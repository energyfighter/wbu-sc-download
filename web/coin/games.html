<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WBU Games – Test Version</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#0E0F12;--s1:#1A1C22;--s2:#2A2D35;--line:#343843;--t:#F4F1EA;--mut:#C9C4B8;--gold:#D4A73A;--red:#D90000;--blue:#1565C0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;cursor:pointer;color:inherit}
.bar{position:sticky;top:0;z-index:20;background:var(--gold);color:#0E0F12;font:600 13px/1.35 Inter,sans-serif;padding:7px 14px;display:flex;gap:10px;align-items:center}
.bar span{flex:1}.bar .lg button{border:0;background:transparent;font:700 12px Inter;padding:4px 6px;border-radius:6px;color:#0E0F12;opacity:.55}.bar .lg button.on{opacity:1;background:#0E0F12;color:var(--gold)}
#hero{position:relative;height:260px;overflow:hidden;border-bottom:1px solid #20232b}
#hero canvas{position:absolute;inset:0;width:100%;height:100%}
#hero .in{position:absolute;inset:auto 0 22px 0;max-width:1120px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:16px}
#hero img{width:84px;height:84px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.7))}
.eb{font:500 13px Oswald,sans-serif;letter-spacing:3px;color:var(--gold)}
h1{font:700 48px/1 Oswald,sans-serif;margin:4px 0 0;letter-spacing:1px;text-shadow:0 4px 18px rgba(0,0,0,.8)}
#hub{max-width:1120px;margin:0 auto;padding:20px 18px 60px}
.lead{color:var(--mut);margin:4px 0 20px;max-width:700px;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.why{font:700 22px/1.3 Oswald,sans-serif;letter-spacing:.5px;color:var(--gold);margin:0 0 10px;max-width:900px}@media(max-width:600px){.why{font-size:19px}}
.gc{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#121419;padding:0;text-align:left;transition:transform .15s,border-color .15s;display:flex;flex-direction:column}
.gc:hover{transform:translateY(-3px);border-color:var(--gold)}
.gc canvas{display:block;width:100%;height:150px}
.gc .in{padding:12px 14px 16px}.gc b{display:block;font:700 22px Oswald,sans-serif;letter-spacing:.5px}.gc p{margin:6px 0 10px;color:var(--mut);font-size:13px;line-height:1.45}
.tag{display:inline-block;font:500 11px Oswald,sans-serif;letter-spacing:2px;color:var(--gold)}
.ctl{display:inline-flex;gap:6px;flex-wrap:wrap}.ctl span{font:600 11px Inter;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--mut)}
.new{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font:700 11px Oswald;letter-spacing:2px;padding:3px 8px;border-radius:6px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:36px}#hero{height:210px}}
#game{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column}
#game.on{display:flex}
.gtop{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid #20232b;background:#0b0c0f}
.gtop img{width:38px;height:38px}.gtop .tt{flex:1;min-width:0}.gtop .tt b{display:block;font:700 20px Oswald,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gtop .tt small{color:var(--gold);font:500 11px Oswald;letter-spacing:2px}
.hud{display:flex;gap:8px}.hud div{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:4px 10px;text-align:center;min-width:62px}.hud small{display:block;font:500 10px Oswald;letter-spacing:1.5px;color:var(--mut)}.hud b{font:700 18px Oswald}
.x{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--s1);font-weight:700}
#stage{flex:1;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
#ui{position:absolute;inset:0;pointer-events:none}
#ui .ans{position:absolute;left:0;right:0;bottom:14px;display:grid;gap:8px;padding:0 14px;max-width:720px;margin:0 auto;pointer-events:auto}
#ui .ans button{min-height:54px;border-radius:12px;border:1px solid #3a3e48;background:rgba(20,22,27,.92);font:700 17px Oswald,sans-serif;letter-spacing:1px;backdrop-filter:blur(4px)}
#ui .ans button.r{border-color:var(--red)}#ui .ans button.b{border-color:var(--blue)}#ui .ans button.ok{background:var(--gold);color:#0E0F12}#ui .ans button.no{background:#5a0f0f}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(6,7,10,.62);backdrop-filter:blur(3px)}
.ov.on{display:flex}
.card{width:100%;max-width:430px;background:linear-gradient(180deg,rgba(28,31,38,.97),rgba(18,20,25,.97));border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.card img{width:92px;height:92px}.card h2{font:700 34px/1.05 Oswald,sans-serif;margin:8px 0 6px}
.rules{text-align:left;background:var(--s1);border-radius:12px;padding:12px 14px 12px 30px;margin:14px 0;font-size:14px;line-height:1.5}.rules li{margin:3px 0}
.btn{height:58px;border:0;border-radius:14px;background:var(--gold);color:#0E0F12;font:700 22px Oswald,sans-serif;letter-spacing:3px;width:100%;margin-top:8px;box-shadow:0 8px 24px rgba(212,167,58,.25)}
.btn2{height:46px;border:1px solid #4A4E58;border-radius:12px;background:transparent;font-weight:600;width:100%;margin-top:10px}
.sc{background:#F4F1EA;color:#0E0F12;border-radius:14px;padding:14px;margin:12px 0}
.sc .big{font:700 64px/1 Oswald,sans-serif}.sc small{font:500 11px Oswald;letter-spacing:2px;color:#6a6458}
.sc .row{display:flex;justify-content:space-between;font-size:13px;border-top:1px dashed #cfc8b8;margin-top:8px;padding-top:8px}
.rate{font:700 18px Oswald;letter-spacing:2px;color:var(--gold)}
</style>
</head>

// WBU-Arena: einmal pro Größe vorgerendert (Zuschauer, Lichttraversen, Ring in Perspektive, Logo auf dem Ringboden)
function makeArenaOld(w,h,opt={}){
 const d=Math.min(2,window.devicePixelRatio||1),o=document.createElement('canvas');o.width=w*d;o.height=h*d;const c=o.getContext('2d');c.setTransform(d,0,0,d,0,0);
 let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
 // Halle
 const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#05060a');g.addColorStop(.55,'#0b0d14');g.addColorStop(1,'#07080b');c.fillStyle=g;c.fillRect(0,0,w,h);
 const hor=h*(opt.hor||.40);
 // Zuschauerränge (Bokeh + Silhouetten)
 for(let row=0;row<9;row++){const y=hor-14-row*(h*.035);const sz=6-row*.45;for(let x=-10;x<w+10;x+=sz*2.1+rnd()*3){const a=.10+rnd()*.12-row*.008;c.fillStyle=`rgba(${70+rnd()*40|0},${70+rnd()*40|0},${90+rnd()*50|0},${a})`;c.beginPath();c.arc(x,y+rnd()*4,sz,0,7);c.fill()}}
 for(let i=0;i<70;i++){const x=rnd()*w,y=hor*(.25+rnd()*.7),r=1+rnd()*2.5;const cl=rnd()<.5?'255,230,170':'170,200,255';const bg=c.createRadialGradient(x,y,0,x,y,r*4);bg.addColorStop(0,`rgba(${cl},.55)`);bg.addColorStop(1,`rgba(${cl},0)`);c.fillStyle=bg;c.beginPath();c.arc(x,y,r*4,0,7);c.fill()}
 // Lichttraverse mit Scheinwerfern
 c.fillStyle='#14161c';c.fillRect(w*.08,h*.045,w*.84,6);
 const lamps=7;for(let i=0;i<lamps;i++){const x=w*(.12+.76*i/(lamps-1)),y=h*.06;
  const cone=c.createLinearGradient(x,y,w/2,hor+h*.25);cone.addColorStop(0,'rgba(255,240,205,.16)');cone.addColorStop(1,'rgba(255,240,205,0)');c.fillStyle=cone;c.beginPath();c.moveTo(x-6,y);c.lineTo(w/2-w*.28,hor+h*.3);c.lineTo(w/2+w*.28,hor+h*.3);c.lineTo(x+6,y);c.closePath();c.fill();
  const lg=c.createRadialGradient(x,y,0,x,y,22);lg.addColorStop(0,'rgba(255,248,225,1)');lg.addColorStop(.25,'rgba(255,230,170,.7)');lg.addColorStop(1,'rgba(255,230,170,0)');c.fillStyle=lg;c.beginPath();c.arc(x,y,22,0,7);c.fill()}
 // Ring in Perspektive
 const fy=h*(opt.floor||.97),bw=w*.56,fw=w*1.25,cxm=w/2;
 const P=[[cxm-bw/2,hor],[cxm+bw/2,hor],[cxm+fw/2,fy],[cxm-fw/2,fy]];
 // Schürze
 c.fillStyle='#0c0d11';c.beginPath();c.moveTo(P[3][0],fy);c.lineTo(P[2][0],fy);c.lineTo(P[2][0],h+40);c.lineTo(P[3][0],h+40);c.fill();
 // Ringboden
 const fl=c.createLinearGradient(0,hor,0,fy);fl.addColorStop(0,'#2c3140');fl.addColorStop(1,'#4a5164');c.fillStyle=fl;c.beginPath();P.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill();
 // Spot auf dem Boden
 const sp=c.createRadialGradient(cxm,(hor+fy)/2,0,cxm,(hor+fy)/2,w*.42);sp.addColorStop(0,'rgba(255,245,220,.30)');sp.addColorStop(1,'rgba(255,245,220,0)');c.save();c.beginPath();P.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.clip();c.fillStyle=sp;c.fillRect(0,hor,w,fy-hor);
 // Logo auf dem Ringboden (perspektivisch gestaucht)
 if(opt.logo&&opt.logo.complete){const lw=Math.min(w*.34,(fy-hor)*1.3);c.globalAlpha=.22;c.save();c.translate(cxm,(hor+fy)/2+4);c.scale(1,.42);c.drawImage(opt.logo,-lw/2,-lw/2,lw,lw);c.restore();c.globalAlpha=1}
 c.restore();
 // Eckpfosten + Seile
 const post=(x,y,hh,col,wd)=>{const pg=c.createLinearGradient(x-wd/2,0,x+wd/2,0);pg.addColorStop(0,col[0]);pg.addColorStop(.5,col[1]);pg.addColorStop(1,col[0]);c.fillStyle=pg;c.beginPath();c.roundRect(x-wd/2,y-hh,wd,hh,wd*.3);c.fill()};
 const bh=h*.11,fh=h*.30;const ropeCols=['#c40000','#e9e5dc','#1565C0'];
 // hintere Seile
 for(let i=0;i<3;i++){const t=(i+1)/3.4,y1=P[0][1]-bh*t,y2=P[1][1]-bh*t;c.strokeStyle=ropeCols[i];c.lineWidth=2.4;c.globalAlpha=.9;c.beginPath();c.moveTo(P[0][0],y1);c.quadraticCurveTo(cxm,y1+3,P[1][0],y2);c.stroke()}
 c.globalAlpha=1;post(P[0][0],P[0][1],bh,['#0a2a5c','#2a6fd6'],8);post(P[1][0],P[1][1],bh,['#ddd9cf','#ffffff'],8);
 // seitliche Seile (laufen nach vorn)
 for(const s of [[0,3],[1,2]])for(let i=0;i<3;i++){const t=(i+1)/3.4,a=P[s[0]],b=P[s[1]];c.strokeStyle=ropeCols[i];c.lineWidth=2.4+3*.0;c.globalAlpha=.85;
  const ex=b[0]+(a[0]<cxm?w*.06:-w*.06),ey=b[1]-fh*t;c.beginPath();c.moveTo(a[0],a[1]-bh*t);c.lineTo(ex,ey);c.lineWidth=3.5;c.stroke()}
 c.globalAlpha=1;
 // Vignette
 const vg=c.createRadialGradient(cxm,h*.5,Math.min(w,h)*.3,cxm,h*.5,Math.max(w,h)*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');c.fillStyle=vg;c.fillRect(0,0,w,h);
 return o}

// Neue Arena-Fotos (Torsten, 19.11.2026): Hochformat fürs Handy, Querformat fürs PC, eigenes Querformat für Box-Tetris
const BG={p:new Image(),l:new Image(),t:new Image()};BG.p.src='/start/img/arena-handy.jpg';BG.l.src='/start/img/arena-pc.jpg';BG.t.src='/start/img/arena-tetris.jpg';
function bgReady(){return BG.p.complete&&BG.p.naturalWidth&&BG.l.complete&&BG.l.naturalWidth&&BG.t.complete&&BG.t.naturalWidth}
function makeArena(w,h,opt={}){
 if(!bgReady())return makeArenaOld(w,h,opt);
 const d=Math.min(2,window.devicePixelRatio||1),o=document.createElement('canvas');o.width=w*d;o.height=h*d;const c=o.getContext('2d');c.setTransform(d,0,0,d,0,0);
 const img=h>w*1.1?BG.p:(opt.tetris?BG.t:BG.l);const iw=img.naturalWidth,ih=img.naturalHeight;
 const s=Math.max(w/iw,h/ih),dw=iw*s,dh=ih*s,fy=opt.fy==null?.5:opt.fy;
 c.fillStyle='#000';c.fillRect(0,0,w,h);c.drawImage(img,(w-dw)/2,(h-dh)*fy,dw,dh);
 // leicht abdunkeln, damit Spielelemente gut lesbar bleiben
 c.fillStyle=`rgba(0,0,0,${opt.dim==null?.22:opt.dim})`;c.fillRect(0,0,w,h);
 const v=c.createRadialGradient(w/2,h/2,Math.min(w,h)*.35,w/2,h/2,Math.max(w,h)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');c.fillStyle=v;c.fillRect(0,0,w,h);
