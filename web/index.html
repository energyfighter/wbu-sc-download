// ===================== WBU Time: Rundenuhr, Pausen, Medical Timeout, Signale =====================
// Zustand st: {rounds, rSec, pSec, phase:'idle'|'round'|'pause'|'done', round, run, t0, rem, med:{run,t0,acc}, red, blue, kl, no, ring}
// t0/rem: zum Zeitpunkt t0 (ms) waren noch rem ms übrig. Läuft die Uhr, rechnen alle Geräte daraus die aktuelle Zeit selbst aus.
function clkDur(d){const m=String(d||'').replace(',','.').match(/[\d.]+/);return Math.round((m?parseFloat(m[0]):2)*60)}
function clkNew(o){return {rounds:o.rounds||3,rSec:o.rSec||120,pSec:o.pSec||60,phase:'idle',round:1,run:false,t0:0,rem:(o.rSec||120)*1000,
  med:{run:false,t0:0,acc:0},red:o.red||'',blue:o.blue||'',kl:o.kl||'',no:o.no||'',mid:o.mid||'',ring:o.ring||1}}
function clkAt(st,now){
  if(!st)return null;let ph=st.phase,rd=st.round,r=st.rem;
  if(st.run&&ph!=='idle'&&ph!=='done'){r=st.rem-(now-st.t0);
    while(r<=0){if(ph==='round'){if(rd>=st.rounds){ph='done';r=0;break}ph='pause';r+=st.pSec*1000}else if(ph==='pause'){ph='round';rd++;r+=st.rSec*1000}else break}}
  const m=st.med||{};const med=Math.min(600000,(m.acc||0)+(m.run?now-m.t0:0));
  return {phase:ph,round:rd,rem:Math.max(0,r),run:st.run&&ph!=='done'&&ph!=='idle',med,medOn:!!m.run||(!!m.end&&med>0&&now-m.end<10000),medRun:!!m.run,medLast:m.run?0:med}}
// Aktionen (geben neuen Zustand zurück)
function clkFreeze(st,now){const v=clkAt(st,now);return Object.assign({},st,{phase:v.phase,round:v.round,rem:v.rem,t0:now})}
function clkStart(st,now){let s=clkFreeze(st,now);const m=s.med||{};if(m.run)s.med={run:false,t0:0,acc:Math.min(600000,(m.acc||0)+now-m.t0),end:now};if(s.phase==='idle'||s.phase==='done')s=Object.assign(s,{phase:'round',round:s.phase==='done'?1:s.round,rem:s.rSec*1000});return Object.assign(s,{run:true,t0:now})}
function clkStop(st,now){const s=Object.assign(clkFreeze(st,now),{run:false});if(st.run&&s.phase==='round')s.med={run:true,t0:now,acc:0,end:0};return s}
function clkResetRound(st,now){const s=clkFreeze(st,now);return Object.assign(s,{med:{run:false,t0:0,acc:0},run:false,phase:s.phase==='idle'?'idle':'round',rem:s.rSec*1000})}
function clkNextRound(st,now){const s=clkFreeze(st,now);const rd=s.phase==='pause'?s.round+1:Math.min(s.rounds,s.round+(s.phase==='round'?1:0));
  return Object.assign(s,{phase:'round',round:Math.min(s.rounds,rd),rem:s.rSec*1000,run:false,med:{run:false,t0:0,acc:0}})}
function clkMed(st,now,act){const m=Object.assign({run:false,t0:0,acc:0},st.med||{});let s=Object.assign({},st);
  if(act==='start'&&!m.run){if(s.run)s=clkStop(s,now);m.run=true;m.t0=now}
  else if(act==='stop'&&m.run){m.acc+=now-m.t0;m.run=false}
  else if(act==='reset'){m.run=false;m.acc=0;m.t0=0}
  s.med=m;return s}
function clkFmt(ms){const s=Math.ceil(ms/1000),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}
function clkFmtUp(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}

  const v=clkAt(st,now),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const cls=v.phase==='pause'?'pause':v.phase==='done'?'done':v.rem<=10000&&v.phase==='round'?'last':'';
  return `<div class="wt ${v.medOn?'withmed':''}"><div class="hd">${logo?`<img src="${logo}">`:''}<div class="t">${st.no?'Kampf '+E(st.no):'WBU Time'}${st.ring?' · '+(/^\d+$/.test(String(st.ring))?'Ring '+E(st.ring):E(st.ring)):''}<small>${E(st.kl||title||'')}</small></div></div>
   <div class="ec"><div class="r"><small>ROTE ECKE</small>${E(st.red)||'&nbsp;'}</div><div class="b"><small>BLAUE ECKE</small>${E(st.blue)||'&nbsp;'}</div></div>
   <div class="main"><div class="box rd"><div class="lab">${v.phase==='pause'?'GLEICH RUNDE':'RUNDE'}</div><div class="big">${v.phase==='pause'?v.round+1:v.round}</div><div class="of">von ${st.rounds}</div></div>
     <div class="box tm ${cls}"><div class="lab">${v.phase==='pause'?'PAUSE':v.phase==='done'?'KAMPF BEENDET':v.phase==='idle'?'BEREIT':'ZEIT'}</div>
       <div class="big">${v.phase==='done'?'ENDE':clkFmt(v.rem)}</div><div class="st">${!v.run&&v.phase!=='idle'&&v.phase!=='done'?'ZEIT GESTOPPT':''}</div></div></div>
   ${v.medOn?`<div class="med"><div class="lab">⏱ TIMEOUT${v.med>=600000?' – 10 MIN ERREICHT':v.medRun?'':' – BEENDET'}</div><div class="big">${clkFmtUp(v.med)}</div></div>`:''}</div>`}
// ---------- Signale (werden im Browser erzeugt, keine Tondateien nötig) ----------
let CLK_AC=null,CLK_OUT=null,KNOCK_VOL=4;
function clkAudio(){try{if(!CLK_AC){CLK_AC=new (window.AudioContext||window.webkitAudioContext)();CLK_OUT=null}if(CLK_AC.state==='suspended')CLK_AC.resume()}catch(e){}return CLK_AC}
// Ausgang mit Kompressor: macht die Signale laut, ohne zu verzerren
function clkOut(ac){if(CLK_OUT&&CLK_OUT.context===ac)return CLK_OUT;const c=ac.createDynamicsCompressor();c.threshold.value=-18;c.knee.value=6;c.ratio.value=8;c.attack.value=.001;c.release.value=.25;
  const g=ac.createGain();g.gain.value=.75;c.connect(g).connect(ac.destination);CLK_OUT=c;return c}
function clkNoise(ac,sec){const b=ac.createBuffer(1,Math.max(1,ac.sampleRate*sec|0),ac.sampleRate),d=b.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1;return b}
// Schwerer Eisenhammer auf massivem Holztisch: harter Aufprall + dumpfer, kurzer Schlag – keine klingenden Töne (sonst klingt es nach Rohr)
function clkHit(ac,s){const out=ac.createGain();out.gain.value=KNOCK_VOL;const lim=ac.createDynamicsCompressor();lim.threshold.value=-3;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.0005;lim.release.value=.08;const sh=ac.createWaveShaper(),cv=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/511.5-1;cv[i]=Math.tanh(2.2*x)/Math.tanh(2.2)*.95}sh.curve=cv;
  out.connect(lim).connect(sh).connect(ac.destination);
  const burst=(sec,type,freq,q,amp,dec)=>{const n=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();n.buffer=clkNoise(ac,sec);f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;
    g.gain.setValueAtTime(amp,s);g.gain.exponentialRampToValueAtTime(.001,s+dec);n.connect(f).connect(g).connect(out);n.start(s);n.stop(s+sec)};
  burst(.03,'highpass',2500,0,1.1,.012);          // harter Eisen-Aufprall (Klack)
  burst(.12,'bandpass',620,.9,4.5,.075);          // Holz – kurz und trocken
  burst(.07,'bandpass',1400,1,2.2,.045);
  burst(.14,'lowpass',380,0,1.6,.09);             // massiver Tisch – dumpfer Druck
  const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(130,s);o.frequency.exponentialRampToValueAtTime(70,s+.07);
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.7,s+.001);g.gain.exponentialRampToValueAtTime(.001,s+.09);o.connect(g).connect(out);o.start(s);o.stop(s+.1)}
function clkKnock3(){const ac=clkAudio();if(!ac)return;const t=ac.currentTime+.03;for(let i=0;i<3;i++)clkHit(ac,t+i*.42)}
// Ringglocke: sehr hell, metallisch, mit Nachhall – kein Piepen
function clkStrike(ac,s,dur){const out=clkOut(ac);
  [[1,1],[1.006,.7],[2.02,.55],[2.74,.6],[2.76,.4],[3.93,.35],[5.41,.28],[6.82,.18],[8.21,.12]].forEach(([m,a])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=1180*m;
    const d=dur*(m<1.1?1:m<3?.7:.45);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.42*a,s+.002);g.gain.exponentialRampToValueAtTime(.0006,s+d);o.connect(g).connect(out);o.start(s);o.stop(s+d+.05)});
  const n=ac.createBufferSource(),f=ac.createBiquadFilter(),ng=ac.createGain();n.buffer=clkNoise(ac,.05);f.type='highpass';f.frequency.value=3000;
  ng.gain.setValueAtTime(.9,s);ng.gain.exponentialRampToValueAtTime(.001,s+.04);n.connect(f).connect(ng).connect(out);n.start(s)}
// weitere Klänge, damit Ringe nebeneinander verschiedene Signale haben (Hammer bleibt überall gleich)
function clkPartials(ac,s,f0,parts,dur,amp){const out=clkOut(ac);parts.forEach(([m,a,dm])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f0*m;const d=dur*(dm||1);
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(amp*a,s+.003);g.gain.exponentialRampToValueAtTime(.0006,s+d);o.connect(g).connect(out);o.start(s);o.stop(s+d+.05)})}
function clkClick(ac,s,freq,amp){const out=clkOut(ac),n=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();n.buffer=clkNoise(ac,.05);f.type='bandpass';f.frequency.value=freq;f.Q.value=.7;
  g.gain.setValueAtTime(amp,s);g.gain.exponentialRampToValueAtTime(.001,s+.04);n.connect(f).connect(g).connect(out);n.start(s)}
const CLK_SOUNDS={
  glocke:{name:'Ringglocke (hell)',hit:(ac,s,d)=>clkStrike(ac,s,d)},
  gong:{name:'Hammer auf Metallglocke (tiefer)',hit:(ac,s,d)=>{clkClick(ac,s,1800,.9);clkPartials(ac,s,520,[[1,1,1],[1.008,.6,1],[2.32,.6,.7],[3.17,.45,.55],[4.6,.3,.4],[6.1,.2,.3]],d*1.1,.5)}},
  amboss:{name:'Hammer auf Metall (Amboss)',hit:(ac,s,d)=>{clkClick(ac,s,3500,1.2);clkPartials(ac,s,1650,[[1,1,.5],[1.42,.8,.45],[2.05,.7,.35],[2.81,.5,.3],[3.6,.35,.25]],Math.min(d,.9),.5)}},
  doppel:{name:'Doppelglocke (ding-dong)',hit:(ac,s,d)=>{clkPartials(ac,s,880,[[1,1,1],[2.76,.45,.5],[5.4,.2,.3]],d*.8,.45);clkPartials(ac,s+.28,660,[[1,1,1],[2.76,.45,.5],[5.4,.2,.3]],d*.9,.45)}},
  fanfare:{name:'Fanfare / Tröte',hit:(ac,s,d)=>{const out=clkOut(ac);[[392,0,.16],[523,.18,.5]].forEach(([f,st,len])=>{[1,1.005,2,3].forEach((m,i)=>{const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();
      o.type='sawtooth';o.frequency.value=f*m;lp.type='lowpass';lp.frequency.value=2600;const a=[.22,.18,.08,.04][i],t0=s+st;
      g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(a,t0+.03);g.gain.setValueAtTime(a,t0+len-.06);g.gain.linearRampToValueAtTime(0,t0+len);o.connect(lp).connect(g).connect(out);o.start(t0);o.stop(t0+len+.02)})})}},
  pfeife:{name:'Schiedsrichterpfiff',hit:(ac,s,d)=>{const out=clkOut(ac),o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();o.type='sine';o.frequency.value=2900;l.frequency.value=32;lg.gain.value=180;
      l.connect(lg).connect(o.frequency);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.5,s+.02);g.gain.setValueAtTime(.5,s+.5);g.gain.linearRampToValueAtTime(0,s+.6);o.connect(g).connect(out);o.start(s);l.start(s);o.stop(s+.65);l.stop(s+.65)}}};
function clkBell(times,snd){const ac=clkAudio();if(!ac)return;const t=ac.currentTime+.03;const n=times||1,S=CLK_SOUNDS[snd]||CLK_SOUNDS.glocke,gap=snd==='fanfare'?.8:snd==='doppel'?.75:snd==='pfeife'?.75:.45;
  for(let k=0;k<n;k++)S.hit(ac,t+k*gap,n>1&&k<n-1?.75:1.3)}
// erkennt die Momente für die Signale (10 Sek. vorher klopfen, Glocke bei Runden-/Pausenende)
function clkSignals(prev,v,snd){if(!prev||!v)return;
  if(v.run&&prev.phase===v.phase&&prev.round===v.round&&prev.rem>10000&&v.rem<=10000&&v.rem>7000&&(v.phase==='round'||v.phase==='pause'))clkKnock3();
  if(!prev.run&&v.run&&prev.phase==='idle'&&v.phase==='round')clkBell(1,snd);
  const pk=prev.phase+prev.round,vk=v.phase+v.round;
  if(pk!==vk&&prev.run&&((prev.phase==='round'&&(v.phase==='pause'||v.phase==='done'))||(prev.phase==='pause'&&v.phase==='round')))clkBell(v.phase==='done'?3:1,snd)}

// Übersetzung im Browser des Schreibenden (der Server darf den Google-Übersetzer nicht direkt nutzen)
async function gTrB(q,tl,sl){if(!q.trim())return{t:q,src:''};const teile=[];let buf='';for(const z of q.split(/(\n)/)){if((buf+z).length>3500&&buf){teile.push(buf);buf=''}buf+=z}if(buf)teile.push(buf);
 let o='',src='';for(const part of teile){const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+(sl||'auto')+'&tl='+tl,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'q='+encodeURIComponent(part)});if(!r.ok)throw 0;const j=await r.json();o+=j[0].map(s=>s[0]||'').join('');src=src||j[2]||''}return{t:o,src}}
async function adAutoTr(t,x){try{const d=await gTrB(t+'\n'+x.slice(0,400),'en');const src=(d.src||'en').slice(0,2);const o={};
 for(const l of ['en','de','es','fr','ru']){if(l===src)continue;o[l]={t:(await gTrB(t,l,src)).t,x:(await gTrB(x,l,src)).t}}return o}catch(e){return null}}

// Laufen mehrere gleichzeitig, erscheinen mehrere Monitore untereinander.
async function lmList(){try{const L0=(await lmApi('l_list',{})).live||[],now=Date.now()/1000;
  const heute=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  LM.evs=L0.filter(e=>e.type==='gala'&&e.sup&&now-e.sup<12*3600&&(!e.date||e.date<=heute)&&(e.offen>0||now-e.updated<1800));   // erst am Veranstaltungstag (Test-Anmeldungen vorher zählen nicht)   // erst wenn sich der Supervisor verbunden hat
  for(const k in LM.D)if(!LM.evs.some(e=>e.id===k))delete LM.D[k]}catch(e){}
 await lmData()}
async function lmData(){await Promise.all(LM.evs.map(async e=>{try{const j=await lmApi('l_get',{lid:e.id});if(j.snap)(LM.D[e.id]=LM.D[e.id]||{}).snap=j.snap}catch(x){}}));lmDraw()}
async function lmClock(){await Promise.all(LM.evs.map(async e=>{try{const t=Date.now(),j=await lmApi('l_clockget',{lid:e.id,ring:1});const d=LM.D[e.id]=LM.D[e.id]||{};d.off=j.srv-(t+Date.now())/2;d.st=j.st||null}catch(x){}}))}
function lmCur(d){const rows=(d.snap&&d.snap.rows)||[],st=d.st;let c=st&&st.mid&&rows.find(r=>r.mid===st.mid&&!r.done);return c||rows.find(r=>!r.done)||null}
function lmClockHtml(d,r){const st=d.st;if(!st||!r||st.mid!==r.mid)return '';const v=clkAt(st,Date.now()+(d.off||0));if(!v)return '';
 if(v.medOn)return `<div class="lmk to"><div><small>${lt('to')}</small><b>${clkFmtUp(v.med)}</b></div><div><small>${lt('rd')}</small><b>${v.round}/${st.rounds}</b></div></div>`;
 if(v.phase==='idle')return `<div class="lmk"><div><small>${lt('soon')}</small></div></div>`;
 if(v.phase==='done')return `<div class="lmk"><div><small>${lt('end')}</small></div></div>`;
 if(v.phase==='pause')return `<div class="lmk pa"><div><small>${lt('pause')}</small><b>${clkFmt(v.rem)}</b></div><div><small>${lt('rd')}</small><b>${v.round}/${st.rounds}</b></div></div>`;
 return `<div class="lmk"><div><small>${lt('rd')}</small><b>${v.round}/${st.rounds}</b></div><div><small>${lt('time')}</small><b>${clkFmt(v.rem)}</b></div></div>`}
function lmOne(id){const d=LM.D[id],sn=d&&d.snap;if(!sn||!(sn.rows||[]).length)return '';
 const rows=sn.rows,c=lmCur(d),gym=(r,s)=>esc([(r.f||{})[s+'v'],(r.f||{})[s+'l']].filter(Boolean).join(' · '));
 const left=c?`<div><span class="no">${lt('fight')} ${c.no}</span>${c.rd?`<span class="tt">${esc(c.rd)}</span>`:''}</div>
   <div class="lmv"><div class="lmc r"><b>${esc(c.a)}</b><span>${gym(c,'r')}</span></div><div class="vs">VS</div><div class="lmc b"><b>${esc(c.b)}</b><span>${gym(c,'b')}</span></div></div>
   <div class="lmi">${[(c.f||{}).cls,c.kind,c.rounds?c.rounds+' '+lt('rnds')+(c.dur?' × '+esc(c.dur)+(/^[\d.,\s]+$/.test(c.dur)?' '+lt('min'):''):''):''].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div>
   <div class="lmclk" data-id="${id}" style="display:contents">${lmClockHtml(d,c)}</div>
   ${(()=>{const i=rows.indexOf(c),nx=rows.slice(i+1).find(r=>!r.done),ls=rows.slice(0,i).reverse().find(r=>r.res);
     return (ls?`<div class="lmx ok"><small>${lt('last')} · ${lt('fight')} ${ls.no}</small><b><span class="rr">${esc(ls.a)}</span> vs <span class="bb">${esc(ls.b)}</span></b><div>${esc(ls.res)}</div></div>`:'')
      +(nx?`<div class="lmx"><small>${lt('next')} · ${lt('fight')} ${nx.no}</small><b><span class="rr">${esc(nx.a)}</span> vs <span class="bb">${esc(nx.b)}</span></b><div>${esc([(nx.f||{}).cls,nx.kind].filter(Boolean).join(' · '))}</div></div>`:'')})()}`
  :`<div class="lmk"><div><small>${lt('done')}</small></div></div>${(()=>{const l=[...rows].reverse().find(r=>r.res);return l?`<div class="res">${lt('fight')} ${l.no}: ${esc(l.res)}</div>`:''})()}`;
 return `<section class="lm" data-id="${id}"><div class="lmb"><div class="lmh"><span class="lv">LIVE</span><b>${esc(sn.name)}</b><span>${esc([sn.ort,sn.date&&sn.date.split('-').reverse().join('.')].filter(Boolean).join(' · '))}</span></div>
  <div class="lmg"><div class="lml">${left}</div><div class="lmr"><h4>${lt('fc')}</h4><div class="lmlist">${rows.map(r=>`<div class="lmf ${c&&r.mid===c.mid?'cur':''}"><div class="n">${r.no}</div><div>
   <span class="rr">${esc(r.a)}</span> vs <span class="bb">${esc(r.b)}</span>${r.rd?` · <b>${esc(r.rd)}</b>`:''}<small>${esc([(r.f||{}).cls,r.kind,r.rounds?r.rounds+' '+lt('rnds'):''].filter(Boolean).join(' · '))}</small>

// ===== Countdown: ab Montag der Woche vor einer Show, bis zum Beginn; mehrere Shows untereinander =====
const CDT={en:['Next show','Days','Hrs','Min','Sec','Live monitor with all fights & results right here from the start','h'],
 de:['Nächste Show','Tage','Std','Min','Sek','Ab Showbeginn hier: der WBU Live-Monitor mit allen Kämpfen und Ergebnissen','Uhr'],
 es:['Próximo show','Días','Hrs','Min','Seg','Desde el inicio aquí: el monitor en vivo con todos los combates y resultados','h'],
 fr:['Prochain show','Jours','H','Min','Sec','Dès le début ici : le moniteur live avec tous les combats et résultats','h'],
 ru:['Следующее шоу','Дн','Час','Мин','Сек','С начала шоу здесь: Live-монитор со всеми боями и результатами','']};
// Jeder Showtag bekommt einen eigenen Countdown-Balken. Ohne Uhrzeit gilt Beginn 19:00 Uhr.
function cdStarts(x){return (x.st||[x.d]).map(v=>{const w=v.length>10?v:v+'T19:00';return {v:w,t:new Date(w).getTime()}})}
function cdList(){const now=Date.now(),R=[];SHOWS_ALL.forEach(x=>cdStarts(x).forEach(s=>{const f=new Date(s.t);f.setHours(0,0,0,0);f.setDate(f.getDate()-((f.getDay()+6)%7));
  if(now>=f.getTime()&&now<s.t)R.push({x,s})}));return R.sort((a,b)=>a.s.t-b.s.t)}
function cdHtml(){const c=CDT[L]||CDT.en,L2=cdList();if(!L2.length)return '';
  return L2.map(({x,s})=>{const tag=new Date(s.t).toLocaleDateString(L,{weekday:'short',day:'2-digit',month:'2-digit'}),z=s.v.slice(11,16)+(c[6]?' '+c[6]:'');
   return `<div class="cd"><div class="cdb" data-t="${s.t}"><div class="cdx"><span class="cdl">${c[0]}</span><b>${esc(x.n||x.t)}</b><span class="cdo">${esc(x.ort||'')} · ${tag} · ${z}</span><small>📡 ${c[5]}</small></div>
    <div class="cdz">${[1,2,3,4].map(i=>`<div><i>--</i><em>${c[i]}</em></div>`).join('')}</div></div></div>`}).join('')}
function cdDraw(){const b=document.getElementById('cdown');if(!b)return;const h=cdHtml();if(b.dataset.h!==h){b.innerHTML=h;b.dataset.h=h}cdTick()}
function cdTick(){document.querySelectorAll('#cdown .cdb').forEach(e=>{let r=Math.max(0,Math.floor((+e.dataset.t-Date.now())/1000));
  const v=[Math.floor(r/86400),Math.floor(r%86400/3600),Math.floor(r%3600/60),r%60];e.querySelectorAll('.cdz i').forEach((i,k)=>i.textContent=String(v[k]).padStart(2,'0'))})}
setInterval(cdDraw,1000);

// YouTube-Livestream über dem Live-Monitor: nur das reine Bild (16:9, Vollbild möglich, ohne Vorschläge)
function ytSrc(u){u=String(u||'').trim();if(!u)return '';let m;
  if((m=u.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/)))return 'https://www.youtube-nocookie.com/embed/'+m[1]+'?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3';
  if((m=u.match(/\/channel\/(UC[\w-]{22})/)))return 'https://www.youtube.com/embed/live_stream?channel='+m[1]+'&autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3';
  return ''}
function ytBox(id,u){const src=ytSrc(u);if(!src)return '';return `<div class="yt" data-yt="${esc(id)}"><div class="ytb"><iframe src="${esc(src)}" title="WBU Livestream" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div></div>`}
function lmDraw(){cdDraw();const box=document.getElementById('lmon');if(!box)return;
 // je Veranstaltung ein fester Block: oben das Video (wird nur bei neuem Link neu geladen), darunter der Monitor
 const ids=LM.evs.map(e=>e.id);[...box.children].forEach(w=>{if(!ids.includes(w.dataset.ev))w.remove()});
 ids.forEach((id,i)=>{let w=[...box.children].find(x=>x.dataset.ev===id);
  if(!w){w=document.createElement('div');w.dataset.ev=id;w.innerHTML='<div class="ytw"></div><div class="lmw"></div>'}
  if(box.children[i]!==w)box.insertBefore(w,box.children[i]||null);
  const sn=(LM.D[id]||{}).snap||{},src=(sn.rows||[]).length?ytSrc(sn.yt):'',yw=w.querySelector('.ytw');
  if(yw.dataset.src!==src){yw.dataset.src=src;yw.innerHTML=src?ytBox(id,sn.yt):''}
  const lw=w.querySelector('.lmw'),l=lw.querySelector('.lmlist'),y=l?l.scrollTop:0;lw.innerHTML=lmOne(id);
  const l2=lw.querySelector('.lmlist');if(l2&&y)l2.scrollTop=y})}
// Uhren fein nachziehen, ohne die Listen neu zu zeichnen
setInterval(()=>document.querySelectorAll('.lmclk').forEach(k=>{const d=LM.D[k.dataset.id];if(!d)return;const h=lmClockHtml(d,lmCur(d));if(k.innerHTML!==h)k.innerHTML=h}),250);
lmList();setInterval(lmList,30000);setInterval(lmData,5000);setInterval(lmClock,1000);
function setLang(l){L=l;try{localStorage.setItem('wbuLang',l)}catch(e){}const u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u);draw()}
addEventListener('hashchange',()=>{draw();const mn=document.getElementById('menu');mn.classList.remove('open');
 const top=document.querySelector('.belts').getBoundingClientRect().bottom+scrollY;if(scrollY>top)scrollTo({top})});
draw();
</script>
<script>addEventListener('scroll',()=>{const u=document.getElementById('up');if(u)u.classList.toggle('on',scrollY>500)},{passive:true})</script>
