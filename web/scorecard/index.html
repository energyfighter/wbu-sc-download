<!DOCTYPE html>
<html lang="de" data-langpos="left">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>WBU Scorecard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WBU-SC">

<style>
:root{--bg:#0b1220;--card:#141e33;--card2:#1b2742;--line:#2a3a5e;--txt:#eef2fb;--mut:#93a1c1;--gold:#e8b931;--red:#d93636;--blue:#2470d9;--ok:#2fb36b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:0 14px 40px}
@media(min-width:900px){#app{max-width:720px}}
header{display:flex;align-items:center;gap:10px;padding:4px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.logo{width:56px;height:56px;flex:none}
.toplogo{display:block;width:120px;height:120px;margin:14px auto 4px}
.htitle{flex:1}.htitle b{display:block;font-size:17px}.htitle span{font-size:12px;color:var(--mut)}
.who{font-size:12px;color:var(--mut);text-align:right}
.who a{color:var(--gold);text-decoration:none;display:block;margin-top:2px}
h2{font-size:19px;margin:6px 0 12px}
h3{font-size:14px;margin:18px 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 5px}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:16px}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;margin-top:12px;background:var(--gold);color:#1a1300}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn:disabled{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:10px 13px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--txt);font-size:15px;cursor:pointer;min-width:44px;text-align:center}
.chip.on{background:var(--gold);color:#1a1300;border-color:var(--gold);font-weight:700}
.role{display:flex;gap:10px}.role .chip{flex:1;padding:18px 8px;font-size:16px}
.corners{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.corner{border-radius:14px;padding:10px;text-align:center}
.corner.r{background:linear-gradient(180deg,#5a1414,#2d0d0d);border:2px solid var(--red)}
.corner.b{background:linear-gradient(180deg,#123b72,#0c1d38);border:2px solid var(--blue)}
.cname{font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:1px}
.wheelbox{position:relative;height:180px;margin:8px 0}
.wheel{height:180px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.wheel::-webkit-scrollbar{display:none}
.wheel .pad{height:60px}
.wheel .it{height:60px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;scroll-snap-align:center;opacity:.35;transition:opacity .15s}
.wheel .it.sel{opacity:1}
.wheelbox:before,.wheelbox:after{content:"";position:absolute;left:8%;right:8%;height:2px;background:rgba(255,255,255,.55);pointer-events:none}
.wheelbox:before{top:60px}.wheelbox:after{top:120px}
.ded{display:flex;gap:5px;justify-content:center}
.ded .chip{flex:1;padding:9px 0;font-size:14px;min-width:0}
.ded .chip.on{background:#fff;color:#111;border-color:#fff}
.dlabel{font-size:12px;margin:6px 0 4px;color:#d6dcec}
.sum{display:flex;align-items:center;justify-content:center;gap:14px;font-size:34px;font-weight:900;margin:14px 0 2px}
.sum .r{color:#ff6b6b}.sum .b{color:#6aa8ff}.sum .x{color:var(--mut);font-size:24px}
.note{font-size:13px;color:var(--mut);text-align:center;min-height:18px}
.warn{color:#ffcf5c}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:12px}
td.rc{color:#ff8a8a;font-weight:700}td.bc{color:#8dbcff;font-weight:700}
tr.tot td{font-weight:900;font-size:16px;border-top:2px solid var(--line)}
.rbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.badge.g{background:var(--ok);border-color:var(--ok);color:#fff}
.badge.y{background:#6b5310;border-color:var(--gold);color:#ffe9a8}
.badge.bt{background:#0b3d91;border-color:#3d8bff;color:#fff}
.muted{color:var(--mut);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 14px 26px;border-top:2px solid var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.final{background:#fff;color:#111;border-radius:14px;padding:16px}
.final th{color:#555}.final td,.final th{border-color:#ddd}
.final td.rc{color:#b71c1c}.final td.bc{color:#0d47a1}
.res{font-size:20px;font-weight:900;text-align:center;margin:12px 0;padding:10px;border-radius:10px;background:#eef3fc}
.fight{cursor:pointer}
.fnum{font-size:22px;font-weight:900;color:var(--gold)}
.scroll{overflow-x:auto}
.big{font-size:56px;text-align:center}
.chatlog{max-height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:8px 0;padding-right:2px}
.msg{max-width:82%;padding:7px 10px;border-radius:12px;font-size:14px;line-height:1.3;word-wrap:break-word}
.msg.me{align-self:flex-end;background:#244f33;border:1px solid #2fb36b}.msg.them{align-self:flex-start;background:var(--card2);border:1px solid var(--line)}
.msg small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.chatin{display:flex;gap:6px}.chatin input{flex:1;padding:11px}.chatin button{border:0;border-radius:10px;background:var(--gold);color:#1a1300;font-weight:700;padding:0 14px;font-size:15px}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.qchips .chip{padding:6px 10px;font-size:13px}
.ubadge{display:inline-block;min-width:18px;padding:1px 6px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;margin-left:4px}
@keyframes fl{0%{box-shadow:0 0 0 0 rgba(232,185,49,.9)}100%{box-shadow:0 0 0 10px rgba(232,185,49,0)}}.flash{animation:fl .8s 3;border-color:var(--gold)!important}
.btstat{white-space:normal;text-align:right;max-width:62%}
@media print{body{background:#fff;color:#000}.btn,.note,#modal,header,.toplogo,h3{display:none!important}.card{background:#fff;border:1px solid #ccc;color:#000}.final{break-inside:avoid;border:1px solid #ccc}}
.archive{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.arow{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.arow:last-child{border-bottom:0}.arow .fnum{font-size:16px;min-width:74px}.arow .t{font-size:14px;flex:1}
.evline{font-size:13px;color:var(--mut);margin:-4px 0 12px}
</style>

["Please choose a role.","Elige un rol.","Veuillez choisir un rôle.","Выберите роль."],"Bitte Runde senden":["Please send the round","Envía el asalto","Veuillez envoyer le round","Отправьте раунд"],"Bitte Sieger wählen.":["Please choose the winner.","Elige al ganador.","Veuillez choisir le vainqueur.","Выберите победителя."],"Bitte Wertung prüfen":["Please check the score","Revisa la puntuación","Veuillez vérifier le pointage","Проверьте оценку"],"Bitte das WBU-Supervisor-Passwort eingeben (für WBU Sports).":["Please enter the WBU supervisor password (for WBU Sports).","Introduce la contraseña de supervisor WBU (para WBU Sports).","Veuillez saisir le mot de passe superviseur WBU (pour WBU Sports).","Введите пароль супервайзера WBU (для WBU Sports)."],"Bitte das WBU-Supervisor-Passwort eingeben.":["Please enter the WBU supervisor password.","Introduce la contraseña de supervisor WBU.","Veuillez saisir le mot de passe superviseur WBU.","Введите пароль супервайзера WBU."],"Bitte den Namen des Ringarztes eintragen – ohne Ringarzt kann die Veranstaltung nicht starten.":["Please enter the ringside doctor's name – the event cannot start without one.","Introduce el nombre del médico de ring – sin médico el evento no puede empezar.","Veuillez saisir le nom du médecin de ring – sans médecin l'événement ne peut pas commencer.","Укажите имя врача ринга – без врача мероприятие не может начаться."],"Bitte die PIN vom Supervisor eingeben (4 Ziffern).":["Please enter the PIN from the supervisor (4 digits).","Introduce el PIN del supervisor (4 cifras).","Veuillez saisir le PIN du superviseur (4 chiffres).","Введите PIN от супервайзера (4 цифры)."],"Bitte eine PIN mit 4 Ziffern für die Punktrichter festlegen.":["Please set a 4-digit PIN for the judges.","Fija un PIN de 4 cifras para los jueces.","Veuillez définir un PIN à 4 chiffres pour les juges.","Задайте 4-значный PIN для судей."],"Bitte einmal das WBU-Supervisor-Passwort eingeben.":["Please enter the WBU supervisor password once.","Introduce una vez la contraseña de supervisor WBU.","Veuillez saisir une fois le mot de passe superviseur WBU.","Один раз введите пароль супервайзера WBU."],"Bitte kurz kommen":["Please come over","Por favor, ven un momento","Venez un instant, s'il vous plaît","Подойдите, пожалуйста"],"Bitte kurz zu mir":["Please come to me","Ven un momento, por favor","Venez me voir, s'il vous plaît","Подойдите ко мне, пожалуйста"],"Bitte vollständigen Namen eintragen.":["Please enter the full name.","Introduce el nombre completo.","Veuillez saisir le nom complet.","Введите полное имя."],"Bitte zuerst bei WBU Sports einloggen.":["Please log in to WBU Sports first.","Inicia sesión primero en WBU Sports.","Connectez-vous d'abord à WBU Sports.","Сначала войдите в WBU Sports."],"Blau":["Blue","Azul","Bleu","Синий"],"Blau Abzug":["Blue deduction","Deducción azul","Pénalité bleu","Снятие синий"],"Blau Punkte":["Blue points","Puntos azul","Points bleu","Очки синий"],"Blau −":["Blue −","Azul −","Bleu −","Синий −"],"Blau: Land · Alter · Gewicht":["Blue: country · age · weight","Azul: país · edad · peso","Bleu : pays · âge · poids","Синий: страна · возраст · вес"],"Blaue Ecke":["Blue corner","Esquina azul","Coin bleu","Синий угол"],"Blaue Ecke (optional":["Blue corner (optional","Esquina azul (opcional","Coin bleu (facultatif","Синий угол (по желанию"],"Bluetooth bereit":["Bluetooth ready","Bluetooth listo","Bluetooth prêt","Bluetooth готов"],"Bluetooth einschalten – die App verbindet sich automatisch mit dem Supervisor.":["Turn on Bluetooth – the app connects to the supervisor automatically.","Activa el Bluetooth – la app se conecta sola con el supervisor.","Activez le Bluetooth – l'appli se connecte automatiquement au superviseur.","Включите Bluetooth – приложение само подключится к супервайзеру."],"Bluetooth startet …":["Starting Bluetooth …","Iniciando Bluetooth …","Démarrage du Bluetooth …","Запуск Bluetooth …"],"Bridgergewicht":["Bridgerweight","Peso bridger","Poids bridger","Бриджервейт"],"Chat mit Punktrichtern":["Chat with judges","Chat con los jueces","Chat avec les juges","Чат с судьями"],"Chat mit dem Supervisor":["Chat with the supervisor","Chat con el supervisor","Chat avec le superviseur","Чат с супервайзером"],"Cruisergewicht":["Cruiserweight","Peso crucero","Poids lourd-léger","Первый тяжёлый вес"],"Danach den Link „Fight Card bearbeiten“ noch einmal öffnen.":["Then open the “Edit fight card” link again.","Después abre otra vez el enlace «Editar cartelera».","Ouvrez ensuite à nouveau le lien « Modifier la carte ».","Затем снова откройте ссылку «Редактировать кард»."],"Danach kannst du jede Runde noch antippen und korrigieren.":["Afterwards you can still tap and correct any round.","Después aún puedes tocar y corregir cada asalto.","Ensuite, vous pouvez encore toucher et corriger chaque round.","Потом любой раунд можно нажать и исправить."],"Das Passwort war falsch.":["The password was wrong.","La contraseña era incorrecta.","Le mot de passe était faux.","Неверный пароль."],"Datum":["Date","Fecha","Date","Дата"],"Dazu die PIN vom Supervisor eintippen – dann geht es direkt zur Scorecard. Die Wertungen gehen über das Internet zum Supervisor.":["Enter the PIN from the supervisor – then you go straight to the scorecard. Scores are sent to the supervisor over the internet.","Introduce el PIN del supervisor – y vas directo a la tarjeta. Las puntuaciones llegan al supervisor por internet.","Saisissez le PIN du superviseur – vous arrivez directement à la carte. Les pointages vont au superviseur par internet.","Введите PIN от супервайзера – и сразу откроется карточка. Оценки идут супервайзеру через интернет."],"Demo":["Demo","Demo","Démo","Демо"],"Deutsche Meisterschaft":["German Championship","Campeonato de Alemania","Championnat d'Allemagne","Чемпионат Германии"],"Die Veranstaltung wird abgeschlossen und die Ergebnisse gehen":["The event will be closed and the results go","El evento se cerrará y los resultados irán","L'événement sera clôtu const NATIVE=!!window.WBU;

const WEB=!NATIVE&&!!window.WBU_WEB_API;
let BT={txt:null,ok:false};
window.wbuStatus=(t,ok)=>{BT={txt:t,ok};document.querySelectorAll('.btstat').forEach(e=>{e.textContent='● '+t;e.className='badge btstat '+(ok?'bt':'y')})};
function btBadge(def){const live=NATIVE||WEB;const t=live?(BT.txt||(WEB?'Verbinde …':'Bluetooth startet …')):def, ok=live?BT.ok:true;return `<span class="badge btstat ${ok?'bt':'y'}">● ${esc(t)}</span>`}
window.wbuHubMsg=j=>{try{const c=JSON.parse(j);if(c.t==='snap'&&c.snap){if(S.role==='sup'&&!S.nlid){S.nlid='hub';startNativeLive()}   // Tablet mit WBU Sports automatisch gefunden
  const js=JSON.stringify(c.snap.rows||[]);if(js!==S.liveJs){S.liveJs=js;S.live=c.snap;softRender()}}}catch(e){}};
window.wbuHubStatus=(t,ok)=>{S.hubSt=t;S.hubOk=ok;const e=$('hubst');if(e){e.textContent='📱 '+t;e.style.color=ok?'var(--ok)':'var(--gold)'}};
window.wbuReceive=j=>{try{const c=JSON.parse(j);
  if(c.t==='snap'){if(c.snap&&S.role==='sup'&&!S.nlid){S.nlid='pc';startNativeLive()}   // Laptop mit WBU Sports hat sich automatisch verbunden
  if(S.nlid==='pc'&&c.snap){wbuHubStatus('Laptop verbunden: '+(c.snap.name||''),true);const js=JSON.stringify(c.snap.rows||[]);if(js!==S.liveJs){S.liveJs=js;S.live=c.snap;softRender()}}return}if(c.t==='msg'){chatAdd(c);refreshChat(true);return}if(c.t==='hello')return;upsertInbox(c);softRender()}catch(e){}};
// gleiche Scorecard-ID = Aktualisierung (neue Runde oder Korrektur) -> ersetzen
function upsertInbox(card){if(get('wbuDelIds',[]).includes(card.id))return;const ib=get('wbuInbox',[]),i=ib.findIndex(x=>x.id===card.id);if(i>=0){if((ib[i].rev||0)<=(card.rev||0)){if(ib[i].svFix){card.svFix=ib[i].svFix;Object.keys(card.svFix).forEach(k=>{if(card.rounds[k])card.rounds[k]={...card.svFix[k].n}})}ib[i]=card}}else ib.push(card);set('wbuInbox',ib)}
window.wbuSent=id=>{if(id===S.sendId){S.delivered=true;const e=$('sendst');if(e)e.innerHTML=sendStatus()}};

// ---------- Chat Supervisor <-> Punktrichter ----------
function chatAll(){return get('wbuChat',[])}
function chatAdd(m){const a=chatAll();if(a.some(x=>x.id===m.id))return;a.push(m);set('wbuChat',a.slice(-300))}
window.wbuMsg=j=>{try{const m=JSON.parse(j);if(m.t==='cur'){S.jcur=m;showJCur();jRst(m.rst);return}chatAdd(m);refreshChat(true)}catch(e){}};
function chatJudges(){const s=new Set();chatAll().forEach(m=>m.judge&&s.add(m.judge));get('wbuInbox',[]).slice(-12).forEach(c=>c.judge&&s.add(c.judge));return[...s]}
function convo(){return S.role==='sup'?chatAll().filter(m=>m.judge===S.chatWith):chatAll().filter(m=>m.judge===S.name)}
function unread(j){const k=S.role==='sup'?j:'sup',other=S.role==='sup'?'judge':'sup';return chatAll().filter(m=>(S.role==='sup'?m.judge===j:m.judge===S.name)&&m.from===other&&m.ts>(S.seen[k]||0)).length}
function chatLog(){const ms=convo(),me=S.role==='sup'?'sup':'judge';
  return ms.length?ms.map(m=>`<div class="msg ${m.from===me?'me':'them'}">${esc(m.text)}<small>${m.from==='sup'?'Supervisor':esc(m.judge)} · ${esc(m.at||'')}</small></div>`).join(''):'<div class="note">Noch keine Nachrichten.</div>'}
function chatBox(){
  const sup=S.role==='sup';
  if(sup){const js=chatJudges();if(!S.chatWith||!js.includes(S.chatWith))S.chatWith=js[0]||null}
  const quick=sup?['Bitte Wertung prüfen','Bitte Runde senden','Bitte kurz zu mir']:['Verstanden','Habe korrigiert','Bitte kurz kommen'];
  const chips=sup?`<div class="chips" style="margin:6px 0">${chatJudges().map(j=>{const u=S.chatWith===j?0:unread(j);return `<div class="chip ${S.chatWith===j?'on':''}" style="padding:7px 10px;font-size:14px" onclick="S.chatWith=${esc(JSON.stringify(j))};refreshChat()">${esc(j)}${u?`<span class="ubadge">${u}</span>`:''}</div>`}).join('')||'<span class="muted">Sobald sich Punktrichter verbinden, kannst du ihnen hier schreiben.</span>'}</div>`:'';
  const can=!sup||S.chatWith;
  return `<div class="card" id="chatbox"><b>💬 ${sup?'Chat mit Punktrichtern':'Chat mit dem Supervisor'}</b>${chips}
    <div class="chatlog" id="chatlog">${can?chatLog():''}</div>
    ${can?`<div class="qchips">${quick.map(q=>`<div class="chip" onclick="sendChat(${esc(JSON.stringify(q))})">${q}</div>`).join('')}</div>
    <div class="chatin"><input id="chatin" value="${esc(S.draft||'')}" placeholder="${sup?'Nachricht an '+esc(S.chatWith):'Nachricht an den Supervisor'}" oninput="S.draft=this.value" onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">Senden</button></div>`:''}
  </div>`}
function markSeen(){S.seen[S.role==='sup'?S.chatWith:'sup']=Date.now()}
// Nur das Chatfenster neu zeichnen (Rest der Seite bleibt, Eingaben bleiben stehen)
function refreshChat(incoming){
  const box=$('chatbox');if(!box)return;
  const hadFocus=document.activeElement&&document.activeElement.id==='chatin';
  const newer=incoming&&convo().some(m=>m.from!==(S.role==='sup'?'sup':'judge')&&m.ts>(S.seen[S.role==='sup'?S.chatWith:'sup']||0));
  box.outerHTML=chatBox();markSeen();
  const log=$('chatlog');if(log)log.scrollTop=log.scrollHeight;
  if(hadFocus){const i=$('chatin');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
  if(incoming){const b=$('chatbox');if(b&&(newer||S.role==='sup')){b.classList.add('flash');try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}}
}
function sendChat(txt){

// ---------- 10-Point-Must mit Minuspunkten ----------
// Rohwertung minus Abzug; hat danach keine Ecke mehr 10, wird wieder auf 10 hochgestuft.
function calc(r,b,dr,db){let R=r-dr,B=b-db;const m=Math.max(R,B);if(m<10){R+=10-m;B+=10-m}return[R,B]}
function totals(rounds){let R=0,B=0;rounds.forEach(x=>{const[a,c]=calc(x.r,x.b,x.dr,x.db);R+=a;B+=c});return[R,B]}
function table(rounds,editable){
  let rows='';rounds.forEach((x,i)=>{const[a,b]=calc(x.r,x.b,x.dr,x.db);
    rows+=`<tr${editable?` onclick="startEdit(${i})" style="cursor:pointer"`:''}><td>${i+1}${editable?' <span style="color:var(--gold)">✎</span>':''}</td><td class="rc">${a}${x.dr?` <small>(−${x.dr})</small>`:''}</td><td class="bc">${b}${x.db?` <small>(−${x.db})</small>`:''}</td></tr>`});
  const[R,B]=totals(rounds);
  return `<table><tr><th>Runde</th><th>Rot</th><th>Blau</th></tr>${rows}<tr class="tot"><td>Σ</td><td class="rc">${R}</td><td class="bc">${B}</td></tr></table>${editable?'<div class="note" style="margin-top:6px">Runde antippen = korrigieren</div>':''}`;
}

  catch(e){scanBox(`<h3 style="margin:0 0 8px">📷 Ergebnis-Zettel</h3><p style="color:#d0021b;font-weight:800">${esc(e.message)}</p><button class="btn" onclick="scanClose()">Schließen</button>`)}}
function scanShow(){const rows=liveRows().length?((S.live&&S.live.rows)||[]):[],R=S.scan||[],o=(v,c)=>v===c?'selected':'';
  scanBox(`<h3 style="margin:0 0 4px">📷 Ergebnis-Zettel – bitte prüfen</h3><p style="margin:0 0 10px">Gelb = die KI ist unsicher. Häkchen weg = wird nicht übernommen.</p>
   ${R.length?R.map((x,i)=>{const f=rows.find(y=>y.mid===x.mid)||{};return `<div style="background:${x.sure?'#fff':'#fff3c4'};border:2px solid #000;border-radius:10px;padding:8px;margin-bottom:8px">
     <label style="display:flex;gap:8px;align-items:center;font-weight:800;margin:0"><input type="checkbox" id="sc_on_${i}" ${x.sure?'checked':''} style="width:22px;height:22px"> Kampf ${esc(f.no||'?')}: <span style="color:#d0021b">${esc(f.a||'')}</span> – <span style="color:#0047bb">${esc(f.b||'')}</span></label>
     ${x.note?`<div style="font-size:13px;margin:2px 0 4px">Auf dem Zettel: „${esc(x.note)}“</div>`:''}
     <div style="display:flex;gap:6px;flex-wrap:wrap"><select id="sc_w_${i}" style="width:auto"><option value="R" ${o(x.w,'R')}>Sieger: Rot</option><option value="B" ${o(x.w,'B')}>Sieger: Blau</option><option value="" ${o(x.w,'')}>kein Sieger</option></select>
     <select id="sc_k_${i}" style="width:auto">${RES.map(r=>`<option value="${r[0]}" ${o(x.k,r[0])}>${esc(r[1])}</option>`).join('')}</select>
     <input id="sc_r_${i}" inputmode="numeric" placeholder="Rd" value="${x.r==null?'':x.r}" style="width:60px"><input id="sc_t_${i}" placeholder="Zeit" value="${esc(x.t||'')}" style="width:80px"></div></div>`}).join('')
     :'<p><b>Auf dem Zettel wurden keine Ergebnisse gefunden.</b></p>'}
   <div style="display:flex;gap:8px;flex-wrap:wrap">${R.length?`<button class="btn" style="background:#1e8e3e;border-color:#1e8e3e;color:#fff;font-weight:800" onclick="scanSend()">✓ Übernehmen &amp; hochladen</button>`:''}<button class="btn sec" onclick="scanClose()">Abbrechen</button></div>`)}
function scanSend(){let n=0;(S.scan||[]).forEach((x,i)=>{if(!$('sc_on_'+i).checked)return;const k=$('sc_k_'+i).value,typ=(RES.find(r=>r[0]===k)||[])[2],w=$('sc_w_'+i).value;
    const res={k,w:(typ===1||typ===2)&&w?w:null,r:typ>=2?(+$('sc_r_'+i).value||null):null,t:typ>=2?$('sc_t_'+i).value.trim():null,by:(S.name||'')+' (Zettel)',ts:Date.now(),at:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})};
    if(WEB&&S.web&&S.web.lid)webSend({t:'res',id:'res-'+x.mid,mid:x.mid,res});
    if(NATIVE&&S.nlid)set('wbuLiveOut',get('wbuLiveOut',[]).filter(y=>y.mid!==x.mid).concat([{mid:x.mid,res}]));n++});
  if(NATIVE&&S.nlid)nativeLive();scanBox(`<h3 style="margin:0 0 8px">✓ ${n} Ergebnis${n===1?'':'se'} hochgeladen</h3><p>Sie erscheinen in WBU Sports, WBU Live und bei den Ergebnissen.</p><button class="btn" onclick="scanClose()">Fertig</button>`)}
// Gala: fehlt Gewicht oder Gewichtsklasse, muss der Supervisor das vor dem Kampf nachtragen
function wiegeHinweis(r){const f=r&&r.f;if(!f||!S.live||S.live.type!=='gala')return '';const fehlt=[];
  if(!String(f.rw||'').trim())fehlt.push('Gewicht Rote Ecke');if(!String(f.bw||'').trim())fehlt.push('Gewicht Blaue Ecke');if(!String(f.cls||'').trim())fehlt.push('Gewichtsklasse');

// Ring wechseln: noch nicht gewerteten Kampf neu zuordnen
function setRing(n){set('wbuRing',n);const no=curNo(fights()),m=get('wbuMeta',{})[no];if(m&&m.mid&&!m.result){const all=get('wbuMeta',{});delete all[no].mid;set('wbuMeta',all)}render()}
function curInfo(){const no=curNo(fights()),r=liveFor(no),m=get('wbuMeta',{})[no]||{};
  return r?{no:r.no,kl:r.kl,red:r.a,blue:r.b,rc:r.ac||'',bc:r.bc||''}:{no:0,kl:m.title||'',red:m.red||'',blue:m.blue||'',rc:'',bc:''}}
function sendCur(){if(S.role!=='sup')return;const c=curInfo(),rs=get('wbuRst',null);if(rs)c.rst=rs;const js=JSON.stringify(c);if(js===S.lastCur)return;
  if(WEB&&S.web){S.lastCur=js;webSend({t:'cur',id:'cur',...c})}
  else if(NATIVE&&S.nlid){S.lastCur=js;WBU.sendMsg('*',JSON.stringify({t:'cur',...c}))}}
// App (Bluetooth): Kampfliste übers Internet holen, Ergebnisse übers Internet zurück (bei Funkloch später nachsenden)
let nliveT=null;
function startNativeLive(){clearInterval(nliveT);if(!S.nlid)return;nliveT=setInterval(nativeLive,4000);nativeLive()}
async function nativeLive(){if(!S.nlid)return;
  if(S.nlid==='pc'){const out=get('wbuLiveOut',[]);out.forEach(it=>WBU.sendMsg('WBU-Leitstand',JSON.stringify({t:'res',mid:it.mid,res:it.res})));
    if(out.length)set('wbuLiveOut',[]);sendCur();return}
  if(S.nlid==='hub'){const out=get('wbuLiveOut',[]);out.forEach(it=>WBU.hubResult(JSON.stringify({t:'res',id:'res-'+it.mid,mid:it.mid,res:it.res,judge:S.name})));
    if(out.length)set('wbuLiveOut',[]);sendCur();return}
  fcRetry();
  try{const j=await lapi('l_get',{lid:S.nlid,pass:S.npass||''});if(j.snap){const js=JSON.stringify(j.snap.rows||[]);if(js!==S.liveJs){S.liveJs=js;S.live=j.snap;softRender()}}
    for(const it of get('wbuLiveOut',[])){await lapi('l_result',{lid:S.nlid,pass:S.npass||'',mid:it.mid,res:it.res});set('wbuLiveOut',get('wbuLiveOut',[]).filter(x=>x.mid!==it.mid))}
    S.liveErr=''}catch(e){S.liveErr=e.message}
  sendCur()}
// Supervisor hat den Kampf zurückgesetzt: Punktrichter beginnt diesen Kampf wieder bei Runde 1
function jRst(r){if(!r||S.role!=='judge'||!r.ts||r.ts<=get('wbuRstSeen',0))return;set('wbuRstSeen',r.ts);
  if(S.card&&(r.ids||[]).includes(S.card.id)){newCard();render();setTimeout(()=>alert('Der Supervisor hat Kampf '+(r.no||'')+' zurückgesetzt. Bitte ab Runde 1 neu werten.'),50)}}
function showJCur(){const c=S.jcur||{},has=c.red||c.blue;const l=$('jcur');if(!l)return;
  l.style.display=has||c.kl?'block':'none';l.innerHTML=`${c.no?`<b>Kampf ${c.no}</b> · `:''}${esc(c.kl||'')}`;
  if($('jred'))$('jred').textContent=c.red||'Rote Ecke';if($('jblue'))$('jblue').textContent=c.blue||'Blaue Ecke'}
function pickRole(r){S.role=r;document.querySelectorAll('.role .chip').forEach((c,i)=>c.classList.toggle('on',(i===0&&r==='judge')||(i===1&&r==='sup')));$('supf').style.display=r==='judge'?'none':'block';if($('jpf'))$('jpf').style.display=r==='judge'?'block':'none';$('err').textContent=''}
async function webLogin(n){
  if(S.role==='judge'){const pin=($('jpin')?$('jpin').value:'').replace(/\D/g,'');if(pin.length<4){$('err').textContent='Bitte die PIN vom Supervisor eingeben (4 Ziffern).';return}
    try{const j=await api('join',{pin});await joinEvent({id:j.id,name:j.name},pin)}catch(err){$('err').textContent=err.message}return}
  const e=get('wbuEvent',{}),pin=($('evp')?$('evp').value:'').replace(/\D/g,'');
  const pass=$('evpw')?$('evpw').value.trim():'';
  if(pin.length<4){$('err').textContent='Bitte eine PIN mit 4 Ziffern für die Punktrichter festlegen.';return}
  if(!pass){$('err').textContent='Bitte das WBU-Supervisor-Passwort eingeben.';return}
  // Passwort immer auf dem Server prüfen – auch wenn die Veranstaltung schon existiert
  try{await api('auth',{pass})}
  catch(err){$('err').textContent=/Passwort/.test(err.message)?err.message:'Keine Verbindung zum WBU-Server: '+err.message;return}
  const old=get('wbuWebSup',null);
  try{
    // gleiche Veranstaltung (gleicher Promoter, Ort, Datum, Supervisor) weiterführen statt neu anzulegen
    if(old&&old.name===e.name&&old.ort===e.ort&&old.date===e.date&&old.sup===n&&(old.pin||'')===pin&&(old.lid||'')===(S.lid||'')){
      await api('sup_pull',{ev:old.ev,key:old.key});S.web=old}
    else throw 0}
  catch(x){
    try{const j=await api('create',{name:e.name,ort:e.ort,date:e.date,sup:n,pin,pass,lid:S.lid||''});
      S.web={ev:j.id,key:j.key,name:e.name,ort:e.ort,date:e.date,sup:n,pin,lid:S.lid||''};set('wbuWebSup',S.web)}
    catch(err){$('err').textContent=/Passwort/.test(err.message)?err.message:'Keine Verbindung zum WBU-Server: '+err.message;return}}
  set('wbuEvent',{...e,pin});S.view='sup';render();startPoll()
  if(S.web.lid&&clubTok())lapi('l_grant',{lid:S.web.lid,ev:S.web.ev,key:S.web.key,tok:clubTok()}).catch(()=>{})}
function doLogin(){
  const n=$('nm').value.trim();
  if(!S.role){$('err').textContent='Bitte Rolle wählen.';return}
  if(n.length<3){$('err').textContent='Bitte vollständigen Namen eintragen.';return}
  if(S.role==='sup'){const en=$('evn').value.trim(),eo=$('evo').value.trim();
    const ed=fromIso($('evd').value);
    if(!en||!eo||!ed){$('err').textContent='Bitte Promoter, Ort und Datum eintragen.';return}
    if($('eva')&&$('eva').value.trim().length<3){$('err').textContent='Bitte den Namen des Ringarztes eintragen – ohne Ringarzt kann die Veranstaltung nicht starten.';return}
    const e=get('wbuEvent',{});set('wbuEvent',{...e,name:en,ort:eo,date:ed,arzt:($('eva')?$('eva').value.trim():e.arzt||'')})}
  S.name=n;
  if(WEB){webLogin(n);return}
  // Tablet mit WBU Sports per Bluetooth: Kampfliste vom Tablet, Ergebnisse ans Tablet – ganz ohne Internet
  if(NATIVE&&S.role==='sup'&&S.lid==='hub'){S.nlid='hub';S.live=null;S.liveJs='';S.hubSt='Suche Tablet …';const e=get('wbuEvent',{});
    WBU.startSupervisorHub(n,[e.name,e.ort].filter(Boolean).join(' · '));startNativeLive();S.view='sup';render();return}
  // Laptop mit WBU Sports (Windows-Programm) verbindet sich selbst per Bluetooth mit diesem Handy
  if(NATIVE&&S.role==='sup'&&S.lid==='pc'){S.nlid='pc';S.live=null;S.liveJs='';S.hubSt='Warte auf den Laptop …';S.hubOk=false;const e=get('wbuEvent',{});
    WBU.startSupervisor(n,[e.name,e.ort].filter(Boolean).join(' · '));startNativeLive();S.view='sup';render();return}
  if(NATIVE&&S.role==='sup'&&S.lid&&!S.nlidOk){const pw=$('evpwn')?$('evpwn').value.trim():'';
    if(!pw){$('err').textContent='Bitte das WBU-Supervisor-Passwort eingeben (für WBU Sports).';return}
    lapi('auth',{pass:pw}).then(()=>{S.npass=pw;S.nlid=S.lid;S.nlidOk=true;doLogin();S.nlidOk=false;startNativeLive()})
      .catch(err=>{$('err').textContent=/Passwort/.test(err.message)?err.message:'Keine Internetverbindung zu WBU Sports: '+err.message});return}
  if(NATIVE&&S.role==='sup'&&!S.lid){S.nlid='';clearInterval(nliveT)}
  // Ohne gewählte Show sucht der Supervisor automatisch nach WBU Sports per Bluetooth (Tablet); ein Laptop verbindet sich von selbst
  if(NATIVE){if(S.role==='judge')WBU.startJudge(n);else{const e=get('wbuEvent',{}),ev=[e.name,e.ort].filter(Boolean).join(' · ');if(S.lid)WBU.startSupervisor(n,ev);else WBU.startSupervisorHub(n,ev)}}
  if(S.role==='judge'){newCard();S.view='judge'}else S.view='sup';
  render();
}

// ================= PUNKTRICHTER =================
function newCard(){S.card={id:Date.now()+'-'+Math.random().toString(36).slice(2,6),rounds:[],end:null,done:false,rev:0,corrected:false};S.cur={r:10,b:10,dr:0,db:0};S.editIdx=null;S.lastSent=null}
function wheel(side){return `<div class="wheelbox"><div class="wheel" id="w${side}"><div class="pad"></div>${VALS.map(v=>`<div class="it" data-v="${v}" onclick="setVal('${side}',${v},true)">${v}</div>`).join('')}<div class="pad"></div></div></div>`}
function ded(side){const k='d'+side;return `<div class="dlabel">Minuspunkte (nochmal tippen = weg)</div><div class="ded" data-k="${k}">${[1,2,3,4].map(v=>`<div class="chip ${S.cur[k]===v?'on':''}" onclick="S.cur.${k}=S.cur.${k}===${v}?0:${v};updSum()">−${v}</div>`).join('')}</div>`}
function sendStatus(){const l=S.lastSent;if(!l)return'';
  const what=l.corr?`Korrektur Runde ${l.corr}`:l.done?`Kampf (${l.rounds} Runden)`:`Runde ${l.rounds}`;
  return S.delivered?`<b style="color:var(--ok)">✓ ${what} beim Supervisor angekommen</b>`:`${what} wird ${WEB?'über das Internet':'per Bluetooth'} übertragen … (wird automatisch nachgesendet)`}
function vJudge(){
  const c=S.card, n=c.rounds.length, ed=S.editIdx!=null, rn=ed?S.editIdx+1:n+1;
  const head=ed?`<h2 style="margin:0;color:var(--gold)">Runde ${rn} korrigieren</h2>`:`<h2 style="margin:0">Runde ${rn}</h2>`;
  const btns=ed?`<div class="row2"><button class="btn sec" onclick="cancelEdit()">Abbrechen</button><button class="btn ok" onclick="saveEdit()">${c.rev?'Korrektur senden':'Korrektur speichern'}</button></div>`
    :`<div class="row2"><button class="btn ok" style="font-size:16px" onclick="roundSend()">Runde ${rn} senden</button><button class="btn blue" style="font-size:15px;line-height:1.2" onclick="roundSave()">Runde ${rn} speichern<br><span style="font-size:12px;font-weight:600">(ohne Senden)</span></button></div>
      <button class="btn sec" onclick="askFinish()">Kampf abschließen</button>`;
  return `<div class="rbar">${head}${btBadge('mit Supervisor verbunden')}</div>
  <div id="jcur" class="muted" style="display:none;margin:-4px 0 6px"></div>
  <div class="corners">
    <div class="corner r"><div class="cname" id="jred">Rote Ecke</div>${wheel('r')}${ded('r')}</div>
    <div class="corner b"><div class="cname" id="jblue">Blaue Ecke</div>${wheel('b')}${ded('b')}</div>
  </div>
  <div class="sum"><span class="r" id="sr">10</span><span class="x">:</span><span class="b" id="sb">10</span></div>
  <div class="note" id="sn"></div>
  ${btns}
  <div id="sendst" class="note" style="margin-top:8px">${sendStatus()}</div>
  ${n&&!ed?`<h3>Meine Wertung</h3><div class="card">${table(c.rounds,true)}</div>`:''}
  ${ed?'':`<button class="btn sec" onclick="openEnd()">Kampf vorzeitig beendet (K.O. / T.K.O. / RTD …)</button>`}
  ${ed?'':chatBox()}`;
}
let lock=false;
function initWheels(){
  ['r','b'].forEach(s=>{const w=$('w'+s);w.scrollTop=VALS.indexOf(S.cur[s])*60;mark(s);let t;
    w.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{if(lock)return;const i=Math.max(0,Math.min(4,Math.round(w.scrollTop/60)));if(VALS[i]!==S.cur[s])setVal(s,VALS[i],false)},90)})});
  updSum();
}
function mark(s){document.querySelectorAll('#w'+s+' .it').forEach(e=>e.classList.toggle('sel',+e.dataset.v===S.cur[s]))}
function setVal(s,v,scroll){
  S.cur[s]=v;const o=s==='r'?'b':'r';
  if(v<10&&S.cur[o]<10){S.cur[o]=10;lock=true;$('w'+o).scrollTo({top:0,behavior:'smooth'});setTimeout(()=>lock=false,450);mark(o)}
  if(scroll)$('w'+s).scrollTo({top:VALS.indexOf(v)*60,behavior:'smooth'});
  mark(s);updSum();
}
function updSum(){sessSave();
  const{r,b,dr,db}=S.cur;const[R,B]=calc(r,b,dr,db);
  $('sr').textContent=R;$('sb').textContent=B;
  document.querySelectorAll('.ded').forEach(el=>{const k=el.dataset.k;el.querySelectorAll('.chip').forEach((c,j)=>c.classList.toggle('on',S.cur[k]===j+1))});
  let n='';if(dr||db){n=`Wertung ${r}:${b} · Abzug Rot −${dr}, Blau −${db}`;if((r-dr)<10&&(b-db)<10)n+=' → auf 10 hochgestuft';}
  $('sn').textContent=n;
}
const FRESH=()=>({r:10,b:10,dr:0,db:0});
function pushRound(){S.card.rounds.push({r:S.cur.r,b:S.cur.b,dr:S.cur.dr,db:S.cur.db});S.cur=FRESH()}
function roundSave(){pushRound();if(S.card.rounds.length>=MAXR){askFinish();return}render();window.scrollTo(0,0)}
function roundSend(){pushRound();transmit();if(S.card.rounds.length>=MAXR){askFinish();return}render();window.scrollTo(0,0);verAfterSend()}
function sheet(html){$('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeSheet()"><div class="sheet">${html}</div></div>`}
function closeSheet(){$('modal').innerHTML=''}
function askFinish(){
  const c=S.card,n=c.rounds.length,rn=n+1,[a,b]=calc(S.cur.r,S.cur.b,S.cur.dr,S.cur.db),[R,B]=totals(c.rounds);
  sheet(`<h2>Kampf abschließen?</h2>
  ${n?`<button class="btn blue" onclick="closeSheet();finish(false)">Nach Runde ${n} abschließen</button><p class="muted" style="text-align:center">${n} Runden · Rot ${R} : Blau ${B}</p>`:''}
  ${n<MAXR?`<button class="btn ${n?'sec':'blue'}" onclick="closeSheet();finish(true)">Runde ${rn} (${a}:${b}) noch mitzählen und abschließen</button>`:''}
  <p class="muted">Danach kannst du jede Runde noch antippen und korrigieren.</p>
  <button class="btn sec" onclick="closeSheet()">Abbrechen</button>`);
}
function finish(withCur){if(withCur)pushRound();S.card.done=true;transmit();S.view='sent';render();window.scrollTo(0,0);verAfterSend()}
function openEnd(){
  const rn=S.card.rounds.length+1;
  sheet(`<h2>Kampf vorzeitig beendet</h2><p class="muted">Nur ein Hinweis – das Ergebnis entscheidet der Supervisor.</p>
  <div class="chips">${['K.O.','T.K.O.','RTD','DQ','Unfall/Verletzung','Sonstiges'].map(t=>`<div class="chip" onclick="closeSheet();S.card.end={t:'${t}',r:${rn}};finish(false)">${t}</div>`).join('')}</div>
  <p class="muted">In Runde ${rn}. Die laufende Runde wird nicht gewertet. Der Kampf wird sofort gesendet.</p>
  <button class="btn sec" onclick="closeSheet()">Abbrechen</button>`);
}
// Scorecard (immer mit derselben ID) an den Supervisor schicken – er ersetzt die alte Fassung
function transmit(corrRound){
  const c=S.card;c.rev=(c.rev||0)+1;
  const card={id:c.id,judge:S.name,rounds:c.rounds.map(x=>({...x})),end:c.end,done:!!c.done,rev:c.rev,corrected:!!c.corrected,ts:Date.now(),
    at:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})};
  S.lastSent={rounds:c.rounds.length,done:c.done,corr:corrRound||0};S.sendId=c.id;S.delivered=!(NATIVE||WEB);
  if(NATIVE)WBU.sendCard(JSON.stringify(card));else if(WEB)webSend(card);else upsertInbox(card);
}
function startEdit(i){S.backup={...S.cur};S.editIdx=i;S.cur={...S.card.rounds[i]};S.view='judge';render();window.scrollTo(0,0)}
function cancelEdit(){S.cur=S.backup||FRESH();S.editIdx=null;S.view=S.card.done?'sent':'judge';render();window.scrollTo(0,0)}
function saveEdit(){
  const i=S.editIdx;S.card.rounds[i]={r:S.cur.r,b:S.cur.b,dr:S.cur.dr,db:S.cur.db};S.editIdx=null;S.cur=S.backup||FRESH();
  if(S.card.rev){S.card.corrected=true;transmit(i+1)}
  S.view=S.card.done?'sent':'judge';render();window.scrollTo(0,0);
}
function vSent(){
  const c=S.card;
  return `<div class="card" style="text-align:center"><div class="big" style="color:var(--ok)">✓</div><h2>Abgeschlossen</h2>
  <div class="muted">Punktrichter ${esc(S.name)}</div>
  <div id="sendst" class="note" style="margin-top:6px">${sendStatus()}</div>${c.end?`<p class="warn">Hinweis: ${esc(c.end.t)} in Runde ${c.end.r}</p>`:''}</div>
  <div class="card">${table(c.rounds,true)}</div>
  <button class="btn" onclick="newCard();S.view='judge';render()">Nächster Kampf</button>
  ${chatBox()}`;
}

// ================= SUPERVISOR =================
// Eingehende Scorecards werden automatisch zu Kämpfen sortiert (Kampf 1, 2, 3 …):
// jede Scorecard kommt in den ältesten offenen Kampf, in dem dieser Punktrichter noch fehlt.
function jc(){return Math.min(3,Math.max(1,get('wbuJudgeCount',3)))}
function fights(){
  const n=jc(), inbox=get('wbuInbox',[]), fs=[];

    if(($('nm').value||'').trim().length>=3)doLogin()},500)}catch(e){}})();
