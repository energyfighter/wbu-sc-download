u00e1ticamente a su categor\u00eda de peso.</li>\n<li>Verde: emparejamiento fijo \u00b7 Amarillo: espera rival \u00b7 \u25b6: ya en curso.</li>\n<li>Al hacer clic en una categor\u00eda se ven los participantes. Se pueden a\u00f1adir deportistas a mano y ajustar asaltos, duraci\u00f3n y ring.</li>\n<li>Quitar participantes: \u2715 \u2013 mientras no haya ning\u00fan combate puntuado en la categor\u00eda, se sortea de nuevo autom\u00e1ticamente.</li>\n<li>Si la categor\u00eda ya est\u00e1 en marcha: \u00abno est\u00e1\u00bb \u2013 el deportista se tacha y pierde sus combates abiertos sin combatir; \u00abs\u00ed est\u00e1\u00bb lo deshace.</li>\n</ul>\n<h3 id=\"anl-2-6-cuadros\">2.6 Cuadros</h3>\n<p>Sistema eliminatorio, sorteado autom\u00e1ticamente; los compa\u00f1eros de club se evitan en lo posible en la primera ronda. Los exentos se reparten de forma equilibrada. Los ganadores avanzan solos. No hay combate por el 3.er puesto: los dos perdedores de semifinales son terceros. \u00abNuevo sorteo\u00bb es posible, pero borra los resultados ya introducidos de la categor\u00eda. \u00abImprimir cuadro\u00bb para el tabl\u00f3n.</p>\n<h3 id=\"anl-2-7-lista-de-combates-y-rings\">2.7 Lista de combates y rings</h3>\n<ul>\n<li>Los combates se reparten de forma equilibrada entre los rings; m\u00e1ster preferiblemente en el ring 1.</li>\n<li>Quien participa dos veces nunca combate a la vez en dos rings y recibe la pausa m\u00ednima ajustada (p. ej. 4 combates entre medias).</li>\n<li>\u00abImprimir / PDF\u00bb para la lista de combates por ring.</li>\n</ul>\n<h3 id=\"anl-2-8-poner-en-vivo\">2.8 Poner en vivo</h3>\n<p>En la pesta\u00f1a \u00abLista de combates\u00bb tocar \u00abPoner en vivo\u00bb (contrase\u00f1a WBU). Despu\u00e9s aparecen:</p>\n<ul>\n<li>el enlace a WBU Live (m\u00f3vil, p\u00fablico),</li>\n<li>el enlace de televisor para el monitor del pabell\u00f3n,</li>\n<li>los botones \u00abAbrir ring 1\u00bb, \u00abAbrir ring 2\u00bb para WBU Time.</li>\n</ul>\n<p>El evento aparece entonces tambi\u00e9n en la tarjeta del supervisor. El PC con WBU Sports debe seguir abierto y en l\u00ednea durante el evento \u2013 env\u00eda la lista de combates y recoge los resultados.</p>\n<h2 id=\"anl-3-organizador-crear-una-gala-profesional\">3. Organizador \u2013 crear una gala profesional</h2>\n<p>Una gala es una velada combate a combate, sin categor\u00edas ni cuadros. Siempre se celebra en un ring.</p>\n<ol>\n<li>En la p\u00e1gina de inicio elegir \u00abGala profesional\u00bb.</li>\n<li>Rellenar la pesta\u00f1a \u00abEvento\u00bb como en 2.2 (nombre, promotor, lugar, fecha, m\u00e9dico de ring).</li>\n<li>Pesta\u00f1a \u00abCartelera\u00bb: introducir cada combate y \u00ab+ A\u00f1adir combate\u00bb:</li>\n<li>esquina roja y azul (nombre, obligatorio),</li>\n<li>por esquina gimnasio / club, pa\u00eds, fecha de nacimiento (la edad se calcula el d\u00eda del evento) y peso en el pesaje,</li>\n<li>categor\u00eda de peso (obligatorio),</li>\n<li>t\u00edtulo seg\u00fan autorizaci\u00f3n de la WBU \u2013 para hacer clic: Campeonato del Mundo, Intercontinental, de Europa, Internacional, de Alemania; para t\u00edtulos especiales \u00abOtro t\u00edtulo \u2013 escribir\u00bb (p. ej. Campeonato Mundial Junior); sin t\u00edtulo \u00ab\u2013 sin t\u00edtulo en juego \u2013\u00bb,</li>\n<li>tipo de combate, n\u00famero de asaltos y duraci\u00f3n.</li>\n<li>Cambiar el orden con \u25b2 \u25bc, \u270e editar, \u2715 borrar.</li>\n<li>\u00abPoner en vivo\u00bb como en 2.8 \u2013 despu\u00e9s cronometraje y pantalla de TV mediante los botones de la cartelera.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Ajuste</th>\n<th>Opciones</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Tipo de combate</td>\n<td>Profesional, Semi-Pro, Master, Bare Knuckle, Hybrid, K1 / kickboxing</td>\n</tr>\n<tr>\n<td>Categor\u00eda de peso</td>\n<td>categor\u00edas profesionales de peso minimosca a pesado</td>\n</tr>\n<tr>\n<td>T\u00edtulo</td>\n<td>sin t\u00edtulo, Campeonato del Mundo, Intercontinental, de Europa, Internacional, de Alemania o escribir</td>\n</tr>\n<tr>\n<td>Asaltos</td>\n<td>libre, de 1 a 12</td>\n</tr>\n<tr>\n<td>Duraci\u00f3n del asalto</td>\n<td>3, 2, 1,5 o 1 minuto; pausa siempre 1 minuto</td>\n</tr>\n</tbody>\n</table>\n<p>En la gala tambi\u00e9n es posible el empate o no contest; en el torneo siempre debe haber un ganador.</p>\n<h3 id=\"anl-3-1-subir-la-gala-obligatorio\">3.1 Subir la gala \u2013 obligatorio</h3>\n<p>En cuanto la cartelera tiene su primer combate y hay internet, WBU Sports pide: \u00ab\u26a0 Obligatorio: subir evento\u00bb. Introducir una vez la contrase\u00f1a WBU \u2013 y la gala est\u00e1 en l\u00ednea (aunque se haya creado en el programa de Windows o en la app de tableta). Solo as\u00ed el supervisor recibe la cartelera y puede cambiarla el d\u00eda del evento. Con la primera subida la WBU recibe autom\u00e1ticamente un e-mail informativo (a info@wbu-boxing.com) con nombre, fecha, lugar y organizador \u2013 tambi\u00e9n para torneos.</p>\n<h3 id=\"anl-3-2-cambiar-la-cartelera-el-d-a-del-evento\">3.2 Cambiar la cartelera el d\u00eda del evento</h3>\n<ul>\n<li><strong>Organizador:</strong> en cualquier momento en la cartelera (\u270e cambiar, \u25b2 \u25bc mover, \u2715 borrar, nuevos combates). Todo llega autom\u00e1ticamente a la tarjeta, WBU Live y WBU Time.</li>\n<li><strong>Supervisor (si el organizador no est\u00e1):</strong> en la tarjeta, en el recuadro \u00abDesde WBU Sports\u00bb, tocar \u00ab\u270e Editar cartelera\u00bb. Cambiar nombres, pa\u00eds, fecha de nacimiento, peso, categor\u00eda, t\u00edtulo, tipo de combate, asaltos y duraci\u00f3n, mover, a\u00f1adir o quitar combates \u2013 \u00abGuardar y enviar\u00bb. Tambi\u00e9n funciona sin internet si est\u00e1 conectado por Bluetooth con la tableta o el port\u00e1til; si internet falla un momento, se reenv\u00eda solo.</li>\n<li><strong>Mediante la cuenta WBU Sports:</strong> quien haya entrado en la tarjeta en el navegador como supervisor con la contrase\u00f1a WBU y estaba conectado a WBU Sports, encontrar\u00e1 despu\u00e9s la gala en la p\u00e1gina de inscripci\u00f3n en \u00ab\u270e Habilitado como supervisor\u00bb \u2013 con \u00abEditar cartelera\u00bb. Vale solo para esta gala y termina tras el d\u00eda del evento.</li>\n<li>Los combates ya puntuados no se pueden quitar y solo se cambian tras confirmaci\u00f3n. El organizador ve en WBU Sports qui\u00e9n cambi\u00f3 qu\u00e9 y cu\u00e1ndo.</li>\n</ul>\n<h3 id=\"anl-3-5-supervisor-acceso-completo-en-cualquier-dispositivo\">3.5 Supervisor: acceso completo en cualquier dispositivo</h3>\n<ol>\n<li>Abrir port\u00e1til o tableta, www.wbu-boxing.com \u2192 <strong>WBU Sports</strong>.</li>\n<li>Tocar <strong>\u00ab\ud83d\udee1 Entrar como supervisor\u00bb</strong>, introducir nombre y apellido y la <strong>contrase\u00f1a de supervisor WBU</strong> (la misma que en la tarjeta \u2013 solo la conocen supervisores reales).</li>\n<li>Aparecen todos los eventos subidos. Hacer clic en el correcto \u2013 acceso completo a cartelera, centro de control, reloj, WBU Time y resultados.</li>\n<li>Los cambios de organizador y supervisor se sincronizan autom\u00e1ticamente cada 20 segundos.</li>\n<li><strong>Solo un dispositivo maneja el centro de control:</strong> si ya funciona en otro, aparece en rojo \u00ab\u26a0 El centro de control est\u00e1 funcionando en otro dispositivo\u00bb con nombre y hora. \u00abTomar el control aqu\u00ed\u00bb cambia de forma consciente.</li>\n</ol>\n<p><strong>Inicio de sesi\u00f3n en la tarjeta:</strong> promotor, lugar, fecha y m\u00e9dico de ring quedan vac\u00edos hasta elegir un show \u2013 entonces se rellenan solos.</p>\n<p><strong>Supervisor en port\u00e1til/PC:</strong> Bajo el centro de control aparece \u00ab\ud83d\udee1 Mi tarjeta de supervisor\u00bb \u2013 con sesi\u00f3n iniciada autom\u00e1ticamente y todas las funciones de la tarjeta. Arriba se ve grande el PIN para los jueces, as\u00ed que el supervisor no necesita m\u00f3vil. \u00abAbrir en ventana propia\u00bb la abre aparte. (Solo visible con sesi\u00f3n de supervisor y el evento en vivo.)</p>\n<p><strong>Roles al entrar con la contrase\u00f1a de supervisor:</strong> El rol se elige arriba a la derecha (y en la ventana de acceso). <strong>\ud83d\udee1 Supervisor:</strong> ve el centro de control en vivo (el reloj corre, pero no se puede manejar) y tiene debajo la tarjeta de supervisor. <strong>\ud83c\udf9b Organizador (director t\u00e9cnico):</strong> El director t\u00e9cnico supervisa y maneja el segundo centro de control \u2013 puede ser a la vez el cronometrador. Maneja el centro de control \u2013 reloj, monitores, resultados, edici\u00f3n \u2013 sin tarjeta. As\u00ed funcionan dos centros de control a la vez: uno para que el supervisor observe y otro para manejar.</p>\n<h3 id=\"anl-voz-del-locutor\">Voz del locutor</h3>\n<p>Para eventos sin locutor propio. Sonido desde el PC del centro de control a la megafon\u00eda.</p>\n<ul>\n<li>En el centro de control activa <strong>\u00ab\ud83c\udfa4 Locutor activado\u00bb</strong> y elige el idioma (DE, EN, ES, FR, RU). <strong>\u00ab\u25b6 Prueba\u00bb</strong> prueba la voz.</li>\n<li><strong>Anuncio con un bot\u00f3n</strong> (centro de control \u00abEn el ring\u00bb o cartelera \ud83c\udfa4): <strong>Combate</strong> (n\u00famero, t\u00edtulo, categor\u00eda, asaltos), <strong>Esquina roja</strong>, <strong>Esquina azul</strong> (pa\u00eds, gimnasio, nombre).</li>\n<li><strong>\ud83c\udfc6 Anuncio del ganador:</strong> Tras el resultado (cuando el \u00e1rbitro ha terminado) pulsa <strong>\u00ab\ud83c\udfc6 Ganador\u00bb</strong> en el centro de control o \ud83c\udfc6 en la cartelera. La voz anuncia el m\u00e9todo y el asalto del resultado introducido, p. ej. \u00ab\u00a1Damas y caballeros! \u2026 Por nocaut t\u00e9cnico en el asalto 3 \u2026 y el ganador \u2026 desde la esquina roja \u2026 Marco \u2026 Brandt!\u00bb \u2013 tambi\u00e9n decisiones (un\u00e1nime, dividida, mayoritaria), empates y sin resultado.</li>\n<li><strong>Tono:</strong> En \u00ab\ud83d\udd11 Voz de Google\u00bb hay, junto a la voz y la velocidad, el control <strong>Tono</strong> \u2013 menor = m\u00e1s grave y oscuro, mayor = m\u00e1s agudo. El <strong>nombre de los boxeadores</strong> se pronuncia por separado, con sus propios controles <strong>Velocidad del nombre</strong> y <strong>Tono del nombre</strong>: suena m\u00e1s lento, alargado y enfatizado.</li>\n<li><strong>Gong garantizado:</strong> Al iniciar el asalto primero \u00ab\u00a1Asalto X! \u00a1Box!\u00bb, luego el gong \u2013 tambi\u00e9n tras \u00ab\u21ba Reiniciar asalto\u00bb o \u00ab\u23ed Siguiente asalto\u00bb al pulsar INICIO/CONTINUAR. El gong suena como m\u00e1ximo a los 6 segundos, aunque la voz se quede colgada.</li>\n<li><strong>Autom\u00e1tico con el reloj:</strong> al pulsar START o al empezar un asalto, primero \u00ab\u00a1Asalto 1 \u2013 box!\u00bb y luego la campana (\u00faltimo asalto con \u00ab\u00a1\u00daltimo asalto!\u00bb). Al final del asalto, primero la campana y luego \u00ab\u00a1Fin del asalto 1!\u00bb (al final del combate \u00ab\u00a1Fin del combate!\u00bb). \u00ab\u00a1Segundos fuera!\u00bb con el aviso de 10 segundos en el descanso.</li>\n<li><strong>Voz:</strong> gratis. Sin clave habla la voz del navegador. Con <strong>\u00ab\ud83d\udd11 Voz de Google\u00bb</strong> (solo con la contrase\u00f1a de supervisor WBU) se configura la voz de Google, m\u00e1s natural \u2013 gratis hasta 1 mill\u00f3n de caracteres al mes (una gala necesita unos 5.000\u201310.000).</li>\n<li><strong>\ud83d\udd14 Campana a mano:</strong> el bot\u00f3n \u00ab\ud83d\udd14 Campana\u00bb junto a START/STOP suena una vez con cada clic \u2013 tambi\u00e9n con el reloj en autom\u00e1tico (p. ej. si no se oy\u00f3).</li>\n<li><strong>Probar:</strong> todo usuario con sesi\u00f3n (organizador, supervisor, WBU) tiene \u00ab\ud83e\uddea Abrir evento de prueba\u00bb en la p\u00e1gina de inicio \u2013 con 2 combates, solo en este dispositivo, nunca se sube ni sale en vivo.</li>\n<li>En el rol supervisor el locutor no habla \u2013 solo el centro de control del director t\u00e9cnico.</li>\n</ul>\n<p><strong>Televisores (barra \ud83d\udcfa en el centro de control):</strong> <strong>\ud83d\udcfa WBU Live</strong> (lista de combates), <strong>\u23f1 WBU Time 1</strong> y <strong>\u23f1 WBU Time 2</strong> (reloj). Con internet abren las p\u00e1ginas en vivo (tambi\u00e9n en Fire TV). Sin internet se abre una ventana en el PC \u2013 arr\u00e1strala al televisor (HDMI) y pulsa F11. As\u00ed funcionan p. ej. tres televisores a la vez en un campeonato. Con un ring, WBU Time 2 muestra el mismo reloj en un segundo televisor.</p>\n<p><strong>\u23f8 Pausa del evento:</strong> en el centro de control pulsa \u00ab\u23f8 Pausa del evento\u00bb y elige 5\u201330 minutos o \u00absin tiempo\u00bb. El combate actual termina y no se llama ning\u00fan combate nuevo \u2013 la automatizaci\u00f3n espera. WBU Time y WBU Live muestran \u00abPAUSA\u00bb con cuenta atr\u00e1s y el siguiente combate. \u00ab\u25b6 Continuar \u2013 llamar al siguiente combate\u00bb termina la pausa (con locutor, si est\u00e1 activado).</p>\n<h3 id=\"anl-3-3-base-de-luchadores\">3.3 Base de luchadores</h3>\n<ul>\n<li>Todos los luchadores de inscripciones de torneos y galas subidas llegan autom\u00e1ticamente a la <strong>base de luchadores</strong>, ordenados por gimnasio. Cada luchador aparece una sola vez.</li>\n<li><strong>\ud83d\udcc7</strong> junto a \u00abEsquina roja\u00bb / \u00abEsquina azul\u00bb (y \u00ab\ud83d\udcc7 Base de datos\u00bb en los participantes del torneo): desplegar un gimnasio o buscar un nombre, hacer clic en el luchador \u2013 nombre, gimnasio, pa\u00eds, fecha de nacimiento y peso se rellenan al instante.</li>\n<li>En la p\u00e1gina de inicio: \u00ab\ud83d\udcc7 Base de luchadores\u00bb para revisar, corregir (\u270e) y a\u00f1adir. Borrar solo con la contrase\u00f1a WBU.</li>\n<li><strong>\ud83d\udce5 Importar lista:</strong> una tabla (Excel \u2192 \u00abCSV UTF-8\u00bb) con las columnas nombre; apellido; gimnasio / club; pa\u00eds \u2013 p. ej. los participantes de un torneo anterior. Quien ya est\u00e1 no se duplica. La categor\u00eda de peso la elige el organizador cada vez.</li>\n<li><strong>Al escribir un nombre</strong> (esquina roja/azul, participantes) aparecen luchadores coincidentes de la base \u2013 al hacer clic se adoptan nombre, gimnasio, pa\u00eds y fecha de nacimiento. As\u00ed no hay duplicados. \u00bfOtra persona con el mismo nombre? A\u00f1ade algo (p. ej. segundo nombre).</li>\n<li><strong>Los clubes en la inscripci\u00f3n en l\u00ednea</strong> solo ven sus <strong>propios</strong> deportistas inscritos antes. Si el nombre existe en otro club, solo aparece el aviso \u00abEste nombre ya existe\u00bb \u2013 sin datos ajenos.</li>\n<li><strong>Cerrada:</strong> la base solo la ven cuentas de organizador y supervisor, entrenadores (solo su gimnasio) y la WBU (contrase\u00f1a WBU) \u2013 nunca el p\u00fablico, ni los clubes entre s\u00ed.</li>\n</ul>\n<h3 id=\"anl-3-4-perfil-del-deportista-r-cord-t-tulos-pesos-y-suspensi-n-por-ko\">3.4 Perfil del deportista: r\u00e9cord, t\u00edtulos, pesos y suspensi\u00f3n por KO</h3>\n<ul>\n<li>En la base de luchadores <strong>\u00abPerfil\u00bb</strong> abre el perfil del deportista. Solo se ve aqu\u00ed en el \u00e1rea protegida \u2013 no en la web.</li>\n<li><strong>R\u00e9cord por deporte, separado:</strong> Profesional, Semi-Pro, Master, K1, Bare Knuckle e Hybrid \u2013 victorias (por KO), derrotas (por KO) y empates. Cada combate del sistema WBU cuenta autom\u00e1ticamente, tambi\u00e9n los resultados publicados antes. Si a\u00fan no hay nada, el pr\u00f3ximo combate WBU es el n.\u00ba 1.</li>\n<li><strong>A\u00f1adir combates de otros sitios:</strong> solo el <strong>entrenador</strong> del mismo gimnasio (rol \u00abEntrenador\u00bb) \u2013 y solo hacia arriba, los n\u00fameros no pueden bajar. Las correcciones hacia abajo solo las hace la WBU. Cada cambio aparece con nombre y fecha en \u00abCambios\u00bb.</li>\n<li><strong>T\u00edtulos:</strong> los t\u00edtulos WBU y las victorias en torneos los registra el sistema autom\u00e1ticamente (o la WBU a mano). Los entrenadores pueden a\u00f1adir t\u00edtulos de otras federaciones; aparecen marcados como \u00abexterno\u00bb.</li>\n<li><strong>Pesos:</strong> cada peso de inscripci\u00f3n y gala se guarda con fecha.</li>\n<li><strong>Suspensi\u00f3n por KO:</strong> tras una derrota por KO el deportista queda suspendido <strong>90 d\u00edas</strong>, tras un TKO <strong>30 d\u00edas</strong> (abandono/RTD: sin suspensi\u00f3n). En la base aparece en rojo \u00ab\ud83d\udeab Suspendido hasta \u2026\u00bb y no se puede elegir ni introducir por nombre en un combate. La WBU puede registrar una suspensi\u00f3n a mano (p. ej. KO en otra federaci\u00f3n) o levantarla con alta m\u00e9dica.</li>\n</ul>\n<h2 id=\"anl-4-el-d-a-de-combate-el-centro-de-control\">4. El d\u00eda de combate \u2013 el centro de control</h2>\n<p>El centro de control muestra todos los rings con reloj, el combate en el ring, los pr\u00f3ximos combates y los anteriores. Est\u00e1 en la pesta\u00f1a \u00ab\ud83c\udf9b Centro de control\u00bb.</p>\n<h3 id=\"anl-4-1-antes-de-empezar\">4.1 Antes de empezar</h3>\n<ol>\n<li>Introducir el m\u00e9dico de ring (campo de arriba, en amarillo mientras est\u00e9 vac\u00edo). Sin m\u00e9dico de ring el reloj no arranca.</li>\n<li>Con varios PC: en \u00abEste PC maneja\u00bb marcar solo los propios rings.</li>\n<li>Elegir la se\u00f1al por ring (p. ej. ring 1 campana, ring 2 silbato) y escuchar con \u25b6.</li>\n<li>Comprobar \u00abSe\u00f1ales activadas\u00bb \u2013 \u00abSILENCIO\u00bb apaga todos los sonidos.</li>\n</ol>\n<h3 id=\"anl-4-2-el-reloj\">4.2 El reloj</h3>\n<table>\n<thead>\n<tr>\n<th>Bot\u00f3n</th>\n<th>Efecto</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\u25b6 INICIO / SEGUIR</td>\n<td>el asalto corre</td>\n</tr>\n<tr>\n<td>\u23f8 PARAR</td>\n<td>el reloj se detiene, arranca solo el tiempo muerto (m\u00e1x. 10 min)</td>\n</tr>\n<tr>\n<td>\u21ba Reiniciar asalto</td>\n<td>asalto actual desde el principio</td>\n</tr>\n<tr>\n<td>\u23ed Siguiente asalto</td>\n<td>salta al siguiente asalto</td>\n</tr>\n<tr>\n<td>As. / Min</td>\n<td>cambiar n\u00famero y duraci\u00f3n de asaltos</td>\n</tr>\n</tbody>\n</table>\n<p>Las se\u00f1ales son autom\u00e1ticas: 10 segundos antes del final del asalto tres golpes de martillo, tras cada asalto y cada pausa una campana, al final del combate tres. La pausa dura siempre 1 minuto.</p>\n<h3 id=\"anl-4-3-pesaje\">4.3 Pesaje</h3>\n<p>En el recuadro \u00abPesaje\u00bb aparece el peso m\u00e1ximo (categor\u00eda m\u00e1s tolerancia, p. ej. -55 kg + 4 kg = m\u00e1x. 59,0 kg). Introducir el peso de rojo y azul. Si est\u00e1 por encima, el sistema pregunta por la descalificaci\u00f3n; el rival gana y pasa.</p>\n<h3 id=\"anl-4-4-casos-especiales-con-un-clic\">4.4 Casos especiales con un clic</h3>\n<table>\n<thead>\n<tr>\n<th>Caso</th>\n<th>Bot\u00f3n</th>\n<th>Consecuencia</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Descalificaci\u00f3n en el pesaje</td>\n<td>\u2696 DQ: rojo / azul</td>\n<td>el rival gana por DQ</td>\n</tr>\n<tr>\n<td>El rival no puede competir (p. ej. lesi\u00f3n)</td>\n<td>\u270b Gan\u00f3 sin combatir: rojo / azul</td>\n<td>sin confirmaci\u00f3n, corregible despu\u00e9s con \u270e</td>\n</tr>\n<tr>\n<td>Deportista no se present\u00f3</td>\n<td>\ud83d\udeab No se present\u00f3: rojo / azul</td>\n<td>el rival gana sin combatir, tambi\u00e9n combates posteriores de este deportista</td>\n</tr>\n</tbody>\n</table>\n<p>Quien pierde sin combatir, no se presenta o es descalificado en el pesaje no recibe diploma por ese puesto.</p>\n<h3 id=\"anl-4-5-resultados\">4.5 Resultados</h3>\n<p>El resultado llega autom\u00e1ticamente del supervisor (tarjeta) o se fija a mano con \u00abIntroducir resultado\u00bb. En cuanto hay resultado, el reloj se reinicia y se carga el siguiente combate. Con \u00abLlamar siguiente combate\u00bb o \u00abllamar\u00bb se cambia el orden.</p>\n<h3 id=\"anl-4-6-segundo-pc-en-el-ring-puesto-de-control\">4.6 Segundo PC en el ring (puesto de control)</h3>\n<p>Con varios rings aparece abajo \u00abSegundo PC en el ring (sin inicio de sesi\u00f3n)\u00bb con un enlace por ring. Abrir ese enlace en el segundo PC: all\u00ed solo se maneja ese ring (reloj, resultados, DQ). Despu\u00e9s, en el PC principal, desmarcar ese ring en \u00abEste PC maneja\u00bb.</p>\n<h3 id=\"anl-4-7-wbu-time-en-el-televisor\">4.7 WBU Time en el televisor</h3>\n<p>El reloj de asaltos para el televisor del ring: asalto a la izquierda, tiempo grande a la derecha, nombres de las esquinas arriba. En el men\u00fa de la web WBU abrir \u00abWBU Time 1\u00bb o \u00abWBU Time 2\u00bb (o en el navegador del Fire TV <a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1\">https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1</a>). Muestra autom\u00e1ticamente el evento en curso y sigue al reloj del centro de control. Activar el sonido del televisor una vez con \u00abSilencio \u2013 activar sonido\u00bb. Sin internet: conectar el televisor al PC por HDMI y abrir la pantalla de tiempo en el centro de control.</p>\n<h2 id=\"anl-5-resultados-diplomas-y-acreditaci-n\">5. Resultados, diplomas y acreditaci\u00f3n</h2>\n<h3 id=\"anl-5-1-resultados\">5.1 Resultados</h3>\n<p>Pesta\u00f1a \u00abResultados\u00bb: puestos 1, 2 y 3 (dos terceros) por categor\u00eda, autom\u00e1ticamente desde los cuadros. \u00abImprimir / PDF\u00bb para el tabl\u00f3n. Las clasificaciones aparecen a la vez en WBU Live.</p>\n<h3 id=\"anl-5-2-fijar-logos-de-antemano\">5.2 Fijar logos de antemano</h3>\n<p>En la pesta\u00f1a \u00ab\ud83c\udfc5 Diplomas\u00bb, en \u00abLogos en los diplomas\u00bb \u2013 antes del d\u00eda de combate, para que ese d\u00eda nadie tenga que ajustar nada:</p>\n<ol>\n<li>\u00abSubir mi logo\u00bb: cada cuenta tiene un logo (club u organizador).</li>\n<li>Marcar qu\u00e9 logos van en los diplomas y acreditaciones de este evento: KCW, el logo propio, logos de otros organizadores.</li>\n<li>Introducir \u00abSegunda web al pie del diploma\u00bb o dejar vac\u00edo.</li>\n</ol>\n<h3 id=\"anl-5-3-imprimir-diplomas\">5.3 Imprimir diplomas</h3>\n<ul>\n<li>Tras una semifinal, el centro de control muestra \u00ab\ud83c\udfc5 Diploma 3.er puesto: nombre\u00bb, tras la final un bot\u00f3n para el 1.\u00ba y otro para el 2.\u00ba. Un clic imprime exactamente ese diploma; despu\u00e9s el bot\u00f3n muestra \u2713.</li>\n<li>En la pesta\u00f1a \u00abDiplomas\u00bb: \u00abImprimir todos los diplomas\u00bb o \u00abImprimir\u00bb por categor\u00eda.</li>\n<li>En un Campeonato de Alemania el 1.er puesto dice \u00abCampe\u00f3n/Campeona de Alemania\u00bb, si no \u00abDiploma\u00bb. Laurel en oro, plata o bronce.</li>\n<li>Ajustes de impresi\u00f3n: papel A4, sin m\u00e1rgenes, marcar gr\u00e1ficos de fondo.</li>\n</ul>\n<h3 id=\"anl-5-4-acreditaciones\">5.4 Acreditaciones</h3>\n<p>Pesta\u00f1a \u00ab\ud83e\udeaa Acreditaci\u00f3n\u00bb (solo para torneos publicados). Tarjetas para todos los deportistas del sistema y para entrenadores y asistentes inscritos \u2013 entrada gratuita.</p>\n<ol>\n<li>Elegir \u00abImprimir en\u00bb: tarjeta de pl\u00e1stico en la impresora de tarjetas (una a una, tama\u00f1o tarjeta vertical 54 \u00d7 85,6 mm) o papel A4 con 9 tarjetas para recortar.</li>\n<li>\u00abImprimir todas las tarjetas\u00bb, \u00abSolo un club\u00bb o \u00abTarjeta\u00bb para una persona.</li>\n<li>Para fotos sin cabeza seleccionada: \u00abRecortar cabeza\u00bb.</li>\n<li>Ajustes de la impresora de tarjetas: formato CR80 vertical, sin m\u00e1rgenes, escala 100 %, gr\u00e1ficos de fondo activados.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Rol</th>\n<th>Color en la tarjeta</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Deportista</td>\n<td>rojo</td>\n</tr>\n<tr>\n<td>Entrenador</td>\n<td>azul</td>\n</tr>\n<tr>\n<td>Asistente</td>\n<td>verde</td>\n</tr>\n</tbody>\n</table>\n<p>Entrada: escanear el c\u00f3digo QR con la c\u00e1mara del m\u00f3vil. Aparece \u00abAcreditaci\u00f3n v\u00e1lida\u00bb con nombre, rol y club \u2013 o \u00abNo v\u00e1lido\u00bb si la tarjeta es falsa o la persona fue eliminada.</p>\n<h2 id=\"anl-6-supervisor-manejar-la-tarjeta\">6. Supervisor \u2013 manejar la tarjeta</h2>\n<p>El supervisor registra el evento en la tarjeta, fija el PIN de los jueces y confirma cada resultado. Usa el navegador (https://www.wbu-boxing.com/scorecard/) o la app Android WBU-SC.</p>\n<p><strong>Aviso \u00abPor favor, completa\u00bb:</strong> si en una gala faltan el peso (esquina roja/azul) o la categor\u00eda, solo la tarjeta del supervisor muestra un aviso amarillo \u2013 no los jueces. Completar con \u00ab\u270e Editar cartelera\u00bb. Sin categor\u00eda el combate se puede guardar igualmente.</p>\n<p><strong>Regla de edad:</strong> si est\u00e1n las fechas de nacimiento de ambos luchadores, WBU Sports y la tarjeta comprueban la edad el d\u00eda del combate: <strong>boxeo m\u00e1ster</strong> como m\u00e1ximo <strong>5 a\u00f1os</strong> de diferencia (p. ej. 48 contra 52 permitido), <strong>juveniles</strong> (menores de 18) como m\u00e1ximo <strong>2 a\u00f1os</strong> (p. ej. 14 contra 12 no permitido). Si no cumple, el combate no se acepta.</p>\n<p><strong>Subida por la WBU:</strong> el superadministrador de la WBU puede subir una gala sin contrase\u00f1a (con su cuenta). Despu\u00e9s solo el supervisor puede cambiar la cartelera.</p>\n<h3 id=\"anl-6-1-iniciar-sesi-n\">6.1 Iniciar sesi\u00f3n</h3>\n<ol>\n<li>Tocar \u00abSupervisor\u00bb, introducir nombre y apellido.</li>\n<li>Introducir promotor, lugar y fecha.</li>\n<li>Introducir el m\u00e9dico de ring \u2013 obligatorio, vale para todos los combates.</li>\n<li>En \u00abElegir show\u00bb tocar el show \u2013 all\u00ed solo aparecen shows. Sin internet en el ring, simplemente no elegir show: la app busca sola WBU Sports en la tableta por Bluetooth o el port\u00e1til se conecta solo (ver cap\u00edtulos 10.1 y 10.2): se adoptan combates, nombres, pa\u00eds, edad, peso, categor\u00eda, t\u00edtulo, asaltos, duraci\u00f3n y m\u00e9dico de ring, aparecen en el resultado y en el informe PDF, y los resultados van solos a WBU Sports. En un torneo con varios rings elegir el propio ring.</li>\n<li>Introducir la contrase\u00f1a de supervisor WBU. Impide que alguien se haga pasar por supervisor; darla solo a supervisores reales.</li>\n<li>Fijar el PIN para los jueces (4 cifras, obligatorio en el navegador) y dec\u00edrselo a los jueces.</li>\n<li>\u00ab\u00a1Vamos!\u00bb.</li>\n</ol>\n<p>En la app los jueces se conectan por Bluetooth con el m\u00f3vil del supervisor \u2013 sin internet. La app solo necesita internet para la conexi\u00f3n con WBU Sports.</p>\n<h3 id=\"anl-6-2-configurar-un-combate\">6.2 Configurar un combate</h3>\n<ul>\n<li>N\u00famero de asaltos (1\u201312), duraci\u00f3n, n\u00famero de jueces (1\u20133), tipo de combate.</li>\n<li>Esquina roja y azul con pa\u00eds \u00b7 edad \u00b7 peso, categor\u00eda o t\u00edtulo (ya rellenados con WBU Sports; sin WBU Sports los escribe el supervisor).</li>\n<li>Gala desde WBU Sports: \u00ab\u270e Editar cartelera\u00bb cambia la cartelera para todos (ver 3.2).</li>\n<li>Introducir \u00e1rbitro y cronometrador. Se mantienen para los siguientes combates; los nombres guardados de \u00e1rbitros y jueces se pueden tocar.</li>\n<li>Arriba aparece cu\u00e1ntos jueces est\u00e1n conectados.</li>\n</ul>\n<h3 id=\"anl-6-3-ver-puntuaciones\">6.3 Ver puntuaciones</h3>\n<p>Las puntuaciones de los jueces aparecen en vivo, asalto a asalto, con suma. \u00ablisto\u00bb muestra qui\u00e9n ha cerrado el combate. En el chat se pueden enviar mensajes cortos a los jueces.</p>\n<p><strong>Corregir:</strong> cualquier asalto de una tarjeta se puede tocar y corregir si un juez se equivoc\u00f3 claramente. El asalto se marca en dorado (con el valor anterior), la tarjeta recibe \u00abCorrecci\u00f3n SV\u00bb y el informe muestra un *.</p>\n<p><strong>Los jueces punt\u00faan en papel:</strong> encima de \u00abCombate 1\u00bb est\u00e1 el interruptor \u00abLos jueces punt\u00faan en papel\u00bb. Si est\u00e1 activado, bajo los datos del combate aparece <strong>\u00ab\u270d\ufe0f Puntuaci\u00f3n en papel\u00bb</strong>: introducir los nombres de los jueces (se mantienen para los siguientes combates; los nombres guardados se pueden tocar), despu\u00e9s tocar cada casilla y elegir la puntuaci\u00f3n de la tarjeta \u2013 10:9, 10:10, 9:10, 10:8, 8:10 o \u00abm\u00e1s\u2026\u00bb para puntos y deducciones propios. La app calcula las sumas; el resultado queda \u00abseg\u00fan las tarjetas\u00bb y se confirma como siempre. Basta un m\u00f3vil.</p>\n<h3 id=\"anl-6-4-fijar-el-resultado\">6.4 Fijar el resultado</h3>\n<ol>\n<li>Elegir el resultado. El sistema propone una decisi\u00f3n a partir de las puntuaciones.</li>\n<li>Tocar al ganador.</li>\n<li>En KO, TKO, RTD (abandono en la esquina), descalificaci\u00f3n y decisi\u00f3n t\u00e9cnica introducir adem\u00e1s asalto y tiempo, p. ej. asalto 3, 1:25.</li>\n<li>Guardar \u2013 el resultado va a WBU Sports, al centro de control, a WBU Live y a WBU Time.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Resultado</th>\n<th>Significado</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>UD / SD / MD</td>\n<td>decisi\u00f3n un\u00e1nime / dividida / mayoritaria</td>\n</tr>\n<tr>\n<td>KO / TKO</td>\n<td>con asalto y tiempo</td>\n</tr>\n<tr>\n<td>RTD</td>\n<td>abandono en la esquina</td>\n</tr>\n<tr>\n<td>DQ</td>\n<td>descalificaci\u00f3n</td>\n</tr>\n<tr>\n<td>TD</td>\n<td>decisi\u00f3n t\u00e9cnica</td>\n</tr>\n<tr>\n<td>W.O.</td>\n<td>sin combatir</td>\n</tr>\n<tr>\n<td>Empate, empate t\u00e9cnico, no contest</td>\n<td>solo en galas</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"anl-6-5-cierre\">6.5 Cierre</h3>\n<p>\u00abSiguiente combate\u00bb lleva al siguiente combate. Al final \u00abCerrar evento y crear PDF\u00bb \u2013 con doble confirmaci\u00f3n (\u00abS\u00ed, cerrar\u00bb y luego \u00abCerrar definitivamente y enviar\u00bb), para que nada se env\u00ede por error. Un combate se puede reabrir en cualquier momento; un evento cerrado tambi\u00e9n se puede continuar con \u00abReabrir evento\u00bb \u2013 al cerrar de nuevo, los resultados van a la WBU como correcci\u00f3n. El informe contiene cada combate con resultado, puntuaciones, supervisor, \u00e1rbitro, cronometrador, m\u00e9dico de ring y jueces. \u00abCopiar como texto\u00bb da un resultado para reenviar.</p>\n<p>Al cerrar, los resultados van autom\u00e1ticamente a la WBU: la oficina recibe un e-mail con el informe PDF (info@wbu-boxing.com) y todos los combates aparecen al instante en la p\u00e1gina p\u00fablica <strong>Resultados</strong> (https://www.wbu-boxing.com/live/?resultate=1) \u2013 con t\u00edtulo, categor\u00eda, nombres, ganador, decisi\u00f3n, asalto/tiempo y los puntos de los jueces; en torneos tambi\u00e9n las clasificaciones. Sin internet se reenv\u00eda autom\u00e1ticamente. Si el supervisor entr\u00f3 sin contrase\u00f1a WBU (p. ej. con tableta por Bluetooth), la tarjeta la pide una vez. Si el evento se reabre y se vuelve a cerrar, el nuevo estado sustituye al anterior (e-mail con \u00abCorrecci\u00f3n\u00bb).</p>\n<h3 id=\"anl-6-6-m-vil-apagado-bater-a-vac-a-app-o-navegador-cerrados-se-sigue\">6.6 M\u00f3vil apagado, bater\u00eda vac\u00eda, app o navegador cerrados \u2013 se sigue</h3>\n<p>Todo se guarda de forma permanente en el m\u00f3vil tras cada entrada. Tras reiniciar (mismo m\u00f3vil, volver a abrir la app o el navegador) se est\u00e1 exactamente donde se dej\u00f3, sin volver a iniciar sesi\u00f3n \u2013 arriba aparece brevemente \u00ab\u2713 Seguimos como antes del reinicio \u2013 nada perdido\u00bb.\n- <strong>Supervisor:</strong> cartelera, todas las tarjetas, resultados y el combate abierto se mantienen; la conexi\u00f3n con jueces, WBU Sports y monitor en vivo se reanuda sola.\n- <strong>Juez:</strong> el combate en curso se mantiene con todos los asaltos (tambi\u00e9n los solo \u00abguardados\u00bb, no enviados) y el asalto ajustado \u2013 sin nuevo PIN, sin tarjeta duplicada en el supervisor. Los asaltos no enviados se env\u00edan con el siguiente env\u00edo.\n- La copia vale hasta \u00abCerrar sesi\u00f3n\u00bb o como m\u00e1ximo 20 horas (es decir, solo el d\u00eda del evento). No trabajar en el modo privado/inc\u00f3gnito del navegador \u2013 borra todo al cerrar.</p>\n<h2 id=\"anl-7-jueces-puntuar-con-la-tarjeta\">7. Jueces \u2013 puntuar con la tarjeta</h2>\n<p>Los jueces punt\u00faan cada asalto con el sistema de 10 puntos en el m\u00f3vil. Solo necesitan su nombre y el PIN del supervisor.</p>\n<h3 id=\"anl-7-1-iniciar-sesi-n\">7.1 Iniciar sesi\u00f3n</h3>\n<ul>\n<li>Navegador: abrir <a target=\"_blank\" href=\"https://www.wbu-boxing.com/scorecard/,\">https://www.wbu-boxing.com/scorecard/,</a> tocar \u00abJuez\u00bb, introducir nombre y apellido y el PIN del supervisor, \u00ab\u00a1Vamos!\u00bb. Se llega directamente a la tarjeta; un PIN incorrecto se rechaza.</li>\n<li>App: activar Bluetooth, elegir \u00abJuez\u00bb y el nombre \u2013 la app se conecta con el m\u00f3vil del supervisor, tambi\u00e9n sin internet.</li>\n</ul>\n<p>Arriba aparece \u00abConectado en l\u00ednea\u00bb con el nombre del evento. Si no hay conexi\u00f3n, las puntuaciones se guardan y se env\u00edan despu\u00e9s autom\u00e1ticamente.</p>\n<h3 id=\"anl-7-2-puntuar-un-asalto\">7.2 Puntuar un asalto</h3>\n<ol>\n<li>Tocar los puntos de rojo y azul: el ganador del asalto 10, el otro 9 (con ca\u00edda o clara superioridad 8 o menos).</li>\n<li>Deducciones por amonestaciones: tocar \u22121 a \u22124 bajo la esquina; tocar otra vez las quita.</li>\n<li>Abajo aparece la suma del asalto, p. ej. 10 : 9.</li>\n<li>\u00abEnviar asalto\u00bb env\u00eda el asalto al supervisor al instante. \u00abGuardar asalto (sin enviar)\u00bb solo lo memoriza \u2013 seg\u00fan indique el supervisor.</li>\n</ol>\n<h3 id=\"anl-7-3-corregir-y-cerrar\">7.3 Corregir y cerrar</h3>\n<ul>\n<li>En la lista de abajo se puede tocar y corregir cada asalto.</li>\n<li>Tras el \u00faltimo asalto \u00abCerrar combate\u00bb. Aparece \u00abFinalizado \u2013 lleg\u00f3 al supervisor\u00bb con todos los asaltos.</li>\n<li>\u00abCombate terminado antes (KO / TKO / RTD \u2026)\u00bb si el combate acaba antes del \u00faltimo asalto.</li>\n<li>\u00abSiguiente combate\u00bb abre una tarjeta vac\u00eda.</li>\n<li>Por el chat se pueden enviar mensajes cortos al supervisor (p. ej. \u00abHe corregido\u00bb, \u00abPor favor, ven un momento\u00bb).</li>\n</ul>\n<h2 id=\"anl-8-rbitro-cronometrador-y-m-dico-de-ring\">8. \u00c1rbitro, cronometrador y m\u00e9dico de ring</h2>\n<table>\n<thead>\n<tr>\n<th>Rol</th>\n<th>Tarea en el sistema</th>\n<th>D\u00f3nde</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\u00c1rbitro</td>\n<td>lo introduce el supervisor en cada combate, se mantiene para los siguientes; \u00e9l no maneja nada</td>\n<td>tarjeta del supervisor</td>\n</tr>\n<tr>\n<td>Cronometrador</td>\n<td>maneja el reloj: INICIO, PARAR (el tiempo muerto corre solo), SEGUIR, reiniciar asalto; las se\u00f1ales son autom\u00e1ticas</td>\n<td>centro de control o puesto en el ring</td>\n</tr>\n<tr>\n<td>M\u00e9dico de ring</td>\n<td>se introduce una vez antes de empezar y vale para todos los combates; sin \u00e9l el reloj no arranca</td>\n<td>WBU Sports (evento o centro de control) y tarjeta</td>\n</tr>\n</tbody>\n</table>\n<p>Todos los nombres aparecen en el resultado de cada combate y en el informe PDF del supervisor.</p>\n<h2 id=\"anl-9-p-blico-wbu-live-monitor-en-vivo-resultados-y-ranking-mundial\">9. P\u00fablico \u2013 WBU Live, monitor en vivo, resultados y ranking mundial</h2>\n<p>WBU Live muestra sin iniciar sesi\u00f3n qui\u00e9n est\u00e1 en el ring, qui\u00e9n debe prepararse, todos los resultados y las clasificaciones.</p>\n<ul>\n<li>En el m\u00f3vil: <a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/\">https://www.wbu-boxing.com/live/</a> \u2013 tocar el evento, con varios rings elegir el ring. Pesta\u00f1as: pr\u00f3ximos combates, combates anteriores, clasificaciones.</li>\n<li>En el monitor del pabell\u00f3n: abrir el enlace de televisor de WBU Sports (pesta\u00f1a lista de combates) en el navegador del televisor o Fire TV. Muestra todos los combates pr\u00f3ximos; verde est\u00e1 en el ring, amarillo debe prepararse.</li>\n<li>Ambos se actualizan solos mientras el PC con WBU Sports est\u00e9 en l\u00ednea.</li>\n</ul>\n<h3 id=\"anl-9-1-monitor-en-vivo-en-la-p-gina-de-inicio-wbu\">9.1 Monitor en vivo en la p\u00e1gina de inicio WBU</h3>\n<ul>\n<li>En cuanto el <strong>supervisor</strong> se ha conectado con la gala el <strong>d\u00eda del evento</strong> (tarjeta iniciada, combates a\u00fan abiertos; las pruebas de d\u00edas anteriores no cuentan), aparece autom\u00e1ticamente en la p\u00e1gina de inicio WBU, justo bajo el men\u00fa, un <strong>monitor en vivo</strong> \u2013 sin punto de men\u00fa, sin clic.</li>\n<li><strong>Izquierda:</strong> el combate en curso \u2013 n\u00famero, combate por t\u00edtulo, esquina roja y azul con gimnasio y pa\u00eds, categor\u00eda, deporte, asaltos \u00d7 minutos. Si el cronometraje va por WBU Time, asalto y tiempo aparecen grandes debajo (tambi\u00e9n pausa y tiempo muerto); con cronometraje anal\u00f3gico simplemente no aparece. Debajo, el \u00faltimo resultado y el siguiente combate.</li>\n<li><strong>Derecha:</strong> toda la cartelera para desplazar \u2013 combates terminados con resultado y ganador, el combate en curso marcado en amarillo.</li>\n<li>Los resultados aparecen en cuanto el supervisor cierra el combate. No se muestran los puntos por asalto ni los nombres de los jueces.</li>\n<li>Si hay varias galas a la vez, aparecen varios monitores uno debajo de otro.</li>\n<li>Cuando todos los combates han terminado, el monitor se mantiene 30 minutos m\u00e1s y luego desaparece. Los resultados est\u00e1n despu\u00e9s en la p\u00e1gina de resultados.</li>\n<li>Fondo claro, texto negro, rojo y azul \u2013 como WBU Live y WBU Time. En el m\u00f3vil uno debajo de otro, la cartelera se desplaza con el dedo.</li>\n</ul>\n<p><strong>Directo de YouTube:</strong> en \u00abEvento\u00bb el organizador puede introducir un enlace de YouTube \u2013 al v\u00eddeo (p. ej. youtube.com/live/\u2026) o al canal (youtube.com/channel/UC\u2026, entonces se reproduce lo que est\u00e9 en directo all\u00ed). En cuanto el supervisor inicia sesi\u00f3n, el v\u00eddeo aparece en 16:9 sobre el monitor en vivo con el mismo ancho \u2013 solo la imagen, sin comentarios ni sugerencias. Pantalla completa con el icono abajo a la derecha del v\u00eddeo, en el m\u00f3vil basta girarlo. El v\u00eddeo empieza sin sonido (as\u00ed lo exigen los navegadores) \u2013 tocar una vez el altavoz. Sin enlace solo queda el monitor en vivo.</p>\n<h3 id=\"anl-9-2-resultados\">9.2 Resultados</h3>\n<ul>\n<li><a target=\"_blank\" href=\"https://www.wbu-boxing.com/results/\">https://www.wbu-boxing.com/results/</a> \u2013 todos los resultados de galas y torneos WBU, enviados autom\u00e1ticamente por el supervisor, sin iniciar sesi\u00f3n. Los torneos muestran las clasificaciones (1.\u00ba, 2.\u00ba, 3.\u00ba).</li>\n<li>En 5 idiomas (EN, DE, ES, FR, RU), b\u00fasqueda por nombre, evento o lugar.</li>\n</ul>\n<h3 id=\"anl-9-3-ranking-mundial-wbu\">9.3 Ranking mundial WBU</h3>\n<ul>\n<li><a target=\"_blank\" href=\"https://www.wbu-boxing.com/rankings/\">https://www.wbu-boxing.com/rankings/</a> \u2013 el top 15 seg\u00fan BoxRec por categor\u00eda profesional m\u00e1s los campeones WBU en su posici\u00f3n (con corona), dos columnas, kg/lbs conmutable, b\u00fasqueda, 5 idiomas.</li>\n</ul>\n<h2 id=\"anl-10-descargas-actualizaciones-y-trabajo-sin-internet\">10. Descargas, actualizaciones y trabajo sin internet</h2>\n<p>WBU Sports existe en varias formas. Todas funcionan y se ven igual.</p>\n<table>\n<thead>\n<tr>\n<th>Versi\u00f3n</th>\n<th>Para qui\u00e9n</th>\n<th>Internet necesario</th>\n<th>Descarga</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Versi\u00f3n de navegador</td>\n<td>todos: inscripci\u00f3n, WBU Sports, tarjeta, WBU Live, WBU Time</td>\n<td>s\u00ed</td>\n<td>sin instalaci\u00f3n \u2013 <a target=\"_blank\" href=\"https://www.wbu-boxing.com/anmeldung/\">https://www.wbu-boxing.com/anmeldung/</a></td>\n</tr>\n<tr>\n<td>WBU Sports para Windows (programa)</td>\n<td>organizador y centro de control en el port\u00e1til, con Bluetooth, Wi-Fi del pabell\u00f3n y televisor por HDMI</td>\n<td>no</td>\n<td><a target=\"_blank\" href=\"https://github.com/energyfighter/wbu-sc-download/raw/windows/WBU-Sports-Setup.exe\">https://github.com/energyfighter/wbu-sc-download/raw/windows/WBU-Sports-Setup.exe</a></td>\n</tr>\n<tr>\n<td>WBU Sports como app de tableta (Android)</td>\n<td>organizador y centro de control en el ring, con televisor por HDMI</td>\n<td>no (Bluetooth al supervisor)</td>\n<td><a target=\"_blank\" href=\"https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-Sports.apk\">https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-Sports.apk</a></td>\n</tr>\n<tr>\n<td>App de tarjeta para Android (m\u00f3vil y tableta)</td>\n<td>supervisor y jueces</td>\n<td>no (Bluetooth)</td>\n<td><a target=\"_blank\" href=\"https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-SC.apk\">https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-SC.apk</a></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"anl-10-1-instalar-wbu-sports-para-windows\">10.1 Instalar WBU Sports para Windows</h3>\n<ol>\n<li>Descargar \u00abWBU-Sports-Setup.exe\u00bb (unos 10 MB) y hacer doble clic. Si Windows dice \u00abWindows protegi\u00f3 su PC\u00bb: \u00abM\u00e1s informaci\u00f3n\u00bb \u2013 \u00abEjecutar de todas formas\u00bb.</li>\n<li>\u00abInstalar\u00bb \u2013 si falta el entorno Microsoft .NET, el instalador lo descarga una vez (Windows pregunta \u00abS\u00ed\u00bb una vez).</li>\n<li>En el escritorio aparece \u00abWBU Sports\u00bb. El programa se abre en su propia ventana \u2013 sin iniciar sesi\u00f3n. Los datos se quedan en el port\u00e1til, tambi\u00e9n con actualizaciones.</li>\n<li><strong>Supervisor por Bluetooth:</strong> activar Bluetooth en el port\u00e1til. En el centro de control \u00ab\ud83d\udcf6 Iniciar Bluetooth\u00bb. En el m\u00f3vil del supervisor iniciar sesi\u00f3n en la app de tarjeta sin elegir show \u2013 nada m\u00e1s. El port\u00e1til encuentra el m\u00f3vil solo, env\u00eda la lista de combates y recibe los resultados.</li>\n<li><strong>Televisor por HDMI:</strong> conectar el televisor, pulsar tecla Windows + P y elegir \u00abExtender\u00bb. En el centro de control \u00ab\u23f1 WBU Time\u00bb o \u00ab\ud83d\udccb Lista de combates\u00bb \u2013 la pantalla aparece a pantalla completa en el televisor.</li>\n<li><strong>Wi-Fi del pabell\u00f3n:</strong> ver 10.3.</li>\n</ol>\n<p>Un evento del navegador entra en el programa con \u00abGuardar copia (.json)\u00bb y \u00abRestaurar copia guardada\u00bb.</p>\n<h3 id=\"anl-10-1a-crear-un-evento-programa-windows-y-app-de-tableta\">10.1a Crear un evento (programa Windows y app de tableta)</h3>\n<ul>\n<li>La preparaci\u00f3n funciona sin internet: nombre, fecha, lugar, cartelera o categor\u00edas y participantes.</li>\n<li>Un evento solo se puede <strong>usar</strong> cuando est\u00e1 <strong>creado</strong>: pulsar arriba \u00ab\u2705 Crear evento\u00bb \u2013 para ello una vez <strong>internet</strong> y la <strong>contrase\u00f1a del organizador</strong> (la recibe de la WBU). La WBU recibe autom\u00e1ticamente un e-mail informativo.</li>\n<li>Antes, centro de control, lista de combates, cuadros, resultados, diplomas, acreditaci\u00f3n, impresi\u00f3n, televisor y conexi\u00f3n con el supervisor est\u00e1n <strong>bloqueados (\ud83d\udd12)</strong>. Sin internet aparece \u00abCon\u00e9ctate a internet\u00bb.</li>\n<li>Despu\u00e9s todo funciona tambi\u00e9n sin internet. En el navegador (con cuenta WBU Sports) este bloqueo no existe.</li>\n</ul>\n<h3 id=\"anl-10-2-wbu-sports-como-app-de-tableta-android\">10.2 WBU Sports como app de tableta (Android)</h3>\n<p>La app de tableta es WBU Sports para llevar: todo en la tableta, en el ring tambi\u00e9n sin internet.</p>\n<ol>\n<li>Descargar el archivo APK \u00abWBU-Sports.apk\u00bb en la tableta y tocarlo, una vez \u00abPermitir apps de esta fuente\u00bb, luego \u00abInstalar\u00bb.</li>\n<li>Llevar el evento a la tableta: crearlo directamente en la tableta (con internet funcionan la inscripci\u00f3n en l\u00ednea y poner en vivo como en el navegador) o en el PC \u00abGuardar copia (.json)\u00bb, enviar el archivo a la tableta (p. ej. por e-mail o USB) y en la app \u00abRestaurar copia guardada\u00bb.</li>\n<li><strong>Supervisor por Bluetooth:</strong> en el centro de control tocar \u00ab\ud83d\udcf6 Iniciar Bluetooth\u00bb. En el m\u00f3vil del supervisor iniciar sesi\u00f3n en la app de tarjeta sin elegir show \u2013 la app encuentra la tableta sola. La lista de combates con nombres, t\u00edtulo y asaltos viene de la tableta, los resultados confirmados vuelven solos a la tableta. Los jueces se conectan como siempre con el m\u00f3vil del supervisor.</li>\n<li><strong>Televisor por cable:</strong> conectar la tableta al televisor con un adaptador USB-C a HDMI. En el centro de control aparece \u00ab\ud83d\udcfa Televisor (HDMI) \u2013 conectado\u00bb: \u00ab\u23f1 WBU Time\u00bb muestra el reloj en el televisor, \u00ab\ud83d\udccb Lista de combates\u00bb los pr\u00f3ximos combates. En la tableta se sigue manejando el centro de control.</li>\n<li><strong>Imprimir:</strong> lista de combates, cuadros, diplomas y acreditaciones van por el di\u00e1logo de impresi\u00f3n de Android a una impresora Wi-Fi o como PDF.</li>\n<li><strong>Copia:</strong> \u00abGuardar copia (.json)\u00bb deja el archivo en la carpeta \u00abDownload\u00bb de la tableta.</li>\n</ol>\n<p>Con internet la app de tableta funciona adem\u00e1s exactamente como la versi\u00f3n de navegador (inscripci\u00f3n en l\u00ednea, pagos, poner en vivo, WBU Live y WBU Time por la red).</p>\n<h3 id=\"anl-10-3-wi-fi-del-pabell-n-tantos-televisores-como-quieras-sin-internet-y-sin-cables\">10.3 Wi-Fi del pabell\u00f3n: tantos televisores como quieras sin internet y sin cables</h3>\n<p>La app de tableta y el programa de Windows pueden abrir su propia red Wi-Fi. Todos los televisores (p. ej. Fire TV) y m\u00f3viles conectados muestran WBU Live y WBU Time \u2013 para cada ring \u2013 sin internet.</p>\n<ol>\n<li>En el centro de control tocar \u00ab\ud83d\udce1 Iniciar Wi-Fi del pabell\u00f3n\u00bb.</li>\n<li>Aparecen nombre y contrase\u00f1a de la red (port\u00e1til: \u00abWBU-Halle\u00bb / \u00abwbuboxing\u00bb; tableta: los que fija la tableta) y las direcciones.</li>\n<li>Conectar el televisor a la red y abrir la direcci\u00f3n indicada en el navegador (Fire TV: Silk):</li>\n<li>WBU Time para ring 1, ring 2 \u2026 (una direcci\u00f3n por ring),</li>\n<li>lista de combates para el monitor del pabell\u00f3n,</li>\n<li>WBU Live para m\u00f3viles.</li>\n<li>En el port\u00e1til, el firewall de Windows pregunta la primera vez: \u00abPermitir acceso\u00bb (marcar redes privadas y p\u00fablicas).</li>\n</ol>\n<p>Si no se puede iniciar una red propia (algunos dispositivos lo bloquean), las mismas direcciones funcionan tambi\u00e9n con un router Wi-Fi existente o un punto de acceso m\u00f3vil al que est\u00e9n conectados tableta/port\u00e1til y televisor. Con internet, WBU Live y WBU Time siguen funcionando adem\u00e1s por www.wbu-boxing.com.</p>\n<h3 id=\"anl-10-4-instalar-la-app-de-tarjeta-para-android\">10.4 Instalar la app de tarjeta para Android</h3>\n<ol>\n<li>Descargar el archivo APK en el m\u00f3vil o la tableta y tocarlo.</li>\n<li>Permitir una vez \u00abPermitir apps de esta fuente\u00bb, luego \u00abInstalar\u00bb.</li>\n<li>Activar Bluetooth y ubicaci\u00f3n.</li>\n</ol>\n<p>Supervisor y jueces se conectan directamente por Bluetooth \u2013 sin internet y sin Wi-Fi en el pabell\u00f3n. La app solo necesita internet si se adopta un evento de WBU Sports y se env\u00edan all\u00ed los resultados; si falla un momento, los resultados se reenv\u00edan solos.</p>\n<h3 id=\"anl-10-5-actualizaciones\">10.5 Actualizaciones</h3>\n<ul>\n<li>Versi\u00f3n de navegador: siempre actualizada. Si una p\u00e1gina a\u00fan muestra la versi\u00f3n antigua, pulsar Ctrl + F5.</li>\n<li>Apps Android (tarjeta y WBU Sports tableta): comprueban en cada inicio si hay una versi\u00f3n nueva. Entonces aparece un aviso con \u00abInstalar actualizaci\u00f3n\u00bb \u2013 tocarlo, la actualizaci\u00f3n se descarga e instala sola. No hace falta tienda de apps. Si Android cancela el primer intento (algunos m\u00f3viles revisan antes la app con Play Protect), la app vuelve a iniciar la instalaci\u00f3n en silencio \u2013 no aparece ning\u00fan error (desde la versi\u00f3n 1.145).</li>\n<li>Programa de Windows: al iniciar (con internet) muestra \u00abNueva versi\u00f3n\u00bb \u2013 tocar \u00abInstalar actualizaci\u00f3n\u00bb: se descarga, se instala y se reinicia a los pocos segundos. Los datos se conservan.</li>\n</ul>\n<p><strong>M\u00f3viles Xiaomi (Mi Protect):</strong> Al actualizar, Xiaomi muestra \u00abApp de riesgo \u2013 fuente de instalaci\u00f3n de riesgo\u00bb. El m\u00f3vil lo hace con toda app que no venga de una tienda \u2013 la app WBU es segura. Pulsa <strong>\u00abOmitir\u00bb</strong> y luego <strong>\u00abActualizar\u00bb</strong>. Para desactivarlo: Ajustes \u2192 Aplicaciones \u2192 Instalador de apps (\u2699) \u2192 desactivar \u00abComprobaci\u00f3n de seguridad\u00bb/\u00abMi Protect\u00bb.</p>\n<h2 id=\"anl-11-preguntas-y-problemas-frecuentes\">11. Preguntas y problemas frecuentes</h2>\n<table>\n<thead>\n<tr>\n<th>Problema</th>\n<th>Soluci\u00f3n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>WBU Sports muestra \u00abInicia sesi\u00f3n primero\u00bb</td>\n<td>iniciar sesi\u00f3n en la p\u00e1gina de inscripci\u00f3n; con rol equivocado tocar \u00abSeguir como organizador\u00bb</td>\n</tr>\n<tr>\n<td>La p\u00e1gina muestra a\u00fan la versi\u00f3n antigua</td>\n<td>pulsar Ctrl + F5</td>\n</tr>\n<tr>\n<td>El reloj no arranca</td>\n<td>introducir el m\u00e9dico de ring en el centro de control</td>\n</tr>\n<tr>\n<td>El juez no puede entrar</td>\n<td>pedir el PIN al supervisor; el supervisor debe haber iniciado sesi\u00f3n antes</td>\n</tr>\n<tr>\n<td>Falta el evento en la tarjeta</td>\n<td>en WBU Sports \u00abPoner en vivo\u00bb; el PC con WBU Sports debe estar en l\u00ednea</td>\n</tr>\n<tr>\n<td>WBU Live o WBU Time no se mueven</td>\n<td>comprobar internet en el PC con WBU Sports; tener un punto de acceso m\u00f3vil de reserva \u2013 o trabajar sin internet con la versi\u00f3n de Windows y la app (cap\u00edtulo 10)</td>\n</tr>\n<tr>\n<td>No hay sonido en el televisor</td>\n<td>tocar una vez \u00abSilencio \u2013 activar sonido\u00bb</td>\n</tr>\n<tr>\n<td>El navegador rellena la contrase\u00f1a en un campo equivocado</td>\n<td>vaciar el campo; borrar la entrada guardada con el icono de llave en la barra de direcciones</td>\n</tr>\n<tr>\n<td>PC nuevo, falta el evento</td>\n<td>\u00abRestaurar copia guardada\u00bb con la copia .json</td>\n</tr>\n<tr>\n<td>Diploma sin oro o bandera</td>\n<td>al imprimir, marcar gr\u00e1ficos de fondo</td>\n</tr>\n</tbody>\n</table>\n<p>Preguntas a la WBU: dm@wbu-boxing.com \u00b7 www.wbu-boxing.com</p>", "fr": "<p>WBU Sports est le syst\u00e8me de la World Boxing Union pour les tournois et les galas pro : de l'inscription en ligne au dipl\u00f4me, en passant par le jour des combats. Tout fonctionne dans le navigateur sur www.wbu-boxing.com \u2013 y compris la carte de pointage. Il existe en plus la carte de pointage en appli Android, WBU Sports en appli tablette Android et WBU Sports en version Windows \u2013 toutes les trois fonctionnent aussi sans internet.</p>\n<p><strong>Langue :</strong> la carte de pointage, WBU Sports, la page d'inscription et WBU Live existent en allemand, anglais, espagnol, fran\u00e7ais et russe. La langue se r\u00e8gle automatiquement selon le navigateur ou le t\u00e9l\u00e9phone ; le bouton <strong>\ud83c\udf10</strong> en haut permet de la changer \u00e0 tout moment. Rapports, dipl\u00f4mes, factures et cartes d'accr\u00e9ditation sont imprim\u00e9s dans la langue choisie.</p>\n<h2 id=\"anl-aper-u\">Aper\u00e7u</h2>\n<table>\n<thead>\n<tr>\n<th>Module</th>\n<th>Utilisateurs</th>\n<th>Adresse</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Page d'inscription</td>\n<td>clubs, entra\u00eeneurs, sportifs individuels, organisateurs</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/anmeldung/\">https://www.wbu-boxing.com/anmeldung/</a></td>\n</tr>\n<tr>\n<td>WBU Sports (organisateur)</td>\n<td>organisateurs, poste de contr\u00f4le</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/veranstalter/\">https://www.wbu-boxing.com/veranstalter/</a></td>\n</tr>\n<tr>\n<td>Carte de pointage</td>\n<td>superviseur, juges</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/scorecard/\">https://www.wbu-boxing.com/scorecard/</a></td>\n</tr>\n<tr>\n<td>WBU Live</td>\n<td>spectateurs (t\u00e9l\u00e9phone, \u00e9cran de la salle)</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/\">https://www.wbu-boxing.com/live/</a></td>\n</tr>\n<tr>\n<td>WBU Time</td>\n<td>chronom\u00e9treur, t\u00e9l\u00e9viseur au ring</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1\">https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1</a></td>\n</tr>\n<tr>\n<td>Moniteur live sur la page d'accueil</td>\n<td>tous les visiteurs du site WBU, appara\u00eet automatiquement pendant les galas</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/\">https://www.wbu-boxing.com/</a></td>\n</tr>\n<tr>\n<td>R\u00e9sultats</td>\n<td>tous</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/results/\">https://www.wbu-boxing.com/results/</a></td>\n</tr>\n<tr>\n<td>Classement mondial WBU</td>\n<td>tous</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/rankings/\">https://www.wbu-boxing.com/rankings/</a></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"anl-tournoi-ou-gala-pro-la-diff-rence\">Tournoi ou gala pro \u2013 la diff\u00e9rence</h3>\n<p>\u00c0 la cr\u00e9ation, l'organisateur choisit s'il s'agit d'un tournoi ou d'un gala pro. Ce choix ne peut plus \u00eatre modifi\u00e9.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Tournoi</th>\n<th>Gala pro</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Quoi</td>\n<td>beaucoup de sportifs, tir\u00e9s au sort par cat\u00e9gorie</td>\n<td>soir\u00e9e de combats, combat par combat</td>\n</tr>\n<tr>\n<td>Inscription</td>\n<td>en ligne par clubs, entra\u00eeneurs, sportifs individuels</td>\n<td>aucune \u2013 l'organisateur saisit lui-m\u00eame les combats</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>cat\u00e9gories, tableaux (\u00e9limination directe), liste des combats</td>\n<td>carte des combats</td>\n</tr>\n<tr>\n<td>Rings</td>\n<td>1 \u00e0 10 rings ou aires de combat</td>\n<td>1 ring</td>\n</tr>\n<tr>\n<td>R\u00e9sultat</td>\n<td>il doit toujours y avoir un vainqueur</td>\n<td>nul ou no contest possibles</td>\n</tr>\n<tr>\n<td>Dipl\u00f4mes, accr\u00e9ditation</td>\n<td>oui</td>\n<td>\u2013</td>\n</tr>\n<tr>\n<td>Chapitre</td>\n<td>2</td>\n<td>3</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"anl-1-clubs-entra-neurs-et-sportifs-individuels\">1. Clubs, entra\u00eeneurs et sportifs individuels</h2>\n<p>Pour inscrire des sportifs, il faut un compte sur la page d'inscription. Le compte vaut pour tous les tournois WBU.</p>\n<h3 id=\"anl-1-1-cr-er-un-compte\">1.1 Cr\u00e9er un compte</h3>\n<ol>\n<li>Ouvrir <a target=\"_blank\" href=\"https://www.wbu-boxing.com/anmeldung/\">https://www.wbu-boxing.com/anmeldung/</a> (dans le menu du site WBU : WBU Sports).</li>\n<li>Toucher \u00ab S'inscrire \u00bb.</li>\n<li>Sous \u00ab Je suis \u00bb, choisir le r\u00f4le : club/salle, entra\u00eeneur, sportif individuel ou organisateur.</li>\n<li>Saisir club, pr\u00e9nom et nom, t\u00e9l\u00e9phone, e-mail et un mot de passe (6 caract\u00e8res min.).</li>\n<li>Toucher \u00ab Cr\u00e9er un compte \u00bb. D\u00e9sormais, connexion avec e-mail et mot de passe.</li>\n</ol>\n<p>La connexion vaut dans tous les onglets et se termine \u00e0 la fermeture du navigateur ou avec \u00ab Se d\u00e9connecter \u00bb. Le r\u00f4le se change en haut \u00e0 droite sous \u00ab Changer de r\u00f4le \u00bb. Mot de passe oubli\u00e9 : toucher \u00ab Mot de passe oubli\u00e9 ? \u00bb, un code arrive par e-mail.</p>\n<h3 id=\"anl-1-2-ouvrir-un-tournoi\">1.2 Ouvrir un tournoi</h3>\n<p>Chaque tournoi a une page d'information publique avec date, lieu, frais, date limite et l'annonce \u00e0 lire \u2013 m\u00eame sans connexion. Apr\u00e8s connexion, toucher le tournoi dans la liste. En haut se trouvent les onglets : Inscription, Mes inscriptions et paiement, Participants, Cat\u00e9gories, Clubs et entra\u00eeneurs.</p>\n<h3 id=\"anl-1-3-inscrire-des-sportifs\">1.3 Inscrire des sportifs</h3>\n<ol>\n<li>Onglet \u00ab Inscription \u00bb.</li>\n<li>Choisir le sport (boxe Semi-Pro, kickboxing K1, boxe masters, Shadow Boxing Battle).</li>\n<li>Saisir pr\u00e9nom, nom, date de naissance, sexe et poids. La cat\u00e9gorie d\u00e9coule automatiquement de l'\u00e2ge le jour du tournoi, du sexe et du poids.</li>\n<li>Saisir club, pays, entra\u00eeneur et e-mail.</li>\n<li>Choisir une photo (facultatif). La fen\u00eatre \u00ab S\u00e9lectionner la t\u00eate \u00bb s'ouvre : placer le cadre rouge sur la t\u00eate, agrandir ou r\u00e9duire avec le curseur, \u00ab Appliquer \u00bb. La t\u00eate figure ensuite sur la carte d'accr\u00e9ditation.</li>\n<li>T\u00e9l\u00e9verser les documents s'ils sont d\u00e9j\u00e0 disponibles (voir 1.4) \u2013 ils peuvent aussi \u00eatre fournis plus tard.</li>\n<li>\u00ab Ajouter \u00bb. Le sportif figure aussit\u00f4t sur la liste des participants et dans le panier. Pour d'autres sportifs \u00ab + Ajouter un autre sportif \u00bb.</li>\n</ol>\n<h3 id=\"anl-1-4-documents\">1.4 Documents</h3>\n<table>\n<thead>\n<tr>\n<th>Document</th>\n<th>Qui en a besoin</th>\n<th>Remarque</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>D\u00e9claration de participation et d\u00e9charge</td>\n<td>tous les sportifs</td>\n<td>t\u00e9l\u00e9charger le formulaire, imprimer, signer, t\u00e9l\u00e9verser en photo ou PDF</td>\n</tr>\n<tr>\n<td>Signature des parents</td>\n<td>sportifs de moins de 18 ans</td>\n<td>sur la m\u00eame d\u00e9claration de participation</td>\n</tr>\n<tr>\n<td>Certificat de m\u00e9decine du sport</td>\n<td>selon l'annonce (p. ex. Semi-Pro)</td>\n<td>doit dater de l'ann\u00e9e de l'\u00e9v\u00e9nement ; saisir la date de d\u00e9livrance</td>\n</tr>\n</tbody>\n</table>\n<p>S'il manque quelque chose, c'est marqu\u00e9 en rouge sous \u00ab Mes inscriptions et paiement \u00bb et peut y \u00eatre t\u00e9l\u00e9vers\u00e9. Apr\u00e8s la cl\u00f4ture, un rappel avec 3 jours de d\u00e9lai suit, puis le sportif est retir\u00e9.</p>\n<h3 id=\"anl-1-5-payer\">1.5 Payer</h3>\n<ol>\n<li>Onglet \u00ab Mes inscriptions et paiement \u00bb.</li>\n<li>\u00ab Termin\u00e9 \u2013 payer maintenant \u00bb. Le total est alors fix\u00e9 et un code de paiement appara\u00eet.</li>\n<li>Virer le montant, avec uniquement le code de paiement comme r\u00e9f\u00e9rence.</li>\n<li>D\u00e8s que l'organisateur a attribu\u00e9 le paiement, la mention \u00ab Pay\u00e9 \u2013 inscription confirm\u00e9e \u00bb appara\u00eet.</li>\n</ol>\n<p>Qui n'a pas tout pay\u00e9 \u00e0 la cl\u00f4ture re\u00e7oit un rappel avec un court d\u00e9lai ; ensuite les sportifs sont retir\u00e9s. La facture est disponible en PDF le lendemain de l'\u00e9v\u00e9nement.</p>\n<h3 id=\"anl-1-6-inscrire-entra-neurs-et-soigneurs\">1.6 Inscrire entra\u00eeneurs et soigneurs</h3>\n<p>Sous \u00ab Mes inscriptions et paiement \u00bb, dans la section \u00ab Entra\u00eeneurs et soigneurs (accr\u00e9ditation) \u00bb. Chaque personne inscrite re\u00e7oit une carte d'accr\u00e9ditation avec entr\u00e9e gratuite.</p>\n<table>\n<thead>\n<tr>\n<th>Sportifs inscrits</th>\n<th>Entra\u00eeneurs gratuits</th>\n<th>Soigneurs gratuits</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0</td>\n<td>0</td>\n<td>0</td>\n</tr>\n<tr>\n<td>1 \u00e0 5</td>\n<td>1</td>\n<td>2</td>\n</tr>\n<tr>\n<td>6 ou plus</td>\n<td>1</td>\n<td>4</td>\n</tr>\n</tbody>\n</table>\n<ol>\n<li>Saisir pr\u00e9nom et nom, choisir le r\u00f4le (seuls les r\u00f4les avec places libres sont propos\u00e9s).</li>\n<li>Choisir une photo (facultatif) et s\u00e9lectionner la t\u00eate.</li>\n<li>\u00ab + Ajouter \u00bb. Retirer avec \u00ab retirer \u00bb.</li>\n</ol>\n<p>Les soigneurs non inscrits sont des spectateurs et paient l'entr\u00e9e. Les sportifs individuels inscrivent leur entra\u00eeneur et leurs soigneurs de la m\u00eame fa\u00e7on.</p>\n<h2 id=\"anl-2-organisateur-cr-er-un-tournoi\">2. Organisateur \u2013 cr\u00e9er un tournoi</h2>\n<p>Un tournoi est cr\u00e9\u00e9 dans WBU Sports, ouvert \u00e0 l'inscription en ligne et pilot\u00e9 le jour J depuis le poste de contr\u00f4le.</p>\n<h3 id=\"anl-2-1-se-connecter\">2.1 Se connecter</h3>\n<ol>\n<li>Se connecter sur la page d'inscription avec un compte au r\u00f4le \u00ab Organisateur \u00bb \u2013 on arrive directement dans WBU Sports.</li>\n<li>Si le compte est encore \u00ab Entra\u00eeneur \u00bb ou \u00ab Club \u00bb : dans WBU Sports toucher \u00ab Continuer comme organisateur \u00bb ou en haut \u00ab Changer de r\u00f4le \u00bb.</li>\n</ol>\n<p>Important : les \u00e9v\u00e9nements sont enregistr\u00e9s sur le serveur (dans le navigateur avec un compte WBU Sports). Chaque modification est enregistr\u00e9e automatiquement et appara\u00eet sur chaque appareil o\u00f9 vous vous connectez \u2013 PC, ordinateur portable ou tablette. \u00ab Enregistrer une sauvegarde (.json) \u00bb reste une copie suppl\u00e9mentaire.</p>\n<h3 id=\"anl-2-2-cr-er-un-v-nement\">2.2 Cr\u00e9er un \u00e9v\u00e9nement</h3>\n<ol>\n<li>Sur la page de d\u00e9part choisir \u00ab Tournoi \u00bb (pour un gala voir le chapitre 3).</li>\n<li>Remplir l'onglet \u00ab \u00c9v\u00e9nement \u00bb : nom, promoteur, lieu/salle, date. Superviseur et chronom\u00e9treur ne sont pas saisis par l'organisateur \u2013 le superviseur le fait dans sa carte ; les noms figurent ensuite dans le r\u00e9sultat et le rapport PDF.</li>\n<li>M\u00e9decin de ring : peut \u00eatre saisi d\u00e8s maintenant \u2013 sinon le jour J au poste de contr\u00f4le. Sans m\u00e9decin de ring, le chrono ne d\u00e9marre pas.</li>\n<li>Choisir le nombre de rings ou d'aires de combat (1\u201310) et la d\u00e9signation \u00ab Ring \u00bb ou \u00ab Aire de combat \u00bb.</li>\n<li>R\u00e9gler la tol\u00e9rance de poids \u00e0 la pes\u00e9e (p. ex. 4 kg selon l'annonce).</li>\n</ol>\n<h3 id=\"anl-2-3-ouvrir-l-inscription-en-ligne\">2.3 Ouvrir l'inscription en ligne</h3>\n<ol>\n<li>Onglet \u00ab Inscription en ligne \u00bb.</li>\n<li>Toucher les sports propos\u00e9s.</li>\n<li>Saisir date limite, frais pour le 1er d\u00e9part et pour chaque d\u00e9part suppl\u00e9mentaire, d\u00e9lai suppl\u00e9mentaire (jours).</li>\n<li>Certificat de m\u00e9decine du sport : exig\u00e9 ou non.</li>\n<li>Saisir titulaire du compte, IBAN, BIC et remarques pour les sportifs.</li>\n<li>Publier (mot de passe WBU n\u00e9cessaire). Ensuite t\u00e9l\u00e9verser annonce, programme, affiche et formulaires.</li>\n</ol>\n<p>En haut, une barre noire affiche les chiffres : participants inscrits, d\u00e9parts, clubs, comptes enregistr\u00e9s, paiements en attente, documents manquants. \u00ab Voir participants, cat\u00e9gories avec photos, clubs \u00bb ouvre la page d'inscription en vue organisateur \u2013 sans compte propre.</p>\n<h3 id=\"anl-2-4-attribuer-les-paiements\">2.4 Attribuer les paiements</h3>\n<p>Dans l'onglet \u00ab Inscription en ligne \u00bb, charger le relev\u00e9 bancaire (PDF ou CSV de la banque). Le syst\u00e8me cherche les codes de paiement et attribue les montants. Le relev\u00e9 n'est lu que dans votre navigateur et n'est pas envoy\u00e9. Les paiements peuvent aussi \u00eatre confirm\u00e9s ou annul\u00e9s manuellement.</p>\n<h3 id=\"anl-2-5-cat-gories-et-participants\">2.5 Cat\u00e9gories et participants</h3>\n<ul>\n<li>Les sportifs inscrits en ligne arrivent automatiquement dans leur cat\u00e9gorie de poids.</li>\n<li>Vert : paire fix\u00e9e \u00b7 Jaune : attend un adversaire \u00b7 \u25b6 : d\u00e9j\u00e0 en cours.</li>\n<li>Un clic sur une cat\u00e9gorie affiche les participants. On peut ajouter des sportifs manuellement, r\u00e9gler rounds, dur\u00e9e et ring.</li>\n<li>Retirer des participants : \u2715 \u2013 tant qu'aucun combat n'est not\u00e9 dans la cat\u00e9gorie, un nouveau tirage est fait automatiquement.</li>\n<li>Si la cat\u00e9gorie a d\u00e9j\u00e0 commenc\u00e9 : \u00ab absent \u00bb \u2013 le sportif est barr\u00e9 et perd ses combats ouverts par forfait ; \u00ab finalement pr\u00e9sent \u00bb annule.</li>\n</ul>\n<h3 id=\"anl-2-6-tableaux\">2.6 Tableaux</h3>\n<p>\u00c9limination directe, tirage automatique ; les co\u00e9quipiers d'un m\u00eame club sont si possible s\u00e9par\u00e9s au premier tour. Les exempts sont r\u00e9partis \u00e9quitablement. Les vainqueurs avancent automatiquement. Il n'y a pas de combat pour la 3e place : les deux perdants des demi-finales sont 3es. \u00ab Nouveau tirage \u00bb est possible mais efface les r\u00e9sultats d\u00e9j\u00e0 saisis de la cat\u00e9gorie. \u00ab Imprimer le tableau \u00bb pour l'affichage.</p>\n<h3 id=\"anl-2-7-liste-des-combats-et-rings\">2.7 Liste des combats et rings</h3>\n<ul>\n<li>Les combats sont r\u00e9partis \u00e9quitablement sur les rings ; les masters de pr\u00e9f\u00e9rence sur le ring 1.</li>\n<li>Un sportif qui part deux fois ne combat jamais en m\u00eame temps sur deux rings et a la pause minimale r\u00e9gl\u00e9e (p. ex. 4 combats entre-temps).</li>\n<li>\u00ab Imprimer / PDF \u00bb pour la liste des combats par ring.</li>\n</ul>\n<h3 id=\"anl-2-8-mettre-en-direct\">2.8 Mettre en direct</h3>\n<p>Dans l'onglet \u00ab Liste des combats \u00bb, toucher \u00ab Mettre en direct \u00bb (mot de passe WBU). Apparaissent alors :</p>\n<ul>\n<li>le lien WBU Live (t\u00e9l\u00e9phone, spectateurs),</li>\n<li>le lien t\u00e9l\u00e9viseur pour l'\u00e9cran de la salle,</li>\n<li>les boutons \u00ab Ouvrir ring 1 \u00bb, \u00ab Ouvrir ring 2 \u00bb pour WBU Time.</li>\n</ul>\n<p>L'\u00e9v\u00e9nement appara\u00eet aussi dans la carte du superviseur. Le PC avec WBU Sports doit rester ouvert et en ligne pendant l'\u00e9v\u00e9nement \u2013 il envoie la liste des combats et r\u00e9cup\u00e8re les r\u00e9sultats.</p>\n<h2 id=\"anl-3-organisateur-cr-er-un-gala-pro\">3. Organisateur \u2013 cr\u00e9er un gala pro</h2>\n<p>Un gala est une soir\u00e9e combat par combat, sans cat\u00e9gories ni tableaux. Il se d\u00e9roule toujours sur un ring.</p>\n<ol>\n<li>Sur la page de d\u00e9part choisir \u00ab Gala pro \u00bb.</li>\n<li>Remplir l'onglet \u00ab \u00c9v\u00e9nement \u00bb comme en 2.2 (nom, promoteur, lieu, date, m\u00e9decin de ring).</li>\n<li>Onglet \u00ab Carte des combats \u00bb : saisir chaque combat puis \u00ab + Ajouter un combat \u00bb :</li>\n<li>coin rouge et bleu (nom, obligatoire),</li>\n<li>par coin salle / club, pays, date de naissance (l'\u00e2ge est calcul\u00e9 le jour de l'\u00e9v\u00e9nement) et poids \u00e0 la pes\u00e9e,</li>\n<li>cat\u00e9gorie de poids (obligatoire),</li>\n<li>titre selon l'autorisation de la WBU \u2013 \u00e0 cliquer : championnat du monde, intercontinental, d'Europe, international, d'Allemagne ; pour les titres particuliers \u00ab Autre titre \u2013 saisir \u00bb (p. ex. championnat du monde junior) ; sans titre \u00ab \u2013 pas de combat pour le titre \u2013 \u00bb,</li>\n<li>type de combat, nombre et dur\u00e9e des rounds.</li>\n<li>Modifier l'ordre avec \u25b2 \u25bc, \u270e modifier, \u2715 supprimer.</li>\n<li>\u00ab Mettre en direct \u00bb comme en 2.8 \u2013 ensuite chronom\u00e9trage et affichage TV via les boutons de la carte.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>R\u00e9glage</th>\n<th>Possibilit\u00e9s</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Type de combat</td>\n<td>Pro, Semi-Pro, Master, Bare Knuckle, Hybrid, K1 / kickboxing</td>\n</tr>\n<tr>\n<td>Cat\u00e9gorie de poids</td>\n<td>cat\u00e9gories pro de mi-mouche \u00e0 lourd</td>\n</tr>\n<tr>\n<td>Titre</td>\n<td>pas de titre, championnat du monde, intercontinental, d'Europe, international, d'Allemagne ou \u00e0 saisir</td>\n</tr>\n<tr>\n<td>Rounds</td>\n<td>au choix, 1 \u00e0 12</td>\n</tr>\n<tr>\n<td>Dur\u00e9e du round</td>\n<td>3, 2, 1,5 ou 1 minute ; pause toujours 1 minute</td>\n</tr>\n</tbody>\n</table>\n<p>En gala, le nul ou le no contest sont possibles ; en tournoi il faut toujours un vainqueur.</p>\n<h3 id=\"anl-3-1-t-l-verser-le-gala-obligatoire\">3.1 T\u00e9l\u00e9verser le gala \u2013 obligatoire</h3>\n<p>D\u00e8s que la carte a son premier combat et qu'internet est disponible, WBU Sports exige : \u00ab \u26a0 Obligatoire : t\u00e9l\u00e9verser l'\u00e9v\u00e9nement \u00bb. Saisir une fois le mot de passe WBU \u2013 le gala est alors en ligne (m\u00eame s'il a \u00e9t\u00e9 cr\u00e9\u00e9 dans le programme Windows ou l'appli tablette). C'est la seule fa\u00e7on pour le superviseur de recevoir la carte et de la modifier le jour m\u00eame. Au premier envoi, la WBU re\u00e7oit automatiquement un e-mail d'information (\u00e0 info@wbu-boxing.com) avec nom, date, lieu et organisateur \u2013 cela vaut aussi pour les tournois.</p>\n<h3 id=\"anl-3-2-modifier-la-carte-le-jour-de-l-v-nement\">3.2 Modifier la carte le jour de l'\u00e9v\u00e9nement</h3>\n<ul>\n<li><strong>Organisateur :</strong> \u00e0 tout moment dans la carte (\u270e modifier, \u25b2 \u25bc d\u00e9placer, \u2715 supprimer, nouveaux combats). Tout part automatiquement vers la carte de pointage, WBU Live et WBU Time.</li>\n<li><strong>Superviseur (si l'organisateur est absent) :</strong> dans la carte de pointage, encadr\u00e9 \u00ab Depuis WBU Sports \u00bb, toucher \u00ab \u270e Modifier la carte \u00bb. Modifier noms, pays, date de naissance, poids, cat\u00e9gorie, titre, type de combat, rounds et dur\u00e9e, d\u00e9placer, ajouter ou supprimer des combats \u2013 \u00ab Enregistrer et envoyer \u00bb. Cela fonctionne aussi sans internet s'il est reli\u00e9 par Bluetooth \u00e0 la tablette ou \u00e0 l'ordinateur ; si internet coupe bri\u00e8vement, l'envoi est refait automatiquement.</li>\n<li><strong>Via le compte WBU Sports :</strong> qui s'est connect\u00e9 \u00e0 la carte dans le navigateur comme superviseur avec le mot de passe WBU en \u00e9tant connect\u00e9 \u00e0 WBU Sports, retrouve ensuite le gala sur la page d'inscription sous \u00ab \u270e Activ\u00e9 comme superviseur \u00bb \u2013 avec \u00ab Modifier la carte \u00bb. Valable uniquement pour ce gala et jusqu'\u00e0 la fin du jour de l'\u00e9v\u00e9nement.</li>\n<li>Les combats d\u00e9j\u00e0 not\u00e9s ne peuvent pas \u00eatre supprim\u00e9s et ne se modifient qu'apr\u00e8s confirmation. L'organisateur voit dans WBU Sports qui a modifi\u00e9 quoi et quand.</li>\n</ul>\n<h3 id=\"anl-3-5-superviseur-acc-s-complet-sur-n-importe-quel-appareil\">3.5 Superviseur : acc\u00e8s complet sur n'importe quel appareil</h3>\n<ol>\n<li>Ouvrir un ordinateur ou une tablette, www.wbu-boxing.com \u2192 <strong>WBU Sports</strong>.</li>\n<li>Toucher <strong>\u00ab \ud83d\udee1 Se connecter comme superviseur \u00bb</strong>, saisir pr\u00e9nom et nom et le <strong>mot de passe superviseur WBU</strong> (le m\u00eame que dans la carte \u2013 seuls les vrais superviseurs le connaissent).</li>\n<li>Tous les \u00e9v\u00e9nements t\u00e9l\u00e9vers\u00e9s apparaissent. Cliquer sur le bon \u2013 acc\u00e8s complet \u00e0 la carte, au poste de contr\u00f4le, au chrono, \u00e0 WBU Time et aux r\u00e9sultats.</li>\n<li>Les modifications de l'organisateur et du superviseur se synchronisent automatiquement toutes les 20 secondes.</li>\n<li><strong>Un seul appareil pilote le poste de contr\u00f4le :</strong> s'il tourne d\u00e9j\u00e0 ailleurs, une remarque rouge \u00ab \u26a0 Le poste de contr\u00f4le tourne actuellement sur un autre appareil \u00bb appara\u00eet avec nom et heure. \u00ab Reprendre le poste de contr\u00f4le ici \u00bb change d\u00e9lib\u00e9r\u00e9ment.</li>\n</ol>\n<p><strong>Connexion \u00e0 la carte :</strong> promoteur, lieu, date et m\u00e9decin de ring restent vides jusqu'au choix d'un show \u2013 ils se remplissent alors automatiquement.</p>\n<p><strong>Superviseur sur portable/PC :</strong> Sous le poste de contr\u00f4le appara\u00eet \u00ab \ud83d\udee1 Ma carte de superviseur \u00bb \u2013 connexion automatique, avec toutes les fonctions de la carte. Le PIN pour les juges s'affiche en grand en haut : pas besoin de t\u00e9l\u00e9phone. \u00ab Ouvrir dans une fen\u00eatre \u00bb l'ouvre \u00e0 part. (Visible uniquement connect\u00e9 comme superviseur et l'\u00e9v\u00e9nement en direct.)</p>\n<p><strong>R\u00f4les \u00e0 la connexion avec le mot de passe superviseur :</strong> Le r\u00f4le se choisit en haut \u00e0 droite (et dans la fen\u00eatre de connexion). <strong>\ud83d\udee1 Superviseur :</strong> suit le poste de contr\u00f4le en direct (le chrono d\u00e9file mais ne peut pas \u00eatre pilot\u00e9) et a la carte de superviseur en dessous. <strong>\ud83c\udf9b Organisateur (directeur technique) :</strong> Le directeur technique surveille et pilote le second poste de contr\u00f4le \u2013 il peut aussi \u00eatre le chronom\u00e9treur. Il pilote le poste de contr\u00f4le \u2013 chrono, \u00e9crans, r\u00e9sultats, modifications \u2013 sans carte. Deux postes fonctionnent ainsi en m\u00eame temps : un pour suivre (superviseur), un pour piloter.</p>\n<h3 id=\"anl-voix-du-speaker\">Voix du speaker</h3>\n<p>Pour les \u00e9v\u00e9nements sans speaker. Le son passe par le PC du poste de contr\u00f4le vers la sono de la salle.</p>\n<ul>\n<li>Dans le poste de contr\u00f4le, activez <strong>\u00ab \ud83c\udfa4 Speaker activ\u00e9 \u00bb</strong> et choisissez la langue (DE, EN, ES, FR, RU). <strong>\u00ab \u25b6 Essai \u00bb</strong> teste la voix.</li>\n<li><strong>Annonce d'un clic</strong> (poste de contr\u00f4le \u00ab Sur le ring \u00bb ou carte \ud83c\udfa4) : <strong>Combat</strong> (num\u00e9ro, titre, cat\u00e9gorie, rounds), <strong>Coin rouge</strong>, <strong>Coin bleu</strong> (pays, club, nom).</li>\n<li><strong>\ud83c\udfc6 Annonce du vainqueur :</strong> Apr\u00e8s le r\u00e9sultat (quand l'arbitre a termin\u00e9), appuyez sur <strong>\u00ab \ud83c\udfc6 Vainqueur \u00bb</strong> dans le poste de contr\u00f4le ou \ud83c\udfc6 dans la carte. La voix annonce la m\u00e9thode et le round du r\u00e9sultat saisi, p. ex. \u00ab Mesdames et messieurs ! \u2026 Par K.O. technique au round 3 \u2026 et le vainqueur \u2026 dans le coin rouge \u2026 Marco \u2026 Brandt ! \u00bb \u2013 aussi d\u00e9cisions (unanime, partag\u00e9e, majoritaire), matchs nuls et sans d\u00e9cision.</li>\n<li><strong>Tonalit\u00e9 :</strong> Dans \u00ab \ud83d\udd11 Voix Google \u00bb, \u00e0 c\u00f4t\u00e9 de la voix et du d\u00e9bit, le curseur <strong>Tonalit\u00e9</strong> \u2013 plus petit = plus grave et sombre, plus grand = plus clair. Le <strong>nom des boxeurs</strong> est prononc\u00e9 s\u00e9par\u00e9ment, avec ses propres curseurs <strong>D\u00e9bit du nom</strong> et <strong>Tonalit\u00e9 du nom</strong> \u2013 il sonne plus lent, \u00e9tir\u00e9 et accentu\u00e9.</li>\n<li><strong>Gong garanti :</strong> Au d\u00e9but du round d'abord \u00ab Round X ! Boxez ! \u00bb, puis le gong \u2013 aussi apr\u00e8s \u00ab \u21ba Recommencer le round \u00bb ou \u00ab \u23ed Round suivant \u00bb en appuyant sur D\u00c9PART/REPRENDRE. Le gong sonne au plus tard apr\u00e8s 6 secondes, m\u00eame si la voix bloque.</li>\n<li><strong>Automatique avec le chrono :</strong> \u00e0 START ou au d\u00e9but d'un round, d'abord \u00ab Round 1 \u2013 boxez ! \u00bb, puis le gong (dernier round avec \u00ab Dernier round ! \u00bb). \u00c0 la fin du round, d'abord le gong, puis \u00ab Fin du round 1 ! \u00bb (\u00e0 la fin du combat \u00ab Fin du combat ! \u00bb). \u00ab Soigneurs, dehors ! \u00bb au signal des 10 secondes pendant la pause.</li>\n<li><strong>Voix :</strong> gratuite. Sans cl\u00e9, c'est la voix de l'ordinateur du navigateur. Avec <strong>\u00ab \ud83d\udd11 Voix Google \u00bb</strong> (uniquement avec le mot de passe superviseur WBU), la voix Google plus naturelle est configur\u00e9e \u2013 gratuite jusqu'\u00e0 1 million de caract\u00e8res par mois (un gala en utilise environ 5 000\u201310 000).</li>\n<li><strong>\ud83d\udd14 Gong \u00e0 la main :</strong> le bouton \u00ab \ud83d\udd14 Gong \u00bb \u00e0 c\u00f4t\u00e9 de START/STOP sonne une fois \u00e0 chaque clic \u2013 m\u00eame quand le chrono tourne automatiquement (p. ex. si le gong n'a pas \u00e9t\u00e9 entendu).</li>\n<li><strong>Essayer :</strong> chaque utilisateur connect\u00e9 (organisateur, superviseur, WBU) a \u00ab \ud83e\uddea Ouvrir l'\u00e9v\u00e9nement test \u00bb sur la page d'accueil \u2013 avec 2 combats, uniquement sur cet appareil, jamais envoy\u00e9 ni en direct.</li>\n<li>En r\u00f4le superviseur, le speaker reste muet \u2013 seul le poste du directeur technique parle.</li>\n</ul>\n<p><strong>T\u00e9l\u00e9viseurs (barre \ud83d\udcfa du poste de contr\u00f4le) :</strong> <strong>\ud83d\udcfa WBU Live</strong> (liste des combats), <strong>\u23f1 WBU Time 1</strong> et <strong>\u23f1 WBU Time 2</strong> (chrono). Avec internet, ils ouvrent les pages en direct (aussi sur Fire TV). Sans internet, une fen\u00eatre s'ouvre sur le PC \u2013 faites-la glisser sur le t\u00e9l\u00e9viseur (HDMI) et F11. Ainsi, trois t\u00e9l\u00e9viseurs fonctionnent en m\u00eame temps lors d'un championnat. Avec un seul ring, WBU Time 2 affiche le m\u00eame chrono sur un second t\u00e9l\u00e9viseur.</p>\n<p><strong>\u23f8 Pause de l'\u00e9v\u00e9nement :</strong> dans le poste de contr\u00f4le, appuyez sur \u00ab \u23f8 Pause de l'\u00e9v\u00e9nement \u00bb et choisissez 5\u201330 minutes ou \u00ab sans dur\u00e9e \u00bb. Le combat en cours va jusqu'au bout, ensuite aucun nouveau combat n'est appel\u00e9 \u2013 l'automatisme attend. WBU Time et WBU Live affichent \u00ab PAUSE \u00bb avec compte \u00e0 rebours et le prochain combat. \u00ab \u25b6 Reprendre \u2013 appeler le combat suivant \u00bb termine la pause (avec le speaker s'il est activ\u00e9).</p>\n<h3 id=\"anl-3-3-base-des-combattants\">3.3 Base des combattants</h3>\n<ul>\n<li>Tous les combattants des inscriptions aux tournois et des galas envoy\u00e9s arrivent automatiquement dans la <strong>base des combattants</strong>, tri\u00e9s par salle. Chaque combattant n'y figure qu'une fois.</li>\n<li><strong>\ud83d\udcc7</strong> \u00e0 c\u00f4t\u00e9 de \u00ab Coin rouge \u00bb / \u00ab Coin bleu \u00bb (et \u00ab \ud83d\udcc7 Base de donn\u00e9es \u00bb pour les participants d'un tournoi) : d\u00e9plier une salle ou chercher un nom, cliquer sur le combattant \u2013 nom, salle, pays, date de naissance et poids sont remplis aussit\u00f4t.</li>\n<li>Sur la page de d\u00e9part : \u00ab \ud83d\udcc7 Base des combattants \u00bb pour consulter, corriger (\u270e) et ajouter. Suppression uniquement avec le mot de passe WBU.</li>\n<li><strong>\ud83d\udce5 Importer une liste :</strong> un tableau (Excel \u2192 \u00ab CSV UTF-8 \u00bb) avec les colonnes pr\u00e9nom ; nom ; salle / club ; pays \u2013 p. ex. les participants d'un tournoi pr\u00e9c\u00e9dent. Les combattants d\u00e9j\u00e0 pr\u00e9sents ne sont pas cr\u00e9\u00e9s en double. L'organisateur choisit la cat\u00e9gorie \u00e0 chaque fois.</li>\n<li><strong>En tapant un nom</strong> (coin rouge/bleu, participants) des combattants correspondants de la base apparaissent \u
