 dem Laptop, auch bei Updates.</li>\n<li><strong>Supervisor per Bluetooth:</strong> Bluetooth am Laptop einschalten. Im Leitstand \u201e\ud83d\udcf6 Bluetooth starten\u201c. Am Supervisor-Handy in der Scorecard-App normal anmelden, ohne Show zu w\u00e4hlen \u2013 nichts weiter ausw\u00e4hlen. Der Laptop findet das Handy selbst, schickt die Kampfliste und bekommt die Ergebnisse.</li>\n<li><strong>Fernseher per HDMI:</strong> Fernseher anschlie\u00dfen, Windows-Taste + P dr\u00fccken und \u201eErweitern\u201c w\u00e4hlen. Im Leitstand \u201e\u23f1 WBU Time\u201c oder \u201e\ud83d\udccb Kampfliste\u201c \u2013 die Anzeige erscheint im Vollbild auf dem Fernseher.</li>\n<li><strong>Hallen-WLAN:</strong> siehe 10.3.</li>\n</ol>\n<p>Eine Veranstaltung aus dem Browser kommt mit \u201eSicherung speichern (.json)\u201c und \u201eGespeicherte Sicherung einspielen\u201c ins Programm.</p>\n<h3 id=\"anl-10-1a-veranstaltung-erstellen-windows-programm-und-tablet-app\">10.1a Veranstaltung erstellen (Windows-Programm und Tablet-App)</h3>\n<ul>\n<li>Vorbereiten geht ohne Internet: Name, Datum, Ort, Fight Card bzw. Kategorien und Teilnehmer.</li>\n<li><strong>Benutzen</strong> l\u00e4sst sich eine Veranstaltung erst, wenn sie <strong>erstellt</strong> ist: oben auf \u201e\u2705 Veranstaltung erstellen\u201c dr\u00fccken \u2013 daf\u00fcr einmal <strong>Internet</strong> und das <strong>Veranstalter-Passwort</strong> (bekommt der Veranstalter von der WBU). Die WBU bekommt dabei automatisch eine Info-E-Mail.</li>\n<li>Vorher sind Leitstand, Kampfliste, Brackets, Ergebnisse, Urkunden, Akkreditierung, Drucken, Fernseher und Supervisor-Verbindung <strong>gesperrt (\ud83d\udd12)</strong>. Ohne Internet kommt der Hinweis \u201eBitte mit dem Internet verbinden\u201c.</li>\n<li>Danach l\u00e4uft alles auch ohne Internet weiter. Im Browser (mit WBU-Sports-Konto) gibt es diese Sperre nicht.</li>\n</ul>\n<h3 id=\"anl-10-2-wbu-sports-als-tablet-app-android\">10.2 WBU Sports als Tablet-App (Android)</h3>\n<p>Die Tablet-App ist WBU Sports zum Mitnehmen: alles auf dem Tablet, am Ring auch ohne Internet.</p>\n<ol>\n<li>Die APK-Datei \u201eWBU-Sports.apk\u201c auf dem Tablet herunterladen und antippen, einmalig \u201eApps aus dieser Quelle zulassen\u201c, dann \u201eInstallieren\u201c.</li>\n<li>Veranstaltung auf das Tablet holen: entweder direkt auf dem Tablet anlegen (mit Internet funktionieren Online-Anmeldung und Live schalten wie im Browser) oder am PC \u201eSicherung speichern (.json)\u201c, die Datei aufs Tablet schicken (z. B. per E-Mail oder USB) und in der App \u201eGespeicherte Sicherung einspielen\u201c.</li>\n<li><strong>Supervisor per Bluetooth:</strong> Im Leitstand \u201e\ud83d\udcf6 Bluetooth starten\u201c antippen. Am Supervisor-Handy in der Scorecard-App normal anmelden, ohne Show zu w\u00e4hlen \u2013 die App findet das Tablet von selbst. Die Kampfliste mit Namen, Titel, Runden kommt vom Tablet, die best\u00e4tigten Ergebnisse gehen automatisch ans Tablet zur\u00fcck. Die Punktrichter verbinden sich wie immer mit dem Supervisor-Handy.</li>\n<li><strong>Fernseher per Kabel:</strong> Tablet mit einem USB-C-auf-HDMI-Adapter an den Fernseher anschlie\u00dfen. Im Leitstand erscheint \u201e\ud83d\udcfa Fernseher (HDMI) \u2013 angeschlossen\u201c: \u201e\u23f1 WBU Time\u201c zeigt die Rundenuhr am Fernseher, \u201e\ud83d\udccb Kampfliste\u201c die n\u00e4chsten K\u00e4mpfe. Auf dem Tablet bedient man weiter den Leitstand.</li>\n<li><strong>Drucken:</strong> Kampfliste, Brackets, Urkunden und Akkreditierungskarten gehen \u00fcber den Android-Druckdialog an einen WLAN-Drucker oder als PDF.</li>\n<li><strong>Sicherung:</strong> \u201eSicherung speichern (.json)\u201c legt die Datei in den Ordner \u201eDownload\u201c des Tablets.</li>\n</ol>\n<p>Mit Internet arbeitet die Tablet-App zus\u00e4tzlich genau wie die Browser-Version (Online-Anmeldung, Zahlungen, Live schalten, WBU Live und WBU Time \u00fcber das Netz).</p>\n<h3 id=\"anl-10-3-hallen-wlan-beliebig-viele-fernseher-ohne-internet-und-ohne-kabel\">10.3 Hallen-WLAN: beliebig viele Fernseher ohne Internet und ohne Kabel</h3>\n<p>Tablet-App und Windows-Programm k\u00f6nnen ein eigenes WLAN aufmachen. Alle Fernseher (z. B. Fire TV) und Handys, die sich damit verbinden, zeigen WBU Live und WBU Time \u2013 f\u00fcr jeden Ring \u2013 ganz ohne Internet.</p>\n<ol>\n<li>Im Leitstand \u201e\ud83d\udce1 Hallen-WLAN starten\u201c antippen.</li>\n<li>Es erscheinen WLAN-Name und Passwort (Laptop: \u201eWBU-Halle\u201c / \u201ewbuboxing\u201c; Tablet: vom Tablet vorgegeben) sowie die Adressen.</li>\n<li>Am Fernseher das WLAN verbinden und im Browser (Fire TV: Silk) die angezeigte Adresse \u00f6ffnen:</li>\n<li>WBU Time f\u00fcr Ring 1, Ring 2 \u2026 (eine eigene Adresse je Ring),</li>\n<li>Kampfliste f\u00fcr den Hallen-Monitor,</li>\n<li>WBU Live f\u00fcr Handys.</li>\n<li>Am Laptop fragt die Windows-Firewall beim ersten Mal: \u201eZugriff zulassen\u201c (private und \u00f6ffentliche Netzwerke anhaken).</li>\n</ol>\n<p>L\u00e4sst sich kein eigenes WLAN starten (manche Ger\u00e4te sperren das), funktionieren dieselben Adressen auch \u00fcber einen vorhandenen WLAN-Router oder einen Handy-Hotspot, mit dem Tablet/Laptop und Fernseher verbunden sind. Mit Internet laufen WBU Live und WBU Time weiterhin zus\u00e4tzlich \u00fcber www.wbu-boxing.com.</p>\n<h3 id=\"anl-10-4-scorecard-app-f-r-android-installieren\">10.4 Scorecard-App f\u00fcr Android installieren</h3>\n<ol>\n<li>Die APK-Datei auf dem Handy oder Tablet herunterladen und antippen.</li>\n<li>Einmalig \u201eApps aus dieser Quelle zulassen\u201c erlauben, dann \u201eInstallieren\u201c.</li>\n<li>Bluetooth und Standort einschalten.</li>\n</ol>\n<p>Supervisor und Punktrichter verbinden sich per Bluetooth direkt miteinander \u2013 ohne Internet und ohne WLAN in der Halle. Internet braucht die App nur, wenn eine Veranstaltung aus WBU Sports \u00fcbernommen und die Ergebnisse dorthin geschickt werden sollen; fehlt es kurz, werden die Ergebnisse automatisch nachgeschickt.</p>\n<h3 id=\"anl-10-5-updates\">10.5 Updates</h3>\n<ul>\n<li>Browser-Version: immer automatisch aktuell. Zeigt eine Seite noch die alte Version, Strg + F5 dr\u00fccken.</li>\n<li>Android-Apps (Scorecard und WBU Sports Tablet): pr\u00fcfen bei jedem Start, ob es eine neue Version gibt. Dann erscheint ein Hinweis mit \u201eUpdate installieren\u201c \u2013 antippen, das Update l\u00e4dt und installiert sich selbst. Ein App-Store ist nicht n\u00f6tig. Bricht Android den ersten Versuch ab (manche Handys pr\u00fcfen die App erst mit Play Protect), startet die App die Installation still noch einmal \u2013 es erscheint keine Fehlermeldung (ab Version 1.145).</li>\n<li>Windows-Programm: zeigt beim Start (mit Internet) \u201eNeue Version\u201c \u2013 \u201eUpdate installieren\u201c antippen: es l\u00e4dt, installiert sich selbst und startet nach ein paar Sekunden neu. Die Daten bleiben erhalten.</li>\n</ul>\n<p><strong>Xiaomi-Handys (Mi Protect):</strong> Beim Update zeigt Xiaomi \u201eRiskante App \u2013 Riskante Installationsquelle\u201c. Das kommt vom Handy bei jeder App, die nicht aus einem App-Store stammt \u2013 die WBU-App ist sicher. Einfach <strong>\u201e\u00dcberspringen\u201c</strong> und dann <strong>\u201eAktualisieren\u201c</strong> tippen. Dauerhaft abschalten: Einstellungen \u2192 Apps \u2192 App-Installationsprogramm (\u2699) \u2192 \u201eSicherheitspr\u00fcfung\u201c/\u201eMi Protect\u201c aus.</p>\n<h2 id=\"anl-11-h-ufige-fragen-und-probleme\">11. H\u00e4ufige Fragen und Probleme</h2>\n<table>\n<thead>\n<tr>\n<th>Problem</th>\n<th>L\u00f6sung</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>WBU Sports zeigt \u201eBitte zuerst einloggen\u201c</td>\n<td>Auf der Anmeldeseite einloggen; bei falscher Rolle \u201eAls Veranstalter weiter\u201c antippen</td>\n</tr>\n<tr>\n<td>Seite zeigt noch die alte Version</td>\n<td>Strg + F5 dr\u00fccken</td>\n</tr>\n<tr>\n<td>Uhr startet nicht</td>\n<td>Ringarzt im Leitstand eintragen</td>\n</tr>\n<tr>\n<td>Punktrichter kommt nicht rein</td>\n<td>PIN beim Supervisor erfragen; der Supervisor muss zuerst angemeldet sein</td>\n</tr>\n<tr>\n<td>Veranstaltung fehlt in der Scorecard</td>\n<td>In WBU Sports \u201eLive schalten\u201c; der PC mit WBU Sports muss online sein</td>\n</tr>\n<tr>\n<td>WBU Live oder WBU Time steht still</td>\n<td>Internet am PC mit WBU Sports pr\u00fcfen; als Reserve einen Handy-Hotspot bereithalten \u2013 oder ohne Internet mit der Windows-Version und der App arbeiten (Kapitel 10)</td>\n</tr>\n<tr>\n<td>Kein Ton am Fernseher</td>\n<td>Einmal \u201eMute \u2013 Ton einschalten\u201c antippen</td>\n</tr>\n<tr>\n<td>Browser f\u00fcllt das Passwort in ein falsches Feld</td>\n<td>Feld leeren; gespeicherten Eintrag \u00fcber das Schl\u00fcssel-Symbol in der Adressleiste l\u00f6schen</td>\n</tr>\n<tr>\n<td>Neuer PC, Veranstaltung fehlt</td>\n<td>\u201eGespeicherte Sicherung einspielen\u201c mit der .json-Sicherung</td>\n</tr>\n<tr>\n<td>Urkunde ohne Gold oder Fahne</td>\n<td>Beim Drucken H\u00e4kchen bei Hintergrundgrafiken setzen</td>\n</tr>\n</tbody>\n</table>\n<p>Fragen an die WBU: dm@wbu-boxing.com \u00b7 www.wbu-boxing.com</p>", "en": "<p>WBU Sports is the World Boxing Union's system for tournaments and pro galas: from online registration through fight day to the certificate. Everything runs in the browser at www.wbu-boxing.com \u2013 including the scorecard. In addition there is the scorecard as an Android app, WBU Sports as a tablet app for Android and WBU Sports as a Windows version \u2013 all three also work without internet.</p>\n<p><strong>Language:</strong> Scorecard, WBU Sports, the registration page and WBU Live are available in German, English, Spanish, French and Russian. The language is set automatically from the browser or phone; the <strong>\ud83c\udf10</strong> button at the top switches it at any time. Reports, certificates, invoices and accreditation cards are printed in the selected language.</p>\n<h2 id=\"anl-overview\">Overview</h2>\n<table>\n<thead>\n<tr>\n<th>Module</th>\n<th>Who uses it</th>\n<th>Address</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Registration page</td>\n<td>Clubs, coaches, individual athletes, promoters</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/anmeldung/\">https://www.wbu-boxing.com/anmeldung/</a></td>\n</tr>\n<tr>\n<td>WBU Sports (promoter)</td>\n<td>Promoters, control center</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/veranstalter/\">https://www.wbu-boxing.com/veranstalter/</a></td>\n</tr>\n<tr>\n<td>Scorecard</td>\n<td>Supervisor, judges</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/scorecard/\">https://www.wbu-boxing.com/scorecard/</a></td>\n</tr>\n<tr>\n<td>WBU Live</td>\n<td>Spectators (phone, hall monitor)</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/\">https://www.wbu-boxing.com/live/</a></td>\n</tr>\n<tr>\n<td>WBU Time</td>\n<td>Timekeeper, TV at the ring</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1\">https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1</a></td>\n</tr>\n<tr>\n<td>Live monitor on the home page</td>\n<td>all visitors of the WBU website, appears automatically during running galas</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/\">https://www.wbu-boxing.com/</a></td>\n</tr>\n<tr>\n<td>Results</td>\n<td>everyone</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/results/\">https://www.wbu-boxing.com/results/</a></td>\n</tr>\n<tr>\n<td>WBU world ranking</td>\n<td>everyone</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/rankings/\">https://www.wbu-boxing.com/rankings/</a></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"anl-tournament-or-pro-gala-the-difference\">Tournament or pro gala \u2013 the difference</h3>\n<p>When creating the event, the promoter chooses whether it is a tournament or a pro gala. This cannot be changed later.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Tournament</th>\n<th>Pro gala</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>What</td>\n<td>many athletes, drawn by class</td>\n<td>fight night, set fight by fight</td>\n</tr>\n<tr>\n<td>Registration</td>\n<td>online by clubs, coaches, individual athletes</td>\n<td>none \u2013 the promoter enters the fights himself</td>\n</tr>\n<tr>\n<td>Structure</td>\n<td>categories, brackets (knockout system), fight list</td>\n<td>fight card</td>\n</tr>\n<tr>\n<td>Rings</td>\n<td>1 to 10 rings or fighting areas</td>\n<td>1 ring</td>\n</tr>\n<tr>\n<td>Result</td>\n<td>there must always be a winner</td>\n<td>draw or no contest also possible</td>\n</tr>\n<tr>\n<td>Certificates, accreditation</td>\n<td>yes</td>\n<td>\u2013</td>\n</tr>\n<tr>\n<td>Chapter</td>\n<td>2</td>\n<td>3</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"anl-1-clubs-coaches-and-individual-athletes\">1. Clubs, coaches and individual athletes</h2>\n<p>Anyone registering athletes needs an account on the registration page. The account is valid for all WBU tournaments.</p>\n<h3 id=\"anl-1-1-create-an-account\">1.1 Create an account</h3>\n<ol>\n<li>Open <a target=\"_blank\" href=\"https://www.wbu-boxing.com/anmeldung/\">https://www.wbu-boxing.com/anmeldung/</a> (in the menu of the WBU website: WBU Sports).</li>\n<li>Tap \u201cRegister\u201d.</li>\n<li>Under \u201cI am\u201d choose the role: club/gym, coach, individual athlete or promoter.</li>\n<li>Enter club, first and last name, phone, e-mail and a password (at least 6 characters).</li>\n<li>Tap \u201cCreate account\u201d. From now on log in with e-mail and password.</li>\n</ol>\n<p>The login applies in all tabs and ends when the browser is closed or you tap \u201cLog out\u201d. The role can be changed at the top right under \u201cChange role\u201d. Forgot your password: tap \u201cForgot password?\u201d, a code arrives by e-mail.</p>\n<h3 id=\"anl-1-2-open-a-tournament\">1.2 Open a tournament</h3>\n<p>Every tournament has a public info page with date, venue, entry fee, registration deadline and the announcement to read \u2013 even without login. After logging in, tap the tournament in the tournament list. At the top are the tabs: Registration, My registrations &amp; payment, Participants, Categories, Clubs &amp; coaches.</p>\n<h3 id=\"anl-1-3-enter-athletes\">1.3 Enter athletes</h3>\n<ol>\n<li>Tab \u201cRegistration\u201d.</li>\n<li>Choose the sport (Semi-Pro boxing, kickboxing K1, masters boxing, Shadow Boxing Battle).</li>\n<li>Enter first name, last name, date of birth, gender and weight. The class follows automatically from age on the tournament day, gender and weight.</li>\n<li>Enter club, country, coach and e-mail.</li>\n<li>Choose a photo (optional). The \u201cSelect head\u201d window opens: move the red frame onto the head, make it bigger or smaller with the slider, \u201cApply\u201d. The head later appears on the accreditation card.</li>\n<li>Upload documents if already available (see 1.4) \u2013 they can also be submitted later.</li>\n<li>\u201cEnter\u201d. The athlete is immediately on the participant list and in the basket. For more athletes \u201c+ Add another athlete\u201d.</li>\n</ol>\n<h3 id=\"anl-1-4-documents\">1.4 Documents</h3>\n<table>\n<thead>\n<tr>\n<th>Document</th>\n<th>Who needs it</th>\n<th>Note</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Participation declaration &amp; liability waiver</td>\n<td>all athletes</td>\n<td>download the form, print, sign, upload as photo or PDF</td>\n</tr>\n<tr>\n<td>Parents' signature</td>\n<td>athletes under 18</td>\n<td>on the same participation declaration</td>\n</tr>\n<tr>\n<td>Sports medical certificate</td>\n<td>as per announcement (e.g. Semi-Pro)</td>\n<td>must be from the year of the event; enter the date of issue</td>\n</tr>\n</tbody>\n</table>\n<p>If something is missing, it is marked red under \u201cMy registrations &amp; payment\u201d and can be uploaded there. After the registration deadline a reminder with a 3-day grace period follows, then the athlete is removed.</p>\n<h3 id=\"anl-1-5-payment\">1.5 Payment</h3>\n<ol>\n<li>Tab \u201cMy registrations &amp; payment\u201d.</li>\n<li>\u201cDone \u2013 pay now\u201d. The total is now fixed and a payment code appears.</li>\n<li>Transfer the amount, with only the payment code as reference.</li>\n<li>As soon as the promoter has matched the payment, it shows \u201cPaid \u2013 registration confirmed\u201d.</li>\n</ol>\n<p>Anyone who has not paid in full by the deadline gets a reminder with a short grace period; after that the athletes are removed. The invoice is available as PDF for download on the day after the event.</p>\n<h3 id=\"anl-1-6-register-coaches-and-seconds\">1.6 Register coaches and seconds</h3>\n<p>Under \u201cMy registrations &amp; payment\u201d in the section \u201cCoaches &amp; seconds (accreditation)\u201d. Everyone entered gets an accreditation card with free entry.</p>\n<table>\n<thead>\n<tr>\n<th>Athletes registered</th>\n<th>Coaches free</th>\n<th>Seconds free</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0</td>\n<td>0</td>\n<td>0</td>\n</tr>\n<tr>\n<td>1 to 5</td>\n<td>1</td>\n<td>2</td>\n</tr>\n<tr>\n<td>6 or more</td>\n<td>1</td>\n<td>4</td>\n</tr>\n</tbody>\n</table>\n<ol>\n<li>Enter first and last name, choose the role (only roles with free places are offered).</li>\n<li>Choose a photo (optional) and select the head.</li>\n<li>\u201c+ Add\u201d. Remove via \u201cremove\u201d.</li>\n</ol>\n<p>Unregistered seconds count as spectators and pay admission. Individual athletes register their coach and seconds the same way.</p>\n<h2 id=\"anl-2-promoter-create-a-tournament\">2. Promoter \u2013 create a tournament</h2>\n<p>A tournament is created in WBU Sports, opened for online registration and controlled on fight day from the control center.</p>\n<h3 id=\"anl-2-1-log-in\">2.1 Log in</h3>\n<ol>\n<li>Log in on the registration page with an account with the role \u201cPromoter\u201d \u2013 you go straight to WBU Sports.</li>\n<li>If the account is still \u201cCoach\u201d or \u201cClub\u201d: in WBU Sports tap \u201cContinue as promoter\u201d or \u201cChange role\u201d at the top.</li>\n</ol>\n<p>Important: events are stored on the server (in the browser with a WBU Sports account). Every change is saved automatically and appears on every device you log in on \u2013 PC, laptop or tablet. \u201cSave backup (.json)\u201d remains as an extra copy.</p>\n<h3 id=\"anl-2-2-create-an-event\">2.2 Create an event</h3>\n<ol>\n<li>On the start page choose \u201cTournament\u201d (for a gala see chapter 3).</li>\n<li>Fill in the \u201cEvent\u201d tab: name, promoter, venue/hall, date. The promoter does not enter supervisor and timekeeper \u2013 the supervisor does this in his scorecard; the names then appear in the result and in the PDF report.</li>\n<li>Ringside doctor: can be entered now \u2013 otherwise on fight day in the control center. Without a ringside doctor the clock does not start.</li>\n<li>Choose the number of rings or fighting areas (1\u201310) and the label \u201cRing\u201d or \u201cFighting area\u201d.</li>\n<li>Set the weight tolerance at weigh-in (e.g. 4 kg as per announcement).</li>\n</ol>\n<h3 id=\"anl-2-3-open-online-registration\">2.3 Open online registration</h3>\n<ol>\n<li>Tab \u201cOnline registration\u201d.</li>\n<li>Tap the sports offered.</li>\n<li>Enter registration deadline, entry fee for the 1st start and for each further start, grace period (days).</li>\n<li>Sports medical certificate: required or not.</li>\n<li>Enter account holder, IBAN, BIC and notes for the athletes.</li>\n<li>Publish (WBU password required). Then upload announcement, schedule, poster and forms.</li>\n</ol>\n<p>A black bar at the top shows the figures: registered participants, starts, clubs, registered accounts, open payments, missing documents. \u201cView participants, categories with pictures, clubs\u201d opens the registration page in the promoter view \u2013 without your own account.</p>\n<h3 id=\"anl-2-4-match-payments\">2.4 Match payments</h3>\n<p>In the \u201cOnline registration\u201d tab load the bank statement (PDF or CSV from the bank). The system looks for the payment codes and matches the amounts. The statement is read only in your own browser and not uploaded. Individual payments can also be confirmed or undone manually.</p>\n<h3 id=\"anl-2-5-categories-and-participants\">2.5 Categories and participants</h3>\n<ul>\n<li>Athletes registered online automatically land in their weight class.</li>\n<li>Green: pairing fixed \u00b7 Yellow: waiting for an opponent \u00b7 \u25b6: already running.</li>\n<li>Clicking a class shows the participants. Athletes can be added manually, rounds and round time as well as the ring can be set.</li>\n<li>Remove participants: \u2715 \u2013 as long as no fight in the class has been scored, a new draw is made automatically.</li>\n<li>If the class is already running: \u201cnot here\u201d \u2013 the athlete is crossed out and loses his open fights by walkover; \u201cis here after all\u201d undoes it.</li>\n</ul>\n<h3 id=\"anl-2-6-brackets\">2.6 Brackets</h3>\n<p>Knockout system, drawn automatically; club mates are kept apart in the first round where possible. Byes are distributed evenly. Winners advance automatically. There is no fight for 3rd place: both semi-final losers are third. \u201cRedraw\u201d is possible but deletes results already entered for the class. \u201cPrint bracket\u201d for the notice board.</p>\n<h3 id=\"anl-2-7-fight-list-and-rings\">2.7 Fight list and rings</h3>\n<ul>\n<li>Fights are distributed evenly across the rings; masters preferably in ring 1.</li>\n<li>Anyone starting twice never fights in two rings at the same time and gets the set minimum break (e.g. 4 fights in between).</li>\n<li>\u201cPrint / PDF\u201d for the fight list per ring.</li>\n</ul>\n<h3 id=\"anl-2-8-go-live\">2.8 Go live</h3>\n<p>In the \u201cFight list\u201d tab tap \u201cGo live\u201d (WBU password). Then the following appear:</p>\n<ul>\n<li>the link for WBU Live (phone, spectators),</li>\n<li>the TV link for the hall monitor,</li>\n<li>the buttons \u201cOpen ring 1\u201d, \u201cOpen ring 2\u201d for WBU Time.</li>\n</ul>\n<p>The event then also appears in the supervisor's scorecard. The PC with WBU Sports must stay open and online during the event \u2013 it sends the fight list and fetches the results.</p>\n<h2 id=\"anl-3-promoter-create-a-pro-gala\">3. Promoter \u2013 create a pro gala</h2>\n<p>A gala is a fight night, fight by fight, without categories and brackets. It always runs in one ring.</p>\n<ol>\n<li>On the start page choose \u201cPro gala\u201d.</li>\n<li>Fill in the \u201cEvent\u201d tab as in 2.2 (name, promoter, venue, date, ringside doctor).</li>\n<li>Tab \u201cFight card\u201d: enter each fight and \u201c+ Add fight\u201d:</li>\n<li>red and blue corner (name, required),</li>\n<li>per corner gym / club, country, date of birth (the age is calculated on the event day) and weight at weigh-in,</li>\n<li>weight class (required),</li>\n<li>title as authorised by the WBU \u2013 to click: World Championship, Intercontinental Championship, European Championship, International Championship, German Championship; for special titles \u201cOther title \u2013 enter yourself\u201d (e.g. Junior World Championship); without a title \u201c\u2013 no title fight \u2013\u201d,</li>\n<li>fight type, number of rounds and round length.</li>\n<li>Change the order with \u25b2 \u25bc, \u270e edit, \u2715 delete.</li>\n<li>\u201cGo live\u201d as in 2.8 \u2013 then timekeeping and TV display via the fight card buttons.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Setting</th>\n<th>Options</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Fight type</td>\n<td>Pro, Semi-Pro, Master, Bare Knuckle, Hybrid, K1 / kickboxing</td>\n</tr>\n<tr>\n<td>Weight class</td>\n<td>pro weight classes from light flyweight to heavyweight</td>\n</tr>\n<tr>\n<td>Title</td>\n<td>no title fight, World, Intercontinental, European, International, German Championship or enter yourself</td>\n</tr>\n<tr>\n<td>Rounds</td>\n<td>free choice, 1 to 12</td>\n</tr>\n<tr>\n<td>Round length</td>\n<td>3, 2, 1.5 or 1 minute; break always 1 minute</td>\n</tr>\n</tbody>\n</table>\n<p>At a gala a draw or no contest is also possible; in a tournament there must always be a winner.</p>\n<h3 id=\"anl-3-1-upload-the-gala-required\">3.1 Upload the gala \u2013 required</h3>\n<p>As soon as the fight card has its first fight and internet is available, WBU Sports asks: \u201c\u26a0 Required: upload event\u201d. Enter the WBU password once \u2013 then the gala is online (even if it was created in the Windows program or the tablet app). Only then does the supervisor get the fight card and can change it on the event day. On the first upload the WBU automatically receives an info e-mail (to info@wbu-boxing.com) with name, date, venue and promoter \u2013 this also applies to tournaments.</p>\n<h3 id=\"anl-3-2-change-the-fight-card-on-the-event-day\">3.2 Change the fight card on the event day</h3>\n<ul>\n<li><strong>Promoter:</strong> any time in the fight card (\u270e change, \u25b2 \u25bc move, \u2715 delete, new fights). Everything goes automatically to the scorecard, WBU Live and WBU Time.</li>\n<li><strong>Supervisor (if the promoter is not there):</strong> in the scorecard, in the box \u201cFrom WBU Sports\u201d, tap \u201c\u270e Edit fight card\u201d. Change names, country, date of birth, weight, weight class, title, fight type, rounds and round length, move, add or remove fights \u2013 \u201cSave &amp; send\u201d. This also works without internet if he is connected to the tablet or laptop via Bluetooth; if the internet drops briefly, it is resent automatically.</li>\n<li><strong>Via the WBU Sports account:</strong> anyone who logged in to the scorecard in the browser as supervisor with the WBU password while logged in to WBU Sports will afterwards find the gala on the registration page under \u201c\u270e Unlocked as supervisor\u201d \u2013 with \u201cEdit fight card\u201d. This applies only to this gala and ends after the event day.</li>\n<li>Fights already scored cannot be removed and can only be changed after confirmation. The promoter sees in WBU Sports who changed what and when.</li>\n</ul>\n<h3 id=\"anl-3-5-supervisor-full-access-on-any-device\">3.5 Supervisor: full access on any device</h3>\n<ol>\n<li>Open a laptop or tablet, www.wbu-boxing.com \u2192 <strong>WBU Sports</strong>.</li>\n<li>Tap <strong>\u201c\ud83d\udee1 Log in as supervisor\u201d</strong>, enter first and last name and the <strong>WBU supervisor password</strong> (the same as in the scorecard \u2013 only real supervisors know it).</li>\n<li>All uploaded events appear. Click the right one \u2013 full access to fight card, control center, clock, WBU Time and results.</li>\n<li>Changes by promoter and supervisor are synchronised automatically every 20 seconds.</li>\n<li><strong>Only one device runs the control center:</strong> if it is already running on another device, a red note \u201c\u26a0 The control center is currently running on another device\u201d appears with name and time. \u201cTake over control center here\u201d switches deliberately.</li>\n</ol>\n<p><strong>Scorecard login:</strong> promoter, venue, date and ringside doctor stay empty until a show is selected \u2013 then they are filled in automatically.</p>\n<p><strong>Supervisor on laptop/PC:</strong> Below the control center, \u201c\ud83d\udee1 My supervisor scorecard\u201d appears \u2013 logged in automatically, with all scorecard functions. The PIN for the judges is shown large at the top, so the supervisor needs no phone. \u201cOpen in its own window\u201d opens it separately. (Only visible when logged in as supervisor and the event is live.)</p>\n<p><strong>Roles when logging in with the supervisor password:</strong> Choose the role at the top right (and in the login window). <strong>\ud83d\udee1 Supervisor:</strong> follows the control center live (the clock runs along but cannot be operated) and has the supervisor scorecard below. <strong>\ud83c\udf9b Promoter (technical director):</strong> The technical director supervises and operates the second control center \u2013 he can also be the timekeeper. He operates the control center \u2013 clock, monitors, results, editing \u2013 without a scorecard. So two control centers run at the same time: one for the supervisor to follow, one to operate.</p>\n<h3 id=\"anl-ring-announcer-voice\">Ring announcer voice</h3>\n<p>For events without their own ring announcer. Sound via the control-center PC to the hall PA.</p>\n<ul>\n<li>In the control center switch on <strong>\u201c\ud83c\udfa4 Ring announcer on\u201d</strong> and choose the language (DE, EN, ES, FR, RU). <strong>\u201c\u25b6 Test\u201d</strong> tests the voice.</li>\n<li><strong>Announce at the push of a button</strong> (control center \u201cIn the ring\u201d or fight card \ud83c\udfa4): <strong>Fight</strong> (number, title, weight class, rounds), <strong>Red corner</strong>, <strong>Blue corner</strong> (country, gym, name).</li>\n<li><strong>\ud83c\udfc6 Winner announcement:</strong> After the result (when the referee is done) press <strong>\u201c\ud83c\udfc6 Winner\u201d</strong> in the control center or \ud83c\udfc6 in the fight card. The voice announces method and round from the entered result, e.g. \u201cLadies and gentlemen! \u2026 By technical knockout in round 3 \u2026 and the winner \u2026 from the red corner \u2026 Marco \u2026 Brandt!\u201d \u2013 also decisions (unanimous, split, majority), draws and no contest.</li>\n<li><strong>Pitch:</strong> Under \u201c\ud83d\udd11 Google voice\u201d there is a <strong>Pitch</strong> slider next to voice and speaking rate \u2013 lower = deeper and darker, higher = brighter. The <strong>boxers' names</strong> are spoken separately with their own sliders <strong>Name speed</strong> and <strong>Name pitch</strong> \u2013 so they sound slower, stretched and emphasized.</li>\n<li><strong>Gong guaranteed:</strong> At round start first \u201cSeconds out! Round X!\u201d, then the gong \u2013 also after \u201c\u21ba Restart round\u201d or \u201c\u23ed Next round\u201d when pressing START/CONTINUE. The gong comes after 6 seconds at the latest, even if the voice hangs.</li>\n<li><strong>Automatically with the clock:</strong> at START or the start of a round first \u201cRound 1 \u2013 box!\u201d, then the bell (last round with \u201cFinal round!\u201d). At the end of a round first the bell, then \u201cEnd of round 1!\u201d (at the end of the fight \u201cEnd of the fight!\u201d). \u201cSeconds out!\u201d at the 10-second knock in the break.</li>\n<li><strong>Voice:</strong> free. Without a key the browser's computer voice speaks. With <strong>\u201c\ud83d\udd11 Google voice\u201d</strong> (WBU supervisor password only) the more natural Google voice is set up \u2013 free up to 1 million characters a month (a gala needs about 5,000\u201310,000).</li>\n<li><strong>\ud83d\udd14 Bell by hand:</strong> the \u201c\ud83d\udd14 Bell\u201d button next to START/STOP rings once with every click \u2013 even while the clock runs automatically (e.g. if the bell was not heard).</li>\n<li><strong>Try it out:</strong> every logged-in user (promoter, supervisor, WBU) has \u201c\ud83e\uddea Open test event\u201d on the start page \u2013 with 2 fights, on this device only, never uploaded, never live.</li>\n<li>In the supervisor role the announcer stays silent \u2013 only the technical director's control center speaks.</li>\n</ul>\n<p><strong>TVs (\ud83d\udcfa bar in the control center):</strong> <strong>\ud83d\udcfa WBU Live</strong> (fight list), <strong>\u23f1 WBU Time 1</strong> and <strong>\u23f1 WBU Time 2</strong> (round clock). With internet they open the live pages (also available on Fire TV). Without internet a window opens on the control-center PC \u2013 drag it to the TV (HDMI) and press F11 for full screen. So e.g. three TVs run at once at a championship. With one ring, WBU Time 2 shows the same clock on a second TV.</p>\n<p><strong>\u23f8 Event break:</strong> in the control center press \u201c\u23f8 Event break\u201d and choose 5\u201330 minutes or \u201cno time limit\u201d. The current fight runs to the end, then no new fight is called \u2013 the automation waits. WBU Time and WBU Live show \u201cBREAK\u201d with countdown and the next fight. \u201c\u25b6 Continue \u2013 call next fight\u201d ends the break (with ring announcer, if switched on).</p>\n<h3 id=\"anl-3-3-fighter-database\">3.3 Fighter database</h3>\n<ul>\n<li>All fighters from tournament registrations and uploaded galas automatically land in the <strong>fighter database</strong>, sorted by gym. Each fighter appears only once.</li>\n<li><strong>\ud83d\udcc7</strong> next to \u201cRed corner\u201d / \u201cBlue corner\u201d (and \u201c\ud83d\udcc7 Database\u201d for tournament participants): expand a gym or search for a name, click a fighter \u2013 name, gym, country, date of birth and weight are filled in immediately.</li>\n<li>On the start page: \u201c\ud83d\udcc7 Fighter database\u201d to browse, correct (\u270e) and add new. Deleting only with the WBU password.</li>\n<li><strong>\ud83d\udce5 Import list:</strong> a table (Excel \u2192 \u201cCSV UTF-8\u201d) with the columns first name; last name; gym / club; country \u2013 e.g. the starters of an earlier tournament. Anyone already in it is not created twice. The promoter chooses the weight class anew each time.</li>\n<li><strong>When typing a name</strong> (red/blue corner, tournament participants) matching fighters from the database appear \u2013 clicking takes over name, gym, country and date of birth. This prevents duplicates. Another person with the same name? Just add something (e.g. a middle name).</li>\n<li><strong>Clubs during online registration</strong> only see their <strong>own</strong>, previously registered athletes to take over. If the name exists at another club, only the note \u201cThis name already exists\u201d appears \u2013 without other people's data.</li>\n<li><strong>Closed:</strong> only promoter and supervisor accounts, coaches (their own gym only) and the WBU (WBU password) can see the database \u2013 never the public, nor clubs among each other.</li>\n</ul>\n<h3 id=\"anl-3-4-athlete-profile-record-titles-weights-and-ko-suspension\">3.4 Athlete profile: record, titles, weights and KO suspension</h3>\n<ul>\n<li>In the fighter database <strong>\u201cProfile\u201d</strong> opens the athlete profile. It can only be seen here in the protected area \u2013 not on the website.</li>\n<li><strong>Record per sport, separate:</strong> Pro, Semi-Pro, Master, K1, Bare Knuckle and Hybrid \u2013 each with wins (of which by KO), losses (of which by KO) and draws. Every fight from the WBU system counts automatically, including results published earlier. If nothing is entered yet, the next WBU fight is fight no. 1.</li>\n<li><strong>Add fights from elsewhere:</strong> only the <strong>coach</strong> from the same gym (role \u201cCoach\u201d) \u2013 and only upwards, numbers cannot go down. Corrections downwards are made only by the WBU. Every change is listed with name and date under \u201cChanges\u201d.</li>\n<li><strong>Titles:</strong> WBU titles and tournament wins are entered automatically by the system (or manually by the WBU). Coaches can add titles of other federations; they are marked \u201cexternal\u201d.</li>\n<li><strong>Weights:</strong> every weight from registration and gala is saved with the date.</li>\n<li><strong>KO suspension:</strong> after a KO loss the athlete is suspended for <strong>90 days</strong>, after a TKO for <strong>30 days</strong> (retirement/RTD: no suspension). The database then shows \u201c\ud83d\udeab Suspended until \u2026\u201d in red, and he can neither be selected nor entered into a fight by name. The WBU can enter a suspension manually (e.g. KO with another federation) or lift it with medical clearance.</li>\n</ul>\n<h2 id=\"anl-4-on-fight-day-the-control-center\">4. On fight day \u2013 the control center</h2>\n<p>The control center shows all rings with the round clock, the fight in the ring, the next fights and the previous fights. It is in the \u201c\ud83c\udf9b Control center\u201d tab.</p>\n<h3 id=\"anl-4-1-before-the-start\">4.1 Before the start</h3>\n<ol>\n<li>Enter the ringside doctor (field at the top, marked yellow while empty). Without a ringside doctor the clock does not start.</li>\n<li>With several PCs: under \u201cThis PC operates\u201d tick only your own rings.</li>\n<li>Choose the signal per ring (e.g. ring 1 ring bell, ring 2 referee whistle) and listen with \u25b6.</li>\n<li>Check \u201cSignals on\u201d \u2013 \u201cMUTE\u201d switches off all sounds.</li>\n</ol>\n<h3 id=\"anl-4-2-the-clock\">4.2 The clock</h3>\n<table>\n<thead>\n<tr>\n<th>Button</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\u25b6 START / CONTINUE</td>\n<td>round runs</td>\n</tr>\n<tr>\n<td>\u23f8 STOP</td>\n<td>clock stops, the timeout clock (max. 10 min) starts automatically</td>\n</tr>\n<tr>\n<td>\u21ba Restart round</td>\n<td>current round from the start</td>\n</tr>\n<tr>\n<td>\u23ed Next round</td>\n<td>jumps to the next round</td>\n</tr>\n<tr>\n<td>Rd. / Min</td>\n<td>change number of rounds and round length</td>\n</tr>\n</tbody>\n</table>\n<p>Signals run automatically: 10 seconds before the end of the round three hammer blows, after each round and each break one bell, at the end of the fight three. The break always lasts 1 minute.</p>\n<h3 id=\"anl-4-3-weigh-in\">4.3 Weigh-in</h3>\n<p>The \u201cWeigh-in\u201d box shows the maximum weight (class plus tolerance, e.g. -55 kg + 4 kg = max. 59.0 kg). Type in the weight for red and blue. If it is above, the system asks about disqualification; the opponent wins and advances.</p>\n<h3 id=\"anl-4-4-special-cases-with-one-click\">4.4 Special cases with one click</h3>\n<table>\n<thead>\n<tr>\n<th>Case</th>\n<th>Button</th>\n<th>Result</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Disqualification at weigh-in</td>\n<td>\u2696 DQ: red / blue</td>\n<td>opponent wins by DQ</td>\n</tr>\n<tr>\n<td>Opponent cannot compete (e.g. injury)</td>\n<td>\u270b Won by walkover: red / blue</td>\n<td>without confirmation, can be corrected later via \u270e</td>\n</tr>\n<tr>\n<td>Athlete did not show up</td>\n<td>\ud83d\udeab Did not show up: red / blue</td>\n<td>opponent wins by walkover, also later fights of this athlete</td>\n</tr>\n</tbody>\n</table>\n<p>Anyone who loses by walkover, does not show up or is disqualified at weigh-in gets no certificate for this place.</p>\n<h3 id=\"anl-4-5-results\">4.5 Results</h3>\n<p>The result comes automatically from the supervisor (scorecard) or is set manually with \u201cEnter result\u201d. As soon as a result is there, the clock is reset and the next fight is loaded. \u201cCall next fight\u201d or \u201ccall\u201d changes the order.</p>\n<h3 id=\"anl-4-6-second-pc-at-the-ring-operator-station\">4.6 Second PC at the ring (operator station)</h3>\n<p>With several rings, \u201cSecond PC at the ring (no login)\u201d appears at the bottom with a link per ring. Open this link on the second PC: only this ring can be operated there (clock, results, DQ). Then untick this ring under \u201cThis PC operates\u201d on the main PC.</p>\n<h3 id=\"anl-4-7-wbu-time-on-the-tv\">4.7 WBU Time on the TV</h3>\n<p>The round clock for the TV at the ring: round on the left, time large on the right, names of the corners at the top. In the menu of the WBU website open \u201cWBU Time 1\u201d or \u201cWBU Time 2\u201d (or in the Fire TV browser <a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1\">https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1</a>). It automatically shows the running event and follows the clock in the control center. Enable sound on the TV once with \u201cMute \u2013 turn sound on\u201d. Without internet: connect the TV to the PC via HDMI and open the time display in the control center.</p>\n<h2 id=\"anl-5-results-certificates-and-accreditation\">5. Results, certificates and accreditation</h2>\n<h3 id=\"anl-5-1-results\">5.1 Results</h3>\n<p>Tab \u201cResults\u201d: places 1, 2 and 3 (two thirds) per class, automatically from the brackets. \u201cPrint / PDF\u201d for the notice board. The placings appear on WBU Live at the same time.</p>\n<h3 id=\"anl-5-2-set-logos-in-advance\">5.2 Set logos in advance</h3>\n<p>In the \u201c\ud83c\udfc5 Certificates\u201d tab under \u201cLogos on the certificates\u201d \u2013 before fight day, so nobody has to set anything on the day:</p>\n<ol>\n<li>\u201cUpload my logo\u201d: each account has one logo (club or promoter).</li>\n<li>Tick which logos go on the certificates and accreditation cards of this event: KCW, your own logo, logos of other promoters.</li>\n<li>Enter \u201cSecond website at the bottom of the certificate\u201d or leave empty.</li>\n</ol>\n<h3 id=\"anl-5-3-print-certificates\">5.3 Print certificates</h3>\n<ul>\n<li>After a semi-final the control center shows \u201c\ud83c\udfc5 Certificate 3rd place: name\u201d, after the final one button each for places 1 and 2. One click prints exactly this certificate; the button then shows a \u2713.</li>\n<li>In the \u201cCertificates\u201d tab: \u201cPrint all certificates\u201d or \u201cPrint\u201d per class.</li>\n<li>At a German Championship, place 1 reads \u201cGerman Champion\u201d, otherwise \u201cCertificate\u201d. Laurel in gold, silver or bronze.</li>\n<li>Print settings: A4 paper, no margins, tick background graphics.</li>\n</ul>\n<h3 id=\"anl-5-4-accreditation-cards\">5.4 Accreditation cards</h3>\n<p>Tab \u201c\ud83e\udeaa Accreditation\u201d (only for published tournaments). Cards for all athletes in the system as well as registered coaches and seconds \u2013 free entry.</p>\n<ol>\n<li>Choose \u201cPrint on\u201d: plastic card on the card printer (each card separately, credit-card size portrait 54 \u00d7 85.6 mm) or A4 paper with 9 cards to cut out.</li>\n<li>\u201cPrint all cards\u201d, \u201cOnly one club\u201d or \u201cCard\u201d for a single person.</li>\n<li>For photos without a selected head: \u201cCrop head\u201d.</li>\n<li>Card printer settings: CR80 portrait, no margins, scaling 100 %, background graphics on.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Role</th>\n<th>Colour on the card</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Athlete</td>\n<td>red</td>\n</tr>\n<tr>\n<td>Coach</td>\n<td>blue</td>\n</tr>\n<tr>\n<td>Second</td>\n<td>green</td>\n</tr>\n</tbody>\n</table>\n<p>Entry: scan the QR code with a phone camera. \u201cAccreditation valid\u201d appears with name, role and club \u2013 or \u201cNot valid\u201d if the card is forged or the person has been removed.</p>\n<h2 id=\"anl-6-supervisor-operating-the-scorecard\">6. Supervisor \u2013 operating the scorecard</h2>\n<p>The supervisor logs in to the event in the scorecard, sets the PIN for the judges and confirms every result. He uses the browser (https://www.wbu-boxing.com/scorecard/) or the Android app WBU-SC.</p>\n<p><strong>Note \u201cPlease add\u201d:</strong> if weight (red/blue corner) or weight class is missing at a gala, only the supervisor's scorecard shows a yellow note \u2013 not the judges. Add via \u201c\u270e Edit fight card\u201d. Without a weight class a fight can still be saved.</p>\n<p><strong>Age rule:</strong> if both fighters' dates of birth are entered, WBU Sports and the scorecard check the age on fight day: <strong>masters boxing</strong> at most <strong>5 years</strong> difference (e.g. 48 vs 52 allowed), <strong>youth</strong> (under 18) at most <strong>2 years</strong> difference (e.g. 14 vs 12 not allowed). If it does not fit, the fight is not accepted at all.</p>\n<p><strong>Upload by the WBU:</strong> the WBU super administrator can upload a gala without password (via his account). Afterwards only the supervisor may change the fight card.</p>\n<h3 id=\"anl-6-1-log-in\">6.1 Log in</h3>\n<ol>\n<li>Tap \u201cSupervisor\u201d, enter first and last name.</li>\n<li>Enter promoter, venue and date.</li>\n<li>Enter the ringside doctor \u2013 required, applies to all fights.</li>\n<li>Under \u201cChoose show\u201d tap the show \u2013 only shows are listed there. Without internet at the ring simply choose no show: the app then searches for WBU Sports on the tablet via Bluetooth by itself, or the laptop connects by itself (see chapters 10.1 and 10.2): fights, names, country, age, weight, weight class, title, rounds, round length and the ringside doctor are then taken over, appear in the result and the PDF report, and results go to WBU Sports automatically. For a tournament with several rings choose your own ring.</li>\n<li>Enter the WBU supervisor password. It prevents anyone from posing as supervisor; only give it to real supervisors.</li>\n<li>Set the PIN for the judges (4 digits, required in the browser) and tell the judges.</li>\n<li>\u201cLet's go\u201d.</li>\n</ol>\n<p>In the app the judges connect to the supervisor's phone via Bluetooth \u2013 without internet. The app only needs internet for the connection to WBU Sports.</p>\n<h3 id=\"anl-6-2-set-up-a-fight\">6.2 Set up a fight</h3>\n<ul>\n<li>Number of rounds (1\u201312), round length, number of judges (1\u20133), fight type.</li>\n<li>Red and blue corner with country \u00b7 age \u00b7 weight, weight class or title (already filled in with WBU Sports; without WBU Sports the supervisor types them himself).</li>\n<li>Gala from WBU Sports: \u201c\u270e Edit fight card\u201d changes the fight card for everyone (see 3.2).</li>\n<li>Enter referee and timekeeper. They stay for the next fights; saved names of referees and judges can be tapped.</li>\n<li>The top shows how many judges are connected.</li>\n</ul>\n<h3 id=\"anl-6-3-view-scores\">6.3 View scores</h3>\n<p>The judges' scores appear live, round by round, with total. \u201cdone\u201d shows who has completed the fight. Short messages can be sent to the judges in the chat.</p>\n<p><strong>Correct:</strong> any round of a scorecard can be tapped and corrected if a judge obviously typed wrongly. The round is marked gold (with the old value), the scorecard gets \u201cSV correction\u201d, the report shows an *.</p>\n<p><strong>Judges score on paper:</strong> above \u201cFight 1\u201d is the switch \u201cJudges score on paper\u201d. When it is on, <strong>\u201c\u270d\ufe0f Paper scores\u201d</strong> appears below the fight details: enter the judges' names (they stay for the next fights; saved names of referees and judges can be tapped), then tap each field and pick the score from the paper card \u2013 10:9, 10:10, 9:10, 10:8, 8:10 or \u201cmore\u2026\u201d for your own points and deductions. The app calculates the totals; the result is set \u201caccording to paper cards\u201d and confirmed as usual. One phone is enough.</p>\n<h3 id=\"anl-6-4-set-the-result\">6.4 Set the result</h3>\n<ol>\n<li>Choose the result. The system suggests a decision from the scores.</li>\n<li>Tap the winner.</li>\n<li>For KO, TKO, RTD (retired in the corner), disqualification and technical decision also enter round and time, e.g. round 3, 1:25.</li>\n<li>Save \u2013 the result goes to WBU Sports, the control center, WBU Live and WBU Time.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Result</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>UD / SD / MD</td>\n<td>unanimous / split / majority decision</td>\n</tr>\n<tr>\n<td>KO / TKO</td>\n<td>with round and time</td>\n</tr>\n<tr>\n<td>RTD</td>\n<td>retired in the corner</td>\n</tr>\n<tr>\n<td>DQ</td>\n<td>disqualification</td>\n</tr>\n<tr>\n<td>TD</td>\n<td>technical decision</td>\n</tr>\n<tr>\n<td>W.O.</td>\n<td>walkover</td>\n</tr>\n<tr>\n<td>Draw, technical draw, no contest</td>\n<td>galas only</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"anl-6-5-closing\">6.5 Closing</h3>\n<p>\u201cNext fight\u201d leads to the next fight. At the end \u201cClose event &amp; create PDF\u201d \u2013 with double confirmation (\u201cYes, close\u201d and then \u201cClose finally &amp; send\u201d) so nothing is sent by mistake. A single fight can be reopened at any time; a closed event can also be continued with \u201cReopen event\u201d \u2013 when closing again, the results go to the WBU as a correction. The report contains every fight with result, scores, supervisor, referee, timekeeper, ringside doctor and judges. \u201cCopy as text\u201d gives a single result for forwarding.</p>\n<p>When closing, the results go to the WBU automatically: the office receives an e-mail with the PDF report (info@wbu-boxing.com), and all fights appear immediately on the public <strong>Results</strong> page (https://www.wbu-boxing.com/live/?resultate=1) \u2013 with title, weight class, names, winner, decision, round/time and the judges' points; for tournaments also the placings. Without internet it is resent automatically. If the supervisor logged in without the WBU password (e.g. with a tablet via Bluetooth), the scorecard asks for it once. If the event is reopened and closed again, the new state replaces the old one (e-mail marked \u201cCorrection\u201d).</p>\n<h3 id=\"anl-6-6-phone-off-battery-empty-app-or-browser-closed-it-continues\">6.6 Phone off, battery empty, app or browser closed \u2013 it continues</h3>\n<p>Everything is saved permanently on the phone after every input. After a restart (same phone, open the app or browser again) you are exactly where you left off without logging in again \u2013 \u201c\u2713 Continuing as before the restart \u2013 nothing lost\u201d briefly appears at the top.\n- <strong>Supervisor:</strong> fight card, all scorecards, results and the open fight remain; the connection to judges, WBU Sports and the live monitor restarts by itself.\n- <strong>Judge:</strong> the running fight remains with all rounds (including only \u201csaved\u201d, unsent ones) and the round currently set \u2013 no new PIN, no duplicate scorecard at the supervisor. Unsent rounds are sent with the next send.\n- The backup applies until \u201cLog out\u201d or at most 20 hours (i.e. only on the event day). Do not work in the browser's private/incognito mode \u2013 it deletes everything when closed.</p>\n<h2 id=\"anl-7-judges-scoring-with-the-scorecard\">7. Judges \u2013 scoring with the scorecard</h2>\n<p>Judges score every round in the 10-point system on their phone. They only need their name and the supervisor's PIN.</p>\n<h3 id=\"anl-7-1-log-in\">7.1 Log in</h3>\n<ul>\n<li>Browser: open <a target=\"_blank\" href=\"https://www.wbu-boxing.com/scorecard/,\">https://www.wbu-boxing.com/scorecard/,</a> tap \u201cJudge\u201d, enter first and last name and the PIN from the supervisor, \u201cLet's go\u201d. You go straight to the scorecard; a wrong PIN is rejected.</li>\n<li>App: turn on Bluetooth, choose \u201cJudge\u201d and the name \u2013 the app connects to the supervisor's phone, even without internet.</li>\n</ul>\n<p>The top shows \u201cConnected online\u201d with the name of the event. If no connection is made, scores are saved and sent automatically later.</p>\n<h3 id=\"anl-7-2-score-a-round\">7.2 Score a round</h3>\n<ol>\n<li>Tap the points for red and blue: the round winner 10, the other 9 (8 or fewer for a knockdown or clear superiority).</li>\n<li>Deductions for warnings: tap \u22121 to \u22124 under the corner; tapping again removes it.</li>\n<li>The total of the round appears at the bottom, e.g. 10 : 9.</li>\n<li>\u201cSend round\u201d sends the round to the supervisor immediately. \u201cSave round (without sending)\u201d only stores it \u2013 as the supervisor announces.</li>\n</ol>\n<h3 id=\"anl-7-3-correct-and-close\">7.3 Correct and close</h3>\n<ul>\n<li>Every round in the list below can be tapped and corrected.</li>\n<li>After the last round \u201cClose fight\u201d. \u201cCompleted \u2013 arrived at the supervisor\u201d appears with all rounds.</li>\n<li>\u201cFight ended early (KO / TKO / RTD \u2026)\u201d if the fight ends before the last round.</li>\n<li>\u201cNext fight\u201d starts an empty scorecard.</li>\n<li>Short messages can be sent to the supervisor via the chat (e.g. \u201cI have corrected it\u201d, \u201cPlease come over\u201d).</li>\n</ul>\n<h2 id=\"anl-8-referee-timekeeper-and-ringside-doctor\">8. Referee, timekeeper and ringside doctor</h2>\n<table>\n<thead>\n<tr>\n<th>Role</th>\n<th>Task in the system</th>\n<th>Where</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Referee</td>\n<td>entered by the supervisor per fight, stays for the next fights; does not operate anything himself</td>\n<td>supervisor's scorecard</td>\n</tr>\n<tr>\n<td>Timekeeper</td>\n<td>operates the round clock: START, STOP (timeout runs automatically), CONTINUE, restart round; signals come automatically</td>\n<td>control center or operator station at the ring</td>\n</tr>\n<tr>\n<td>Ringside doctor</td>\n<td>entered once before the start and applies to all fights; without him the clock does not start</td>\n<td>WBU Sports (event or control center) and scorecard</td>\n</tr>\n</tbody>\n</table>\n<p>All names appear in the result of each fight and in the supervisor's PDF report.</p>\n<h2 id=\"anl-9-spectators-wbu-live-live-monitor-results-and-world-ranking\">9. Spectators \u2013 WBU Live, live monitor, results and world ranking</h2>\n<p>WBU Live shows without login who is in the ring, who has to get ready, all results and the placings.</p>\n<ul>\n<li>On the phone: <a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/\">https://www.wbu-boxing.com/live/</a> \u2013 tap the event, with several rings choose the ring. Tabs: next fights, previous fights, placings.</li>\n<li>On the hall monitor: open the TV link from WBU Sports (fight list tab) in the browser of the TV or Fire TV. It shows all upcoming fights; green is in the ring, yellow has to get ready.</li>\n<li>Both update by themselves as long as the PC with WBU Sports is online.</li>\n</ul>\n<h3 id=\"anl-9-1-live-monitor-on-the-wbu-home-page\">9.1 Live monitor on the WBU home page</h3>\n<ul>\n<li>As soon as the <strong>supervisor</strong> has connected to the gala on the <strong>event day</strong> (scorecard logged in, fights still open; test logins on the days before do not count), a <strong>live monitor</strong> appears automatically on the WBU home page directly below the menu \u2013 without a menu item, without a click.</li>\n<li><strong>Left:</strong> the running fight \u2013 fight number, title fight, red and blue corner with gym and country, weight class, sport, rounds \u00d7 minutes. If timekeeping runs via WBU Time, round and time are shown large below (also break and timeout); with analogue timekeeping this is simply omitted. Below that the last result and the next fight.</li>\n<li><strong>Right:</strong> the whole fight card to scroll \u2013 finished fights with result and winner, the running fight marked yellow.</li>\n<li>Results appear as soon as the supervisor closes the fight. Points per round and names of the judges are not shown.</li>\n<li>If several galas run at the same time, several monitors appear one below the other.</li>\n<li>When all fights are finished, the monitor stays for another 30 minutes and then disappears. The results are then on the results page.</li>\n<li>Light background, black text, red and blue \u2013 like WBU Live and WBU Time. On the phone stacked, the fight card can be scrolled with the finger.</li>\n</ul>\n<p><strong>YouTube livestream:</strong> under \u201cEvent\u201d the promoter can enter a YouTube link \u2013 link to the video (e.g. youtube.com/live/\u2026) or to the channel (youtube.com/channel/UC\u2026, then whatever is live there plays automatically). As soon as the supervisor logs in, the video appears in 16:9 above the live monitor on the home page at the same width \u2013 only the plain picture, without comments and suggestions. Full screen via the icon at the bottom right of the video, on the phone simply rotate. The video starts muted (browsers require this) \u2013 tap the speaker once. Without a link there is only the live monitor.</p>\n<h3 id=\"anl-9-2-results\">9.2 Results</h3>\n<ul>\n<li><a target=\"_blank\" href=\"https://www.wbu-boxing.com/results/\">https://www.wbu-boxing.com/results/</a> \u2013 all results of WBU galas and tournaments, sent automatically by the supervisor, without login. Tournaments show the placings (1st, 2nd, 3rd).</li>\n<li>In 5 languages (EN, DE, ES, FR, RU), search by name, event or venue.</li>\n</ul>\n<h3 id=\"anl-9-3-wbu-world-ranking\">9.3 WBU world ranking</h3>\n<ul>\n<li><a target=\"_blank\" href=\"https://www.wbu-boxing.com/rankings/\">https://www.wbu-boxing.com/rankings/</a> \u2013 the top 15 according to BoxRec per pro weight class plus the WBU champions at their position (with crown), two columns, kg/lbs switchable, search, 5 languages.</li>\n</ul>\n<h2 id=\"anl-10-downloads-app-updates-and-working-without-internet\">10. Downloads, app updates and working without internet</h2>\n<p>WBU Sports comes in several forms. All work the same and look the same.</p>\n<table>\n<thead>\n<tr>\n<th>Version</th>\n<th>For whom</th>\n<th>Internet needed</th>\n<th>Download</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Browser version</td>\n<td>everyone: registration, WBU Sports, scorecard, WBU Live, WBU Time</td>\n<td>yes</td>\n<td>no installation \u2013 <a target=\"_blank\" href=\"https://www.wbu-boxing.com/anmeldung/\">https://www.wbu-boxing.com/anmeldung/</a></td>\n</tr>\n<tr>\n<td>WBU Sports for Windows (program)</td>\n<td>promoter and control center on the laptop, with Bluetooth, hall Wi-Fi and TV via HDMI</td>\n<td>no</td>\n<td><a target=\"_blank\" href=\"https://github.com/energyfighter/wbu-sc-download/raw/windows/WBU-Sports-Setup.exe\">https://github.com/energyfighter/wbu-sc-download/raw/windows/WBU-Sports-Setup.exe</a></td>\n</tr>\n<tr>\n<td>WBU Sports as tablet app (Android)</td>\n<td>promoter and control center at the ring, with TV via HDMI</td>\n<td>no (Bluetooth to the supervisor)</td>\n<td><a target=\"_blank\" href=\"https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-Sports.apk\">https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-Sports.apk</a></td>\n</tr>\n<tr>\n<td>Scorecard app for Android (phone and tablet)</td>\n<td>supervisor and judges</td>\n<td>no (Bluetooth)</td>\n<td><a target=\"_blank\" href=\"https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-SC.apk\">https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-SC.apk</a></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"anl-10-1-install-wbu-sports-for-windows\">10.1 Install WBU Sports for Windows</h3>\n<ol>\n<li>Download \u201cWBU-Sports-Setup.exe\u201d (about 10 MB) and double-click it. If Windows says \u201cWindows protected your PC\u201d: \u201cMore info\u201d \u2013 \u201cRun anyway\u201d.</li>\n<li>\u201cInstall\u201d \u2013 if the Microsoft .NET runtime is missing on the PC, the setup downloads it once by itself (Windows asks \u201cYes\u201d once).</li>\n<li>\u201cWBU Sports\u201d appears on the desktop. The program opens in its own window \u2013 without login. The data stays on the laptop, also with updates.</li>\n<li><strong>Supervisor via Bluetooth:</strong> turn on Bluetooth on the laptop. In the control center \u201c\ud83d\udcf6 Start Bluetooth\u201d. On the supervisor's phone log in to the scorecard app as usual without choosing a show \u2013 nothing else to choose. The laptop finds the phone by itself, sends the fight list and receives the results.</li>\n<li><strong>TV via HDMI:</strong> connect the TV, press Windows key + P and choose \u201cExtend\u201d. In the control center \u201c\u23f1 WBU Time\u201d or \u201c\ud83d\udccb Fight list\u201d \u2013 the display appears full screen on the TV.</li>\n<li><strong>Hall Wi-Fi:</strong> see 10.3.</li>\n</ol>\n<p>An event from the browser gets into the program with \u201cSave backup (.json)\u201d and \u201cRestore saved backup\u201d.</p>\n<h3 id=\"anl-10-1a-create-an-event-windows-program-and-tablet-app\">10.1a Create an event (Windows program and tablet app)</h3>\n<ul>\n<li>Preparation works without internet: name, date, venue, fight card or categories and participants.</li>\n<li>An event can only be <strong>used</strong> once it has been <strong>created</strong>: press \u201c\u2705 Create event\u201d at the top \u2013 this needs <strong>internet</strong> once and the <strong>promoter password</strong> (the promoter gets it from the WBU). The WBU automatically receives an info e-mail.</li>\n<li>Before that, control center, fight list, brackets, results, certificates, accreditation, printing, TV and supervisor connection are <strong>locked (\ud83d\udd12)</strong>. Without internet the note \u201cPlease connect to the internet\u201d appears.</li>\n<li>After that everything also works without internet. In the browser (with a WBU Sports account) this lock does not exist.</li>\n</ul>\n<h3 id=\"anl-10-2-wbu-sports-as-tablet-app-android\">10.2 WBU Sports as tablet app (Android)</h3>\n<p>The tablet app is WBU Sports to take along: everything on the tablet, at the ring also without internet.</p>\n<ol>\n<li>Download the APK file \u201cWBU-Sports.apk\u201d on the tablet and tap it, once \u201cAllow apps from this source\u201d, then \u201cInstall\u201d.</li>\n<li>Get the event onto the tablet: either create it directly on the tablet (with internet, online registration and going live work as in the browser) or on the PC \u201cSave backup (.json)\u201d, send the file to the tablet (e.g. by e-mail or USB) and in the app \u201cRestore saved backup\u201d.</li>\n<li><strong>Supervisor via Bluetooth:</strong> in the control center tap \u201c\ud83d\udcf6 Start Bluetooth\u201d. On the supervisor's phone log in to the scorecard app as usual without choosing a show \u2013 the app finds the tablet by itself. The fight list with names, title and rounds comes from the tablet, the confirmed results go back to the tablet automatically. The judges connect to the supervisor's phone as always.</li>\n<li><strong>TV via cable:</strong> connect the tablet to the TV with a USB-C to HDMI adapter. The control center shows \u201c\ud83d\udcfa TV (HDMI) \u2013 connected\u201d: \u201c\u23f1 WBU Time\u201d shows the round clock on the TV, \u201c\ud83d\udccb Fight list\u201d the next fights. On the tablet you continue to operate the control center.</li>\n<li><strong>Printing:</strong> fight list, brackets, certificates and accreditation cards go via the Android print dialog to a Wi-Fi printer or as PDF.</li>\n<li><strong>Backup:</strong> \u201cSave backup (.json)\u201d puts the file into the tablet's \u201cDownload\u201d folder.</li>\n</ol>\n<p>With internet the tablet app additionally works exactly like the browser version (online registration, payments, going live, WBU Live and WBU Time over the network).</p>\n<h3 id=\"anl-10-3-hall-wi-fi-any-number-of-tvs-without-internet-and-without-cables\">10.3 Hall Wi-Fi: any number of TVs without internet and without cables</h3>\n<p>The tablet app and the Windows program can open their own Wi-Fi. All TVs (e.g. Fire TV) and phones that connect to it show WBU Live and WBU Time \u2013 for each ring \u2013 completely without internet.</p>\n<ol>\n<li>In the control center tap \u201c\ud83d\udce1 Start hall Wi-Fi\u201d.</li>\n<li>Wi-Fi name and password appear (laptop: \u201cWBU-Halle\u201d / \u201cwbuboxing\u201d; tablet: set by the tablet) as well as the addresses.</li>\n<li>Connect the TV to the Wi-Fi and open the shown address in the browser (Fire TV: Silk):</li>\n<li>WBU Time for ring 1, ring 2 \u2026 (a separate address per ring),</li>\n<li>fight list for the hall monitor,</li>\n<li>WBU Live for phones.</li>\n<li>On the laptop the Windows firewall asks the first time: \u201cAllow access\u201d (tick private and public networks).</li>\n</ol>\n<p>If no own Wi-Fi can be started (some devices block it), the same addresses also work via an existing Wi-Fi router or a phone hotspot to which tablet/laptop and TV are connected. With internet, WBU Live and WBU Time continue to run additionally via www.wbu-boxing.com.</p>\n<h3 id=\"anl-10-4-install-the-scorecard-app-for-android\">10.4 Install the scorecard app for Android</h3>\n<ol>\n<li>Download the APK file on the phone or tablet and tap it.</li>\n<li>Allow \u201cAllow apps from this source\u201d once, then \u201cInstall\u201d.</li>\n<li>Turn on Bluetooth and location.</li>\n</ol>\n<p>Supervisor and judges connect directly to each other via Bluetooth \u2013 without internet and without Wi-Fi in the hall. The app only needs internet if an event is to be taken over from WBU Sports and the results sent there; if it drops briefly, the results are resent automatically.</p>\n<h3 id=\"anl-10-5-updates\">10.5 Updates</h3>\n<ul>\n<li>Browser version: always up to date automatically. If a page still shows the old version, press Ctrl + F5.</li>\n<li>Android apps (scorecard and WBU Sports tablet): check at every start whether there is a new version. Then a note with \u201cInstall update\u201d appears \u2013 tap it, the update downloads and installs itself. No app store needed. If Android cancels the first attempt (some phones check the app with Play Protect first), the app silently starts the installation again \u2013 no error message appears (from version 1.145).</li>\n<li>Windows program: shows \u201cNew version\u201d at start (with internet) \u2013 tap \u201cInstall update\u201d: it downloads, installs itself and restarts after a few seconds. The data is kept.</li>\n</ul>\n<p><strong>Xiaomi phones (Mi Protect):</strong> During updates Xiaomi shows \u201cRisky app \u2013 risky installation source\u201d. The phone does this for every app not from an app store \u2013 the WBU app is safe. Just tap <strong>\u201cSkip\u201d</strong>, then <strong>\u201cUpdate\u201d</strong>. To switch it off for good: Settings \u2192 Apps \u2192 App installer (\u2699) \u2192 turn off \u201cSecurity check\u201d/\u201cMi Protect\u201d.</p>\n<h2 id=\"anl-11-frequent-questions-and-problems\">11. Frequent questions and problems</h2>\n<table>\n<thead>\n<tr>\n<th>Problem</th>\n<th>Solution</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>WBU Sports shows \u201cPlease log in first\u201d</td>\n<td>log in on the registration page; with the wrong role tap \u201cContinue as promoter\u201d</td>\n</tr>\n<tr>\n<td>Page still shows the old version</td>\n<td>press Ctrl + F5</td>\n</tr>\n<tr>\n<td>Clock does not start</td>\n<td>enter the ringside doctor in the control center</td>\n</tr>\n<tr>\n<td>Judge cannot get in</td>\n<td>ask the supervisor for the PIN; the supervisor must be logged in first</td>\n</tr>\n<tr>\n<td>Event missing in the scorecard</td>\n<td>in WBU Sports \u201cGo live\u201d; the PC with WBU Sports must be online</td>\n</tr>\n<tr>\n<td>WBU Live or WBU Time is frozen</td>\n<td>check the internet on the PC with WBU Sports; keep a phone hotspot as backup \u2013 or work without internet with the Windows version and the app (chapter 10)</td>\n</tr>\n<tr>\n<td>No sound on the TV</td>\n<td>tap \u201cMute \u2013 turn sound on\u201d once</td>\n</tr>\n<tr>\n<td>Browser fills the password into the wrong field</td>\n<td>clear the field; delete the saved entry via the key icon in the address bar</td>\n</tr>\n<tr>\n<td>New PC, event missing</td>\n<td>\u201cRestore saved backup\u201d with the .json backup</td>\n</tr>\n<tr>\n<td>Certificate without gold or flag</td>\n<td>tick background graphics when printing</td>\n</tr>\n</tbody>\n</table>\n<p>Questions to the WBU: dm@wbu-boxing.com \u00b7 www.wbu-boxing.com</p>", "es": "<p>WBU Sports es el sistema de la World Boxing Union para torneos y galas profesionales: desde la inscripci\u00f3n en l\u00ednea, pasando por el d\u00eda de combate, hasta el diploma. Todo funciona en el navegador en www.wbu-boxing.com \u2013 tambi\u00e9n la tarjeta de puntuaci\u00f3n. Adem\u00e1s existe la tarjeta como app Android, WBU Sports como app para tableta Android y WBU Sports como versi\u00f3n para Windows \u2013 las tres funcionan tambi\u00e9n sin internet.</p>\n<p><strong>Idioma:</strong> la tarjeta, WBU Sports, la p\u00e1gina de inscripci\u00f3n y WBU Live est\u00e1n disponibles en alem\u00e1n, ingl\u00e9s, espa\u00f1ol, franc\u00e9s y ruso. El idioma se ajusta autom\u00e1ticamente seg\u00fan el navegador o el m\u00f3vil; con el bot\u00f3n <strong>\ud83c\udf10</strong> de arriba se cambia en cualquier momento. Informes, diplomas, facturas y acreditaciones se imprimen en el idioma elegido.</p>\n<h2 id=\"anl-resumen\">Resumen</h2>\n<table>\n<thead>\n<tr>\n<th>M\u00f3dulo</th>\n<th>Qui\u00e9n lo usa</th>\n<th>Direcci\u00f3n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>P\u00e1gina de inscripci\u00f3n</td>\n<td>clubes, entrenadores, deportistas individuales, organizadores</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/anmeldung/\">https://www.wbu-boxing.com/anmeldung/</a></td>\n</tr>\n<tr>\n<td>WBU Sports (organizador)</td>\n<td>organizadores, centro de control</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/veranstalter/\">https://www.wbu-boxing.com/veranstalter/</a></td>\n</tr>\n<tr>\n<td>Tarjeta de puntuaci\u00f3n</td>\n<td>supervisor, jueces</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/scorecard/\">https://www.wbu-boxing.com/scorecard/</a></td>\n</tr>\n<tr>\n<td>WBU Live</td>\n<td>p\u00fablico (m\u00f3vil, monitor del pabell\u00f3n)</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/\">https://www.wbu-boxing.com/live/</a></td>\n</tr>\n<tr>\n<td>WBU Time</td>\n<td>cronometrador, televisor en el ring</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1\">https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1</a></td>\n</tr>\n<tr>\n<td>Monitor en vivo en la p\u00e1gina de inicio</td>\n<td>todos los visitantes de la web WBU, aparece solo durante galas en curso</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/\">https://www.wbu-boxing.com/</a></td>\n</tr>\n<tr>\n<td>Resultados</td>\n<td>todos</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/results/\">https://www.wbu-boxing.com/results/</a></td>\n</tr>\n<tr>\n<td>Ranking mundial WBU</td>\n<td>todos</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/rankings/\">https://www.wbu-boxing.com/rankings/</a></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"anl-torneo-o-gala-profesional-la-diferencia\">Torneo o gala profesional \u2013 la diferencia</h3>\n<p>Al crear el evento, el organizador elige si ser\u00e1 un torneo o una gala profesional. Despu\u00e9s no se puede cambiar.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Torneo</th>\n<th>Gala profesional</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Qu\u00e9</td>\n<td>muchos deportistas, sorteados por categor\u00edas</td>\n<td>velada, combate a combate</td>\n</tr>\n<tr>\n<td>Inscripci\u00f3n</td>\n<td>en l\u00ednea por clubes, entrenadores, deportistas individuales</td>\n<td>ninguna \u2013 el organizador introduce los combates</td>\n</tr>\n<tr>\n<td>Estructura</td>\n<td>categor\u00edas, cuadros (eliminatoria), lista de combates</td>\n<td>cartelera</td>\n</tr>\n<tr>\n<td>Rings</td>\n<td>de 1 a 10 rings o \u00e1reas de combate</td>\n<td>1 ring</td>\n</tr>\n<tr>\n<td>Resultado</td>\n<td>siempre debe haber un ganador</td>\n<td>tambi\u00e9n empate o no contest</td>\n</tr>\n<tr>\n<td>Diplomas, acreditaci\u00f3n</td>\n<td>s\u00ed</td>\n<td>\u2013</td>\n</tr>\n<tr>\n<td>Cap\u00edtulo</td>\n<td>2</td>\n<td>3</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"anl-1-clubes-entrenadores-y-deportistas-individuales\">1. Clubes, entrenadores y deportistas individuales</h2>\n<p>Quien inscribe deportistas necesita una cuenta en la p\u00e1gina de inscripci\u00f3n. La cuenta vale para todos los torneos WBU.</p>\n<h3 id=\"anl-1-1-crear-una-cuenta\">1.1 Crear una cuenta</h3>\n<ol>\n<li>Abrir <a target=\"_blank\" href=\"https://www.wbu-boxing.com/anmeldung/\">https://www.wbu-boxing.com/anmeldung/</a> (en el men\u00fa de la web WBU: WBU Sports).</li>\n<li>Tocar \u00abRegistrarse\u00bb.</li>\n<li>En \u00abSoy\u00bb elegir el rol: club/gimnasio, entrenador, deportista individual u organizador.</li>\n<li>Introducir club, nombre y apellido, tel\u00e9fono, e-mail y una contrase\u00f1a (m\u00ednimo 6 caracteres).</li>\n<li>Tocar \u00abCrear cuenta\u00bb. A partir de ahora se entra con e-mail y contrase\u00f1a.</li>\n</ol>\n<p>La sesi\u00f3n vale en todas las pesta\u00f1as y termina al cerrar el navegador o al tocar \u00abCerrar sesi\u00f3n\u00bb. El rol se cambia arriba a la derecha en \u00abCambiar rol\u00bb. \u00bfOlvidaste la contrase\u00f1a? Toca \u00ab\u00bfOlvidaste la contrase\u00f1a?\u00bb, llega un c\u00f3digo por e-mail.</p>\n<h3 id=\"anl-1-2-abrir-un-torneo\">1.2 Abrir un torneo</h3>\n<p>Cada torneo tiene una p\u00e1gina informativa p\u00fablica con fecha, lugar, cuota, cierre de inscripci\u00f3n y la convocatoria para leer \u2013 tambi\u00e9n sin iniciar sesi\u00f3n. Tras iniciar sesi\u00f3n, tocar el torneo en la lista. Arriba est\u00e1n las pesta\u00f1as: Inscripci\u00f3n, Mis inscripciones y pago, Participantes, Categor\u00edas, Clubes y entrenadores.</p>\n<h3 id=\"anl-1-3-inscribir-deportistas\">1.3 Inscribir deportistas</h3>\n<ol>\n<li>Pesta\u00f1a \u00abInscripci\u00f3n\u00bb.</li>\n<li>Elegir el deporte (boxeo Semi-Pro, kickboxing K1, boxeo m\u00e1ster, Shadow Boxing Battle).</li>\n<li>Introducir nombre, apellido, fecha de nacimiento, sexo y peso. La categor\u00eda resulta autom\u00e1ticamente de la edad el d\u00eda del torneo, el sexo y el peso.</li>\n<li>Introducir club, pa\u00eds, entrenador y e-mail.</li>\n<li>Elegir foto (opcional). Se abre la ventana \u00abSeleccionar cabeza\u00bb: mover el marco rojo sobre la cabeza, ajustar el tama\u00f1o con el control, \u00abAplicar\u00bb. La cabeza aparece despu\u00e9s en la acreditaci\u00f3n.</li>\n<li>Subir documentos si ya est\u00e1n (ver 1.4) \u2013 tambi\u00e9n se pueden entregar m\u00e1s tarde.</li>\n<li>\u00abA\u00f1adir\u00bb. El deportista aparece enseguida en la lista de participantes y en la cesta. Para m\u00e1s deportistas \u00ab+ A\u00f1adir otro deportista\u00bb.</li>\n</ol>\n<h3 id=\"anl-1-4-documentos\">1.4 Documentos</h3>\n<table>\n<thead>\n<tr>\n<th>Documento</th>\n<th>Qui\u00e9n lo necesita</th>\n<th>Nota</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Declaraci\u00f3n de participaci\u00f3n y exenci\u00f3n de responsabilidad</td>\n<td>todos los deportistas</td>\n<td>descargar el formulario, imprimir, firmar, subir como foto o PDF</td>\n</tr>\n<tr>\n<td>Firma de los padres</td>\n<td>deportistas menores de 18</td>\n<td>en la misma declaraci\u00f3n de participaci\u00f3n</td>\n</tr>\n<tr>\n<td>Certificado m\u00e9dico deportivo</td>\n<td>seg\u00fan la convocatoria (p. ej. Semi-Pro)</td>\n<td>debe ser del a\u00f1o del evento; introducir la fecha de emisi\u00f3n</td>\n</tr>\n</tbody>\n</table>\n<p>Si falta algo, aparece marcado en rojo en \u00abMis inscripciones y pago\u00bb y se puede subir all\u00ed. Tras el cierre de inscripci\u00f3n llega un recordatorio con 3 d\u00edas de plazo extra; despu\u00e9s se elimina al deportista.</p>\n<h3 id=\"anl-1-5-pagar\">1.5 Pagar</h3>\n<ol>\n<li>Pesta\u00f1a \u00abMis inscripciones y pago\u00bb.</li>\n<li>\u00abListo \u2013 pagar ahora\u00bb. Con ello el total queda fijado y aparece un c\u00f3digo de pago.</li>\n<li>Transferir el importe, como concepto solo el c\u00f3digo de pago.</li>\n<li>En cuanto el organizador haya asignado el pago, aparece \u00abPagado \u2013 inscripci\u00f3n confirmada\u00bb.</li>\n</ol>\n<p>Quien no haya pagado todo al cierre recibe un recordatorio con un breve plazo extra; despu\u00e9s se eliminan los deportistas. La factura est\u00e1 disponible en PDF el d\u00eda despu\u00e9s del evento.</p>\n<h3 id=\"anl-1-6-inscribir-entrenadores-y-asistentes\">1.6 Inscribir entrenadores y asistentes</h3>\n<p>En \u00abMis inscripciones y pago\u00bb, en la secci\u00f3n \u00abEntrenadores y asistentes (acreditaci\u00f3n)\u00bb. Cada persona inscrita recibe una acreditaci\u00f3n con entrada gratuita.</p>\n<table>\n<thead>\n<tr>\n<th>Deportistas inscritos</th>\n<th>Entrenadores gratis</th>\n<th>Asistentes gratis</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0</td>\n<td>0</td>\n<td>0</td>\n</tr>\n<tr>\n<td>1 a 5</td>\n<td>1</td>\n<td>2</td>\n</tr>\n<tr>\n<td>6 o m\u00e1s</td>\n<td>1</td>\n<td>4</td>\n</tr>\n</tbody>\n</table>\n<ol>\n<li>Introducir nombre y apellido, elegir el rol (solo se ofrecen roles con plazas libres).</li>\n<li>Elegir foto (opcional) y seleccionar la cabeza.</li>\n<li>\u00ab+ A\u00f1adir\u00bb. Quitar con \u00abquitar\u00bb.</li>\n</ol>\n<p>Los asistentes no inscritos cuentan como p\u00fablico y pagan entrada. Los deportistas individuales inscriben a su entrenador y asistentes del mismo modo.</p>\n<h2 id=\"anl-2-organizador-crear-un-torneo\">2. Organizador \u2013 crear un torneo</h2>\n<p>Un torneo se crea en WBU Sports, se abre a la inscripci\u00f3n en l\u00ednea y el d\u00eda de combate se controla desde el centro de control.</p>\n<h3 id=\"anl-2-1-iniciar-sesi-n\">2.1 Iniciar sesi\u00f3n</h3>\n<ol>\n<li>Iniciar sesi\u00f3n en la p\u00e1gina de inscripci\u00f3n con una cuenta con el rol \u00abOrganizador\u00bb \u2013 se entra directamente en WBU Sports.</li>\n<li>Si la cuenta a\u00fan es \u00abEntrenador\u00bb o \u00abClub\u00bb: en WBU Sports tocar \u00abSeguir como organizador\u00bb o arriba \u00abCambiar rol\u00bb.</li>\n</ol>\n<p>Importante: los eventos se guardan en el servidor (en el navegador con cuenta WBU Sports). Cada cambio se guarda autom\u00e1ticamente y aparece en cualquier dispositivo en el que inicies sesi\u00f3n \u2013 PC, port\u00e1til o tableta. \u00abGuardar copia (.json)\u00bb sigue como copia adicional.</p>\n<h3 id=\"anl-2-2-crear-un-evento\">2.2 Crear un evento</h3>\n<ol>\n<li>En la p\u00e1gina de inicio elegir \u00abTorneo\u00bb (para una gala ver el cap\u00edtulo 3).</li>\n<li>Rellenar la pesta\u00f1a \u00abEvento\u00bb: nombre, promotor, lugar/pabell\u00f3n, fecha. Supervisor y cronometrador no los introduce el organizador \u2013 lo hace el supervisor en su tarjeta; los nombres aparecen luego en el resultado y en el informe PDF.</li>\n<li>M\u00e9dico de ring: se puede introducir ya \u2013 si no, el d\u00eda de combate en el centro de control. Sin m\u00e9dico de ring el reloj no arranca.</li>\n<li>Elegir el n\u00famero de rings o \u00e1reas de combate (1\u201310) y la denominaci\u00f3n \u00abRing\u00bb o \u00ab\u00c1rea de combate\u00bb.</li>\n<li>Ajustar la tolerancia de peso en el pesaje (p. ej. 4 kg seg\u00fan la convocatoria).</li>\n</ol>\n<h3 id=\"anl-2-3-abrir-la-inscripci-n-en-l-nea\">2.3 Abrir la inscripci\u00f3n en l\u00ednea</h3>\n<ol>\n<li>Pesta\u00f1a \u00abInscripci\u00f3n en l\u00ednea\u00bb.</li>\n<li>Tocar los deportes ofrecidos.</li>\n<li>Introducir cierre de inscripci\u00f3n, cuota para la 1.\u00aa participaci\u00f3n y para cada participaci\u00f3n adicional, plazo extra (d\u00edas).</li>\n<li>Certificado m\u00e9dico deportivo: exigir o no.</li>\n<li>Introducir titular de la cuenta, IBAN, BIC y avisos para los deportistas.</li>\n<li>Publicar (se necesita la contrase\u00f1a WBU). Despu\u00e9s subir convocatoria, programa, cartel y formularios.</li>\n</ol>\n<p>Arriba, una barra negra muestra las cifras: participantes inscritos, participaciones, clubes, cuentas registradas, pagos pendientes, documentos que faltan. \u00abVer participantes, categor\u00edas con fotos, clubes\u00bb abre la p\u00e1gina de inscripci\u00f3n en la vista de organizador \u2013 sin cuenta propia.</p>\n<h3 id=\"anl-2-4-asignar-pagos\">2.4 Asignar pagos</h3>\n<p>En la pesta\u00f1a \u00abInscripci\u00f3n en l\u00ednea\u00bb cargar el extracto bancario (PDF o CSV del banco). El sistema busca los c\u00f3digos de pago y asigna los importes. El extracto solo se lee en el propio navegador y no se sube. Los pagos individuales tambi\u00e9n se pueden confirmar o deshacer a mano.</p>\n<h3 id=\"anl-2-5-categor-as-y-participantes\">2.5 Categor\u00edas y participantes</h3>\n<ul>\n<li>Los deportistas inscritos en l\u00ednea van autom\
