0 \u0431\u0443\u043c\u0430\u0433\u0435\u00bb. \u0415\u0441\u043b\u0438 \u043e\u043d \u0432\u043a\u043b\u044e\u0447\u0451\u043d, \u043f\u043e\u0434 \u0434\u0430\u043d\u043d\u044b\u043c\u0438 \u0431\u043e\u044f \u043f\u043e\u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f <strong>\u00ab\u270d\ufe0f \u0411\u0443\u043c\u0430\u0436\u043d\u044b\u0435 \u043e\u0446\u0435\u043d\u043a\u0438\u00bb</strong>: \u0432\u0432\u0435\u0441\u0442\u0438 \u0438\u043c\u0435\u043d\u0430 \u0441\u0443\u0434\u0435\u0439 (\u043e\u043d\u0438 \u043e\u0441\u0442\u0430\u044e\u0442\u0441\u044f \u0434\u043b\u044f \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0445 \u0431\u043e\u0451\u0432; \u0441\u043e\u0445\u0440\u0430\u043d\u0451\u043d\u043d\u044b\u0435 \u0438\u043c\u0435\u043d\u0430 \u043c\u043e\u0436\u043d\u043e \u043d\u0430\u0436\u0430\u0442\u044c), \u0437\u0430\u0442\u0435\u043c \u043d\u0430\u0436\u0438\u043c\u0430\u0442\u044c \u043a\u0430\u0436\u0434\u043e\u0435 \u043f\u043e\u043b\u0435 \u0438 \u0432\u044b\u0431\u0438\u0440\u0430\u0442\u044c \u043e\u0446\u0435\u043d\u043a\u0443 \u0441 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438 \u2013 10:9, 10:10, 9:10, 10:8, 8:10 \u0438\u043b\u0438 \u00ab\u0435\u0449\u0451\u2026\u00bb \u0434\u043b\u044f \u0441\u0432\u043e\u0438\u0445 \u043e\u0447\u043a\u043e\u0432 \u0438 \u0441\u043d\u044f\u0442\u0438\u0439. \u041f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0441\u0447\u0438\u0442\u0430\u0435\u0442 \u0441\u0443\u043c\u043c\u044b; \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u0444\u0438\u043a\u0441\u0438\u0440\u0443\u0435\u0442\u0441\u044f \u00ab\u043f\u043e \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430\u043c\u00bb \u0438 \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0430\u0435\u0442\u0441\u044f \u043a\u0430\u043a \u043e\u0431\u044b\u0447\u043d\u043e. \u0414\u043e\u0441\u0442\u0430\u0442\u043e\u0447\u043d\u043e \u043e\u0434\u043d\u043e\u0433\u043e \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0430.</p>\n<h3 id=\"anl-6-4\">6.4 \u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u044c \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442</h3>\n<ol>\n<li>\u0412\u044b\u0431\u0440\u0430\u0442\u044c \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442. \u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u043f\u0440\u0435\u0434\u043b\u0430\u0433\u0430\u0435\u0442 \u0440\u0435\u0448\u0435\u043d\u0438\u0435 \u043f\u043e \u043e\u0446\u0435\u043d\u043a\u0430\u043c.</li>\n<li>\u041d\u0430\u0436\u0430\u0442\u044c \u043f\u043e\u0431\u0435\u0434\u0438\u0442\u0435\u043b\u044f.</li>\n<li>\u041f\u0440\u0438 KO, TKO, RTD (\u043e\u0442\u043a\u0430\u0437 \u0432 \u0443\u0433\u043b\u0443), \u0434\u0438\u0441\u043a\u0432\u0430\u043b\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0438 \u0438 \u0442\u0435\u0445\u043d\u0438\u0447\u0435\u0441\u043a\u043e\u043c \u0440\u0435\u0448\u0435\u043d\u0438\u0438 \u0434\u043e\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u043b\u044c\u043d\u043e \u0443\u043a\u0430\u0437\u0430\u0442\u044c \u0440\u0430\u0443\u043d\u0434 \u0438 \u0432\u0440\u0435\u043c\u044f, \u043d\u0430\u043f\u0440. \u0440\u0430\u0443\u043d\u0434 3, 1:25.</li>\n<li>\u0421\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u2013 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u0443\u0445\u043e\u0434\u0438\u0442 \u0432 WBU Sports, \u043d\u0430 \u043f\u0443\u043b\u044c\u0442, \u0432 WBU Live \u0438 WBU Time.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>\u0420\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442</th>\n<th>\u0417\u043d\u0430\u0447\u0435\u043d\u0438\u0435</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>UD / SD / MD</td>\n<td>\u0440\u0435\u0448\u0435\u043d\u0438\u0435 \u0435\u0434\u0438\u043d\u043e\u0433\u043b\u0430\u0441\u043d\u043e\u0435 / \u0440\u0430\u0437\u0434\u0435\u043b\u044c\u043d\u043e\u0435 / \u0431\u043e\u043b\u044c\u0448\u0438\u043d\u0441\u0442\u0432\u043e\u043c</td>\n</tr>\n<tr>\n<td>KO / TKO</td>\n<td>\u0441 \u0440\u0430\u0443\u043d\u0434\u043e\u043c \u0438 \u0432\u0440\u0435\u043c\u0435\u043d\u0435\u043c</td>\n</tr>\n<tr>\n<td>RTD</td>\n<td>\u043e\u0442\u043a\u0430\u0437 \u0432 \u0443\u0433\u043b\u0443</td>\n</tr>\n<tr>\n<td>DQ</td>\n<td>\u0434\u0438\u0441\u043a\u0432\u0430\u043b\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u044f</td>\n</tr>\n<tr>\n<td>TD</td>\n<td>\u0442\u0435\u0445\u043d\u0438\u0447\u0435\u0441\u043a\u043e\u0435 \u0440\u0435\u0448\u0435\u043d\u0438\u0435</td>\n</tr>\n<tr>\n<td>W.O.</td>\n<td>\u0431\u0435\u0437 \u0431\u043e\u044f</td>\n</tr>\n<tr>\n<td>\u041d\u0438\u0447\u044c\u044f, \u0442\u0435\u0445\u043d\u0438\u0447. \u043d\u0438\u0447\u044c\u044f, No Contest</td>\n<td>\u0442\u043e\u043b\u044c\u043a\u043e \u043d\u0430 \u0433\u0430\u043b\u0430</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"anl-6-5\">6.5 \u0417\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u0438\u0435</h3>\n<p>\u00ab\u0421\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0431\u043e\u0439\u00bb \u0432\u0435\u0434\u0451\u0442 \u043a \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u043c\u0443 \u0431\u043e\u044e. \u0412 \u043a\u043e\u043d\u0446\u0435 \u00ab\u0417\u0430\u0432\u0435\u0440\u0448\u0438\u0442\u044c \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435 \u0438 \u0441\u043e\u0437\u0434\u0430\u0442\u044c PDF\u00bb \u2013 \u0441 \u0434\u0432\u043e\u0439\u043d\u044b\u043c \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u0438\u0435\u043c (\u00ab\u0414\u0430, \u0437\u0430\u0432\u0435\u0440\u0448\u0438\u0442\u044c\u00bb, \u0437\u0430\u0442\u0435\u043c \u00ab\u041e\u043a\u043e\u043d\u0447\u0430\u0442\u0435\u043b\u044c\u043d\u043e \u0437\u0430\u0432\u0435\u0440\u0448\u0438\u0442\u044c \u0438 \u043e\u0442\u043f\u0440\u0430\u0432\u0438\u0442\u044c\u00bb), \u0447\u0442\u043e\u0431\u044b \u043d\u0438\u0447\u0435\u0433\u043e \u043d\u0435 \u0443\u0448\u043b\u043e \u0441\u043b\u0443\u0447\u0430\u0439\u043d\u043e. \u041e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u0439 \u0431\u043e\u0439 \u043c\u043e\u0436\u043d\u043e \u0432 \u043b\u044e\u0431\u043e\u0439 \u043c\u043e\u043c\u0435\u043d\u0442 \u043e\u0442\u043a\u0440\u044b\u0442\u044c \u0441\u043d\u043e\u0432\u0430; \u0437\u0430\u0432\u0435\u0440\u0448\u0451\u043d\u043d\u043e\u0435 \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435 \u043c\u043e\u0436\u043d\u043e \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0438\u0442\u044c \u043a\u043d\u043e\u043f\u043a\u043e\u0439 \u00ab\u0421\u043d\u043e\u0432\u0430 \u043e\u0442\u043a\u0440\u044b\u0442\u044c \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435\u00bb \u2013 \u043f\u0440\u0438 \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u043e\u043c \u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u0438\u0438 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b \u0443\u0445\u043e\u0434\u044f\u0442 \u0432 WBU \u043a\u0430\u043a \u0438\u0441\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435. \u041e\u0442\u0447\u0451\u0442 \u0441\u043e\u0434\u0435\u0440\u0436\u0438\u0442 \u043a\u0430\u0436\u0434\u044b\u0439 \u0431\u043e\u0439 \u0441 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u043e\u043c, \u043e\u0446\u0435\u043d\u043a\u0430\u043c\u0438, \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u043e\u043c, \u0440\u0435\u0444\u0435\u0440\u0438, \u0445\u0440\u043e\u043d\u043e\u043c\u0435\u0442\u0440\u0438\u0441\u0442\u043e\u043c, \u0432\u0440\u0430\u0447\u043e\u043c \u0440\u0438\u043d\u0433\u0430 \u0438 \u0441\u0443\u0434\u044c\u044f\u043c\u0438. \u00ab\u041a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u043a\u0430\u043a \u0442\u0435\u043a\u0441\u0442\u00bb \u0434\u0430\u0451\u0442 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u0439 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u0434\u043b\u044f \u043f\u0435\u0440\u0435\u0441\u044b\u043b\u043a\u0438.</p>\n<p>\u041f\u0440\u0438 \u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u0438\u0438 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0443\u0445\u043e\u0434\u044f\u0442 \u0432 WBU: \u043e\u0444\u0438\u0441 \u043f\u043e\u043b\u0443\u0447\u0430\u0435\u0442 \u043f\u0438\u0441\u044c\u043c\u043e \u0441 PDF-\u043e\u0442\u0447\u0451\u0442\u043e\u043c (info@wbu-boxing.com), \u0430 \u0432\u0441\u0435 \u0431\u043e\u0438 \u0441\u0440\u0430\u0437\u0443 \u043f\u043e\u044f\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u043d\u0430 \u043f\u0443\u0431\u043b\u0438\u0447\u043d\u043e\u0439 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0435 <strong>\u0420\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b</strong> (https://www.wbu-boxing.com/live/?resultate=1) \u2013 \u0441 \u0442\u0438\u0442\u0443\u043b\u043e\u043c, \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0435\u0439, \u0438\u043c\u0435\u043d\u0430\u043c\u0438, \u043f\u043e\u0431\u0435\u0434\u0438\u0442\u0435\u043b\u0435\u043c, \u0440\u0435\u0448\u0435\u043d\u0438\u0435\u043c, \u0440\u0430\u0443\u043d\u0434\u043e\u043c/\u0432\u0440\u0435\u043c\u0435\u043d\u0435\u043c \u0438 \u043e\u0447\u043a\u0430\u043c\u0438 \u0441\u0443\u0434\u0435\u0439; \u043d\u0430 \u0442\u0443\u0440\u043d\u0438\u0440\u0430\u0445 \u0435\u0449\u0451 \u0438 \u043c\u0435\u0441\u0442\u0430. \u0411\u0435\u0437 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0430 \u043e\u0442\u043f\u0440\u0430\u0432\u043a\u0430 \u043f\u043e\u0432\u0442\u043e\u0440\u0438\u0442\u0441\u044f \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438. \u0415\u0441\u043b\u0438 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440 \u0432\u043e\u0448\u0451\u043b \u0431\u0435\u0437 \u043f\u0430\u0440\u043e\u043b\u044f WBU (\u043d\u0430\u043f\u0440. \u0441 \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u043e\u043c \u043f\u043e Bluetooth), \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430 \u043e\u0434\u0438\u043d \u0440\u0430\u0437 \u0441\u043f\u0440\u043e\u0441\u0438\u0442 \u0435\u0433\u043e. \u0415\u0441\u043b\u0438 \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435 \u0441\u043d\u043e\u0432\u0430 \u043e\u0442\u043a\u0440\u044b\u0442\u043e \u0438 \u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u043e, \u043d\u043e\u0432\u043e\u0435 \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u0435 \u0437\u0430\u043c\u0435\u043d\u044f\u0435\u0442 \u0441\u0442\u0430\u0440\u043e\u0435 (\u043f\u0438\u0441\u044c\u043c\u043e \u0441 \u043f\u043e\u043c\u0435\u0442\u043a\u043e\u0439 \u00ab\u0418\u0441\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435\u00bb).</p>\n<h3 id=\"anl-6-6\">6.6 \u0422\u0435\u043b\u0435\u0444\u043e\u043d \u0432\u044b\u043a\u043b\u044e\u0447\u0435\u043d, \u0431\u0430\u0442\u0430\u0440\u0435\u044f \u0441\u0435\u043b\u0430, \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0438\u043b\u0438 \u0431\u0440\u0430\u0443\u0437\u0435\u0440 \u0437\u0430\u043a\u0440\u044b\u0442\u044b \u2013 \u0432\u0441\u0451 \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0430\u0435\u0442\u0441\u044f</h3>\n<p>\u041f\u043e\u0441\u043b\u0435 \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0432\u0432\u043e\u0434\u0430 \u0432\u0441\u0451 \u043d\u0430\u0434\u0451\u0436\u043d\u043e \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u0435\u0442\u0441\u044f \u043d\u0430 \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0435. \u041f\u043e\u0441\u043b\u0435 \u043f\u0435\u0440\u0435\u0437\u0430\u043f\u0443\u0441\u043a\u0430 (\u0442\u043e\u0442 \u0436\u0435 \u0442\u0435\u043b\u0435\u0444\u043e\u043d, \u0441\u043d\u043e\u0432\u0430 \u043e\u0442\u043a\u0440\u044b\u0442\u044c \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0438\u043b\u0438 \u0431\u0440\u0430\u0443\u0437\u0435\u0440) \u0432\u044b \u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442\u0435\u0441\u044c \u0442\u043e\u0447\u043d\u043e \u0442\u0430\u043c, \u0433\u0434\u0435 \u043e\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u043b\u0438\u0441\u044c, \u0431\u0435\u0437 \u043d\u043e\u0432\u043e\u0433\u043e \u0432\u0445\u043e\u0434\u0430 \u2013 \u0432\u0432\u0435\u0440\u0445\u0443 \u043d\u0435\u043d\u0430\u0434\u043e\u043b\u0433\u043e \u043f\u043e\u044f\u0432\u0438\u0442\u0441\u044f \u00ab\u2713 \u041f\u0440\u043e\u0434\u043e\u043b\u0436\u0430\u0435\u043c \u043a\u0430\u043a \u0434\u043e \u043f\u0435\u0440\u0435\u0437\u0430\u043f\u0443\u0441\u043a\u0430 \u2013 \u043d\u0438\u0447\u0435\u0433\u043e \u043d\u0435 \u043f\u043e\u0442\u0435\u0440\u044f\u043d\u043e\u00bb.\n- <strong>\u0421\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440:</strong> \u043a\u0430\u0440\u0434, \u0432\u0441\u0435 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438, \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b \u0438 \u043e\u0442\u043a\u0440\u044b\u0442\u044b\u0439 \u0431\u043e\u0439 \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u044e\u0442\u0441\u044f; \u0441\u0432\u044f\u0437\u044c \u0441 \u0441\u0443\u0434\u044c\u044f\u043c\u0438, WBU Sports \u0438 live-\u043c\u043e\u043d\u0438\u0442\u043e\u0440\u043e\u043c \u0432\u043e\u0441\u0441\u0442\u0430\u043d\u0430\u0432\u043b\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u0441\u0430\u043c\u0430.\n- <strong>\u0421\u0443\u0434\u044c\u044f:</strong> \u0438\u0434\u0443\u0449\u0438\u0439 \u0431\u043e\u0439 \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u0435\u0442\u0441\u044f \u0441\u043e \u0432\u0441\u0435\u043c\u0438 \u0440\u0430\u0443\u043d\u0434\u0430\u043c\u0438 (\u0432 \u0442\u043e\u043c \u0447\u0438\u0441\u043b\u0435 \u0442\u043e\u043b\u044c\u043a\u043e \u00ab\u0441\u043e\u0445\u0440\u0430\u043d\u0451\u043d\u043d\u044b\u043c\u0438\u00bb, \u043d\u0435 \u043e\u0442\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u043d\u044b\u043c\u0438) \u0438 \u0442\u0435\u043a\u0443\u0449\u0438\u043c \u0440\u0430\u0443\u043d\u0434\u043e\u043c \u2013 \u0431\u0435\u0437 \u043d\u043e\u0432\u043e\u0433\u043e PIN, \u0431\u0435\u0437 \u0434\u0443\u0431\u043b\u044f \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438 \u0443 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430. \u041d\u0435\u043e\u0442\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u043d\u044b\u0435 \u0440\u0430\u0443\u043d\u0434\u044b \u0443\u0439\u0434\u0443\u0442 \u0441\u043e \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u0439 \u043e\u0442\u043f\u0440\u0430\u0432\u043a\u043e\u0439.\n- \u041a\u043e\u043f\u0438\u044f \u0434\u0435\u0439\u0441\u0442\u0432\u0443\u0435\u0442 \u0434\u043e \u00ab\u0412\u044b\u0439\u0442\u0438\u00bb \u0438\u043b\u0438 \u043c\u0430\u043a\u0441\u0438\u043c\u0443\u043c 20 \u0447\u0430\u0441\u043e\u0432 (\u0442\u043e \u0435\u0441\u0442\u044c \u0442\u043e\u043b\u044c\u043a\u043e \u0432 \u0434\u0435\u043d\u044c \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u044f). \u041d\u0435 \u0440\u0430\u0431\u043e\u0442\u0430\u0439\u0442\u0435 \u0432 \u043f\u0440\u0438\u0432\u0430\u0442\u043d\u043e\u043c \u0440\u0435\u0436\u0438\u043c\u0435/\u0438\u043d\u043a\u043e\u0433\u043d\u0438\u0442\u043e \u2013 \u043e\u043d \u0432\u0441\u0451 \u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u043f\u0440\u0438 \u0437\u0430\u043a\u0440\u044b\u0442\u0438\u0438.</p>\n<h2 id=\"anl-7\">7. \u0421\u0443\u0434\u044c\u0438 \u2013 \u043e\u0446\u0435\u043d\u043a\u0430 \u0441 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u043e\u0439</h2>\n<p>\u0421\u0443\u0434\u044c\u0438 \u043e\u0446\u0435\u043d\u0438\u0432\u0430\u044e\u0442 \u043a\u0430\u0436\u0434\u044b\u0439 \u0440\u0430\u0443\u043d\u0434 \u043f\u043e 10-\u0431\u0430\u043b\u043b\u044c\u043d\u043e\u0439 \u0441\u0438\u0441\u0442\u0435\u043c\u0435 \u043d\u0430 \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0435. \u0418\u043c \u043d\u0443\u0436\u043d\u044b \u0442\u043e\u043b\u044c\u043a\u043e \u0438\u043c\u044f \u0438 PIN \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430.</p>\n<h3 id=\"anl-7-1\">7.1 \u0412\u0445\u043e\u0434</h3>\n<ul>\n<li>\u0411\u0440\u0430\u0443\u0437\u0435\u0440: \u043e\u0442\u043a\u0440\u044b\u0442\u044c <a target=\"_blank\" href=\"https://www.wbu-boxing.com/scorecard/,\">https://www.wbu-boxing.com/scorecard/,</a> \u043d\u0430\u0436\u0430\u0442\u044c \u00ab\u0421\u0443\u0434\u044c\u044f\u00bb, \u0432\u0432\u0435\u0441\u0442\u0438 \u0438\u043c\u044f \u0438 \u0444\u0430\u043c\u0438\u043b\u0438\u044e \u0438 PIN \u043e\u0442 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430, \u00ab\u041f\u043e\u0435\u0445\u0430\u043b\u0438\u00bb. \u0412\u044b \u0441\u0440\u0430\u0437\u0443 \u043f\u043e\u043f\u0430\u0434\u0451\u0442\u0435 \u0432 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0443; \u043d\u0435\u0432\u0435\u0440\u043d\u044b\u0439 PIN \u043e\u0442\u043a\u043b\u043e\u043d\u044f\u0435\u0442\u0441\u044f.</li>\n<li>\u041f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435: \u0432\u043a\u043b\u044e\u0447\u0438\u0442\u044c Bluetooth, \u0432\u044b\u0431\u0440\u0430\u0442\u044c \u00ab\u0421\u0443\u0434\u044c\u044f\u00bb \u0438 \u0438\u043c\u044f \u2013 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0438\u0442\u0441\u044f \u043a \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0443 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430, \u0438 \u0431\u0435\u0437 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0430.</li>\n</ul>\n<p>\u0412\u0432\u0435\u0440\u0445\u0443 \u0432\u0438\u0434\u043d\u043e \u00ab\u041f\u043e\u0434\u043a\u043b\u044e\u0447\u0435\u043d\u043e \u043e\u043d\u043b\u0430\u0439\u043d\u00bb \u0441 \u043d\u0430\u0437\u0432\u0430\u043d\u0438\u0435\u043c \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u044f. \u0415\u0441\u043b\u0438 \u0441\u0432\u044f\u0437\u0438 \u043d\u0435\u0442, \u043e\u0446\u0435\u043d\u043a\u0438 \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u044e\u0442\u0441\u044f \u0438 \u043e\u0442\u043f\u0440\u0430\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u043f\u043e\u0437\u0436\u0435.</p>\n<h3 id=\"anl-7-2\">7.2 \u041e\u0446\u0435\u043d\u0438\u0442\u044c \u0440\u0430\u0443\u043d\u0434</h3>\n<ol>\n<li>\u041d\u0430\u0436\u0430\u0442\u044c \u043e\u0447\u043a\u0438 \u043a\u0440\u0430\u0441\u043d\u043e\u0433\u043e \u0438 \u0441\u0438\u043d\u0435\u0433\u043e: \u043f\u043e\u0431\u0435\u0434\u0438\u0442\u0435\u043b\u044c \u0440\u0430\u0443\u043d\u0434\u0430 10, \u0434\u0440\u0443\u0433\u043e\u0439 9 (\u043f\u0440\u0438 \u043d\u043e\u043a\u0434\u0430\u0443\u043d\u0435 \u0438\u043b\u0438 \u044f\u0432\u043d\u043e\u043c \u043f\u0440\u0435\u0432\u043e\u0441\u0445\u043e\u0434\u0441\u0442\u0432\u0435 8 \u0438\u043b\u0438 \u043c\u0435\u043d\u044c\u0448\u0435).</li>\n<li>\u0421\u043d\u044f\u0442\u0438\u044f \u043e\u0447\u043a\u043e\u0432 \u0437\u0430 \u043f\u0440\u0435\u0434\u0443\u043f\u0440\u0435\u0436\u0434\u0435\u043d\u0438\u044f: \u043d\u0430\u0436\u0430\u0442\u044c \u22121 \u0434\u043e \u22124 \u043f\u043e\u0434 \u0443\u0433\u043b\u043e\u043c; \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u043e\u0435 \u043d\u0430\u0436\u0430\u0442\u0438\u0435 \u0443\u0431\u0438\u0440\u0430\u0435\u0442.</li>\n<li>\u0412\u043d\u0438\u0437\u0443 \u0432\u0438\u0434\u043d\u0430 \u0441\u0443\u043c\u043c\u0430 \u0440\u0430\u0443\u043d\u0434\u0430, \u043d\u0430\u043f\u0440. 10 : 9.</li>\n<li>\u00ab\u041e\u0442\u043f\u0440\u0430\u0432\u0438\u0442\u044c \u0440\u0430\u0443\u043d\u0434\u00bb \u0441\u0440\u0430\u0437\u0443 \u043e\u0442\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442 \u0440\u0430\u0443\u043d\u0434 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0443. \u00ab\u0421\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u0440\u0430\u0443\u043d\u0434 (\u0431\u0435\u0437 \u043e\u0442\u043f\u0440\u0430\u0432\u043a\u0438)\u00bb \u0442\u043e\u043b\u044c\u043a\u043e \u0437\u0430\u043f\u043e\u043c\u0438\u043d\u0430\u0435\u0442 \u2013 \u043f\u043e \u0443\u043a\u0430\u0437\u0430\u043d\u0438\u044e \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430.</li>\n</ol>\n<h3 id=\"anl-7-3\">7.3 \u0418\u0441\u043f\u0440\u0430\u0432\u0438\u0442\u044c \u0438 \u0437\u0430\u0432\u0435\u0440\u0448\u0438\u0442\u044c</h3>\n<ul>\n<li>\u0412 \u0441\u043f\u0438\u0441\u043a\u0435 \u0432\u043d\u0438\u0437\u0443 \u043b\u044e\u0431\u043e\u0439 \u0440\u0430\u0443\u043d\u0434 \u043c\u043e\u0436\u043d\u043e \u043d\u0430\u0436\u0430\u0442\u044c \u0438 \u0438\u0441\u043f\u0440\u0430\u0432\u0438\u0442\u044c.</li>\n<li>\u041f\u043e\u0441\u043b\u0435 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0435\u0433\u043e \u0440\u0430\u0443\u043d\u0434\u0430 \u00ab\u0417\u0430\u0432\u0435\u0440\u0448\u0438\u0442\u044c \u0431\u043e\u0439\u00bb. \u041f\u043e\u044f\u0432\u0438\u0442\u0441\u044f \u00ab\u0417\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u043e \u2013 \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u043e \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u043e\u043c\u00bb \u0441\u043e \u0432\u0441\u0435\u043c\u0438 \u0440\u0430\u0443\u043d\u0434\u0430\u043c\u0438.</li>\n<li>\u00ab\u0411\u043e\u0439 \u0437\u0430\u0432\u0435\u0440\u0448\u0451\u043d \u0434\u043e\u0441\u0440\u043e\u0447\u043d\u043e (KO / TKO / RTD \u2026)\u00bb, \u0435\u0441\u043b\u0438 \u0431\u043e\u0439 \u043e\u043a\u043e\u043d\u0447\u0438\u043b\u0441\u044f \u0434\u043e \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0435\u0433\u043e \u0440\u0430\u0443\u043d\u0434\u0430.</li>\n<li>\u00ab\u0421\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0431\u043e\u0439\u00bb \u043e\u0442\u043a\u0440\u044b\u0432\u0430\u0435\u0442 \u043f\u0443\u0441\u0442\u0443\u044e \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0443.</li>\n<li>\u0427\u0435\u0440\u0435\u0437 \u0447\u0430\u0442 \u043c\u043e\u0436\u043d\u043e \u043e\u0442\u043f\u0440\u0430\u0432\u0438\u0442\u044c \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0443 \u043a\u043e\u0440\u043e\u0442\u043a\u0438\u0435 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f (\u043d\u0430\u043f\u0440. \u00ab\u042f \u0438\u0441\u043f\u0440\u0430\u0432\u0438\u043b\u00bb, \u00ab\u041f\u043e\u0434\u043e\u0439\u0434\u0438\u0442\u0435, \u043f\u043e\u0436\u0430\u043b\u0443\u0439\u0441\u0442\u0430\u00bb).</li>\n</ul>\n<h2 id=\"anl-8\">8. \u0420\u0435\u0444\u0435\u0440\u0438, \u0445\u0440\u043e\u043d\u043e\u043c\u0435\u0442\u0440\u0438\u0441\u0442 \u0438 \u0432\u0440\u0430\u0447 \u0440\u0438\u043d\u0433\u0430</h2>\n<table>\n<thead>\n<tr>\n<th>\u0420\u043e\u043b\u044c</th>\n<th>\u0417\u0430\u0434\u0430\u0447\u0430 \u0432 \u0441\u0438\u0441\u0442\u0435\u043c\u0435</th>\n<th>\u0413\u0434\u0435</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\u0420\u0435\u0444\u0435\u0440\u0438</td>\n<td>\u0432\u043d\u043e\u0441\u0438\u0442\u0441\u044f \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u043e\u043c \u0434\u043b\u044f \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0431\u043e\u044f, \u043e\u0441\u0442\u0430\u0451\u0442\u0441\u044f \u0434\u043b\u044f \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0445; \u0441\u0430\u043c \u043d\u0438\u0447\u0435\u043c \u043d\u0435 \u0443\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442</td>\n<td>\u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430</td>\n</tr>\n<tr>\n<td>\u0425\u0440\u043e\u043d\u043e\u043c\u0435\u0442\u0440\u0438\u0441\u0442</td>\n<td>\u0443\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442 \u0447\u0430\u0441\u0430\u043c\u0438: \u0421\u0422\u0410\u0420\u0422, \u0421\u0422\u041e\u041f (\u0442\u0430\u0439\u043c\u0430\u0443\u0442 \u0438\u0434\u0451\u0442 \u0441\u0430\u043c), \u0414\u0410\u041b\u0415\u0415, \u0440\u0430\u0443\u043d\u0434 \u0437\u0430\u043d\u043e\u0432\u043e; \u0441\u0438\u0433\u043d\u0430\u043b\u044b \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0435</td>\n<td>\u043f\u0443\u043b\u044c\u0442 \u0438\u043b\u0438 \u0440\u0430\u0431\u043e\u0447\u0435\u0435 \u043c\u0435\u0441\u0442\u043e \u0443 \u0440\u0438\u043d\u0433\u0430</td>\n</tr>\n<tr>\n<td>\u0412\u0440\u0430\u0447 \u0440\u0438\u043d\u0433\u0430</td>\n<td>\u0432\u043d\u043e\u0441\u0438\u0442\u0441\u044f \u043e\u0434\u0438\u043d \u0440\u0430\u0437 \u043f\u0435\u0440\u0435\u0434 \u0441\u0442\u0430\u0440\u0442\u043e\u043c \u0438 \u0434\u0435\u0439\u0441\u0442\u0432\u0443\u0435\u0442 \u0434\u043b\u044f \u0432\u0441\u0435\u0445 \u0431\u043e\u0451\u0432; \u0431\u0435\u0437 \u043d\u0435\u0433\u043e \u0447\u0430\u0441\u044b \u043d\u0435 \u0437\u0430\u043f\u0443\u0441\u043a\u0430\u044e\u0442\u0441\u044f</td>\n<td>WBU Sports (\u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435 \u0438\u043b\u0438 \u043f\u0443\u043b\u044c\u0442) \u0438 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430</td>\n</tr>\n</tbody>\n</table>\n<p>\u0412\u0441\u0435 \u0438\u043c\u0435\u043d\u0430 \u0435\u0441\u0442\u044c \u0432 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0435 \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0431\u043e\u044f \u0438 \u0432 PDF-\u043e\u0442\u0447\u0451\u0442\u0435 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430.</p>\n<h2 id=\"anl-9-wbu-live-live\">9. \u0417\u0440\u0438\u0442\u0435\u043b\u0438 \u2013 WBU Live, live-\u043c\u043e\u043d\u0438\u0442\u043e\u0440, \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b \u0438 \u043c\u0438\u0440\u043e\u0432\u043e\u0439 \u0440\u0435\u0439\u0442\u0438\u043d\u0433</h2>\n<p>WBU Live \u0431\u0435\u0437 \u0432\u0445\u043e\u0434\u0430 \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442, \u043a\u0442\u043e \u043d\u0430 \u0440\u0438\u043d\u0433\u0435, \u043a\u043e\u043c\u0443 \u0433\u043e\u0442\u043e\u0432\u0438\u0442\u044c\u0441\u044f, \u0432\u0441\u0435 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b \u0438 \u043c\u0435\u0441\u0442\u0430.</p>\n<ul>\n<li>\u041d\u0430 \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0435: <a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/\">https://www.wbu-boxing.com/live/</a> \u2013 \u043d\u0430\u0436\u0430\u0442\u044c \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435, \u043f\u0440\u0438 \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u0438\u0445 \u0440\u0438\u043d\u0433\u0430\u0445 \u0432\u044b\u0431\u0440\u0430\u0442\u044c \u0440\u0438\u043d\u0433. \u0412\u043a\u043b\u0430\u0434\u043a\u0438: \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0435 \u0431\u043e\u0438, \u043f\u0440\u043e\u0448\u0435\u0434\u0448\u0438\u0435 \u0431\u043e\u0438, \u043c\u0435\u0441\u0442\u0430.</li>\n<li>\u041d\u0430 \u043c\u043e\u043d\u0438\u0442\u043e\u0440\u0435 \u0432 \u0437\u0430\u043b\u0435: \u043e\u0442\u043a\u0440\u044b\u0442\u044c \u0422\u0412-\u0441\u0441\u044b\u043b\u043a\u0443 \u0438\u0437 WBU Sports (\u0432\u043a\u043b\u0430\u0434\u043a\u0430 \u00ab\u0421\u043f\u0438\u0441\u043e\u043a \u0431\u043e\u0451\u0432\u00bb) \u0432 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435 \u0442\u0435\u043b\u0435\u0432\u0438\u0437\u043e\u0440\u0430 \u0438\u043b\u0438 Fire TV. \u041f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u0432\u0441\u0435 \u043f\u0440\u0435\u0434\u0441\u0442\u043e\u044f\u0449\u0438\u0435 \u0431\u043e\u0438; \u0437\u0435\u043b\u0451\u043d\u044b\u0439 \u2013 \u043d\u0430 \u0440\u0438\u043d\u0433\u0435, \u0436\u0451\u043b\u0442\u044b\u0439 \u2013 \u0433\u043e\u0442\u043e\u0432\u0438\u0442\u044c\u0441\u044f.</li>\n<li>\u041e\u0431\u0430 \u043e\u0431\u043d\u043e\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u0441\u0430\u043c\u0438, \u043f\u043e\u043a\u0430 \u041f\u041a \u0441 WBU Sports \u043e\u043d\u043b\u0430\u0439\u043d.</li>\n</ul>\n<h3 id=\"anl-9-1-live-wbu\">9.1 Live-\u043c\u043e\u043d\u0438\u0442\u043e\u0440 \u043d\u0430 \u0433\u043b\u0430\u0432\u043d\u043e\u0439 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0435 WBU</h3>\n<ul>\n<li>\u041a\u0430\u043a \u0442\u043e\u043b\u044c\u043a\u043e <strong>\u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440</strong> \u0432 <strong>\u0434\u0435\u043d\u044c \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u044f</strong> \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0438\u043b\u0441\u044f \u043a \u0433\u0430\u043b\u0430 (\u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430 \u043e\u0442\u043a\u0440\u044b\u0442\u0430, \u0431\u043e\u0438 \u0435\u0449\u0451 \u043d\u0435 \u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u044b; \u0442\u0435\u0441\u0442\u043e\u0432\u044b\u0435 \u0432\u0445\u043e\u0434\u044b \u0432 \u043f\u0440\u0435\u0434\u044b\u0434\u0443\u0449\u0438\u0435 \u0434\u043d\u0438 \u043d\u0435 \u0441\u0447\u0438\u0442\u0430\u044e\u0442\u0441\u044f), \u043d\u0430 \u0433\u043b\u0430\u0432\u043d\u043e\u0439 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0435 WBU \u043f\u0440\u044f\u043c\u043e \u043f\u043e\u0434 \u043c\u0435\u043d\u044e \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u043f\u043e\u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f <strong>live-\u043c\u043e\u043d\u0438\u0442\u043e\u0440</strong> \u2013 \u0431\u0435\u0437 \u043f\u0443\u043d\u043a\u0442\u0430 \u043c\u0435\u043d\u044e, \u0431\u0435\u0437 \u043d\u0430\u0436\u0430\u0442\u0438\u044f.</li>\n<li><strong>\u0421\u043b\u0435\u0432\u0430:</strong> \u0438\u0434\u0443\u0449\u0438\u0439 \u0431\u043e\u0439 \u2013 \u043d\u043e\u043c\u0435\u0440, \u0442\u0438\u0442\u0443\u043b\u044c\u043d\u044b\u0439 \u0431\u043e\u0439, \u043a\u0440\u0430\u0441\u043d\u044b\u0439 \u0438 \u0441\u0438\u043d\u0438\u0439 \u0443\u0433\u043e\u043b \u0441 \u0437\u0430\u043b\u043e\u043c \u0438 \u0441\u0442\u0440\u0430\u043d\u043e\u0439, \u0432\u0435\u0441\u043e\u0432\u0430\u044f \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f, \u0432\u0438\u0434 \u0441\u043f\u043e\u0440\u0442\u0430, \u0440\u0430\u0443\u043d\u0434\u044b \u00d7 \u043c\u0438\u043d\u0443\u0442\u044b. \u0415\u0441\u043b\u0438 \u0445\u0440\u043e\u043d\u043e\u043c\u0435\u0442\u0440\u0430\u0436 \u0438\u0434\u0451\u0442 \u0447\u0435\u0440\u0435\u0437 WBU Time, \u0440\u0430\u0443\u043d\u0434 \u0438 \u0432\u0440\u0435\u043c\u044f \u043a\u0440\u0443\u043f\u043d\u043e \u043d\u0438\u0436\u0435 (\u0442\u0430\u043a\u0436\u0435 \u043f\u0435\u0440\u0435\u0440\u044b\u0432 \u0438 \u0442\u0430\u0439\u043c\u0430\u0443\u0442); \u043f\u0440\u0438 \u0440\u0443\u0447\u043d\u043e\u043c \u0445\u0440\u043e\u043d\u043e\u043c\u0435\u0442\u0440\u0430\u0436\u0435 \u044d\u0442\u043e\u0433\u043e \u043f\u0440\u043e\u0441\u0442\u043e \u043d\u0435\u0442. \u041d\u0438\u0436\u0435 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0438\u0439 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u0438 \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0431\u043e\u0439.</li>\n<li><strong>\u0421\u043f\u0440\u0430\u0432\u0430:</strong> \u0432\u0435\u0441\u044c \u043a\u0430\u0440\u0434 \u0441 \u043f\u0440\u043e\u043a\u0440\u0443\u0442\u043a\u043e\u0439 \u2013 \u0437\u0430\u0432\u0435\u0440\u0448\u0451\u043d\u043d\u044b\u0435 \u0431\u043e\u0438 \u0441 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u043e\u043c \u0438 \u043f\u043e\u0431\u0435\u0434\u0438\u0442\u0435\u043b\u0435\u043c, \u0438\u0434\u0443\u0449\u0438\u0439 \u0431\u043e\u0439 \u0432\u044b\u0434\u0435\u043b\u0435\u043d \u0436\u0451\u043b\u0442\u044b\u043c.</li>\n<li>\u0420\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b \u043f\u043e\u044f\u0432\u043b\u044f\u044e\u0442\u0441\u044f, \u043a\u0430\u043a \u0442\u043e\u043b\u044c\u043a\u043e \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440 \u0437\u0430\u0432\u0435\u0440\u0448\u0430\u0435\u0442 \u0431\u043e\u0439. \u041e\u0447\u043a\u0438 \u043f\u043e \u0440\u0430\u0443\u043d\u0434\u0430\u043c \u0438 \u0438\u043c\u0435\u043d\u0430 \u0441\u0443\u0434\u0435\u0439 \u043d\u0435 \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u044e\u0442\u0441\u044f.</li>\n<li>\u0415\u0441\u043b\u0438 \u043e\u0434\u043d\u043e\u0432\u0440\u0435\u043c\u0435\u043d\u043d\u043e \u0438\u0434\u0443\u0442 \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u043e \u0433\u0430\u043b\u0430, \u043c\u043e\u043d\u0438\u0442\u043e\u0440\u044b \u043f\u043e\u044f\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u0434\u0440\u0443\u0433 \u043f\u043e\u0434 \u0434\u0440\u0443\u0433 u043f\u0438\u0441\u043e\u043a \u0431\u043e\u0451\u0432, \u0441\u0435\u0442\u043a\u0438, \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b, \u0433\u0440\u0430\u043c\u043e\u0442\u044b, \u0430\u043a\u043a\u0440\u0435\u0434\u0438\u0442\u0430\u0446\u0438\u044f, \u043f\u0435\u0447\u0430\u0442\u044c, \u0422\u0412 \u0438 \u0441\u0432\u044f\u0437\u044c \u0441 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u043e\u043c <strong>\u0437\u0430\u0431\u043b\u043e\u043a\u0438\u0440\u043e\u0432\u0430\u043d\u044b (\ud83d\udd12)</strong>. \u0411\u0435\u0437 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0430 \u043f\u043e\u044f\u0432\u0438\u0442\u0441\u044f \u00ab\u041f\u043e\u0434\u043a\u043b\u044e\u0447\u0438\u0442\u0435\u0441\u044c \u043a \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0443\u00bb.</li>\n<li>\u041f\u043e\u0441\u043b\u0435 \u044d\u0442\u043e\u0433\u043e \u0432\u0441\u0451 \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u0438 \u0431\u0435\u0437 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0430. \u0412 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435 (\u0441 \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u043e\u043c WBU Sports) \u0442\u0430\u043a\u043e\u0439 \u0431\u043b\u043e\u043a\u0438\u0440\u043e\u0432\u043a\u0438 \u043d\u0435\u0442.</li>\n</ul>\n<h3 id=\"anl-10-2-wbu-sports-android\">10.2 WBU Sports \u043a\u0430\u043a \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0434\u043b\u044f \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u0430 (Android)</h3>\n<p>\u041f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0434\u043b\u044f \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u0430 \u2013 \u044d\u0442\u043e WBU Sports \u0441 \u0441\u043e\u0431\u043e\u0439: \u0432\u0441\u0451 \u043d\u0430 \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u0435, \u0443 \u0440\u0438\u043d\u0433\u0430 \u0438 \u0431\u0435\u0437 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0430.</p>\n<ol>\n<li>\u0421\u043a\u0430\u0447\u0430\u0442\u044c APK-\u0444\u0430\u0439\u043b \u00abWBU-Sports.apk\u00bb \u043d\u0430 \u043f\u043b\u0430\u043d\u0448\u0435\u0442 \u0438 \u043d\u0430\u0436\u0430\u0442\u044c, \u043e\u0434\u0438\u043d \u0440\u0430\u0437 \u00ab\u0420\u0430\u0437\u0440\u0435\u0448\u0438\u0442\u044c \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043a\u0443 \u0438\u0437 \u044d\u0442\u043e\u0433\u043e \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a\u0430\u00bb, \u0437\u0430\u0442\u0435\u043c \u00ab\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u044c\u00bb.</li>\n<li>\u041f\u0435\u0440\u0435\u043d\u0435\u0441\u0442\u0438 \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435 \u043d\u0430 \u043f\u043b\u0430\u043d\u0448\u0435\u0442: \u043b\u0438\u0431\u043e \u0441\u043e\u0437\u0434\u0430\u0442\u044c \u043f\u0440\u044f\u043c\u043e \u043d\u0430 \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u0435 (\u0441 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u043e\u043c \u043e\u043d\u043b\u0430\u0439\u043d-\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f \u0438 \u0437\u0430\u043f\u0443\u0441\u043a live \u0440\u0430\u0431\u043e\u0442\u0430\u044e\u0442 \u043a\u0430\u043a \u0432 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435), \u043b\u0438\u0431\u043e \u043d\u0430 \u041f\u041a \u00ab\u0421\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u043a\u043e\u043f\u0438\u044e (.json)\u00bb, \u043e\u0442\u043f\u0440\u0430\u0432\u0438\u0442\u044c \u0444\u0430\u0439\u043b \u043d\u0430 \u043f\u043b\u0430\u043d\u0448\u0435\u0442 (\u043d\u0430\u043f\u0440. \u043f\u043e e-mail \u0438\u043b\u0438 USB) \u0438 \u0432 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0438 \u00ab\u0412\u043e\u0441\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u044c \u0441\u043e\u0445\u0440\u0430\u043d\u0451\u043d\u043d\u0443\u044e \u043a\u043e\u043f\u0438\u044e\u00bb.</li>\n<li><strong>\u0421\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440 \u043f\u043e Bluetooth:</strong> \u043d\u0430 \u043f\u0443\u043b\u044c\u0442\u0435 \u043d\u0430\u0436\u0430\u0442\u044c \u00ab\ud83d\udcf6 \u0417\u0430\u043f\u0443\u0441\u0442\u0438\u0442\u044c Bluetooth\u00bb. \u041d\u0430 \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0435 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430 \u043e\u0431\u044b\u0447\u043d\u044b\u043c \u043e\u0431\u0440\u0430\u0437\u043e\u043c \u0432\u043e\u0439\u0442\u0438 \u0432 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435-\u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0443, \u043d\u0435 \u0432\u044b\u0431\u0438\u0440\u0430\u044f \u0448\u043e\u0443 \u2013 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0441\u0430\u043c\u043e \u043d\u0430\u0439\u0434\u0451\u0442 \u043f\u043b\u0430\u043d\u0448\u0435\u0442. \u0421\u043f\u0438\u0441\u043e\u043a \u0431\u043e\u0451\u0432 \u0441 \u0438\u043c\u0435\u043d\u0430\u043c\u0438, \u0442\u0438\u0442\u0443\u043b\u043e\u043c \u0438 \u0440\u0430\u0443\u043d\u0434\u0430\u043c\u0438 \u043f\u0440\u0438\u0445\u043e\u0434\u0438\u0442 \u0441 \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u0430, \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0451\u043d\u043d\u044b\u0435 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u044e\u0442\u0441\u044f \u043d\u0430 \u043f\u043b\u0430\u043d\u0448\u0435\u0442. \u0421\u0443\u0434\u044c\u0438, \u043a\u0430\u043a \u0432\u0441\u0435\u0433\u0434\u0430, \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0430\u044e\u0442\u0441\u044f \u043a \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0443 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430.</li>\n<li><strong>\u0422\u0412 \u043f\u043e \u043a\u0430\u0431\u0435\u043b\u044e:</strong> \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0438\u0442\u044c \u043f\u043b\u0430\u043d\u0448\u0435\u0442 \u043a \u0442\u0435\u043b\u0435\u0432\u0438\u0437\u043e\u0440\u0443 \u0447\u0435\u0440\u0435\u0437 \u0430\u0434\u0430\u043f\u0442\u0435\u0440 USB-C \u2013 HDMI. \u041d\u0430 \u043f\u0443\u043b\u044c\u0442\u0435 \u043f\u043e\u044f\u0432\u0438\u0442\u0441\u044f \u00ab\ud83d\udcfa \u0422\u0435\u043b\u0435\u0432\u0438\u0437\u043e\u0440 (HDMI) \u2013 \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0451\u043d\u00bb: \u00ab\u23f1 WBU Time\u00bb \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u0447\u0430\u0441\u044b \u043d\u0430 \u0422\u0412, \u00ab\ud83d\udccb \u0421\u043f\u0438\u0441\u043e\u043a \u0431\u043e\u0451\u0432\u00bb \u2013 \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0435 \u0431\u043e\u0438. \u041d\u0430 \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u0435 \u043f\u0440\u043e\u0434\u043e\u043b\u0436\u0430\u0435\u0442\u0435 \u0440\u0430\u0431\u043e\u0442\u0430\u0442\u044c \u0441 \u043f\u0443\u043b\u044c\u0442\u043e\u043c.</li>\n<li><strong>\u041f\u0435\u0447\u0430\u0442\u044c:</strong> \u0441\u043f\u0438\u0441\u043e\u043a \u0431\u043e\u0451\u0432, \u0441\u0435\u0442\u043a\u0438, \u0433\u0440\u0430\u043c\u043e\u0442\u044b \u0438 \u0430\u043a\u043a\u0440\u0435\u0434\u0438\u0442\u0430\u0446\u0438\u043e\u043d\u043d\u044b\u0435 \u043a\u0430\u0440\u0442\u044b \u043f\u0435\u0447\u0430\u0442\u0430\u044e\u0442\u0441\u044f \u0447\u0435\u0440\u0435\u0437 \u0434\u0438\u0430\u043b\u043e\u0433 \u043f\u0435\u0447\u0430\u0442\u0438 Android \u043d\u0430 Wi-Fi-\u043f\u0440\u0438\u043d\u0442\u0435\u0440 \u0438\u043b\u0438 \u0432 PDF.</li>\n<li><strong>\u041a\u043e\u043f\u0438\u044f:</strong> \u00ab\u0421\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u043a\u043e\u043f\u0438\u044e (.json)\u00bb \u043a\u043b\u0430\u0434\u0451\u0442 \u0444\u0430\u0439\u043b \u0432 \u043f\u0430\u043f\u043a\u0443 \u00abDownload\u00bb \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u0430.</li>\n</ol>\n<p>\u0421 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u043e\u043c \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0434\u043b\u044f \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u0430 \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u0435\u0449\u0451 \u0438 \u0442\u043e\u0447\u043d\u043e \u043a\u0430\u043a \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u043d\u0430\u044f \u0432\u0435\u0440\u0441\u0438\u044f (\u043e\u043d\u043b\u0430\u0439\u043d-\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f, \u043f\u043b\u0430\u0442\u0435\u0436\u0438, \u0437\u0430\u043f\u0443\u0441\u043a live, WBU Live \u0438 WBU Time \u0447\u0435\u0440\u0435\u0437 \u0441\u0435\u0442\u044c).</p>\n<h3 id=\"anl-10-3-wi-fi\">10.3 Wi-Fi \u0437\u0430\u043b\u0430: \u0441\u043a\u043e\u043b\u044c\u043a\u043e \u0443\u0433\u043e\u0434\u043d\u043e \u0442\u0435\u043b\u0435\u0432\u0438\u0437\u043e\u0440\u043e\u0432 \u0431\u0435\u0437 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0430 \u0438 \u0431\u0435\u0437 \u043a\u0430\u0431\u0435\u043b\u0435\u0439</h3>\n<p>\u041f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0434\u043b\u044f \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u0430 \u0438 \u043f\u0440\u043e\u0433\u0440\u0430\u043c\u043c\u0430 \u0434\u043b\u044f Windows \u043c\u043e\u0433\u0443\u0442 \u043e\u0442\u043a\u0440\u044b\u0442\u044c \u0441\u043e\u0431\u0441\u0442\u0432\u0435\u043d\u043d\u0443\u044e \u0441\u0435\u0442\u044c Wi-Fi. \u0412\u0441\u0435 \u0442\u0435\u043b\u0435\u0432\u0438\u0437\u043e\u0440\u044b (\u043d\u0430\u043f\u0440. Fire TV) \u0438 \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u044b, \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0451\u043d\u043d\u044b\u0435 \u043a \u043d\u0435\u0439, \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u044e\u0442 WBU Live \u0438 WBU Time \u2013 \u0434\u043b\u044f \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0440\u0438\u043d\u0433\u0430 \u2013 \u0431\u0435\u0437 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0430.</p>\n<ol>\n<li>\u041d\u0430 \u043f\u0443\u043b\u044c\u0442\u0435 \u043d\u0430\u0436\u0430\u0442\u044c \u00ab\ud83d\udce1 \u0417\u0430\u043f\u0443\u0441\u0442\u0438\u0442\u044c Wi-Fi \u0437\u0430\u043b\u0430\u00bb.</li>\n<li>\u041f\u043e\u044f\u0432\u044f\u0442\u0441\u044f \u0438\u043c\u044f \u0438 \u043f\u0430\u0440\u043e\u043b\u044c \u0441\u0435\u0442\u0438 (\u043d\u043e\u0443\u0442\u0431\u0443\u043a: \u00abWBU-Halle\u00bb / \u00abwbuboxing\u00bb; \u043f\u043b\u0430\u043d\u0448\u0435\u0442: \u0437\u0430\u0434\u0430\u0451\u0442 \u043f\u043b\u0430\u043d\u0448\u0435\u0442) \u0438 \u0430\u0434\u0440\u0435\u0441\u0430.</li>\n<li>\u041f\u043e\u0434\u043a\u043b\u044e\u0447\u0438\u0442\u044c \u0442\u0435\u043b\u0435\u0432\u0438\u0437\u043e\u0440 \u043a \u044d\u0442\u043e\u0439 \u0441\u0435\u0442\u0438 \u0438 \u043e\u0442\u043a\u0440\u044b\u0442\u044c \u043f\u043e\u043a\u0430\u0437\u0430\u043d\u043d\u044b\u0439 \u0430\u0434\u0440\u0435\u0441 \u0432 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435 (Fire TV: Silk):</li>\n<li>WBU Time \u0434\u043b\u044f \u0440\u0438\u043d\u0433\u0430 1, \u0440\u0438\u043d\u0433\u0430 2 \u2026 (\u0441\u0432\u043e\u0439 \u0430\u0434\u0440\u0435\u0441 \u0434\u043b\u044f \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0440\u0438\u043d\u0433\u0430),</li>\n<li>\u0441\u043f\u0438\u0441\u043e\u043a \u0431\u043e\u0451\u0432 \u0434\u043b\u044f \u043c\u043e\u043d\u0438\u0442\u043e\u0440\u0430 \u0432 \u0437\u0430\u043b\u0435,</li>\n<li>WBU Live \u0434\u043b\u044f \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u043e\u0432.</li>\n<li>\u041d\u0430 \u043d\u043e\u0443\u0442\u0431\u0443\u043a\u0435 \u0431\u0440\u0430\u043d\u0434\u043c\u0430\u0443\u044d\u0440 Windows \u043f\u0440\u0438 \u043f\u0435\u0440\u0432\u043e\u043c \u0437\u0430\u043f\u0443\u0441\u043a\u0435 \u0441\u043f\u0440\u043e\u0441\u0438\u0442: \u00ab\u0420\u0430\u0437\u0440\u0435\u0448\u0438\u0442\u044c \u0434\u043e\u0441\u0442\u0443\u043f\u00bb (\u043e\u0442\u043c\u0435\u0442\u0438\u0442\u044c \u0447\u0430\u0441\u0442\u043d\u044b\u0435 \u0438 \u043f\u0443\u0431\u043b\u0438\u0447\u043d\u044b\u0435 \u0441\u0435\u0442\u0438).</li>\n</ol>\n<p>\u0415\u0441\u043b\u0438 \u0441\u043e\u0431\u0441\u0442\u0432\u0435\u043d\u043d\u0443\u044e \u0441\u0435\u0442\u044c \u0437\u0430\u043f\u0443\u0441\u0442\u0438\u0442\u044c \u043d\u0435\u043b\u044c\u0437\u044f (\u043d\u0435\u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0430 \u044d\u0442\u043e \u0431\u043b\u043e\u043a\u0438\u0440\u0443\u044e\u0442), \u0442\u0435 \u0436\u0435 \u0430\u0434\u0440\u0435\u0441\u0430 \u0440\u0430\u0431\u043e\u0442\u0430\u044e\u0442 \u0447\u0435\u0440\u0435\u0437 \u0438\u043c\u0435\u044e\u0449\u0438\u0439\u0441\u044f Wi-Fi-\u0440\u043e\u0443\u0442\u0435\u0440 \u0438\u043b\u0438 \u0442\u043e\u0447\u043a\u0443 \u0434\u043e\u0441\u0442\u0443\u043f\u0430 \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0430, \u043a \u043a\u043e\u0442\u043e\u0440\u044b\u043c \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0435\u043d\u044b \u043f\u043b\u0430\u043d\u0448\u0435\u0442/\u043d\u043e\u0443\u0442\u0431\u0443\u043a \u0438 \u0442\u0435\u043b\u0435\u0432\u0438\u0437\u043e\u0440. \u0421 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u043e\u043c WBU Live \u0438 WBU Time \u0434\u043e\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u043b\u044c\u043d\u043e \u0440\u0430\u0431\u043e\u0442\u0430\u044e\u0442 \u0447\u0435\u0440\u0435\u0437 www.wbu-boxing.com.</p>\n<h3 id=\"anl-10-4-android\">10.4 \u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u044c \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435-\u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0443 \u0434\u043b\u044f Android</h3>\n<ol>\n<li>\u0421\u043a\u0430\u0447\u0430\u0442\u044c APK-\u0444\u0430\u0439\u043b \u043d\u0430 \u0442\u0435\u043b\u0435\u0444\u043e\u043d \u0438\u043b\u0438 \u043f\u043b\u0430\u043d\u0448\u0435\u0442 \u0438 \u043d\u0430\u0436\u0430\u0442\u044c \u043d\u0430 \u043d\u0435\u0433\u043e.</li>\n<li>\u041e\u0434\u0438\u043d \u0440\u0430\u0437 \u0440\u0430\u0437\u0440\u0435\u0448\u0438\u0442\u044c \u00ab\u0420\u0430\u0437\u0440\u0435\u0448\u0438\u0442\u044c \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043a\u0443 \u0438\u0437 \u044d\u0442\u043e\u0433\u043e \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a\u0430\u00bb, \u0437\u0430\u0442\u0435\u043c \u00ab\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u044c\u00bb.</li>\n<li>\u0412\u043a\u043b\u044e\u0447\u0438\u0442\u044c Bluetooth \u0438 \u0433\u0435\u043e\u043b\u043e\u043a\u0430\u0446\u0438\u044e.</li>\n</ol>\n<p>\u0421\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440 \u0438 \u0441\u0443\u0434\u044c\u0438 \u0441\u043e\u0435\u0434\u0438\u043d\u044f\u044e\u0442\u0441\u044f \u043d\u0430\u043f\u0440\u044f\u043c\u0443\u044e \u043f\u043e Bluetooth \u2013 \u0431\u0435\u0437 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0430 \u0438 \u0431\u0435\u0437 Wi-Fi \u0432 \u0437\u0430\u043b\u0435. \u0418\u043d\u0442\u0435\u0440\u043d\u0435\u0442 \u043d\u0443\u0436\u0435\u043d \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u044e, \u0442\u043e\u043b\u044c\u043a\u043e \u0447\u0442\u043e\u0431\u044b \u0432\u0437\u044f\u0442\u044c \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435 \u0438\u0437 WBU Sports \u0438 \u043e\u0442\u043f\u0440\u0430\u0432\u0438\u0442\u044c \u0442\u0443\u0434\u0430 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b; \u0435\u0441\u043b\u0438 \u043e\u043d \u043d\u0435\u043d\u0430\u0434\u043e\u043b\u0433\u043e \u043f\u0440\u043e\u043f\u0430\u0434\u0451\u0442, \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b \u043e\u0442\u043f\u0440\u0430\u0432\u044f\u0442\u0441\u044f \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u043f\u043e\u0437\u0436\u0435.</p>\n<h3 id=\"anl-10-5\">10.5 \u041e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u044f</h3>\n<ul>\n<li>\u0411\u0440\u0430\u0443\u0437\u0435\u0440\u043d\u0430\u044f \u0432\u0435\u0440\u0441\u0438\u044f: \u0432\u0441\u0435\u0433\u0434\u0430 \u0430\u043a\u0442\u0443\u0430\u043b\u044c\u043d\u0430 \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438. \u0415\u0441\u043b\u0438 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0430 \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u0441\u0442\u0430\u0440\u0443\u044e \u0432\u0435\u0440\u0441\u0438\u044e, \u043d\u0430\u0436\u0430\u0442\u044c Ctrl + F5.</li>\n<li>Android-\u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u044f (\u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430 \u0438 WBU Sports \u0434\u043b\u044f \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u0430): \u043f\u0440\u0438 \u043a\u0430\u0436\u0434\u043e\u043c \u0437\u0430\u043f\u0443\u0441\u043a\u0435 \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u044e\u0442, \u0435\u0441\u0442\u044c \u043b\u0438 \u043d\u043e\u0432\u0430\u044f \u0432\u0435\u0440\u0441\u0438\u044f. \u0422\u043e\u0433\u0434\u0430 \u043f\u043e\u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u043f\u043e\u0434\u0441\u043a\u0430\u0437\u043a\u0430 \u00ab\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u044c \u043e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u0435\u00bb \u2013 \u043d\u0430\u0436\u0430\u0442\u044c, \u043e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u0435 \u0441\u043a\u0430\u0447\u0430\u0435\u0442\u0441\u044f \u0438 \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0441\u044f \u0441\u0430\u043c\u043e. \u041c\u0430\u0433\u0430\u0437\u0438\u043d \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0439 \u043d\u0435 \u043d\u0443\u0436\u0435\u043d. \u0415\u0441\u043b\u0438 Android \u043f\u0440\u0435\u0440\u044b\u0432\u0430\u0435\u0442 \u043f\u0435\u0440\u0432\u0443\u044e \u043f\u043e\u043f\u044b\u0442\u043a\u0443 (\u043d\u0435\u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u044b \u0441\u043d\u0430\u0447\u0430\u043b\u0430 \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u044e\u0442 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0447\u0435\u0440\u0435\u0437 Play Protect), \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0442\u0438\u0445\u043e \u0437\u0430\u043f\u0443\u0441\u043a\u0430\u0435\u0442 \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043a\u0443 \u0441\u043d\u043e\u0432\u0430 \u2013 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f \u043e\u0431 \u043e\u0448\u0438\u0431\u043a\u0435 \u043d\u0435\u0442 (\u0441 \u0432\u0435\u0440\u0441\u0438\u0438 1.145).</li>\n<li>\u041f\u0440\u043e\u0433\u0440\u0430\u043c\u043c\u0430 \u0434\u043b\u044f Windows: \u043f\u0440\u0438 \u0437\u0430\u043f\u0443\u0441\u043a\u0435 (\u0441 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u043e\u043c) \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u00ab\u041d\u043e\u0432\u0430\u044f \u0432\u0435\u0440\u0441\u0438\u044f\u00bb \u2013 \u043d\u0430\u0436\u0430\u0442\u044c \u00ab\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u044c \u043e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u0435\u00bb: \u0441\u043a\u0430\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044f, \u0443\u0441\u0442\u0430\u043d\u0430\u0432\u043b\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u0438 \u0447\u0435\u0440\u0435\u0437 \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u043e \u0441\u0435\u043a\u0443\u043d\u0434 \u043f\u0435\u0440\u0435\u0437\u0430\u043f\u0443\u0441\u043a\u0430\u0435\u0442\u0441\u044f. \u0414\u0430\u043d\u043d\u044b\u0435 \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u044e\u0442\u0441\u044f.</li>\n</ul>\n<p><strong>\u0422\u0435\u043b\u0435\u0444\u043e\u043d\u044b Xiaomi (Mi Protect):</strong> \u041f\u0440\u0438 \u043e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u0438 Xiaomi \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u00ab\u0420\u0438\u0441\u043a\u043e\u0432\u0430\u043d\u043d\u043e\u0435 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u2013 \u0440\u0438\u0441\u043a\u043e\u0432\u0430\u043d\u043d\u044b\u0439 \u0438\u0441\u0442\u043e\u0447\u043d\u0438\u043a\u00bb. \u0422\u0435\u043b\u0435\u0444\u043e\u043d \u0434\u0435\u043b\u0430\u0435\u0442 \u0442\u0430\u043a \u0434\u043b\u044f \u043b async function loadMy(){try{S.my=await api('t_my',{tid:S.t.id})}catch(e){S.myErr=e.message}}
const dt=ts=>new Date(ts*1000).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const ST={cart:['Noch nicht abgeschlossen','#e2a500'],open:['Zahlung offen','#e2a500'],paid:['✓ Bezahlt – fest angemeldet','#1a9e55'],storno:['Storniert – nicht bezahlt, Sportler entfernt','#c62828']};
function payBox(o,b){const iban=(b.iban||'').replace(/(.{4})/g,'$1 ').trim();
  return `<div class="kl" style="margin-top:10px"><b>Jetzt überweisen – genau diesen Betrag:</b>
   <div class="pay" style="margin-top:6px"><span>Betrag</span><b style="font-size:20px">${euro(o.total)}</b><span>Empfänger</span><b>${esc(b.inhaber||'–')}</b><span>IBAN</span><b>${esc(iban)}</b>${b.bic?`<span>BIC</span><b>${esc(b.bic)}</b>`:''}
   <span>Verwendungszweck</span><b style="font-size:20px">${esc(o.code)}</b><span>Zahlbar</span><b>${o.reminded?'bis spätestens '+dt(o.due):'sofort – spätestens zum Anmeldeschluss '+deDate(S.my.schluss)}</b></div>
   <p style="margin:8px 0 0">Bitte <b>nur den Code ${esc(o.code)}</b> als Verwendungszweck angeben. ${o.reminded?`<b style="color:var(--red)">Letzte Frist: Ist der Betrag bis ${dt(o.due)} nicht vollständig da, werden die Sportler komplett entfernt.</b>`:'Wer bis zum Anmeldeschluss nicht vollständig bezahlt hat, bekommt noch eine Erinnerung mit kurzer Nachfrist – danach werden die Sportler entfernt.'}</p></div>`}
function vMy(){
  const M=S.my;if(!M)return `<div class="card">${esc(S.myErr||'Lädt …')}</div>`;
  const cart=M.orders.find(o=>o.status==='cart'),rest=M.orders.filter(o=>o!==cart);
  return `${S.added?`<div class="card" style="border-color:var(--ok)"><b>✅ Eingetragen:</b> ${esc(S.added)}</div>`:''}
  ${docCard(M)}
  ${staffCard(M)}
  <div class="card"><h2 style="margin-top:0">Offene Anmeldung</h2>
   ${cart?`<table class="l"><tr><th>Sportler</th><th>Kategorie</th><th>Startgeld</th><th></th></tr>${cart.items.map(x=>`<tr><td><b>${esc(x.vorname)} ${esc(x.name)}</b></td><td>${x.nr}</td><td>${euro(x.fee)}</td><td><a href="#" style="color:var(--red);font-weight:700" onclick="cartDel('${x.id}');return false">entfernen</a></td></tr>`).join('')}
     <tr><td colspan="2"><b>Summe</b></td><td colspan="2"><b style="font-size:18px">${euro(cart.total)}</b></td></tr></table>
     <p class="muted">Die Sportler stehen schon in der Teilnehmerliste. Bitte abschließen und sofort bezahlen – spätestens zum Anmeldeschluss ${deDate(S.my.schluss)}.</p>
     <div class="g2"><button class="btn sec full" onclick="S.added='';S.tab='anm';render();scrollTo(0,0)">+ Weiteren Sportler eintragen</button><button class="btn full" onclick="checkout('${cart.id}')">Fertig – jetzt bezahlen</button></div>`
   :`<p class="muted" style="margin:0">Keine offene Anmeldung. <a href="#" style="color:#000;font-weight:700" onclick="S.tab='anm';render();return false">Sportler eintragen</a></p>`}</div>
  ${rest.map(o=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:17px">Anmeldung ${esc(o.code)}</b><span class="badge" style="background:${ST[o.status][1]};color:${o.status==='open'?'#2a1d00':'#fff'};border:0">${ST[o.status][0]}</span></div>
    <p style="margin:6px 0">${o.items.map(x=>`${esc(x.vorname)} ${esc(x.name)} (${x.nr})`).join(', ')}</p>
    <p style="margin:0">Summe <b>${euro(o.total)}</b>${o.paidAmt!=null&&o.status!=='paid'?` · eingegangen <b>${euro(o.paidAmt)}</b> – ${o.paidAmt<o.total?`<b style="color:var(--red)">es fehlen ${euro(o.total-o.paidAmt)}</b>`:'zu viel – der Veranstalter meldet sich'}`:''}</p>
    ${o.status==='open'?payBox(o,M.bank):''}
    ${o.status==='paid'?(Date.now()/1000>=M.rechnungAb?`<a class="btn" style="text-decoration:none;display:inline-block;margin-top:10px" target="_blank" href="${API}?a=t_invoice&lang=${window.WBU_LANG||'de'}&tid=${encodeURIComponent(S.t.id)}&oid=${o.id}&tok=${encodeURIComponent(AUTH.tok)}">📄 Rechnung herunterladen (PDF)</a>`
      :`<p style="margin:10px 0 0">📄 <b>Rechnung:</b> wird automatisch am <b>${new Date(M.rechnungAb*1000).toLocaleDateString('de-DE')}</b> erstellt (Tag nach der Veranstaltung) und kann dann hier heruntergeladen werden.</p>`):''}</div>`).join('')}`}

const staffFoto=x=>`${API}?a=t_staffdoc&tid=${encodeURIComponent(S.t.id)}&sid=${x.id}&tok=${encodeURIComponent(AUTH.tok)}`;
function staffCard(M){const L=M.staff||[],mx=M.staffMax||{trainer:0,betreuer:0},cnt=r=>L.filter(x=>x.rolle===r).length,frei={trainer:mx.trainer-cnt('trainer'),betreuer:mx.betreuer-cnt('betreuer')};
  const opts=['trainer','betreuer'].filter(r=>frei[r]>0);
  return `<div class="card"><h2 style="margin-top:0">🪪 Trainer &amp; Betreuer (Akkreditierung)</h2>
   <p style="margin:0 0 8px">Laut Ausschreibung frei: <b>1 Trainer</b> und <b>2 Betreuer pro angefangene 5 Sportler, höchstens 4 Betreuer</b> pro Team – auch für Einzelsportler. Jeder bekommt eine Akkreditierungskarte (freier Eintritt). Nicht angemeldete Betreuer zahlen Eintritt. Foto freiwillig – ohne Foto bleibt das Bildfeld auf der Karte leer.</p>
   <p style="margin:0 0 8px">Trainer: <b>${cnt('trainer')} von ${mx.trainer}</b> · Betreuer: <b>${cnt('betreuer')} von ${mx.betreuer}</b></p>
   ${L.length?`<table class="l">${L.map(x=>`<tr><td style="width:40px">${x.foto?`<div style="width:36px;height:45px;border-radius:5px;${kopfStyle(staffFoto(x),x.kopf)}"></div>`:'<div class="nofoto" style="width:36px;height:45px">–</div>'}</td><td><b>${esc(x.name)}</b><div class="muted">${x.rolle==='trainer'?'Trainer':'Betreuer'}</div></td><td style="text-align:right"><a href="#" style="color:var(--red);font-weight:700" onclick="staffDel('${x.id}');return false">entfernen</a></td></tr>`).join('')}</table>`:''}
   ${opts.length?`<div class="g2" style="margin-top:10px"><div><label>Vor- und Nachname</label><input id="st_name" placeholder="z. B. Peter Muster"></div><div><label>Rolle</label><select id="st_rolle">${opts.map(r=>`<option value="${r}">${r==='trainer'?'Trainer':'Betreuer'} (noch ${frei[r]} frei)</option>`).join('')}</select></div></div>
     <label>Foto (freiwillig)</label><div class="upl"><input type="file" accept="image/*" onchange="staffPick(this)"><span id="st_fs" class="muted"></span></div>
     <button class="btn" style="margin-top:10px" onclick="staffAdd()">+ Hinzufügen</button><span id="st_err" style="color:var(--red);font-weight:700;margin-left:10px"></span>`
     :mx.trainer?'<p class="muted" style="margin:6px 0 0">Alle freien Plätze sind belegt.</p>':'<p class="muted" style="margin:6px 0 0">Erst Sportler anmelden – dann können Trainer und Betreuer eingetragen werden.</p>'}</div>`}
let STF=null;
async function staffPick(inp){const f=inp.files[0];if(!f)return;$('st_fs').textContent='Wird vorbereitet …';try{const data=await fileData(f);STF={data,kopf:null};$('st_fs').textContent='✅ '+f.name;
  kopfDlg(data,null,k=>{STF.kopf=k;$('st_fs').innerHTML=`<span style="display:inline-block;width:28px;height:35px;border-radius:4px;vertical-align:middle;${kopfStyle(data,k)}"></span> ✅ Kopf ausgewählt`})}catch(e){STF=null;$('st_fs').textContent='⚠ '+e.message}}
async function staffAdd(){const name=$('st_name').value.trim(),rolle=$('st_rolle').value;$('st_err').textContent='';
  try{await api('t_staff_add',{tid:S.t.id,name,rolle,foto:STF?STF.data:'',kopf:STF?STF.kopf:null});STF=null;await loadMy();render()}catch(e){$('st_err').textContent=e.message}}
async function staffDel(id){try{await api('t_staff_del',{tid:S.t.id,id});await loadMy();render()}catch(e){alert(e.message)}}
const DOCSHORT={haft:'Teilnahmeerklärung',eltern:'Einverständnis Eltern',attest:'Sportärztliches Attest'};
function docCard(M){const rs=(M.regs||[]).filter(x=>(x.need||[]).length);if(!rs.length)return '';
  const offen=rs.filter(x=>x.miss.length).length;
  return `<div class="card" style="${offen?'border:2px solid var(--red)':''}"><h2 style="margin-top:0">Unterlagen ${offen?`– bei ${offen} Sportler${offen>1?'n':''} fehlt noch etwas`:'– alles vollständig ✅'}</h2>
   ${offen?`<p style="margin:0 0 8px">Fehlende Unterlagen bitte hier hochladen – spätestens bis zum Anmeldeschluss ${deDate(M.schluss)}. Sonst kommt eine Erinnerung mit ${S.t.grace||3} Tagen Nachfrist; danach wird der Sportler entfernt. Das Attest muss aus dem Jahr ${M.year} sein.</p>`:''}
   <table class="l"><tr><th>Sportler</th><th>Kategorie</th><th>Unterlagen</th></tr>${rs.map(x=>`<tr><td><b>${esc(x.vorname)} ${esc(x.name)}</b>${x.miss.length&&x.docDue?`<div style="color:var(--red);font-weight:700">Letzte Frist: ${new Date(x.docDue*1000).toLocaleDateString('de-DE')}</div>`:''}</td><td>${x.nr}</td><td>
     ${x.need.map(k=>x.docs.includes(k)?`<div>✅ ${DOCSHORT[k]}${k==='attest'&&x.attestDate?' ('+deDate(x.attestDate)+')':''}</div>`
       :`<div style="margin:4px 0"><b style="color:var(--red)">✗ ${DOCSHORT[k]} fehlt</b>
         ${k==='attest'?`<div style="margin-top:3px">Ausgestellt am <input type="date" id="ad_${x.id}" style="width:auto;display:inline-block"></div>`:''}
         <div class="upl" style="margin-top:3px"><input type="file" accept="image/*,application/pdf" onchange="myUp('${x.id}','${k}',this)"><span id="mu_${x.id}_${k}"></span></div>
         ${k!=='attest'?`<a href="${docUrl(S.t.id,k)}" target="_blank" style="color:#000;font-weight:700;font-size:13px">📄 Formular herunterladen</a>`:''}</div>`).join('')}</td></tr>`).join('')}</table></div>`}
async function myUp(rid,k,inp){const f=inp.files[0];if(!f)return;const st=$('mu_'+rid+'_'+k);
  let datum='';if(k==='attest'){datum=$('ad_'+rid).value;const ae=attErr(datum);if(ae){st.textContent='⚠ '+ae;inp.value='';return}}
  st.textContent='Wird hochgeladen …';
  try{const data=await fileData(f);await api('t_mydoc',{tid:S.t.id,rid,kind:k,data,name:f.name,datum});await loadMy();render()}
  catch(e){st.textContent='⚠ '+(e.message||'Fehler');inp.value=''}}
async function checkout(oid){try{await api('t_checkout',{tid:S.t.id,oid});S.added='';await loadMy();render();scrollTo(0,0)}catch(e){alert(e.message)}}
async function cartDel(rid){if(!confirm('Diesen Sportler aus der Anmeldung nehmen?'))return;try{await api('t_cartdel',{tid:S.t.id,rid});await loadMy();render()}catch(e){alert(e.message)}}

// ===================== Teilnehmer / Kategorien / Clubs (nur mit Login) =====================
async function refreshCount(){try{const t=(await api('t_get',{tid:S.t.id})).turnier;S.t.anz=t.anz;S.t.pers=t.pers;S.t.clubs=t.clubs}catch(e){}}
async function setTab(k){S.tab=k;render();await refreshCount();if(k==='my'){await loadMy();render();return}if(k!=='anm'&&!S.pub){try{S.pub=await api('t_public',{tid:S.t.id})}catch(e){S.pubErr=e.message}render()}}
const ringOf=x=>(S.t.rings||1)>1?((x.sp==='MB'||x.sp==='SB')?'Arena 1 / Ring 1':'Arena 2 / Ring 2'):'';
function gewOf(x){const k=wbuKlasse(x.nr);return k&&k.gew?k.gew+' kg':'–'}
function stats(rs){const p={};rs.forEach(x=>p[x.pid]=x);const ps=Object.values(p);
  return {pers:ps.length,m:ps.filter(x=>x.sex==='m').length,w:ps.filter(x=>x.sex==='w').length,starts:rs.length,dopp:rs.length-ps.length}}
const tiles=a=>`<div class="tiles">${a.map(([n,l])=>`<div class="tile"><b>${n}</b><span>${l}</span></div>`).join('')}</div>`;
function thumb(x,big){return x.foto?`<img class="${big?'':'thumb'}" src="${fotoUrl(x.id)}" alt="">`:`<div class="nofoto">Foto folgt</div>`}
function profil(id){const x=S.pub.regs.find(r=>r.id===id);if(!x)return;const k=wbuKlasse(x.nr),al=x.geb?wbuAlter(x.geb,S.t.date):null;
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)this.parentNode.innerHTML=''"><div class="dlg"><div class="prof">${thumb(x,true)}<div>
  <h2 style="margin:0">${esc(x.vorname)} ${esc(x.name)}</h2><p style="margin:2px 0 10px">Kategorie ${x.nr} · ${esc(gewOf(x))}</p>
  <div class="pay"><span>Verein / Team</span><b>${esc(x.verein||'–')}</b><span>Geburtsdatum</span><b>${esc(deDate(x.geb))}${al!=null?` · ${al} Jahre am ${esc(deDate(S.t.date))}`:''}</b>
  <span>Gewicht</span><b>${esc(x.kg?x.kg+' kg':'–')}</b><span>Größe</span><b>${esc(x.cm?x.cm+' cm':'–')}</b><span>Geschlecht</span><b>${x.sex==='w'?'weiblich':x.sex==='m'?'männlich':'M/W Mix'}</b>
  <span>Klasse</span><b>${esc(k?k.name:x.klasse)}</b>${ringOf(x)?`<span>Zuordnung</span><b>${ringOf(x)}</b>`:''}<span>Trainer</span><b>${esc(x.trainer||'–')}</b></div></div></div>
  <button class="btn full" style="margin-top:14px" onclick="$('modal').innerHTML=''">Schließen</button></div></div>`}
// Vorläufige Paarungen der 1. Runde (gleiche Regel wie in WBU Sports: Vereinskollegen möglichst nicht gegeneinander)
function paarungen(nrs,rs){const out=[];
  nrs.forEach(n=>{const xs=rs.filter(x=>x.nr===n).sort((a,b)=>a.no-b.no);if(!xs.length)return;
    if(xs.length<2){out.push(`<div class="grp" style="cursor:default"><b>Kategorie ${n}</b><span>${esc(xs[0].vorname)} ${esc(xs[0].name)} – wartet auf Gegner</span></div>`);return}
    const sl=wbuPaare(xs.map(x=>({id:x.id,club:x.verein}))),nm=id=>{const x=xs.find(y=>y.id===id);return x?`<b>${esc(x.vorname)} ${esc(x.name)}</b> <span class="muted">(${esc(x.verein)})</span>`:''};
    const ps=[];for(let i=0;i<sl.length;i+=2)if(sl[i]||sl[i+1])ps.push(sl[i]&&sl[i+1]?`<span style="color:var(--red)">●</span> ${nm(sl[i])} &nbsp;vs.&nbsp; <span style="color:var(--blue)">●</span> ${nm(sl[i+1])}`:`${nm(sl[i]||sl[i+1])} – Freilos`);
    out.push(`<div class="grp" style="cursor:default;display:block"><b>Kategorie ${n}</b><div style="margin-top:4px">${ps.join('<br>')}</div></div>`)});
  return out.length?`<h2>Paarungen 1. Runde (vorläufig)</h2><p class="muted" style="margin-top:0">Ändern sich mit jeder neuen Anmeldung. Sportler desselben Vereins werden möglichst nicht gegeneinander gesetzt.</p>${out.join('')}`:''}
function vData(){
  const P=S.pub;if(!P)return `<div class="card">${S.pubErr?esc(S.pubErr):'Lädt …'}</div>`;
  const rs=P.regs.slice().sort((a,b)=>a.nr-b.nr||String(a.name).localeCompare(b.name)),st=stats(rs);
  const bel=[...new Set(rs.map(x=>x.nr))];
  const katBtns=bel.length?`<p style="margin:0 0 6px"><b>Belegte Kategorien – anklicken:</b></p>${bel.map(n=>`<span class="katbtn" onclick="S.kat=${n};setTab('kat')">Kategorie ${n}</span>`).join('')}`:'';
  if(S.tab==='tn')return `<div class="card">${tiles([[st.pers,'Teilnehmer'],[st.m,'Männlich'],[st.w,'Weiblich'],[st.starts,'Starts'],[st.dopp,'Doppelstarts']])}${katBtns}
    <div style="overflow-x:auto;margin-top:8px"><table class="l"><tr><th>Kat.</th><th>Name</th><th>Club / Team</th><th>Geburtsdatum</th><th>Gewicht</th><th>Klasse</th>${(S.t.rings||1)>1?'<th>Zuordnung</th>':''}<th>Bild</th></tr>
    ${rs.map(x=>`<tr class="${x.own?'own':''}" style="cursor:pointer" onclick="profil('${x.id}')"><td><b>${x.nr}</b></td><td><b>${esc(x.vorname)} ${esc(x.name)}</b></td><td>${esc(x.verein)}</td><td>${esc(deDate(x.geb))}</td><td>${esc(x.kg?x.kg+' kg':'–')}</td><td>${esc(gewOf(x))}</td>${(S.t.rings||1)>1?`<td>${ringOf(x)}</td>`:''}<td>${thumb(x)}</td></tr>`).join('')||'<tr><td colspan="8">Noch keine Anmeldungen.</td></tr>'}</table></div>
    <p class="muted">Auf einen Sportler tippen = Foto und alle Daten groß. Eigene Anmeldungen sind gelb hinterlegt.</p></div>`;
  if(S.tab==='kat'){
    const grp=[];S.t.sports.forEach(sp=>{const s=WBU_SPORT[sp];
      if(sp==='SB'){grp.push({sp,label:'Shadow Boxing Battle | M/W - Mix | 10 - 99 J.',von:1000,bis:1000});return}
      s.alter.forEach(([a,b,mn,wn])=>['m','w'].forEach(sex=>{const n0=sex==='m'?mn:wn;grp.push({sp,label:`${s.name} | ${sex==='m'?'Männlich':'Weiblich'} | ${wbuAlterText(a,b)}`,von:n0,bis:n0+13})}))});
    if(S.kat){const g=grp.find(g=>S.kat>=g.von&&S.kat<=g.bis);if(g){S.grp=g.von;S.kat=null}}
    const g=grp.find(x=>x.von===S.grp);
    if(g){const nrs=[];for(let n=g.von;n<=g.bis;n++)nrs.push(n);
      return `<div class="card"><span class="katbtn" onclick="S.grp=null;render()">‹ Zurück zur Übersicht</span><h2>${esc(g.label)}</h2>
      <div style="overflow-x:auto"><table class="l"><tr><th>Kategorie</th><th>Gewicht / Klasse</th><th>Athlet/in</th><th>Verein / Team</th><th>Bild</th></tr>
      ${nrs.map(n=>{const k=wbuKlasse(n),xs=rs.filter(x=>x.nr===n);return xs.length?xs.map((x,i)=>`<tr style="cursor:pointer" onclick="profil('${x.id}')"><td><b>${i?'':n}</b></td><td>${i?'':esc(k.gew?k.gew+' kg':'–')}</td><td><b>${esc(x.vorname)} ${esc(x.name)}</b></td><td>${esc(x.verein)}</td><td>${thumb(x)}</td></tr>`).join('')
        :`<tr><td><b>${n}</b></td><td>${esc(k.gew?k.gew+' kg':'–')}</td><td colspan="3" class="muted">frei</td></tr>`}).join('')}</table></div>
      ${paarungen(nrs,rs)}</div>`}
    return `<div class="card">${tiles([[st.pers,'Teilnehmer'],[st.m,'Männlich'],[st.w,'Weiblich'],[st.starts,'Starts'],[st.dopp,'Doppelstarts']])}${katBtns}
      <h2>Alle Kategorien</h2>${grp.map(g=>{const n=rs.filter(x=>x.nr>=g.von&&x.nr<=g.bis).length;return `<div class="grp ${n?'bel':''}" onclick="S.grp=${g.von};render();scrollTo(0,0)"><div><b>${esc(g.label)}</b><br><span class="muted">Kategorien ${g.von}${g.bis>g.von?'–'+g.bis:''}</span></div><b>${n?n+' Teilnehmer':'frei'} ›</b></div>`}).join('')}</div>`}
  // Clubs
  const cl={};rs.forEach(x=>{const c=x.verein||'–';(cl[c]=cl[c]||{n:c,p:{},s:0,tr:new Set(),be:new Set()});cl[c].p[x.pid]=1;cl[c].s++;
    String(x.trainer||'').split(/[,;]+/).map(t=>t.trim()).filter(Boolean).forEach(t=>cl[c].tr.add(t));String(x.betreuer||'').split(/[,;]+/).map(t=>t.trim()).filter(Boolean).forEach(t=>cl[c].be.add(t))});
  const L=Object.values(cl).map(c=>({...c,pers:Object.keys(c.p).length})).sort((a,b)=>b.pers-a.pers||b.s-a.s);
  return `<div class="card"><h2 style="margin-top:0">Clubs mit den meisten Teilnehmern</h2>${tiles([[L.length,'Clubs'],[st.pers,'Teilnehmer'],[st.dopp,'Doppelstarts'],[st.starts,'Starts'],[L.filter(c=>c.s>=10).length,'Clubs ab 10 Starts']])}
    <table class="l"><tr><th>#</th><th>Club / Team</th><th>Teilnehmer</th><th>Starts</th><th>Anteil</th></tr>${L.map((c,i)=>`<tr><td><b>${i+1}.</b></td><td><b>${esc(c.n)}</b></td><td>${c.pers}</td><td>${c.s}</td><td>${st.pers?Math.round(c.pers/st.pers*100):0} %</td></tr>`).join('')}</table>
    <h2>Trainer & Betreuer je Team</h2><p class="muted" style="margin-top:0">2 Betreuer pro max. 5 Teilnehmer, höchstens 4 Betreuer pro Team. Nicht angemeldete Betreuer gelten als Zuschauer.</p>
    ${L.map(c=>`<div class="grp" style="cursor:default"><div><b>${esc(c.n)}</b><br>Trainer: ${c.tr.size?esc([...c.tr].join(', ')):'<span class="muted">noch nicht gemeldet</span>'}<br>Betreuer: ${c.be.size?esc([...c.be].join(', ')):'<span class="muted">noch nicht gemeldet</span>'}</div><b>${c.pers} TN</b></div>`).join('')}</div>`;
}
async function send(){
  const r=klasseAus(),g=id=>$(id).value.trim();
  const fail=m=>{$('ferr').textContent=m};
  if(r.err)return fail(r.err);
  if(!g('f_vorname')||!g('f_name'))return fail('Bitte Vor- und Nachnamen eintragen.');
  if(!/^\S+@\S+\.\S+$/.test(g('f_email')))return fail('Bitte eine gültige E-Mail-Adresse eintragen.');
  if(!$('f_ok').checked)return fail('Bitte das Einverständnis ankreuzen.');
  const need=needDocs();
  if(FILES.attest&&need.includes('attest')){const ae=attErr(g('f_attest'));if(ae)return fail(ae);FILES.attest.datum=g('f_attest')}
  const reg={vorname:g('f_vorname'),name:g('f_name'),geb:g('f_geb'),sex:S.f.sex,verein:g('f_verein'),land:g('f_land'),trainer:g('f_trainer'),
    email:g('f_email'),tel:g('f_tel'),bem:g('f_bem'),betreuer:g('f_betreuer'),sp:S.f.sp,nr:r.nr,kg:S.f.sp==='SB'?'':g('f_kg'),klasse:r.k.name,website:g('f_website'),
    cm:g('f_cm'),files:Object.fromEntries(need.filter(k=>FILES[k]).concat(FILES.foto?['foto']:[]).map(k=>[k,FILES[k]]))};
  $('sendbtn').disabled=true;$('sendbtn').textContent='Wird gesendet …';
  try{const j=await api('t_register',{tid:S.t.id,r:reg});S.pub=null;
    keep={verein:reg.verein,land:reg.land,trainer:reg.trainer,betreuer:reg.betreuer,email:reg.email,tel:reg.tel};
    for(const k in FILES)delete FILES[k];
    S.added=`${reg.vorname} ${reg.name} – Kategorie ${r.k.nr}`;S.f={sp:reg.sp,sex:null,gew:null,erw:false};S.err='';
    $('app').innerHTML='';S.tab='my';await loadMy();render();scrollTo(0,0)}
  catch(e){fail(e.message);$('sendbtn').disabled=false;$('sendbtn').textContent='Sportler eintragen'}
}
function vOk(){
  const o=S.ok,zweck=`${o.name} Start-Nr ${o.no} ${o.reg.vorname} ${o.reg.name}`.slice(0,140);
  return `<div class="card" style="border-color:var(--ok)"><h1 style="margin-top:0">✅ Angemeldet!</h1>
    <p><b>${esc(o.reg.vorname)} ${esc(o.reg.name)}</b> ist für <b>${esc(o.name)}</b> angemeldet.</p>
    ${o.reg.files&&Object.keys(o.reg.files).length?'<p style="margin:6px 0">✅ Unterlagen hochgeladen – der Sportler ist zum Kampf freigegeben.</p>':''}
    <div class="kl"><div class="muted">Start-Nr. ${o.no}</div><b class="nr">Klasse ${o.k.nr}</b> &nbsp;<b>${esc(o.k.name)}</b></div></div>
  ${o.fee?`<div class="card"><h2 style="margin-top:0">Startgeld überweisen</h2>
    <div class="pay"><span>Betrag</span><b>${euro(o.fee)}</b><span>Empfänger</span><b>${esc(o.inhaber||'–')}</b><span>IBAN</span><b>${esc((o.iban||'–').replace(/(.{4})/g,'$1 ').trim())}</b>
    ${o.bic?`<span>BIC</span><b>${esc(o.bic)}</b>`:''}<span>Verwendungszweck</span><b>${esc(zweck)}</b></div>
    <p class="muted">Die Anmeldung gilt, sobald das Startgeld eingegangen ist. Der Veranstalter hakt die Zahlung ab.</p></div>`:''}
  <button class="btn full" onclick="again()">+ Weiteren Sportler anmelden</button>
  <p style="text-align:center"><a href="#" style="color:#000;font-weight:700" onclick="S.view='list';history.replaceState(null,'','?');loadList();return false">Zur Turnierliste</a></p>`;
}
function again(){S.view='form';S.f={sp:S.ok.reg.sp,sex:null,gew:null,erw:false};S.err='';$('app').innerHTML='';render();scrollTo(0,0)}

function render(keepInputs){
  let h;try{h=S.view==='hilfe'?vHilfe():S.view==='info'?vInfo():S.view==='login'?vLogin():S.view==='form'?vForm():S.view==='ok'?vOk():vList()}
  catch(e){h=`<div class="card"><b>Fehler beim Anzeigen:</b> ${esc(e.message)}<br><button class="btn" style="margin-top:10px" onclick="location.reload()">Seite neu laden</button></div>`}
  $('app').innerHTML=h;accBar();
}
const WEB_VERSION=Number('207')||0;
async function checkWebVersion(){if(!/^https?:/.test(location.protocol))return;
  try{const r=await fetch('webversion.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
    if(j.version>WEB_VERSION&&!$('newver')){const d=document.createElement('div');d.id='newver';
      d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:99;background:#e8b931;color:#2a1d00;padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer;max-width:92vw;text-align:center';
      d.textContent='Neue Version verfügbar – hier tippen zum Neuladen';d.onclick=()=>location.reload();document.body.appendChild(d)}}catch(e){}}
setTimeout(checkWebVersion,3000);

    <p style="margin-top:10px">${esc(j.turnier)} · ${esc(deDate(j.date))}</p></div>`
   :`<div class="card" style="border:4px solid #c62828;text-align:center"><div style="font-size:64px;line-height:1">⛔</div><h1 style="margin:6px 0;color:#c62828">Nicht gültig</h1><p>Diese Karte ist nicht (mehr) im System – bitte an die Turnierleitung wenden.</p></div>`}

{const vk=new URLSearchParams(location.search).get('vk');if(q&&vk&&!(AUTH&&AUTH.me.rolle==='veranstalter'))saveAuth({tok:'vk:'+q+':'+vk,me:{trainer:'Veranstalter',rolle:'veranstalter',club:'–',email:''}});if(vk)history.replaceState(null,'','?t='+q)}
if(AKKC)akkCheck(AKKC);else if(new URLSearchParams(location.search).get('hilfe')){S.view='hilfe';render()}else if(!AUTH&&q)openInfo(q);else if(!AUTH){S.view='login';render()}else if(q)openT(q);else loadList();
