2013 un clic reprend nom, salle, pays et date de naissance. Ainsi pas de doublons. Une autre personne du m\u00eame nom ? Ajouter un compl\u00e9ment (p. ex. deuxi\u00e8me pr\u00e9nom).</li>\n<li><strong>Les clubs lors de l'inscription en ligne</strong> ne voient que leurs <strong>propres</strong> sportifs inscrits auparavant. Si le nom existe dans un autre club, seule la remarque \u00ab Ce nom existe d\u00e9j\u00e0 \u00bb appara\u00eet \u2013 sans donn\u00e9es d'autrui.</li>\n<li><strong>Ferm\u00e9e :</strong> la base n'est visible que pour les comptes organisateur et superviseur, les entra\u00eeneurs (leur salle uniquement) et la WBU (mot de passe WBU) \u2013 jamais pour le public, ni entre clubs.</li>\n</ul>\n<h3 id=\"anl-3-4-profil-du-sportif-palmar-s-titres-poids-et-suspension-apr-s-ko\">3.4 Profil du sportif : palmar\u00e8s, titres, poids et suspension apr\u00e8s KO</h3>\n<ul>\n<li>Dans la base des combattants, <strong>\u00ab Profil \u00bb</strong> ouvre le profil du sportif. Il n'est visible qu'ici, dans la zone prot\u00e9g\u00e9e \u2013 pas sur le site.</li>\n<li><strong>Palmar\u00e8s par sport, s\u00e9par\u00e9 :</strong> Pro, Semi-Pro, Master, K1, Bare Knuckle et Hybrid \u2013 victoires (dont par KO), d\u00e9faites (dont par KO) et nuls. Chaque combat du syst\u00e8me WBU compte automatiquement, y compris les r\u00e9sultats publi\u00e9s auparavant. S'il n'y a encore rien, le prochain combat WBU est le combat n\u00b0 1.</li>\n<li><strong>Ajouter des combats d'ailleurs :</strong> seulement l'<strong>entra\u00eeneur</strong> de la m\u00eame salle (r\u00f4le \u00ab Entra\u00eeneur \u00bb) \u2013 et seulement vers le haut, les chiffres ne peuvent pas baisser. Les corrections vers le bas sont faites uniquement par la WBU. Chaque modification figure avec nom et date sous \u00ab Modifications \u00bb.</li>\n<li><strong>Titres :</strong> les titres WBU et les victoires en tournoi sont saisis automatiquement par le syst\u00e8me (ou par la WBU). Les entra\u00eeneurs peuvent ajouter des titres d'autres f\u00e9d\u00e9rations ; ils portent la mention \u00ab externe \u00bb.</li>\n<li><strong>Poids :</strong> chaque poids de l'inscription et du gala est enregistr\u00e9 avec la date.</li>\n<li><strong>Suspension apr\u00e8s KO :</strong> apr\u00e8s une d\u00e9faite par KO, le sportif est suspendu <strong>90 jours</strong>, apr\u00e8s un TKO <strong>30 jours</strong> (abandon/RTD : pas de suspension). La base affiche alors en rouge \u00ab \ud83d\udeab Suspendu jusqu'au \u2026 \u00bb, et il ne peut ni \u00eatre s\u00e9lectionn\u00e9 ni \u00eatre saisi par son nom dans un combat. La WBU peut saisir une suspension manuellement (p. ex. KO dans une autre f\u00e9d\u00e9ration) ou la lever avec un feu vert m\u00e9dical.</li>\n</ul>\n<h2 id=\"anl-4-le-jour-des-combats-le-poste-de-contr-le\">4. Le jour des combats \u2013 le poste de contr\u00f4le</h2>\n<p>Le poste de contr\u00f4le affiche tous les rings avec le chrono, le combat sur le ring, les prochains et les pr\u00e9c\u00e9dents combats. Il se trouve dans l'onglet \u00ab \ud83c\udf9b Poste de contr\u00f4le \u00bb.</p>\n<h3 id=\"anl-4-1-avant-le-d-part\">4.1 Avant le d\u00e9part</h3>\n<ol>\n<li>Saisir le m\u00e9decin de ring (champ en haut, jaune tant qu'il est vide). Sans m\u00e9decin de ring, le chrono ne d\u00e9marre pas.</li>\n<li>Avec plusieurs PC : sous \u00ab Ce PC g\u00e8re \u00bb ne cocher que ses propres rings.</li>\n<li>Choisir le signal par ring (p. ex. ring 1 cloche, ring 2 sifflet) et l'\u00e9couter avec \u25b6.</li>\n<li>V\u00e9rifier \u00ab Signaux activ\u00e9s \u00bb \u2013 \u00ab MUET \u00bb coupe tous les sons.</li>\n</ol>\n<h3 id=\"anl-4-2-le-chrono\">4.2 Le chrono</h3>\n<table>\n<thead>\n<tr>\n<th>Bouton</th>\n<th>Effet</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\u25b6 D\u00c9PART / CONTINUER</td>\n<td>le round tourne</td>\n</tr>\n<tr>\n<td>\u23f8 STOP</td>\n<td>le chrono s'arr\u00eate, le chrono de temps mort (max. 10 min) d\u00e9marre automatiquement</td>\n</tr>\n<tr>\n<td>\u21ba Relancer le round</td>\n<td>round en cours depuis le d\u00e9but</td>\n</tr>\n<tr>\n<td>\u23ed Round suivant</td>\n<td>passe au round suivant</td>\n</tr>\n<tr>\n<td>Rd. / Min</td>\n<td>modifier nombre et dur\u00e9e des rounds</td>\n</tr>\n</tbody>\n</table>\n<p>Les signaux sont automatiques : 10 secondes avant la fin du round, trois coups de marteau, apr\u00e8s chaque round et chaque pause une cloche, \u00e0 la fin du combat trois. La pause dure toujours 1 minute.</p>\n<h3 id=\"anl-4-3-pes-e\">4.3 Pes\u00e9e</h3>\n<p>L'encadr\u00e9 \u00ab Pes\u00e9e \u00bb indique le poids maximal (cat\u00e9gorie plus tol\u00e9rance, p. ex. -55 kg + 4 kg = max. 59,0 kg). Saisir le poids pour rouge et bleu. S'il est au-dessus, le syst\u00e8me propose la disqualification ; l'adversaire gagne et passe.</p>\n<h3 id=\"anl-4-4-cas-particuliers-en-un-clic\">4.4 Cas particuliers en un clic</h3>\n<table>\n<thead>\n<tr>\n<th>Cas</th>\n<th>Bouton</th>\n<th>Cons\u00e9quence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Disqualification \u00e0 la pes\u00e9e</td>\n<td>\u2696 DQ : rouge / bleu</td>\n<td>l'adversaire gagne par DQ</td>\n</tr>\n<tr>\n<td>L'adversaire ne peut pas combattre (p. ex. blessure)</td>\n<td>\u270b Gagn\u00e9 par forfait : rouge / bleu</td>\n<td>sans confirmation, corrigeable ensuite via \u270e</td>\n</tr>\n<tr>\n<td>Sportif absent</td>\n<td>\ud83d\udeab Absent : rouge / bleu</td>\n<td>l'adversaire gagne par forfait, y compris les combats suivants de ce sportif</td>\n</tr>\n</tbody>\n</table>\n<p>Qui perd par forfait, est absent ou est disqualifi\u00e9 \u00e0 la pes\u00e9e ne re\u00e7oit pas de dipl\u00f4me pour cette place.</p>\n<h3 id=\"anl-4-5-r-sultats\">4.5 R\u00e9sultats</h3>\n<p>Le r\u00e9sultat arrive automatiquement du superviseur (carte de pointage) ou est saisi manuellement avec \u00ab Saisir le r\u00e9sultat \u00bb. D\u00e8s qu'un r\u00e9sultat est l\u00e0, le chrono est remis \u00e0 z\u00e9ro et le combat suivant charg\u00e9. \u00ab Appeler le combat suivant \u00bb ou \u00ab appeler \u00bb permet de changer l'ordre.</p>\n<h3 id=\"anl-4-6-deuxi-me-pc-au-ring-poste-de-commande\">4.6 Deuxi\u00e8me PC au ring (poste de commande)</h3>\n<p>Avec plusieurs rings, \u00ab Deuxi\u00e8me PC au ring (sans connexion) \u00bb appara\u00eet en bas avec un lien par ring. Ouvrir ce lien sur le deuxi\u00e8me PC : seul ce ring s'y g\u00e8re (chrono, r\u00e9sultats, DQ). Ensuite, sur le PC principal, d\u00e9cocher ce ring sous \u00ab Ce PC g\u00e8re \u00bb.</p>\n<h3 id=\"anl-4-7-wbu-time-sur-le-t-l-viseur\">4.7 WBU Time sur le t\u00e9l\u00e9viseur</h3>\n<p>Le chrono des rounds pour le t\u00e9l\u00e9viseur au ring : round \u00e0 gauche, temps en grand \u00e0 droite, noms des coins en haut. Dans le menu du site WBU, ouvrir \u00ab WBU Time 1 \u00bb ou \u00ab WBU Time 2 \u00bb (ou dans le navigateur du Fire TV <a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1\">https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1</a>). Il affiche automatiquement l'\u00e9v\u00e9nement en cours et suit le chrono du poste de contr\u00f4le. Activer une fois le son sur le t\u00e9l\u00e9viseur avec \u00ab Muet \u2013 activer le son \u00bb. Sans internet : brancher le t\u00e9l\u00e9viseur au PC en HDMI et ouvrir l'affichage du temps au poste de contr\u00f4le.</p>\n<h2 id=\"anl-5-r-sultats-dipl-mes-et-accr-ditation\">5. R\u00e9sultats, dipl\u00f4mes et accr\u00e9ditation</h2>\n<h3 id=\"anl-5-1-r-sultats\">5.1 R\u00e9sultats</h3>\n<p>Onglet \u00ab R\u00e9sultats \u00bb : places 1, 2 et 3 (deux 3es) par cat\u00e9gorie, automatiquement depuis les tableaux. \u00ab Imprimer / PDF \u00bb pour l'affichage. Les classements apparaissent en m\u00eame temps sur WBU Live.</p>\n<h3 id=\"anl-5-2-d-finir-les-logos-l-avance\">5.2 D\u00e9finir les logos \u00e0 l'avance</h3>\n<p>Dans l'onglet \u00ab \ud83c\udfc5 Dipl\u00f4mes \u00bb, sous \u00ab Logos sur les dipl\u00f4mes \u00bb \u2013 avant le jour J, pour que personne n'ait rien \u00e0 r\u00e9gler ce jour-l\u00e0 :</p>\n<ol>\n<li>\u00ab T\u00e9l\u00e9verser mon logo \u00bb : chaque compte a un logo (club ou organisateur).</li>\n<li>Cocher les logos qui figurent sur les dipl\u00f4mes et cartes de cet \u00e9v\u00e9nement : KCW, son propre logo, logos d'autres organisateurs.</li>\n<li>Saisir \u00ab Deuxi\u00e8me site en bas du dipl\u00f4me \u00bb ou laisser vide.</li>\n</ol>\n<h3 id=\"anl-5-3-imprimer-les-dipl-mes\">5.3 Imprimer les dipl\u00f4mes</h3>\n<ul>\n<li>Apr\u00e8s une demi-finale, le poste de contr\u00f4le affiche \u00ab \ud83c\udfc5 Dipl\u00f4me 3e place : nom \u00bb, apr\u00e8s la finale un bouton pour la 1re et un pour la 2e place. Un clic imprime exactement ce dipl\u00f4me ; le bouton porte ensuite un \u2713.</li>\n<li>Dans l'onglet \u00ab Dipl\u00f4mes \u00bb : \u00ab Imprimer tous les dipl\u00f4mes \u00bb ou \u00ab Imprimer \u00bb par cat\u00e9gorie.</li>\n<li>Lors d'un championnat d'Allemagne, la 1re place porte \u00ab Champion/Championne d'Allemagne \u00bb, sinon \u00ab Dipl\u00f4me \u00bb. Laurier or, argent ou bronze.</li>\n<li>R\u00e9glages d'impression : papier A4, sans marges, cocher les graphismes d'arri\u00e8re-plan.</li>\n</ul>\n<h3 id=\"anl-5-4-cartes-d-accr-ditation\">5.4 Cartes d'accr\u00e9ditation</h3>\n<p>Onglet \u00ab \ud83e\udeaa Accr\u00e9ditation \u00bb (seulement pour les tournois publi\u00e9s). Cartes pour tous les sportifs du syst\u00e8me ainsi que les entra\u00eeneurs et soigneurs inscrits \u2013 entr\u00e9e gratuite.</p>\n<ol>\n<li>Choisir \u00ab Imprimer sur \u00bb : carte plastique sur l'imprimante \u00e0 cartes (chaque carte s\u00e9par\u00e9ment, format carte bancaire portrait 54 \u00d7 85,6 mm) ou papier A4 avec 9 cartes \u00e0 d\u00e9couper.</li>\n<li>\u00ab Imprimer toutes les cartes \u00bb, \u00ab Un seul club \u00bb ou \u00ab Carte \u00bb pour une personne.</li>\n<li>Pour les photos sans t\u00eate s\u00e9lectionn\u00e9e : \u00ab Recadrer la t\u00eate \u00bb.</li>\n<li>R\u00e9glages de l'imprimante \u00e0 cartes : format CR80 portrait, sans marges, \u00e9chelle 100 %, graphismes d'arri\u00e8re-plan activ\u00e9s.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>R\u00f4le</th>\n<th>Couleur sur la carte</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Sportif</td>\n<td>rouge</td>\n</tr>\n<tr>\n<td>Entra\u00eeneur</td>\n<td>bleu</td>\n</tr>\n<tr>\n<td>Soigneur</td>\n<td>vert</td>\n</tr>\n</tbody>\n</table>\n<p>Entr\u00e9e : scanner le code QR avec l'appareil photo d'un t\u00e9l\u00e9phone. \u00ab Accr\u00e9ditation valide \u00bb appara\u00eet avec nom, r\u00f4le et club \u2013 ou \u00ab Non valide \u00bb si la carte est falsifi\u00e9e ou la personne retir\u00e9e.</p>\n<h2 id=\"anl-6-superviseur-utiliser-la-carte-de-pointage\">6. Superviseur \u2013 utiliser la carte de pointage</h2>\n<p>Le superviseur enregistre l'\u00e9v\u00e9nement dans la carte, fixe le PIN des juges et confirme chaque r\u00e9sultat. Il utilise le navigateur (https://www.wbu-boxing.com/scorecard/) ou l'appli Android WBU-SC.</p>\n<p><strong>Remarque \u00ab Veuillez compl\u00e9ter \u00bb :</strong> s'il manque lors d'un gala le poids (coin rouge/bleu) ou la cat\u00e9gorie, seule la carte du superviseur affiche une remarque jaune \u2013 pas les juges. Compl\u00e9ter via \u00ab \u270e Modifier la carte \u00bb. Sans cat\u00e9gorie, le combat peut quand m\u00eame \u00eatre enregistr\u00e9.</p>\n<p><strong>R\u00e8gle d'\u00e2ge :</strong> si les dates de naissance des deux combattants sont saisies, WBU Sports et la carte v\u00e9rifient l'\u00e2ge le jour du combat : <strong>boxe masters</strong> au plus <strong>5 ans</strong> d'\u00e9cart (p. ex. 48 contre 52 autoris\u00e9), <strong>jeunes</strong> (moins de 18 ans) au plus <strong>2 ans</strong> d'\u00e9cart (p. ex. 14 contre 12 non autoris\u00e9). Sinon, le combat n'est pas accept\u00e9.</p>\n<p><strong>Envoi par la WBU :</strong> le super-administrateur WBU peut envoyer un gala sans mot de passe (via son compte). Ensuite seul le superviseur peut modifier la carte.</p>\n<h3 id=\"anl-6-1-se-connecter\">6.1 Se connecter</h3>\n<ol>\n<li>Toucher \u00ab Superviseur \u00bb, saisir pr\u00e9nom et nom.</li>\n<li>Saisir promoteur, lieu et date.</li>\n<li>Saisir le m\u00e9decin de ring \u2013 obligatoire, vaut pour tous les combats.</li>\n<li>Sous \u00ab Choisir le show \u00bb, toucher le show \u2013 seuls les shows y figurent. Sans internet au ring, ne choisir aucun show : l'appli cherche alors elle-m\u00eame WBU Sports sur la tablette par Bluetooth ou l'ordinateur se connecte seul (voir chapitres 10.1 et 10.2) : combats, noms, pays, \u00e2ge, poids, cat\u00e9gorie, titre, rounds, dur\u00e9e et m\u00e9decin de ring sont repris, figurent dans le r\u00e9sultat et le rapport PDF, et les r\u00e9sultats partent automatiquement vers WBU Sports. Pour un tournoi \u00e0 plusieurs rings, choisir son ring.</li>\n<li>Saisir le mot de passe superviseur WBU. Il emp\u00eache quiconque de se faire passer pour superviseur ; ne le donner qu'aux vrais superviseurs.</li>\n<li>Fixer le PIN des juges (4 chiffres, obligatoire dans le navigateur) et le communiquer aux juges.</li>\n<li>\u00ab C'est parti \u00bb.</li>\n</ol>\n<p>Dans l'appli, les juges se connectent par Bluetooth au t\u00e9l\u00e9phone du superviseur \u2013 sans internet. L'appli n'a besoin d'internet que pour la liaison avec WBU Sports.</p>\n<h3 id=\"anl-6-2-r-gler-un-combat\">6.2 R\u00e9gler un combat</h3>\n<ul>\n<li>Nombre de rounds (1\u201312), dur\u00e9e, nombre de juges (1\u20133), type de combat.</li>\n<li>Coin rouge et bleu avec pays \u00b7 \u00e2ge \u00b7 poids, cat\u00e9gorie ou titre (d\u00e9j\u00e0 remplis avec WBU Sports ; sans WBU Sports, le superviseur les saisit).</li>\n<li>Gala depuis WBU Sports : \u00ab \u270e Modifier la carte \u00bb change la carte pour tous (voir 3.2).</li>\n<li>Saisir arbitre et chronom\u00e9treur. Ils restent pour les combats suivants ; les noms enregistr\u00e9s d'arbitres et de juges peuvent \u00eatre touch\u00e9s.</li>\n<li>En haut figure le nombre de juges connect\u00e9s.</li>\n</ul>\n<h3 id=\"anl-6-3-voir-les-pointages\">6.3 Voir les pointages</h3>\n<p>Les pointages des juges apparaissent en direct, round par round, avec total. \u00ab termin\u00e9 \u00bb indique qui a cl\u00f4tur\u00e9 le combat. Le chat permet d'envoyer de courts messages aux juges.</p>\n<p><strong>Corriger :</strong> chaque round d'une carte peut \u00eatre touch\u00e9 et corrig\u00e9 si un juge s'est manifestement tromp\u00e9. Le round est marqu\u00e9 en or (avec l'ancienne valeur), la carte re\u00e7oit \u00ab Correction SV \u00bb, le rapport affiche un *.</p>\n<p><strong>Les juges notent sur papier :</strong> au-dessus de \u00ab Combat 1 \u00bb se trouve l'interrupteur \u00ab Les juges notent sur papier \u00bb. S'il est activ\u00e9, <strong>\u00ab \u270d\ufe0f Pointage papier \u00bb</strong> appara\u00eet sous les d\u00e9tails du combat : saisir les noms des juges (ils restent pour les combats suivants ; les noms enregistr\u00e9s peuvent \u00eatre touch\u00e9s), puis toucher chaque case et choisir le pointage de la fiche \u2013 10:9, 10:10, 9:10, 10:8, 8:10 ou \u00ab plus\u2026 \u00bb pour ses propres points et p\u00e9nalit\u00e9s. L'appli calcule les totaux ; le r\u00e9sultat est fix\u00e9 \u00ab d'apr\u00e8s les fiches \u00bb et confirm\u00e9 comme d'habitude. Un seul t\u00e9l\u00e9phone suffit.</p>\n<h3 id=\"anl-6-4-fixer-le-r-sultat\">6.4 Fixer le r\u00e9sultat</h3>\n<ol>\n<li>Choisir le r\u00e9sultat. Le syst\u00e8me propose une d\u00e9cision \u00e0 partir des pointages.</li>\n<li>Toucher le vainqueur.</li>\n<li>Pour KO, TKO, RTD (abandon au coin), disqualification et d\u00e9cision technique, saisir aussi round et temps, p. ex. round 3, 1:25.</li>\n<li>Enregistrer \u2013 le r\u00e9sultat part vers WBU Sports, le poste de contr\u00f4le, WBU Live et WBU Time.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>R\u00e9sultat</th>\n<th>Signification</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>UD / SD / MD</td>\n<td>d\u00e9cision unanime / partag\u00e9e / majoritaire</td>\n</tr>\n<tr>\n<td>KO / TKO</td>\n<td>avec round et temps</td>\n</tr>\n<tr>\n<td>RTD</td>\n<td>abandon au coin</td>\n</tr>\n<tr>\n<td>DQ</td>\n<td>disqualification</td>\n</tr>\n<tr>\n<td>TD</td>\n<td>d\u00e9cision technique</td>\n</tr>\n<tr>\n<td>W.O.</td>\n<td>forfait</td>\n</tr>\n<tr>\n<td>Nul, nul technique, no contest</td>\n<td>galas uniquement</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"anl-6-5-cl-ture\">6.5 Cl\u00f4ture</h3>\n<p>\u00ab Combat suivant \u00bb m\u00e8ne au combat suivant. \u00c0 la fin \u00ab Cl\u00f4turer l'\u00e9v\u00e9nement et cr\u00e9er le PDF \u00bb \u2013 avec double confirmation (\u00ab Oui, cl\u00f4turer \u00bb puis \u00ab Cl\u00f4turer d\u00e9finitivement et envoyer \u00bb) pour que rien ne parte par erreur. Un combat peut \u00eatre rouvert \u00e0 tout moment ; un \u00e9v\u00e9nement cl\u00f4tur\u00e9 peut aussi \u00eatre poursuivi avec \u00ab Rouvrir l'\u00e9v\u00e9nement \u00bb \u2013 \u00e0 la nouvelle cl\u00f4ture, les r\u00e9sultats partent \u00e0 la WBU comme correction. Le rapport contient chaque combat avec r\u00e9sultat, pointages, superviseur, arbitre, chronom\u00e9treur, m\u00e9decin de ring et juges. \u00ab Copier en texte \u00bb donne un r\u00e9sultat \u00e0 transmettre.</p>\n<p>\u00c0 la cl\u00f4ture, les r\u00e9sultats partent automatiquement \u00e0 la WBU : le bureau re\u00e7oit un e-mail avec le rapport PDF (info@wbu-boxing.com), et tous les combats apparaissent aussit\u00f4t sur la page publique <strong>R\u00e9sultats</strong> (https://www.wbu-boxing.com/live/?resultate=1) \u2013 avec titre, cat\u00e9gorie, noms, vainqueur, d\u00e9cision, round/temps et points des juges ; pour les tournois aussi les classements. Sans internet, l'envoi est refait automatiquement. Si le superviseur s'est connect\u00e9 sans mot de passe WBU (p. ex. avec une tablette par Bluetooth), la carte le demande une fois. Si l'\u00e9v\u00e9nement est rouvert et cl\u00f4tur\u00e9 \u00e0 nouveau, le nouvel \u00e9tat remplace l'ancien (e-mail avec \u00ab Correction \u00bb).</p>\n<h3 id=\"anl-6-6-t-l-phone-teint-batterie-vide-appli-ou-navigateur-ferm-s-on-continue\">6.6 T\u00e9l\u00e9phone \u00e9teint, batterie vide, appli ou navigateur ferm\u00e9s \u2013 on continue</h3>\n<p>Tout est enregistr\u00e9 durablement sur le t\u00e9l\u00e9phone apr\u00e8s chaque saisie. Apr\u00e8s red\u00e9marrage (m\u00eame t\u00e9l\u00e9phone, rouvrir l'appli ou le navigateur), on se retrouve exactement l\u00e0 o\u00f9 on s'\u00e9tait arr\u00eat\u00e9, sans nouvelle connexion \u2013 \u00ab \u2713 On reprend comme avant le red\u00e9marrage \u2013 rien de perdu \u00bb appara\u00eet bri\u00e8vement en haut.\n- <strong>Superviseur :</strong> carte, toutes les fiches, r\u00e9sultats et combat ouvert restent ; la liaison avec les juges, WBU Sports et le moniteur live red\u00e9marre seule.\n- <strong>Juge :</strong> le combat en cours reste avec tous les rounds (m\u00eame ceux seulement \u00ab enregistr\u00e9s \u00bb, non envoy\u00e9s) et le round r\u00e9gl\u00e9 \u2013 pas de nouveau PIN, pas de fiche en double chez le superviseur. Les rounds non envoy\u00e9s partent avec le prochain envoi.\n- La sauvegarde vaut jusqu'\u00e0 \u00ab Se d\u00e9connecter \u00bb ou au plus 20 heures (donc seulement le jour de l'\u00e9v\u00e9nement). Ne pas travailler en mode priv\u00e9/incognito \u2013 il efface tout \u00e0 la fermeture.</p>\n<h2 id=\"anl-7-juges-noter-avec-la-carte-de-pointage\">7. Juges \u2013 noter avec la carte de pointage</h2>\n<p>Les juges notent chaque round selon le syst\u00e8me des 10 points sur leur t\u00e9l\u00e9phone. Il leur faut seulement leur nom et le PIN du superviseur.</p>\n<h3 id=\"anl-7-1-se-connecter\">7.1 Se connecter</h3>\n<ul>\n<li>Navigateur : ouvrir <a target=\"_blank\" href=\"https://www.wbu-boxing.com/scorecard/,\">https://www.wbu-boxing.com/scorecard/,</a> toucher \u00ab Juge \u00bb, saisir pr\u00e9nom et nom et le PIN du superviseur, \u00ab C'est parti \u00bb. On arrive directement \u00e0 la carte ; un PIN erron\u00e9 est refus\u00e9.</li>\n<li>Appli : activer le Bluetooth, choisir \u00ab Juge \u00bb et le nom \u2013 l'appli se connecte au t\u00e9l\u00e9phone du superviseur, m\u00eame sans internet.</li>\n</ul>\n<p>En haut figure \u00ab Connect\u00e9 en ligne \u00bb avec le nom de l'\u00e9v\u00e9nement. Sans connexion, les pointages sont enregistr\u00e9s et envoy\u00e9s automatiquement plus tard.</p>\n<h3 id=\"anl-7-2-noter-un-round\">7.2 Noter un round</h3>\n<ol>\n<li>Toucher les points pour rouge et bleu : le vainqueur du round 10, l'autre 9 (en cas de knockdown ou de nette sup\u00e9riorit\u00e9 8 ou moins).</li>\n<li>P\u00e9nalit\u00e9s pour avertissements : toucher \u22121 \u00e0 \u22124 sous le coin ; toucher \u00e0 nouveau les retire.</li>\n<li>En bas appara\u00eet le total du round, p. ex. 10 : 9.</li>\n<li>\u00ab Envoyer le round \u00bb envoie aussit\u00f4t le round au superviseur. \u00ab Enregistrer le round (sans envoyer) \u00bb le garde seulement \u2013 selon l'annonce du superviseur.</li>\n</ol>\n<h3 id=\"anl-7-3-corriger-et-cl-turer\">7.3 Corriger et cl\u00f4turer</h3>\n<ul>\n<li>Dans la liste en bas, chaque round peut \u00eatre touch\u00e9 et corrig\u00e9.</li>\n<li>Apr\u00e8s le dernier round \u00ab Cl\u00f4turer le combat \u00bb. \u00ab Termin\u00e9 \u2013 arriv\u00e9 chez le superviseur \u00bb appara\u00eet avec tous les rounds.</li>\n<li>\u00ab Combat termin\u00e9 avant la limite (KO / TKO / RTD \u2026) \u00bb si le combat finit avant le dernier round.</li>\n<li>\u00ab Combat suivant \u00bb ouvre une carte vide.</li>\n<li>Le chat permet d'envoyer de courts messages au superviseur (p. ex. \u00ab J'ai corrig\u00e9 \u00bb, \u00ab Venez un instant, s'il vous pla\u00eet \u00bb).</li>\n</ul>\n<h2 id=\"anl-8-arbitre-chronom-treur-et-m-decin-de-ring\">8. Arbitre, chronom\u00e9treur et m\u00e9decin de ring</h2>\n<table>\n<thead>\n<tr>\n<th>R\u00f4le</th>\n<th>T\u00e2che dans le syst\u00e8me</th>\n<th>O\u00f9</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Arbitre</td>\n<td>saisi par le superviseur \u00e0 chaque combat, reste pour les suivants ; il ne manipule rien lui-m\u00eame</td>\n<td>carte du superviseur</td>\n</tr>\n<tr>\n<td>Chronom\u00e9treur</td>\n<td>utilise le chrono : D\u00c9PART, STOP (le temps mort tourne seul), CONTINUER, relancer le round ; les signaux sont automatiques</td>\n<td>poste de contr\u00f4le ou poste de commande au ring</td>\n</tr>\n<tr>\n<td>M\u00e9decin de ring</td>\n<td>saisi une fois avant le d\u00e9part, vaut pour tous les combats ; sans lui le chrono ne d\u00e9marre pas</td>\n<td>WBU Sports (\u00e9v\u00e9nement ou poste de contr\u00f4le) et carte</td>\n</tr>\n</tbody>\n</table>\n<p>Tous les noms figurent dans le r\u00e9sultat de chaque combat et dans le rapport PDF du superviseur.</p>\n<h2 id=\"anl-9-spectateurs-wbu-live-moniteur-live-r-sultats-et-classement-mondial\">9. Spectateurs \u2013 WBU Live, moniteur live, r\u00e9sultats et classement mondial</h2>\n<p>WBU Live montre sans connexion qui est sur le ring, qui doit se pr\u00e9parer, tous les r\u00e9sultats et les classements.</p>\n<ul>\n<li>Sur le t\u00e9l\u00e9phone : <a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/\">https://www.wbu-boxing.com/live/</a> \u2013 toucher l'\u00e9v\u00e9nement, avec plusieurs rings choisir le ring. Onglets : prochains combats, combats pr\u00e9c\u00e9dents, classements.</li>\n<li>Sur l'\u00e9cran de la salle : ouvrir le lien t\u00e9l\u00e9viseur de WBU Sports (onglet liste des combats) dans le navigateur du t\u00e9l\u00e9viseur ou du Fire TV. Il montre tous les combats \u00e0 venir ; vert est sur le ring, jaune doit se pr\u00e9parer.</li>\n<li>Les deux se mettent \u00e0 jour seuls tant que le PC avec WBU Sports est en ligne.</li>\n</ul>\n<h3 id=\"anl-9-1-moniteur-live-sur-la-page-d-accueil-wbu\">9.1 Moniteur live sur la page d'accueil WBU</h3>\n<ul>\n<li>D\u00e8s que le <strong>superviseur</strong> s'est connect\u00e9 au gala <strong>le jour de l'\u00e9v\u00e9nement</strong> (carte connect\u00e9e, combats encore ouverts ; les tests des jours pr\u00e9c\u00e9dents ne comptent pas), un <strong>moniteur live</strong> appara\u00eet automatiquement sur la page d'accueil WBU juste sous le menu \u2013 sans entr\u00e9e de menu, sans clic.</li>\n<li><strong>\u00c0 gauche :</strong> le combat en cours \u2013 num\u00e9ro, combat pour le titre, coins rouge et bleu avec salle et pays, cat\u00e9gorie, sport, rounds \u00d7 minutes. Si le chronom\u00e9trage passe par WBU Time, round et temps s'affichent en grand dessous (aussi pause et temps mort) ; en chronom\u00e9trage analogique, cela n'appara\u00eet simplement pas. Dessous, le dernier r\u00e9sultat et le combat suivant.</li>\n<li><strong>\u00c0 droite :</strong> toute la carte \u00e0 faire d\u00e9filer \u2013 combats termin\u00e9s avec r\u00e9sultat et vainqueur, le combat en cours en jaune.</li>\n<li>Les r\u00e9sultats apparaissent d\u00e8s que le superviseur cl\u00f4ture le combat. Les points par round et les noms des juges ne sont pas affich\u00e9s.</li>\n<li>Si plusieurs galas ont lieu en m\u00eame temps, plusieurs moniteurs apparaissent les uns sous les autres.</li>\n<li>Quand tous les combats sont termin\u00e9s, le moniteur reste encore 30 minutes puis dispara\u00eet. Les r\u00e9sultats sont ensuite sur la page des r\u00e9sultats.</li>\n<li>Fond clair, texte noir, rouge et bleu \u2013 comme WBU Live et WBU Time. Sur t\u00e9l\u00e9phone, empil\u00e9 ; la carte d\u00e9file au doigt.</li>\n</ul>\n<p><strong>Direct YouTube :</strong> sous \u00ab \u00c9v\u00e9nement \u00bb, l'organisateur peut saisir un lien YouTube \u2013 vers la vid\u00e9o (p. ex. youtube.com/live/\u2026) ou la cha\u00eene (youtube.com/channel/UC\u2026, ce qui y est en direct est alors diffus\u00e9). D\u00e8s que le superviseur se connecte, la vid\u00e9o appara\u00eet en 16:9 au-dessus du moniteur live, de m\u00eame largeur \u2013 seulement l'image, sans commentaires ni suggestions. Plein \u00e9cran via l'ic\u00f4ne en bas \u00e0 droite de la vid\u00e9o, sur t\u00e9l\u00e9phone il suffit de tourner. La vid\u00e9o d\u00e9marre sans son (exigence des navigateurs) \u2013 toucher une fois le haut-parleur. Sans lien, il n'y a que le moniteur live.</p>\n<h3 id=\"anl-9-2-r-sultats\">9.2 R\u00e9sultats</h3>\n<ul>\n<li><a target=\"_blank\" href=\"https://www.wbu-boxing.com/results/\">https://www.wbu-boxing.com/results/</a> \u2013 tous les r\u00e9sultats des galas et tournois WBU, transmis automatiquement par le superviseur, sans connexion. Les tournois montrent les classements (1er, 2e, 3e).</li>\n<li>En 5 langues (EN, DE, ES, FR, RU), recherche par nom, \u00e9v\u00e9nement ou lieu.</li>\n</ul>\n<h3 id=\"anl-9-3-classement-mondial-wbu\">9.3 Classement mondial WBU</h3>\n<ul>\n<li><a target=\"_blank\" href=\"https://www.wbu-boxing.com/rankings/\">https://www.wbu-boxing.com/rankings/</a> \u2013 le top 15 selon BoxRec par cat\u00e9gorie pro plus les champions WBU \u00e0 leur position (avec couronne), deux colonnes, kg/lbs commutable, recherche, 5 langues.</li>\n</ul>\n<h2 id=\"anl-10-t-l-chargements-mises-jour-et-travail-sans-internet\">10. T\u00e9l\u00e9chargements, mises \u00e0 jour et travail sans internet</h2>\n<p>WBU Sports existe sous plusieurs formes. Toutes fonctionnent et se pr\u00e9sentent de la m\u00eame mani\u00e8re.</p>\n<table>\n<thead>\n<tr>\n<th>Version</th>\n<th>Pour qui</th>\n<th>Internet n\u00e9cessaire</th>\n<th>T\u00e9l\u00e9chargement</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Version navigateur</td>\n<td>tous : inscription, WBU Sports, carte, WBU Live, WBU Time</td>\n<td>oui</td>\n<td>sans installation \u2013 <a target=\"_blank\" href=\"https://www.wbu-boxing.com/anmeldung/\">https://www.wbu-boxing.com/anmeldung/</a></td>\n</tr>\n<tr>\n<td>WBU Sports pour Windows (programme)</td>\n<td>organisateur et poste de contr\u00f4le sur l'ordinateur, avec Bluetooth, Wi-Fi de la salle et t\u00e9l\u00e9viseur en HDMI</td>\n<td>non</td>\n<td><a target=\"_blank\" href=\"https://github.com/energyfighter/wbu-sc-download/raw/windows/WBU-Sports-Setup.exe\">https://github.com/energyfighter/wbu-sc-download/raw/windows/WBU-Sports-Setup.exe</a></td>\n</tr>\n<tr>\n<td>WBU Sports en appli tablette (Android)</td>\n<td>organisateur et poste de contr\u00f4le au ring, avec t\u00e9l\u00e9viseur en HDMI</td>\n<td>non (Bluetooth vers le superviseur)</td>\n<td><a target=\"_blank\" href=\"https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-Sports.apk\">https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-Sports.apk</a></td>\n</tr>\n<tr>\n<td>Appli carte de pointage Android (t\u00e9l\u00e9phone et tablette)</td>\n<td>superviseur et juges</td>\n<td>non (Bluetooth)</td>\n<td><a target=\"_blank\" href=\"https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-SC.apk\">https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-SC.apk</a></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"anl-10-1-installer-wbu-sports-pour-windows\">10.1 Installer WBU Sports pour Windows</h3>\n<ol>\n<li>T\u00e9l\u00e9charger \u00ab WBU-Sports-Setup.exe \u00bb (environ 10 Mo) et double-cliquer. Si Windows affiche \u00ab Windows a prot\u00e9g\u00e9 votre ordinateur \u00bb : \u00ab Informations compl\u00e9mentaires \u00bb \u2013 \u00ab Ex\u00e9cuter quand m\u00eame \u00bb.</li>\n<li>\u00ab Installer \u00bb \u2013 s'il manque Microsoft .NET sur le PC, le programme d'installation le t\u00e9l\u00e9charge une fois (Windows demande une fois \u00ab Oui \u00bb).</li>\n<li>\u00ab WBU Sports \u00bb appara\u00eet sur le bureau. Le programme s'ouvre dans sa propre fen\u00eatre \u2013 sans connexion. Les donn\u00e9es restent sur l'ordinateur, m\u00eame lors des mises \u00e0 jour.</li>\n<li><strong>Superviseur par Bluetooth :</strong> activer le Bluetooth de l'ordinateur. Au poste de contr\u00f4le \u00ab \ud83d\udcf6 D\u00e9marrer le Bluetooth \u00bb. Sur le t\u00e9l\u00e9phone du superviseur, se connecter normalement \u00e0 l'appli carte sans choisir de show \u2013 rien d'autre. L'ordinateur trouve le t\u00e9l\u00e9phone seul, envoie la liste des combats et re\u00e7oit les r\u00e9sultats.</li>\n<li><strong>T\u00e9l\u00e9viseur en HDMI :</strong> brancher le t\u00e9l\u00e9viseur, touche Windows + P et choisir \u00ab \u00c9tendre \u00bb. Au poste de contr\u00f4le \u00ab \u23f1 WBU Time \u00bb ou \u00ab \ud83d\udccb Liste des combats \u00bb \u2013 l'affichage appara\u00eet en plein \u00e9cran sur le t\u00e9l\u00e9viseur.</li>\n<li><strong>Wi-Fi de la salle :</strong> voir 10.3.</li>\n</ol>\n<p>Un \u00e9v\u00e9nement du navigateur passe dans le programme avec \u00ab Enregistrer une sauvegarde (.json) \u00bb et \u00ab Restaurer une sauvegarde \u00bb.</p>\n<h3 id=\"anl-10-1a-cr-er-un-v-nement-programme-windows-et-appli-tablette\">10.1a Cr\u00e9er un \u00e9v\u00e9nement (programme Windows et appli tablette)</h3>\n<ul>\n<li>La pr\u00e9paration fonctionne sans internet : nom, date, lieu, carte ou cat\u00e9gories et participants.</li>\n<li>Un \u00e9v\u00e9nement ne peut \u00eatre <strong>utilis\u00e9</strong> qu'une fois <strong>cr\u00e9\u00e9</strong> : appuyer en haut sur \u00ab \u2705 Cr\u00e9er l'\u00e9v\u00e9nement \u00bb \u2013 il faut pour cela une fois <strong>internet</strong> et le <strong>mot de passe organisateur</strong> (fourni par la WBU). La WBU re\u00e7oit automatiquement un e-mail d'information.</li>\n<li>Avant cela, poste de contr\u00f4le, liste des combats, tableaux, r\u00e9sultats, dipl\u00f4mes, accr\u00e9ditation, impression, t\u00e9l\u00e9viseur et liaison superviseur sont <strong>verrouill\u00e9s (\ud83d\udd12)</strong>. Sans internet, la remarque \u00ab Veuillez vous connecter \u00e0 internet \u00bb appara\u00eet.</li>\n<li>Ensuite tout fonctionne aussi sans internet. Dans le navigateur (avec un compte WBU Sports), ce verrou n'existe pas.</li>\n</ul>\n<h3 id=\"anl-10-2-wbu-sports-en-appli-tablette-android\">10.2 WBU Sports en appli tablette (Android)</h3>\n<p>L'appli tablette, c'est WBU Sports \u00e0 emporter : tout sur la tablette, au ring aussi sans internet.</p>\n<ol>\n<li>T\u00e9l\u00e9charger le fichier APK \u00ab WBU-Sports.apk \u00bb sur la tablette et le toucher, une fois \u00ab Autoriser les applis de cette source \u00bb, puis \u00ab Installer \u00bb.</li>\n<li>Mettre l'\u00e9v\u00e9nement sur la tablette : soit le cr\u00e9er directement sur la tablette (avec internet, l'inscription en ligne et la mise en direct fonctionnent comme dans le navigateur), soit sur le PC \u00ab Enregistrer une sauvegarde (.json) \u00bb, envoyer le fichier \u00e0 la tablette (p. ex. par e-mail ou USB) et dans l'appli \u00ab Restaurer une sauvegarde \u00bb.</li>\n<li><strong>Superviseur par Bluetooth :</strong> au poste de contr\u00f4le toucher \u00ab \ud83d\udcf6 D\u00e9marrer le Bluetooth \u00bb. Sur le t\u00e9l\u00e9phone du superviseur, se connecter normalement \u00e0 l'appli carte sans choisir de show \u2013 l'appli trouve la tablette seule. La liste des combats avec noms, titre et rounds vient de la tablette, les r\u00e9sultats confirm\u00e9s y retournent automatiquement. Les juges se connectent comme toujours au t\u00e9l\u00e9phone du superviseur.</li>\n<li><strong>T\u00e9l\u00e9viseur par c\u00e2ble :</strong> relier la tablette au t\u00e9l\u00e9viseur avec un adaptateur USB-C vers HDMI. Le poste de contr\u00f4le affiche \u00ab \ud83d\udcfa T\u00e9l\u00e9viseur (HDMI) \u2013 connect\u00e9 \u00bb : \u00ab \u23f1 WBU Time \u00bb affiche le chrono sur le t\u00e9l\u00e9viseur, \u00ab \ud83d\udccb Liste des combats \u00bb les prochains combats. Sur la tablette, on continue d'utiliser le poste de contr\u00f4le.</li>\n<li><strong>Imprimer :</strong> liste des combats, tableaux, dipl\u00f4mes et cartes d'accr\u00e9ditation passent par la bo\u00eete d'impression Android vers une imprimante Wi-Fi ou en PDF.</li>\n<li><strong>Sauvegarde :</strong> \u00ab Enregistrer une sauvegarde (.json) \u00bb place le fichier dans le dossier \u00ab Download \u00bb de la tablette.</li>\n</ol>\n<p>Avec internet, l'appli tablette fonctionne en plus exactement comme la version navigateur (inscription en ligne, paiements, mise en direct, WBU Live et WBU Time via le r\u00e9seau).</p>\n<h3 id=\"anl-10-3-wi-fi-de-la-salle-autant-de-t-l-viseurs-que-voulu-sans-internet-ni-c-bles\">10.3 Wi-Fi de la salle : autant de t\u00e9l\u00e9viseurs que voulu, sans internet ni c\u00e2bles</h3>\n<p>L'appli tablette et le programme Windows peuvent ouvrir leur propre Wi-Fi. Tous les t\u00e9l\u00e9viseurs (p. ex. Fire TV) et t\u00e9l\u00e9phones qui s'y connectent affichent WBU Live et WBU Time \u2013 pour chaque ring \u2013 sans internet.</p>\n<ol>\n<li>Au poste de contr\u00f4le toucher \u00ab \ud83d\udce1 D\u00e9marrer le Wi-Fi de la salle \u00bb.</li>\n<li>Le nom et le mot de passe du Wi-Fi apparaissent (ordinateur : \u00ab WBU-Halle \u00bb / \u00ab wbuboxing \u00bb ; tablette : d\u00e9finis par la tablette) ainsi que les adresses.</li>\n<li>Connecter le t\u00e9l\u00e9viseur au Wi-Fi et ouvrir l'adresse affich\u00e9e dans le navigateur (Fire TV : Silk) :</li>\n<li>WBU Time pour ring 1, ring 2 \u2026 (une adresse par ring),</li>\n<li>liste des combats pour l'\u00e9cran de la salle,</li>\n<li>WBU Live pour les t\u00e9l\u00e9phones.</li>\n<li>Sur l'ordinateur, le pare-feu Windows demande la premi\u00e8re fois : \u00ab Autoriser l'acc\u00e8s \u00bb (cocher r\u00e9seaux priv\u00e9s et publics).</li>\n</ol>\n<p>Si aucun Wi-Fi propre ne peut \u00eatre lanc\u00e9 (certains appareils le bloquent), les m\u00eames adresses fonctionnent aussi via un routeur Wi-Fi existant ou un point d'acc\u00e8s mobile auquel tablette/ordinateur et t\u00e9l\u00e9viseur sont connect\u00e9s. Avec internet, WBU Live et WBU Time continuent en plus via www.wbu-boxing.com.</p>\n<h3 id=\"anl-10-4-installer-l-appli-carte-de-pointage-android\">10.4 Installer l'appli carte de pointage Android</h3>\n<ol>\n<li>T\u00e9l\u00e9charger le fichier APK sur le t\u00e9l\u00e9phone ou la tablette et le toucher.</li>\n<li>Autoriser une fois \u00ab Autoriser les applis de cette source \u00bb, puis \u00ab Installer \u00bb.</li>\n<li>Activer Bluetooth et localisation.</li>\n</ol>\n<p>Superviseur et juges se connectent directement par Bluetooth \u2013 sans internet et sans Wi-Fi dans la salle. L'appli n'a besoin d'internet que pour reprendre un \u00e9v\u00e9nement de WBU Sports et y envoyer les r\u00e9sultats ; en cas de coupure br\u00e8ve, les r\u00e9sultats sont renvoy\u00e9s automatiquement.</p>\n<h3 id=\"anl-10-5-mises-jour\">10.5 Mises \u00e0 jour</h3>\n<ul>\n<li>Version navigateur : toujours \u00e0 jour automatiquement. Si une page affiche encore l'ancienne version, appuyer sur Ctrl + F5.</li>\n<li>Applis Android (carte et WBU Sports tablette) : v\u00e9rifient \u00e0 chaque d\u00e9marrage s'il existe une nouvelle version. Une remarque \u00ab Installer la mise \u00e0 jour \u00bb appara\u00eet alors \u2013 la toucher, la mise \u00e0 jour se t\u00e9l\u00e9charge et s'installe seule. Pas besoin de boutique d'applis. Si Android annule la premi\u00e8re tentative (certains t\u00e9l\u00e9phones v\u00e9rifient d'abord l'appli avec Play Protect), l'appli relance l'installation en silence \u2013 aucun message d'erreur (\u00e0 partir de la version 1.145).</li>\n<li>Programme Windows : affiche au d\u00e9marrage (avec internet) \u00ab Nouvelle version \u00bb \u2013 toucher \u00ab Installer la mise \u00e0 jour \u00bb : il se t\u00e9l\u00e9charge, s'installe et red\u00e9marre apr\u00e8s quelques secondes. Les donn\u00e9es sont conserv\u00e9es.</li>\n</ul>\n<p><strong>T\u00e9l\u00e9phones Xiaomi (Mi Protect) :</strong> Lors des mises \u00e0 jour, Xiaomi affiche \u00ab Appli \u00e0 risque \u2013 source d'installation \u00e0 risque \u00bb. Le t\u00e9l\u00e9phone le fait pour toute appli hors boutique \u2013 l'appli WBU est s\u00fbre. Touchez <strong>\u00ab Ignorer \u00bb</strong>, puis <strong>\u00ab Mettre \u00e0 jour \u00bb</strong>. Pour le d\u00e9sactiver : Param\u00e8tres \u2192 Applis \u2192 Programme d'installation (\u2699) \u2192 d\u00e9sactiver \u00ab Contr\u00f4le de s\u00e9curit\u00e9 \u00bb/\u00ab Mi Protect \u00bb.</p>\n<h2 id=\"anl-11-questions-et-probl-mes-fr-quents\">11. Questions et probl\u00e8mes fr\u00e9quents</h2>\n<table>\n<thead>\n<tr>\n<th>Probl\u00e8me</th>\n<th>Solution</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>WBU Sports affiche \u00ab Veuillez d'abord vous connecter \u00bb</td>\n<td>se connecter sur la page d'inscription ; avec un mauvais r\u00f4le toucher \u00ab Continuer comme organisateur \u00bb</td>\n</tr>\n<tr>\n<td>La page affiche encore l'ancienne version</td>\n<td>appuyer sur Ctrl + F5</td>\n</tr>\n<tr>\n<td>Le chrono ne d\u00e9marre pas</td>\n<td>saisir le m\u00e9decin de ring au poste de contr\u00f4le</td>\n</tr>\n<tr>\n<td>Le juge ne peut pas entrer</td>\n<td>demander le PIN au superviseur ; le superviseur doit \u00eatre connect\u00e9 en premier</td>\n</tr>\n<tr>\n<td>L'\u00e9v\u00e9nement manque dans la carte</td>\n<td>dans WBU Sports \u00ab Mettre en direct \u00bb ; le PC avec WBU Sports doit \u00eatre en ligne</td>\n</tr>\n<tr>\n<td>WBU Live ou WBU Time est fig\u00e9</td>\n<td>v\u00e9rifier internet sur le PC avec WBU Sports ; pr\u00e9voir un point d'acc\u00e8s mobile de secours \u2013 ou travailler sans internet avec la version Windows et l'appli (chapitre 10)</td>\n</tr>\n<tr>\n<td>Pas de son sur le t\u00e9l\u00e9viseur</td>\n<td>toucher une fois \u00ab Muet \u2013 activer le son \u00bb</td>\n</tr>\n<tr>\n<td>Le navigateur remplit le mot de passe dans un mauvais champ</td>\n<td>vider le champ ; supprimer l'entr\u00e9e enregistr\u00e9e via l'ic\u00f4ne de cl\u00e9 dans la barre d'adresse</td>\n</tr>\n<tr>\n<td>Nouveau PC, l'\u00e9v\u00e9nement manque</td>\n<td>\u00ab Restaurer une sauvegarde \u00bb avec la sauvegarde .json</td>\n</tr>\n<tr>\n<td>Dipl\u00f4me sans or ni drapeau</td>\n<td>cocher les graphismes d'arri\u00e8re-plan \u00e0 l'impression</td>\n</tr>\n</tbody>\n</table>\n<p>Questions \u00e0 la WBU : dm@wbu-boxing.com \u00b7 www.wbu-boxing.com</p>", "ru": "<p>WBU Sports \u2013 \u0441\u0438\u0441\u0 42 \u0434\u0435\u0439\u0441\u0442\u0432\u0443\u0435\u0442 \u0434\u043b\u044f \u0432\u0441\u0435\u0445 \u0442\u0443\u0440\u043d\u0438\u0440\u043e\u0432 WBU.</p>\n<h3 id=\"anl-1-1\">1.1 \u0421\u043e\u0437\u0434\u0430\u0442\u044c \u0430\u043a\u043a\u0430\u0443\u043d\u0442</h3>\n<ol>\n<li>\u041e\u0442\u043a\u0440\u044b\u0442\u044c <a target=\"_blank\" href=\"https://www.wbu-boxing.com/anmeldung/\">https://www.wbu-boxing.com/anmeldung/</a> (\u0432 \u043c\u0435\u043d\u044e \u0441\u0430\u0439\u0442\u0430 WBU: WBU Sports).</li>\n<li>\u041d\u0430\u0436\u0430\u0442\u044c \u00ab\u0417\u0430\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0440\u043e\u0432\u0430\u0442\u044c\u0441\u044f\u00bb.</li>\n<li>\u0412 \u043f\u043e\u043b\u0435 \u00ab\u042f\u00bb \u0432\u044b\u0431\u0440\u0430\u0442\u044c \u0440\u043e\u043b\u044c: \u043a\u043b\u0443\u0431/\u0437\u0430\u043b, \u0442\u0440\u0435\u043d\u0435\u0440, \u0438\u043d\u0434\u0438\u0432\u0438\u0434\u0443\u0430\u043b\u044c\u043d\u044b\u0439 \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d \u0438\u043b\u0438 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440.</li>\n<li>\u0412\u0432\u0435\u0441\u0442\u0438 \u043a\u043b\u0443\u0431, \u0438\u043c\u044f \u0438 \u0444\u0430\u043c\u0438\u043b\u0438\u044e, \u0442\u0435\u043b\u0435\u0444\u043e\u043d, e-mail \u0438 \u043f\u0430\u0440\u043e\u043b\u044c (\u043c\u0438\u043d\u0438\u043c\u0443\u043c 6 \u0441\u0438\u043c\u0432\u043e\u043b\u043e\u0432).</li>\n<li>\u041d\u0430\u0436\u0430\u0442\u044c \u00ab\u0421\u043e\u0437\u0434\u0430\u0442\u044c \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u00bb. \u0414\u0430\u043b\u044c\u0448\u0435 \u0432\u0445\u043e\u0434 \u0441 e-mail \u0438 \u043f\u0430\u0440\u043e\u043b\u0435\u043c.</li>\n</ol>\n<p>\u0412\u0445\u043e\u0434 \u0434\u0435\u0439\u0441\u0442\u0432\u0443\u0435\u0442 \u0432\u043e \u0432\u0441\u0435\u0445 \u0432\u043a\u043b\u0430\u0434\u043a\u0430\u0445 \u0438 \u0437\u0430\u043a\u0430\u043d\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u043f\u0440\u0438 \u0437\u0430\u043a\u0440\u044b\u0442\u0438\u0438 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0430 \u0438\u043b\u0438 \u043f\u043e \u043a\u043d\u043e\u043f\u043a\u0435 \u00ab\u0412\u044b\u0439\u0442\u0438\u00bb. \u0420\u043e\u043b\u044c \u043c\u0435\u043d\u044f\u0435\u0442\u0441\u044f \u0432\u0432\u0435\u0440\u0445\u0443 \u0441\u043f\u0440\u0430\u0432\u0430 \u0432 \u00ab\u0421\u043c\u0435\u043d\u0438\u0442\u044c \u0440\u043e\u043b\u044c\u00bb. \u0417\u0430\u0431\u044b\u043b\u0438 \u043f\u0430\u0440\u043e\u043b\u044c: \u043d\u0430\u0436\u0430\u0442\u044c \u00ab\u0417\u0430\u0431\u044b\u043b\u0438 \u043f\u0430\u0440\u043e\u043b\u044c?\u00bb, \u043a\u043e\u0434 \u043f\u0440\u0438\u0434\u0451\u0442 \u043d\u0430 e-mail.</p>\n<h3 id=\"anl-1-2\">1.2 \u041e\u0442\u043a\u0440\u044b\u0442\u044c \u0442\u0443\u0440\u043d\u0438\u0440</h3>\n<p>\u0423 \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0442\u0443\u0440\u043d\u0438\u0440\u0430 \u0435\u0441\u0442\u044c \u043f\u0443\u0431\u043b\u0438\u0447\u043d\u0430\u044f \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0430 \u0441 \u0434\u0430\u0442\u043e\u0439, \u043c\u0435\u0441\u0442\u043e\u043c, \u0432\u0437\u043d\u043e\u0441\u043e\u043c, \u043e\u043a\u043e\u043d\u0447\u0430\u043d\u0438\u0435\u043c \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438 \u0438 \u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u0435\u043c \u2013 \u0438 \u0431\u0435\u0437 \u0432\u0445\u043e\u0434\u0430. \u041f\u043e\u0441\u043b\u0435 \u0432\u0445\u043e\u0434\u0430 \u043d\u0430\u0436\u0430\u0442\u044c \u043d\u0430 \u0442\u0443\u0440\u043d\u0438\u0440 \u0432 \u0441\u043f\u0438\u0441\u043a\u0435. \u0412\u0432\u0435\u0440\u0445\u0443 \u0432\u043a\u043b\u0430\u0434\u043a\u0438: \u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f, \u041c\u043e\u0438 \u0437\u0430\u044f\u0432\u043a\u0438 \u0438 \u043e\u043f\u043b\u0430\u0442\u0430, \u0423\u0447\u0430\u0441\u0442\u043d\u0438\u043a\u0438, \u041a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438, \u041a\u043b\u0443\u0431\u044b \u0438 \u0442\u0440\u0435\u043d\u0435\u0440\u044b.</p>\n<h3 id=\"anl-1-3\">1.3 \u0412\u043d\u0435\u0441\u0442\u0438 \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u043e\u0432</h3>\n<ol>\n<li>\u0412\u043a\u043b\u0430\u0434\u043a\u0430 \u00ab\u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f\u00bb.</li>\n<li>\u0412\u044b\u0431\u0440\u0430\u0442\u044c \u0432\u0438\u0434 \u0441\u043f\u043e\u0440\u0442\u0430 (\u0431\u043e\u043a\u0441 \u043f\u043e\u043b\u0443\u043f\u0440\u043e\u0444\u0438, \u043a\u0438\u043a\u0431\u043e\u043a\u0441\u0438\u043d\u0433 K1, \u0431\u043e\u043a\u0441 \u043c\u0430\u0441\u0442\u0435\u0440\u0441, Shadow Boxing Battle).</li>\n<li>\u0412\u0432\u0435\u0441\u0442\u0438 \u0438\u043c\u044f, \u0444\u0430\u043c\u0438\u043b\u0438\u044e, \u0434\u0430\u0442\u0443 \u0440\u043e\u0436\u0434\u0435\u043d\u0438\u044f, \u043f\u043e\u043b \u0438 \u0432\u0435\u0441. \u041a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f \u043e\u043f\u0440\u0435\u0434\u0435\u043b\u044f\u0435\u0442\u0441\u044f \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u043f\u043e \u0432\u043e\u0437\u0440\u0430\u0441\u0442\u0443 \u0432 \u0434\u0435\u043d\u044c \u0442\u0443\u0440\u043d\u0438\u0440\u0430, \u043f\u043e\u043b\u0443 \u0438 \u0432\u0435\u0441\u0443.</li>\n<li>\u0412\u0432\u0435\u0441\u0442\u0438 \u043a\u043b\u0443\u0431, \u0441\u0442\u0440\u0430\u043d\u0443, \u0442\u0440\u0435\u043d\u0435\u0440\u0430 \u0438 e-mail.</li>\n<li>\u0412\u044b\u0431\u0440\u0430\u0442\u044c \u0444\u043e\u0442\u043e (\u043f\u043e \u0436\u0435\u043b\u0430\u043d\u0438\u044e). \u041e\u0442\u043a\u0440\u043e\u0435\u0442\u0441\u044f \u043e\u043a\u043d\u043e \u00ab\u0412\u044b\u0431\u0440\u0430\u0442\u044c \u0433\u043e\u043b\u043e\u0432\u0443\u00bb: \u043d\u0430\u0432\u0435\u0434\u0438\u0442\u0435 \u043a\u0440\u0430\u0441\u043d\u0443\u044e \u0440\u0430\u043c\u043a\u0443 \u043d\u0430 \u0433\u043e\u043b\u043e\u0432\u0443, \u0438\u0437\u043c\u0435\u043d\u0438\u0442\u0435 \u0440\u0430\u0437\u043c\u0435\u0440 \u043f\u043e\u043b\u0437\u0443\u043d\u043a\u043e\u043c, \u00ab\u041f\u0440\u0438\u043c\u0435\u043d\u0438\u0442\u044c\u00bb. \u0413\u043e\u043b\u043e\u0432\u0430 \u043f\u043e\u0442\u043e\u043c \u043f\u043e\u044f\u0432\u0438\u0442\u0441\u044f \u043d\u0430 \u0430\u043a\u043a\u0440\u0435\u0434\u0438\u0442\u0430\u0446\u0438\u043e\u043d\u043d\u043e\u0439 \u043a\u0430\u0440\u0442\u0435.</li>\n<li>\u0417\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u044b, \u0435\u0441\u043b\u0438 \u043e\u043d\u0438 \u0443\u0436\u0435 \u0435\u0441\u0442\u044c (\u0441\u043c. 1.4) \u2013 \u0438\u0445 \u043c\u043e\u0436\u043d\u043e \u0434\u043e\u043d\u0435\u0441\u0442\u0438 \u0438 \u043f\u043e\u0437\u0436\u0435.</li>\n<li>\u00ab\u0412\u043d\u0435\u0441\u0442\u0438\u00bb. \u0421\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d \u0441\u0440\u0430\u0437\u0443 \u0432 \u0441\u043f\u0438\u0441\u043a\u0435 \u0443\u0447\u0430\u0441\u0442\u043d\u0438\u043a\u043e\u0432 \u0438 \u0432 \u043a\u043e\u0440\u0437\u0438\u043d\u0435. \u0414\u043b\u044f \u0434\u0440\u0443\u0433\u0438\u0445 \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u043e\u0432 \u2013 \u00ab+ \u0414\u043e\u0431\u0430\u0432\u0438\u0442\u044c \u0435\u0449\u0451 \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u0430\u00bb.</li>\n</ol>\n<h3 id=\"anl-1-4\">1.4 \u0414\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u044b</h3>\n<table>\n<thead>\n<tr>\n<th>\u0414\u043e\u043a\u0443\u043c\u0435\u043d\u0442</th>\n<th>\u041a\u043e\u043c\u0443 \u043d\u0443\u0436\u0435\u043d</th>\n<th>\u041f\u0440\u0438\u043c\u0435\u0447\u0430\u043d\u0438\u0435</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\u0417\u0430\u044f\u0432\u043b\u0435\u043d\u0438\u0435 \u043e\u0431 \u0443\u0447\u0430\u0441\u0442\u0438\u0438 \u0438 \u043e\u0442\u043a\u0430\u0437 \u043e\u0442 \u043e\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0441\u0442\u0438</td>\n<td>\u0432\u0441\u0435\u043c \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u0430\u043c</td>\n<td>\u0441\u043a\u0430\u0447\u0430\u0442\u044c \u0444\u043e\u0440\u043c\u0443, \u0440\u0430\u0441\u043f\u0435\u0447\u0430\u0442\u0430\u0442\u044c, \u043f\u043e\u0434\u043f\u0438\u0441\u0430\u0442\u044c, \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u043a\u0430\u043a \u0444\u043e\u0442\u043e \u0438\u043b\u0438 PDF</td>\n</tr>\n<tr>\n<td>\u041f\u043e\u0434\u043f\u0438\u0441\u044c \u0440\u043e\u0434\u0438\u0442\u0435\u043b\u0435\u0439</td>\n<td>\u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u0430\u043c \u043c\u043b\u0430\u0434\u0448\u0435 18</td>\n<td>\u043d\u0430 \u0442\u043e\u043c \u0436\u0435 \u0437\u0430\u044f\u0432\u043b\u0435\u043d\u0438\u0438</td>\n</tr>\n<tr>\n<td>\u0421\u043f\u043e\u0440\u0442\u0438\u0432\u043d\u043e-\u043c\u0435\u0434\u0438\u0446\u0438\u043d\u0441\u043a\u0430\u044f \u0441\u043f\u0440\u0430\u0432\u043a\u0430</td>\n<td>\u043f\u043e \u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u044e (\u043d\u0430\u043f\u0440. \u043f\u043e\u043b\u0443\u043f\u0440\u043e\u0444\u0438)</td>\n<td>\u0434\u043e\u043b\u0436\u043d\u0430 \u0431\u044b\u0442\u044c \u0437\u0430 \u0433\u043e\u0434 \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u044f; \u0443\u043a\u0430\u0437\u0430\u0442\u044c \u0434\u0430\u0442\u0443 \u0432\u044b\u0434\u0430\u0447\u0438</td>\n</tr>\n</tbody>\n</table>\n<p>\u0415\u0441\u043b\u0438 \u0447\u0435\u0433\u043e-\u0442\u043e \u043d\u0435 \u0445\u0432\u0430\u0442\u0430\u0435\u0442, \u044d\u0442\u043e \u043e\u0442\u043c\u0435\u0447\u0435\u043d\u043e \u043a\u0440\u0430\u0441\u043d\u044b\u043c \u0432 \u00ab\u041c\u043e\u0438 \u0437\u0430\u044f\u0432\u043a\u0438 \u0438 \u043e\u043f\u043b\u0430\u0442\u0430\u00bb \u0438 \u043c\u043e\u0436\u0435\u0442 \u0431\u044b\u0442\u044c \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043d\u043e \u0442\u0430\u043c. \u041f\u043e\u0441\u043b\u0435 \u043e\u043a\u043e\u043d\u0447\u0430\u043d\u0438\u044f \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438 \u043f\u0440\u0438\u0445\u043e\u0434\u0438\u0442 \u043d\u0430\u043f\u043e\u043c\u0438\u043d\u0430\u043d\u0438\u0435 \u0441 3 \u0434\u043d\u044f\u043c\u0438 \u0434\u043e\u043f. \u0441\u0440\u043e\u043a\u0430, \u0437\u0430\u0442\u0435\u043c \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d \u0443\u0434\u0430\u043b\u044f\u0435\u0442\u0441\u044f.</p>\n<h3 id=\"anl-1-5\">1.5 \u041e\u043f\u043b\u0430\u0442\u0430</h3>\n<ol>\n<li>\u0412\u043a\u043b\u0430\u0434\u043a\u0430 \u00ab\u041c\u043e\u0438 \u0437\u0430\u044f\u0432\u043a\u0438 \u0438 \u043e\u043f\u043b\u0430\u0442\u0430\u00bb.</li>\n<li>\u00ab\u0413\u043e\u0442\u043e\u0432\u043e \u2013 \u043e\u043f\u043b\u0430\u0442\u0438\u0442\u044c\u00bb. \u0421\u0443\u043c\u043c\u0430 \u0444\u0438\u043a\u0441\u0438\u0440\u0443\u0435\u0442\u0441\u044f, \u043f\u043e\u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u043a\u043e\u0434 \u043f\u043b\u0430\u0442\u0435\u0436\u0430.</li>\n<li>\u041f\u0435\u0440\u0435\u0432\u0435\u0441\u0442\u0438 \u0441\u0443\u043c\u043c\u0443, \u0432 \u043d\u0430\u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0438 \u043f\u043b\u0430\u0442\u0435\u0436\u0430 \u2013 \u0442\u043e\u043b\u044c\u043a\u043e \u043a\u043e\u0434.</li>\n<li>\u041a\u0430\u043a \u0442\u043e\u043b\u044c\u043a\u043e \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440 \u043f\u0440\u0438\u0432\u044f\u0436\u0435\u0442 \u043f\u043b\u0430\u0442\u0451\u0436, \u043f\u043e\u044f\u0432\u0438\u0442\u0441\u044f \u00ab\u041e\u043f\u043b\u0430\u0447\u0435\u043d\u043e \u2013 \u0437\u0430\u044f\u0432\u043a\u0430 \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u0430\u00bb.</li>\n</ol>\n<p>\u041a\u0442\u043e \u043d\u0435 \u043e\u043f\u043b\u0430\u0442\u0438\u043b \u043f\u043e\u043b\u043d\u043e\u0441\u0442\u044c\u044e \u043a \u043e\u043a\u043e\u043d\u0447\u0430\u043d\u0438\u044e \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438, \u043f\u043e\u043b\u0443\u0447\u0430\u0435\u0442 \u043d\u0430\u043f\u043e\u043c\u0438\u043d\u0430\u043d\u0438\u0435 \u0441 \u043a\u043e\u0440\u043e\u0442\u043a\u0438\u043c \u0441\u0440\u043e\u043a\u043e\u043c; \u0437\u0430\u0442\u0435\u043c \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u044b \u0443\u0434\u0430\u043b\u044f\u044e\u0442\u0441\u044f. \u0421\u0447\u0451\u0442 \u0434\u043e\u0441\u0442\u0443\u043f\u0435\u043d \u0432 PDF \u043d\u0430 \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0434\u0435\u043d\u044c \u043f\u043e\u0441\u043b\u0435 \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u044f.</p>\n<h3 id=\"anl-1-6\">1.6 \u0417\u0430\u044f\u0432\u0438\u0442\u044c \u0442\u0440\u0435\u043d\u0435\u0440\u043e\u0432 \u0438 \u0441\u0435\u043a\u0443\u043d\u0434\u0430\u043d\u0442\u043e\u0432</h3>\n<p>\u0412 \u00ab\u041c\u043e\u0438 \u0437\u0430\u044f\u0432\u043a\u0438 \u0438 \u043e\u043f\u043b\u0430\u0442\u0430\u00bb, \u0440\u0430\u0437\u0434\u0435\u043b \u00ab\u0422\u0440\u0435\u043d\u0435\u0440\u044b \u0438 \u0441\u0435\u043a\u0443\u043d\u0434\u0430\u043d\u0442\u044b (\u0430\u043a\u043a\u0440\u0435\u0434\u0438\u0442\u0430\u0446\u0438\u044f)\u00bb. \u041a\u0430\u0436\u0434\u044b\u0439 \u0432\u043d\u0435\u0441\u0451\u043d\u043d\u044b\u0439 \u043f\u043e\u043b\u0443\u0447\u0430\u0435\u0442 \u0430\u043a\u043a\u0440\u0435\u0434\u0438\u0442\u0430\u0446\u0438\u043e\u043d\u043d\u0443\u044e \u043a\u0430\u0440\u0442\u0443 \u0441 \u0431\u0435\u0441\u043f\u043b\u0430\u0442\u043d\u044b\u043c \u0432\u0445\u043e\u0434\u043e\u043c.</p>\n<table>\n<thead>\n<tr>\n<th>\u0417\u0430\u044f\u0432\u043b\u0435\u043d\u043e \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u043e\u0432</th>\n<th>\u0422\u0440\u0435\u043d\u0435\u0440\u043e\u0432 \u0431\u0435\u0441\u043f\u043b\u0430\u0442\u043d\u043e</th>\n<th>\u0421\u0435\u043a\u0443\u043d\u0434\u0430\u043d\u0442\u043e\u0432 \u0431\u0435\u0441\u043f\u043b\u0430\u0442\u043d\u043e</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0</td>\n<td>0</td>\n<td>0</td>\n</tr>\n<tr>\n<td>\u043e\u0442 1 \u0434\u043e 5</td>\n<td>1</td>\n<td>2</td>\n</tr>\n<tr>\n<td>6 \u0438 \u0431\u043e\u043b\u044c\u0448\u0435</td>\n<td>1</td>\n<td>4</td>\n</tr>\n</tbody>\n</table>\n<ol>\n<li>\u0412\u0432\u0435\u0441\u0442\u0438 \u0438\u043c\u044f \u0438 \u0444\u0430\u043c\u0438\u043b\u0438\u044e, \u0432\u044b\u0431\u0440\u0430\u0442\u044c \u0440\u043e\u043b\u044c (\u043f\u0440\u0435\u0434\u043b\u0430\u0433\u0430\u044e\u0442\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e \u0440\u043e\u043b\u0438 \u0441\u043e \u0441\u0432\u043e\u0431\u043e\u0434\u043d\u044b\u043c\u0438 \u043c\u0435\u0441\u0442\u0430\u043c\u0438).</li>\n<li>\u0412\u044b\u0431\u0440\u0430\u0442\u044c \u0444\u043e\u0442\u043e (\u043f\u043e \u0436\u0435\u043b\u0430\u043d\u0438\u044e) \u0438 \u0432\u044b\u0431\u0440\u0430\u0442\u044c \u0433\u043e\u043b\u043e\u0432\u0443.</li>\n<li>\u00ab+ \u0414\u043e\u0431\u0430\u0432\u0438\u0442\u044c\u00bb. \u0423\u0434\u0430\u043b\u0438\u0442\u044c \u2013 \u00ab\u0443\u0434\u0430\u043b\u0438\u0442\u044c\u00bb.</li>\n</ol>\n<p>\u041d\u0435\u0437\u0430\u044f\u0432\u043b\u0435\u043d\u043d\u044b\u0435 \u0441\u0435\u043a\u0443\u043d\u0434\u0430\u043d\u0442\u044b \u0441\u0447\u0438\u0442\u0430\u044e\u0442\u0441\u044f \u0437\u0440\u0438\u0442\u0435\u043b\u044f\u043c\u0438 \u0438 \u043f\u043b\u0430\u0442\u044f\u0442 \u0437\u0430 \u0432\u0445\u043e\u0434. \u0418\u043d\u0434\u0438\u0432\u0438\u0434\u0443\u0430\u043b\u044c\u043d\u044b\u0435 \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u044b \u0437\u0430\u044f\u0432\u043b\u044f\u044e\u0442 \u0442\u0440\u0435\u043d\u0435\u0440\u0430 \u0438 \u0441\u0435\u043a\u0443\u043d\u0434\u0430\u043d\u0442\u043e\u0432 \u0442\u0430\u043a \u0436\u0435.</p>\n<h2 id=\"anl-2\">2. \u041e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440 \u2013 \u0441\u043e\u0437\u0434\u0430\u0442\u044c \u0442\u0443\u0440\u043d\u0438\u0440</h2>\n<p>\u0422\u0443\u0440\u043d\u0438\u0440 \u0441\u043e\u0437\u0434\u0430\u0451\u0442\u0441\u044f \u0432 WBU Sports, \u043e\u0442\u043a\u0440\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u0434\u043b\u044f \u043e\u043d\u043b\u0430\u0439\u043d-\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438 \u0438 \u0432 \u0434\u0435\u043d\u044c \u0431\u043e\u0451\u0432 \u0443\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0441 \u043f\u0443\u043b\u044c\u0442\u0430.</p>\n<h3 id=\"anl-2-1\">2.1 \u0412\u0445\u043e\u0434</h3>\n<ol>\n<li>\u0412\u043e\u0439\u0442\u0438 \u043d\u0430 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0435 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438 \u0441 \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u043e\u043c \u0441 \u0440\u043e\u043b\u044c\u044e \u00ab\u041e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440\u00bb \u2013 \u0432\u044b \u0441\u0440\u0430\u0437\u0443 \u043f\u043e\u043f\u0430\u0434\u0451\u0442\u0435 \u0432 WBU Sports.</li>\n<li>\u0415\u0441\u043b\u0438 \u0443 \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u0430 \u0435\u0449\u0451 \u0440\u043e\u043b\u044c \u00ab\u0422\u0440\u0435\u043d\u0435\u0440\u00bb \u0438\u043b\u0438 \u00ab\u041a\u043b\u0443\u0431\u00bb: \u0432 WBU Sports \u043d\u0430\u0436\u0430\u0442\u044c \u00ab\u041f\u0440\u043e\u0434\u043e\u043b\u0436\u0438\u0442\u044c \u043a\u0430\u043a \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440\u00bb \u0438\u043b\u0438 \u0432\u0432\u0435\u0440\u0445\u0443 \u00ab\u0421\u043c\u0435\u043d\u0438\u0442\u044c \u0440\u043e\u043b\u044c\u00bb.</li>\n</ol>\n<p>\u0412\u0430\u0436\u043d\u043e: \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u044f \u0445\u0440\u0430\u043d\u044f\u0442\u0441\u044f \u043d\u0430 \u0441\u0435\u0440\u0432\u0435\u0440\u0435 (\u0432 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435 \u0441 \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u043e\u043c WBU Sports). \u041a\u0430\u0436\u0434\u043e\u0435 \u0438\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435 \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u0435\u0442\u0441\u044f \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0438 \u0432\u0438\u0434\u043d\u043e \u043d\u0430 \u043b\u044e\u0431\u043e\u043c \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0435, \u0433\u0434\u0435 \u0432\u044b \u0432\u043e\u0448\u043b\u0438 \u2013 \u041f\u041a, \u043d\u043e\u0443\u0442\u0431\u0443\u043a \u0438\u043b\u0438 \u043f\u043b\u0430\u043d\u0448\u0435\u0442. \u00ab\u0421\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u043a\u043e\u043f\u0438\u044e (.json)\u00bb \u043e\u0441\u0442\u0430\u0451\u0442\u0441\u044f \u043a\u0430\u043a \u0434\u043e\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u043b\u044c\u043d\u0430\u044f \u043a\u043e\u043f\u0438\u044f.</p>\n<h3 id=\"anl-2-2\">2.2 \u0421\u043e\u0437\u0434\u0430\u0442\u044c \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435</h3>\n<ol>\n<li>\u041d\u0430 \u0441\u0442\u0430\u0440\u0442\u043e\u0432\u043e\u0439 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0435 \u0432\u044b\u0431\u0440\u0430\u0442\u044c \u00ab\u0422\u0443\u0440\u043d\u0438\u0440\u00bb (\u0434\u043b\u044f \u0433\u0430\u043b\u0430 \u0441\u043c. \u0433\u043b\u0430\u0432\u0443 3).</li>\n<li>\u0417\u0430\u043f\u043e\u043b\u043d\u0438\u0442\u044c \u0432\u043a\u043b\u0430\u0434\u043a\u0443 \u00ab\u041c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435\u00bb: \u043d\u0430\u0437\u0432\u0430\u043d\u0438\u0435, \u043f\u0440\u043e\u043c\u043e\u0443\u0442\u0435\u0440, \u043c\u0435\u0441\u0442\u043e/\u0437\u0430\u043b, \u0434\u0430\u0442\u0430. \u0421\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430 \u0438 \u0445\u0440\u043e\u043d\u043e\u043c\u0435\u0442\u0440\u0438\u0441\u0442\u0430 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440 \u043d\u0435 \u0432\u043d\u043e\u0441\u0438\u0442 \u2013 \u044d\u0442\u043e \u0434\u0435\u043b\u0430\u0435\u0442 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440 \u0432 \u0441\u0432\u043e\u0435\u0439 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0435; \u0438\u043c\u0435\u043d\u0430 \u043f\u043e\u0442\u043e\u043c \u0435\u0441\u0442\u044c \u0432 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0435 \u0438 PDF-\u043e\u0442\u0447\u0451\u0442\u0435.</li>\n<li>\u0412\u0440\u0430\u0447 \u0440\u0438\u043d\u0433\u0430: \u043c\u043e\u0436\u043d\u043e \u0443\u043a\u0430\u0437\u0430\u0442\u044c \u0441\u0435\u0439\u0447\u0430\u0441 \u2013 \u0438\u043d\u0430\u0447\u0435 \u0432 \u0434\u0435\u043d\u044c \u0431\u043e\u0451\u0432 \u043d\u0430 \u043f\u0443\u043b\u044c\u0442\u0435. \u0411\u0435\u0437 \u0432\u0440\u0430\u0447\u0430 \u0440\u0438\u043d\u0433\u0430 \u0447\u0430\u0441\u044b \u043d\u0435 \u0437\u0430\u043f\u0443\u0441\u043a\u0430\u044e\u0442\u0441\u044f.</li>\n<li>\u0412\u044b\u0431\u0440\u0430\u0442\u044c \u0447\u0438\u0441\u043b\u043e \u0440\u0438\u043d\u0433\u043e\u0432 \u0438\u043b\u0438 \u043f\u043b\u043e\u0449\u0430\u0434\u043e\u043a (1\u201310) \u0438 \u043d\u0430\u0437\u0432\u0430\u043d\u0438\u0435 \u00ab\u0420\u0438\u043d\u0433\u00bb \u0438\u043b\u0438 \u00ab\u041f\u043b\u043e\u0449\u0430\u0434\u043a\u0430\u00bb.</li>\n<li>\u0417\u0430\u0434\u0430\u0442\u044c \u0434\u043e\u043f\u0443\u0441\u043a \u0432\u0435\u0441\u0430 \u043d\u0430 \u0432\u0437\u0432\u0435\u0448\u0438\u0432\u0430\u043d\u0438\u0438 (\u043d\u0430\u043f\u0440. 4 \u043a\u0433 \u043f\u043e \u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u044e).</li>\n</ol>\n<h3 id=\"anl-2-3\">2.3 \u041e\u0442\u043a\u0440\u044b\u0442\u044c \u043e\u043d\u043b\u0430\u0439\u043d-\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044e</h3>\n<ol>\n<li>\u0412\u043a\u043b\u0430\u0434\u043a\u0430 \u00ab\u041e\u043d\u043b\u0430\u0439\u043d-\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f\u00bb.</li>\n<li>\u041e\u0442\u043c\u0435\u0442\u0438\u0442\u044c \u043f\u0440\u0435\u0434\u043b\u0430\u0433\u0430\u0435\u043c\u044b\u0435 \u0432\u0438\u0434\u044b \u0441\u043f\u043e\u0440\u0442\u0430.</li>\n<li>\u0423\u043a\u0430\u0437\u0430\u0442\u044c \u043e\u043a\u043e\u043d\u0447\u0430\u043d\u0438\u0435 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438, \u0432\u0437\u043d\u043e\u0441 \u0437\u0430 1-\u0439 \u0441\u0442\u0430\u0440\u0442 \u0438 \u0437\u0430 \u043a\u0430\u0436\u0434\u044b\u0439 \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439, \u0434\u043e\u043f. \u0441\u0440\u043e\u043a (\u0434\u043d\u0435\u0439).</li>\n<li>\u0421\u043f\u043e\u0440\u0442\u0438\u0432\u043d\u043e-\u043c\u0435\u0434\u0438\u0446\u0438\u043d\u0441\u043a\u0430\u044f \u0441\u043f\u0440\u0430\u0432\u043a\u0430: \u0442\u0440\u0435\u0431\u043e\u0432\u0430\u0442\u044c \u0438\u043b\u0438 \u043d\u0435\u0442.</li>\n<li>\u0423\u043a\u0430\u0437\u0430\u0442\u044c \u0432\u043b\u0430\u0434\u0435\u043b\u044c\u0446\u0430 \u0441\u0447\u0451\u0442\u0430, IBAN, BIC \u0438 \u0437\u0430\u043c\u0435\u0442\u043a\u0438 \u0434\u043b\u044f \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u043e\u0432.</li>\n<li>\u041e\u043f\u0443\u0431\u043b\u0438\u043a\u043e\u0432\u0430\u0442\u044c (\u043d\u0443\u0436\u0435\u043d \u043f\u0430\u0440\u043e\u043b\u044c WBU). \u0417\u0430\u0442\u0435\u043c \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u0435, \u0440\u0430\u0441\u043f\u0438\u0441\u0430\u043d\u0438\u0435, \u043f\u043e\u0441\u0442\u0435\u0440 \u0438 \u0444\u043e\u0440\u043c\u044b.</li>\n</ol>\n<p>\u0412\u0432\u0435\u0440\u0445\u0443 \u0447\u0451\u0440\u043d\u0430\u044f \u043f\u043e\u043b\u043e\u0441\u0430 \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u0446\u0438\u0444\u0440\u044b: \u0437\u0430\u044f\u0432\u043b\u0435\u043d\u043d\u044b\u0435 \u0443\u0447\u0430\u0441\u0442\u043d\u0438\u043a\u0438, \u0441\u0442\u0430\u0440\u0442\u044b, \u043a\u043b\u0443\u0431\u044b, \u0437\u0430\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0435 \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u044b, \u043d\u0435\u043e\u043f\u043b\u0430\u0447\u0435\u043d\u043d\u044b\u0435 \u043f\u043b\u0430\u0442\u0435\u0436\u0438, \u043d\u0435\u0434\u043e\u0441\u0442\u0430\u044e\u0449\u0438\u0435 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u044b. \u00ab\u0423\u0447\u0430\u0441\u0442\u043d\u0438\u043a\u0438, \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438 \u0441 \u0444\u043e\u0442\u043e, \u043a\u043b\u0443\u0431\u044b\u00bb \u043e\u0442\u043a\u0440\u044b\u0432\u0430\u0435\u0442 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0443 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438 \u0432 \u0440\u0435\u0436\u0438\u043c\u0435 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440\u0430 \u2013 \u0431\u0435\u0437 \u0441\u043e\u0431\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0433\u043e \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u0430.</p>\n<h3 id=\"anl-2-4\">2.4 \u041f\u0440\u0438\u0432\u044f\u0437\u0430\u0442\u044c \u043f\u043b\u0430\u0442\u0435\u0436\u0438</h3>\n<p>\u0412\u043e \u0432\u043a\u043b\u0430\u0434\u043a\u0435 \u00ab\u041e\u043d\u043b\u0430\u0439\u043d-\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f\u00bb \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u0431\u0430\u043d\u043a\u043e\u0432\u0441\u043a\u0443\u044e \u0432\u044b\u043f\u0438\u0441\u043a\u0443 (PDF \u0438\u043b\u0438 CSV \u0431\u0430\u043d\u043a\u0430). \u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0438\u0449\u0435\u0442 \u043a\u043e\u0434\u044b \u043f\u043b\u0430\u0442\u0435\u0436\u0435\u0439 \u0438 \u043f\u0440\u0438\u0432\u044f\u0437\u044b\u0432\u0430\u0435\u0442 \u0441\u0443\u043c\u043c\u044b. \u0412\u044b\u043f\u0438\u0441\u043a\u0430 \u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e \u0432 \u0432\u0430\u0448\u0435\u043c \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435 \u0438 \u043d\u0438\u043a\u0443\u0434\u0430 \u043d\u0435 \u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442\u0441\u044f. \u041e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u0435 \u043f\u043b\u0430\u0442\u0435\u0436\u0438 \u043c\u043e\u0436\u043d\u043e \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0434\u0438\u0442\u044c \u0438\u043b\u0438 \u043e\u0442\u043c\u0435\u043d\u0438\u0442\u044c \u0432\u0440\u0443\u0447\u043d\u0443\u044e.</p>\n<h3 id=\"anl-2-5\">2.5 \u041a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438 \u0438 \u0443\u0447\u0430\u0441\u0442\u043d\u0438\u043a\u0438</h3>\n<ul>\n<li>\u0417\u0430\u044f\u0432\u043b\u0435\u043d\u043d\u044b\u0435 \u043e\u043d\u043b\u0430\u0439\u043d \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u044b \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u043f\u043e\u043f\u0430\u0434\u0430\u044e\u0442 \u0432 \u0441\u0432\u043e\u044e \u0432\u0435\u0441\u043e\u0432\u0443\u044e \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044e.</li>\n<li>\u0417\u0435\u043b\u0451\u043d\u044b\u0439: \u043f\u0430\u0440\u0430 \u0441\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0430 \u00b7 \u0416\u0451\u043b\u0442\u044b\u0439: \u0436\u0434\u0451\u0442 \u0441\u043e\u043f\u0435\u0440\u043d\u0438\u043a\u0430 \u00b7 \u25b6: \u0443\u0436\u0435 \u0438\u0434\u0451\u0442.</li>\n<li>\u041d\u0430\u0436\u0430\u0442\u0438\u0435 \u043d\u0430 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044e \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u0443\u0447\u0430\u0441\u0442\u043d\u0438\u043a\u043e\u0432. \u0421\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u043e\u0432 \u043c\u043e\u0436\u043d\u043e \u0434\u043e\u0431\u0430\u0432\u0438\u0442\u044c \u0432\u0440\u0443\u0447\u043d\u0443\u044e, \u0437\u0430\u0434\u0430\u0442\u044c \u0440\u0430\u0443\u043d\u0434\u044b, \u0432\u0440\u0435\u043c\u044f \u0438 \u0440\u0438\u043d\u0433.</li>\n<li>\u0423\u0434\u0430\u043b\u0438\u0442\u044c \u0443\u0447\u0430\u0441\u0442\u043d\u0438\u043a\u0430: \u2715 \u2013 \u043f\u043e\u043a\u0430 \u0432 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438 \u043d\u0435 \u043e\u0446\u0435\u043d\u0451\u043d \u043d\u0438 \u043e\u0434\u0438\u043d \u0431\u043e\u0439, \u0436\u0435\u0440\u0435\u0431\u044c\u0451\u0432\u043a\u0430 \u043f\u0440\u043e\u0432\u043e\u0434\u0438\u0442\u0441\u044f \u0437\u0430\u043d\u043e\u0432\u043e \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438.</li>\n<li>\u0415\u0441\u043b\u0438 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f \u0443\u0436\u0435 \u0438\u0434\u0451\u0442: \u00ab\u043d\u0435\u0442 \u043d\u0430 \u043c\u0435\u0441\u0442\u0435\u00bb \u2013 \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d \u0432\u044b\u0447\u0451\u0440\u043a\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u0438 \u043f\u0440\u043e\u0438\u0433\u0440\u044b\u0432\u0430\u0435\u0442 \u0441\u0432\u043e\u0438 \u043e\u0442\u043a\u0440\u044b\u0442\u044b\u0435 \u0431\u043e\u0438 \u0431\u0435\u0437 \u0431\u043e\u044f; \u00ab\u0432\u0441\u0451-\u0442\u0430\u043a\u0438 \u0437\u0434\u0435\u0441\u044c\u00bb \u043e\u0442\u043c\u0435\u043d\u044f\u0435\u0442.</li>\n</ul>\n<h3 id=\"anl-2-6\">2.6 \u0421\u0435\u0442\u043a\u0438</h3>\n<p>\u041e\u043b\u0438\u043c\u043f\u0438\u0439\u0441\u043a\u0430\u044f \u0441\u0438\u0441\u0442\u0435\u043c\u0430, \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0430\u044f \u0436\u0435\u0440\u0435\u0431\u044c\u0451\u0432\u043a\u0430; \u043e\u0434\u043d\u043e\u043a\u043b\u0443\u0431\u043d\u0438\u043a\u0438 \u043f\u043e \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e\u0441\u0442\u0438 \u043d\u0435 \u0432\u0441\u0442\u0440\u0435\u0447\u0430\u044e\u0442\u0441\u044f \u0432 \u043f\u0435\u0440\u0432\u043e\u043c \u043a\u0440\u0443\u0433\u0435. \u0421\u0432\u043e\u0431\u043e\u0434\u043d\u044b\u0435 \u043f\u0440\u043e\u0445\u043e\u0434\u044b \u0440\u0430\u0441\u043f\u0440\u0435\u0434\u0435\u043b\u044f\u044e\u0442\u0441\u044f \u0440\u0430\u0432\u043d\u043e\u043c\u0435\u0440\u043d\u043e. \u041f\u043e\u0431\u0435\u0434\u0438\u0442\u0435\u043b\u0438 \u043f\u0440\u043e\u0445\u043e\u0434\u044f\u0442 \u0434\u0430\u043b\u044c\u0448\u0435 \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438. \u0411\u043e\u044f \u0437\u0430 3-\u0435 \u043c\u0435\u0441\u0442\u043e \u043d\u0435\u0442: \u043e\u0431\u0430 \u043f\u0440\u043e\u0438\u0433\u0440\u0430\u0432\u0448\u0438\u0445 \u043f\u043e\u043b\u0443\u0444\u0438\u043d\u0430\u043b\u0438\u0441\u0442\u0430 \u2013 \u0442\u0440\u0435\u0442\u044c\u0438. \u00ab\u041d\u043e\u0432\u0430\u044f \u0436\u0435\u0440\u0435\u0431\u044c\u0451\u0432\u043a\u0430\u00bb \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u0430, \u043d\u043e \u0443\u0434\u0430\u043b\u044f\u0435\u0442 \u0443\u0436\u0435 \u0432\u043d\u0435\u0441\u0451\u043d\u043d\u044b\u0435 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438. \u00ab\u041f\u0435\u0447\u0430\u0442\u044c \u0441\u0435\u0442\u043a\u0438\u00bb \u0434\u043b\u044f \u0434\u043e\u0441\u043a\u0438 \u043e\u0431\u044a\u044f\u0432\u043b\u0435\u043d\u0438\u0439.</p>\n<h3 id=\"anl-2-7\">2.7 \u0421\u043f\u0438\u0441\u043e\u043a \u0431\u043e\u0451\u0432 \u0438 \u0440\u0438\u043d\u0433\u0438</h3>\n<ul>\n<li>\u0411\u043e\u0438 \u0440\u0430\u0432\u043d\u043e\u043c\u0435\u0440\u043d\u043e \u0440\u0430\u0441\u043f\u0440\u0435\u0434\u0435\u043b\u044f\u044e\u0442\u0441\u044f \u043f\u043e \u0440\u0438\u043d\u0433\u0430\u043c; \u043c\u0430\u0441\u0442\u0435\u0440\u0441 \u043f\u043e \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e\u0441\u0442\u0438 \u043d\u0430 \u0440\u0438\u043d\u0433\u0435 1.</li>\n<li>\u041a\u0442\u043e \u0441\u0442\u0430\u0440\u0442\u0443\u0435\u0442 \u0434\u0432\u0430\u0436\u0434\u044b, \u043d\u0438\u043a\u043e\u0433\u0434\u0430 \u043d\u0435 \u0431\u043e\u043a\u0441\u0438\u0440\u0443\u0435\u0442 \u043e\u0434\u043d\u043e\u0432\u0440\u0435\u043c\u0435\u043d\u043d\u043e \u043d\u0430 \u0434\u0432\u0443\u0445 \u0440\u0438\u043d\u0433\u0430\u0445 \u0438 \u043f\u043e\u043b\u0443\u0447\u0430\u0435\u0442 \u0437\u0430\u0434\u0430\u043d\u043d\u044b\u0439 \u043c\u0438\u043d\u0438\u043c\u0430\u043b\u044c\u043d\u044b\u0439 \u043f\u0435\u0440\u0435\u0440\u044b\u0432 (\u043d\u0430\u043f\u0440. 4 \u0431\u043e\u044f \u043c\u0435\u0436\u0434\u0443).</li>\n<li>\u00ab\u041f\u0435\u0447\u0430\u0442\u044c / PDF\u00bb \u2013 \u0441\u043f\u0438\u0441\u043e\u043a \u0431\u043e\u0451\u0432 \u043f\u043e \u0440\u0438\u043d\u0433\u0430\u043c.</li>\n</ul>\n<h3 id=\"anl-2-8-live\">2.8 \u0417\u0430\u043f\u0443\u0441\u0442\u0438\u0442\u044c live</h3>\n<p>\u0412\u043e \u0432\u043a\u043b\u0430\u0434\u043a\u0435 \u00ab\u0421\u043f\u0438\u0441\u043e\u043a \u0431\u043e\u0451\u0432\u00bb \u043d\u0430\u0436\u0430\u0442\u044c \u00ab\u0417\u0430\u043f\u0443\u0441\u0442\u0438\u0442\u044c live\u00bb (\u043f\u0430\u0440\u043e\u043b\u044c WBU). \u0417\u0430\u0442\u0435\u043c \u043f\u043e\u044f\u0432\u044f\u0442\u0441\u044f:</p>\n<ul>\n<li>\u0441\u0441\u044b\u043b\u043a\u0430 \u043d\u0430 WBU Live (\u0442\u0435\u043b\u0435\u0444\u043e\u043d, \u0437\u0440\u0438\u0442\u0435\u043b\u0438),</li>\n<li>\u0441\u0441\u044b\u043b\u043a\u0430 \u0434\u043b\u044f \u0422\u0412-\u043c\u043e\u043d\u0438\u0442\u043e\u0440\u0430 \u0432 \u0437\u0430\u043b\u0435,</li>\n<li>\u043a\u043d\u043e\u043f\u043a\u0438 \u00ab\u041e\u0442\u043a\u0440\u044b\u0442\u044c \u0440\u0438\u043d\u0433 1\u00bb, \u00ab\u041e\u0442\u043a\u0440\u044b\u0442\u044c \u0440\u0438\u043d\u0433 2\u00bb \u0434\u043b\u044f WBU Time.</li>\n</ul>\n<p>\u041c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435 \u043f\u043e\u044f\u0432\u0438\u0442\u0441\u044f \u0438 \u0432 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0435 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430. \u041f\u041a \u0441 WBU Sports \u0434\u043e\u043b\u0436\u0435\u043d \u043e\u0441\u0442\u0430\u0432\u0430\u0442\u044c\u0441\u044f \u043e\u0442\u043a\u0440\u044b\u0442\u044b\u043c \u0438 \u043e\u043d\u043b\u0430\u0439\u043d \u0432\u043e \u0432\u0440\u0435\u043c\u044f \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u044f \u2013 \u043e\u043d \u043e\u0442\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442 \u0441\u043f\u0438\u0441\u043e\u043a \u0431\u043e\u0451\u0432 \u0438 \u0437\u0430\u0431\u0438\u0440\u0430\u0435\u0442 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b.</p>\n<h2 id=\"anl-3\">3. \u041e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440 \u2013 \u0441\u043e\u0437\u0434\u0430\u0442\u044c \u043f\u0440\u043e\u0444\u0438-\u0433\u0430\u043b\u0430</h2>\n<p>\u0413\u0430\u043b\u0430 \u2013 \u0432\u0435\u0447\u0435\u0440 \u0431\u043e\u0451\u0432, \u0431\u043e\u0439 \u0437\u0430 \u0431\u043e\u0435\u043c, \u0431\u0435\u0437 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0439 \u0438 \u0441\u0435\u0442\u043e\u043a. \u0412\u0441\u0435\u0433\u0434\u0430 \u043d\u0430 \u043e\u0434\u043d\u043e\u043c \u0440\u0438\u043d\u0433\u0435.</p>\n<ol>\n<li>\u041d\u0430 \u0441\u0442\u0430\u0440\u0442\u043e\u0432\u043e\u0439 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0435 \u0432\u044b\u0431\u0440\u0430\u0442\u044c \u00ab\u041f\u0440\u043e\u0444\u0438-\u0433\u0430\u043b\u0430\u00bb.</li>\n<li>\u0417\u0430\u043f\u043e\u043b\u043d\u0438\u0442\u044c \u0432\u043a\u043b\u0430\u0434\u043a\u0443 \u00ab\u041c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435\u00bb, \u043a\u0430\u043a \u0432 2.2 (\u043d\u0430\u0437\u0432\u0430\u043d\u0438\u0435, \u043f\u0440\u043e\u043c\u043e\u0443\u0442\u0435\u0440, \u043c\u0435\u0441\u0442\u043e, \u0434\u0430\u0442\u0430, \u0432\u0440\u0430\u0447 \u0440\u0438\u043d\u0433\u0430).</li>\n<li>\u0412\u043a\u043b\u0430\u0434\u043a\u0430 \u00ab\u041a\u0430\u0440\u0434\u00bb: \u0432\u043d\u0435\u0441\u0442\u0438 \u043a\u0430\u0436\u0434\u044b\u0439 \u0431\u043e\u0439 \u0438 \u00ab+ \u0414\u043e\u0431\u0430\u0432\u0438\u0442\u044c \u0431\u043e\u0439\u00bb:</li>\n<li>\u043a\u0440\u0430\u0441\u043d\u044b\u0439 \u0438 \u0441\u0438\u043d\u0438\u0439 \u0443\u0433\u043e\u043b (\u0438\u043c\u044f, \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u043e),</li>\n<li>\u0434\u043b\u044f \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0443\u0433\u043b\u0430 \u0437\u0430\u043b / \u043a\u043b\u0443\u0431, \u0441\u0442\u0440\u0430\u043d\u0430, \u0434\u0430\u0442\u0430 \u0440\u043e\u0436\u0434\u0435\u043d\u0438\u044f (\u0432\u043e\u0437\u0440\u0430\u0441\u0442 \u0441\u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u043d\u0430 \u0434\u0435\u043d\u044c \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u044f) \u0438 \u0432\u0435\u0441 \u043d\u0430 \u0432\u0437\u0432\u0435\u0448\u0438\u0432\u0430\u043d\u0438\u0438,</li>\n<li>\u0432\u0435\u0441\u043e\u0432\u0430\u044f \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f (\u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u043e),</li>\n<li>\u0442\u0438\u0442\u0443\u043b \u043f\u043e \u0430\u0432\u0442\u043e\u0440\u0438\u0437\u0430\u0446\u0438\u0438 WBU \u2013 \u043d\u0430 \u0432\u044b\u0431\u043e\u0440: \u0447\u0435\u043c\u043f\u0438\u043e\u043d\u0430\u0442 \u043c\u0438\u0440\u0430, \u043c\u0435\u0436\u043a\u043e\u043d\u0442\u0438\u043d\u0435\u043d\u0442\u0430\u043b\u044c\u043d\u044b\u0439, \u0415\u0432\u0440\u043e\u043f\u044b, \u043c\u0435\u0436\u0434\u0443\u043d\u0430\u0440\u043e\u0434\u043d\u044b\u0439, \u0413\u0435\u0440\u043c\u0430\u043d\u0438\u0438; \u0434\u043b\u044f \u043e\u0441\u043e\u0431\u044b\u0445 \u0442\u0438\u0442\u0443\u043b\u043e\u0432 \u00ab\u0414\u0440\u0443\u0433\u043e\u0439 \u0442\u0438\u0442\u0443\u043b \u2013 \u0432\u0432\u0435\u0441\u0442\u0438 \u0432\u0440\u0443\u0447\u043d\u0443\u044e\u00bb (\u043d\u0430\u043f\u0440. \u0447\u0435\u043c\u043f\u0438\u043e\u043d\u0430\u0442 \u043c\u0438\u0440\u0430 \u0441\u0440\u0435\u0434\u0438 \u044e\u043d\u0438\u043e\u0440\u043e\u0432); \u0431\u0435\u0437 \u0442\u0438\u0442\u0443\u043b\u0430 \u00ab\u2013 \u043d\u0435 \u0442\u0438\u0442\u0443\u043b\u044c\u043d\u044b\u0439 \u0431\u043e\u0439 \u2013\u00bb,</li>\n<li>\u0432\u0438\u0434 \u0431\u043e\u044f, \u0447\u0438\u0441\u043b\u043e \u0438 \u0434\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c \u0440\u0430\u0443\u043d\u0434\u043e\u0432.</li>\n<li>\u041f\u043e\u0440\u044f\u0434\u043e\u043a \u043c\u0435\u043d\u044f\u0442\u044c \u25b2 \u25bc, \u270e \u0440\u0435\u0434\u0430\u043a\u0442\u0438\u0440\u043e\u0432\u0430\u0442\u044c, \u2715 \u0443\u0434\u0430\u043b\u0438\u0442\u044c.</li>\n<li>\u00ab\u0417\u0430\u043f\u0443\u0441\u0442\u0438\u0442\u044c live\u00bb, \u043a\u0430\u043a \u0432 2.8 \u2013 \u0437\u0430\u0442\u0435\u043c \u0445\u0440\u043e\u043d\u043e\u043c\u0435\u0442\u0440\u0430\u0436 \u0438 \u0422\u0412-\u044d\u043a\u0440\u0430\u043d \u0447\u0435\u0440\u0435\u0437 \u043a\u043d\u043e\u043f\u043a\u0438 \u043a\u0430\u0440\u0434\u0430.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>\u041f\u0430\u0440\u0430\u043c\u0435\u0442\u0440</th>\n<th>\u0412\u0430\u0440\u0438\u0430\u043d\u0442\u044b</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\u0412\u0438\u0434 \u0431\u043e\u044f</td>\n<td>\u041f\u0440\u043e\u0444\u0438, \u043f\u043e\u043b\u0443\u043f\u0440\u043e\u0444\u0438, \u043c\u0430\u0441\u0442\u0435\u0440\u0441, Bare Knuckle, Hybrid, K1 / \u043a\u0438\u043a\u0431\u043e\u043a\u0441\u0438\u043d\u0433</td>\n</tr>\n<tr>\n<td>\u0412\u0435\u0441\u043e\u0432\u0430\u044f \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f</td>\n<td>\u043f\u0440\u043e\u0444\u0438-\u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438 \u043e\u0442 \u043f\u0435\u0440\u0432\u043e\u0433\u043e \u043d\u0430\u0438\u043b\u0435\u0433\u0447\u0430\u0439\u0448\u0435\u0433\u043e \u0434\u043e \u0442\u044f\u0436\u0451\u043b\u043e\u0433\u043e</td>\n</tr>\n<tr>\n<td>\u0422\u0438\u0442\u0443\u043b</td>\n<td>\u043d\u0435 \u0442\u0438\u0442\u0443\u043b\u044c\u043d\u044b\u0439, \u0447\u0435\u043c\u043f\u0438\u043e\u043d\u0430\u0442 \u043c\u0438\u0440\u0430, \u043c\u0435\u0436\u043a\u043e\u043d\u0442\u0438\u043
