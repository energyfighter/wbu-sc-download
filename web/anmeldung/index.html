d\u0435\u043d\u0442\u0430\u043b\u044c\u043d\u044b\u0439, \u0415\u0432\u0440\u043e\u043f\u044b, \u043c\u0435\u0436\u0434\u0443\u043d\u0430\u0440\u043e\u0434\u043d\u044b\u0439, \u0413\u0435\u0440\u043c\u0430\u043d\u0438\u0438 \u0438\u043b\u0438 \u0432\u0440\u0443\u0447\u043d\u0443\u044e</td>\n</tr>\n<tr>\n<td>\u0420\u0430\u0443\u043d\u0434\u044b</td>\n<td>\u043d\u0430 \u0432\u044b\u0431\u043e\u0440, \u043e\u0442 1 \u0434\u043e 12</td>\n</tr>\n<tr>\n<td>\u0414\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c \u0440\u0430\u0443\u043d\u0434\u0430</td>\n<td>3, 2, 1,5 \u0438\u043b\u0438 1 \u043c\u0438\u043d\u0443\u0442\u0430; \u043f\u0435\u0440\u0435\u0440\u044b\u0432 \u0432\u0441\u0435\u0433\u0434\u0430 1 \u043c\u0438\u043d\u0443\u0442\u0430</td>\n</tr>\n</tbody>\n</table>\n<p>\u041d\u0430 \u0433\u0430\u043b\u0430 \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u044b \u043d\u0438\u0447\u044c\u044f \u0438 No Contest; \u043d\u0430 \u0442\u0443\u0440\u043d\u0438\u0440\u0435 \u0432\u0441\u0435\u0433\u0434\u0430 \u0434\u043e\u043b\u0436\u0435\u043d \u0431\u044b\u0442\u044c \u043f\u043e\u0431\u0435\u0434\u0438\u0442\u0435\u043b\u044c.</p>\n<h3 id=\"anl-3-1\">3.1 \u0417\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u0433\u0430\u043b\u0430 \u2013 \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u043e</h3>\n<p>\u041a\u0430\u043a \u0442\u043e\u043b\u044c\u043a\u043e \u0432 \u043a\u0430\u0440\u0434\u0435 \u0435\u0441\u0442\u044c \u043f\u0435\u0440\u0432\u044b\u0439 \u0431\u043e\u0439 \u0438 \u0435\u0441\u0442\u044c \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442, WBU Sports \u0442\u0440\u0435\u0431\u0443\u0435\u0442: \u00ab\u26a0 \u041e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u043e: \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435\u00bb. \u041e\u0434\u0438\u043d \u0440\u0430\u0437 \u0432\u0432\u0435\u0441\u0442\u0438 \u043f\u0430\u0440\u043e\u043b\u044c WBU \u2013 \u0438 \u0433\u0430\u043b\u0430 \u043e\u043d\u043b\u0430\u0439\u043d (\u0434\u0430\u0436\u0435 \u0435\u0441\u043b\u0438 \u0441\u043e\u0437\u0434\u0430\u043d\u0430 \u0432 \u043f\u0440\u043e\u0433\u0440\u0430\u043c\u043c\u0435 \u0434\u043b\u044f Windows \u0438\u043b\u0438 \u0432 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0438 \u0434\u043b\u044f \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u0430). \u0422\u043e\u043b\u044c\u043a\u043e \u0442\u0430\u043a \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440 \u043f\u043e\u043b\u0443\u0447\u0438\u0442 \u043a\u0430\u0440\u0434 \u0438 \u0441\u043c\u043e\u0436\u0435\u0442 \u043c\u0435\u043d\u044f\u0442\u044c \u0435\u0433\u043e \u0432 \u0434\u0435\u043d\u044c \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u044f. \u041f\u0440\u0438 \u043f\u0435\u0440\u0432\u043e\u0439 \u0437\u0430\u0433\u0440\u0443\u0437\u043a\u0435 WBU \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u043f\u043e\u043b\u0443\u0447\u0430\u0435\u0442 \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u043e\u043d\u043d\u043e\u0435 \u043f\u0438\u0441\u044c\u043c\u043e (\u043d\u0430 info@wbu-boxing.com) \u0441 \u043d\u0430\u0437\u0432\u0430\u043d\u0438\u0435\u043c, \u0434\u0430\u0442\u043e\u0439, \u043c\u0435\u0441\u0442\u043e\u043c \u0438 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440\u043e\u043c \u2013 \u044d\u0442\u043e \u043e\u0442\u043d\u043e\u0441\u0438\u0442\u0441\u044f \u0438 \u043a \u0442\u0443\u0440\u043d\u0438\u0440\u0430\u043c.</p>\n<h3 id=\"anl-3-2\">3.2 \u0418\u0437\u043c\u0435\u043d\u0438\u0442\u044c \u043a\u0430\u0440\u0434 \u0432 \u0434\u0435\u043d\u044c \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u044f</h3>\n<ul>\n<li><strong>\u041e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440:</strong> \u0432 \u043b\u044e\u0431\u043e\u0435 \u0432\u0440\u0435\u043c\u044f \u0432 \u043a\u0430\u0440\u0434\u0435 (\u270e \u0438\u0437\u043c\u0435\u043d\u0438\u0442\u044c, \u25b2 \u25bc \u043f\u0435\u0440\u0435\u043c\u0435\u0441\u0442\u0438\u0442\u044c, \u2715 \u0443\u0434\u0430\u043b\u0438\u0442\u044c, \u043d\u043e\u0432\u044b\u0435 \u0431\u043e\u0438). \u0412\u0441\u0451 \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0443\u0445\u043e\u0434\u0438\u0442 \u0432 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0443, WBU Live \u0438 WBU Time.</li>\n<li><strong>\u0421\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440 (\u0435\u0441\u043b\u0438 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440\u0430 \u043d\u0435\u0442):</strong> \u0432 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0435 \u0432 \u0431\u043b\u043e\u043a\u0435 \u00ab\u0418\u0437 WBU Sports\u00bb \u043d\u0430\u0436\u0430\u0442\u044c \u00ab\u270e \u0420\u0435\u0434\u0430\u043a\u0442\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u043a\u0430\u0440\u0434\u00bb. \u041c\u0435\u043d\u044f\u0442\u044c \u0438\u043c\u0435\u043d\u0430, \u0441\u0442\u0440\u0430\u043d\u0443, \u0434\u0430\u0442\u0443 \u0440\u043e\u0436\u0434\u0435\u043d\u0438\u044f, \u0432\u0435\u0441, \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044e, \u0442\u0438\u0442\u0443\u043b, \u0432\u0438\u0434 \u0431\u043e\u044f, \u0440\u0430\u0443\u043d\u0434\u044b \u0438 \u0434\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c, \u043f\u0435\u0440\u0435\u043c\u0435\u0449\u0430\u0442\u044c, \u0434\u043e\u0431\u0430\u0432\u043b\u044f\u0442\u044c \u0438\u043b\u0438 \u0443\u0431\u0438\u0440\u0430\u0442\u044c \u0431\u043e\u0438 \u2013 \u00ab\u0421\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u0438 \u043e\u0442\u043f\u0440\u0430\u0432\u0438\u0442\u044c\u00bb. \u0420\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u0438 \u0431\u0435\u0437 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0430, \u0435\u0441\u043b\u0438 \u043e\u043d \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0451\u043d \u043a \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u0443 \u0438\u043b\u0438 \u043d\u043e\u0443\u0442\u0431\u0443\u043a\u0443 \u043f\u043e Bluetooth; \u0435\u0441\u043b\u0438 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442 \u043d\u0435\u043d\u0430\u0434\u043e\u043b\u0433\u043e \u043f\u0440\u043e\u043f\u0430\u043b, \u043e\u0442\u043f\u0440\u0430\u0432\u043a\u0430 \u043f\u043e\u0432\u0442\u043e\u0440\u0438\u0442\u0441\u044f \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438.</li>\n<li><strong>\u0427\u0435\u0440\u0435\u0437 \u0430\u043a\u043a\u0430\u0443\u043d\u0442 WBU Sports:</strong> \u043a\u0442\u043e \u0432\u043e\u0448\u0451\u043b \u0432 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0443 \u0432 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435 \u043a\u0430\u043a \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440 \u0441 \u043f\u0430\u0440\u043e\u043b\u0435\u043c WBU, \u0431\u0443\u0434\u0443\u0447\u0438 \u0432 \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u0435 WBU Sports, \u043d\u0430\u0439\u0434\u0451\u0442 \u043f\u043e\u0442\u043e\u043c \u0433\u0430\u043b\u0430 \u043d\u0430 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0435 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438 \u0432 \u00ab\u270e \u041e\u0442\u043a\u0440\u044b\u0442 \u0434\u043e\u0441\u0442\u0443\u043f \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430\u00bb \u2013 \u0441 \u00ab\u0420\u0435\u0434\u0430\u043a\u0442\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u043a\u0430\u0440\u0434\u00bb. \u0422\u043e\u043b\u044c\u043a\u043e \u0434\u043b\u044f \u044d\u0442\u043e\u0433\u043e \u0433\u0430\u043b\u0430 \u0438 \u0434\u043e \u043a\u043e\u043d\u0446\u0430 \u0434\u043d\u044f \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u044f.</li>\n<li>\u0423\u0436\u0435 \u043e\u0446\u0435\u043d\u0451\u043d\u043d\u044b\u0435 \u0431\u043e\u0438 \u043d\u0435\u043b\u044c\u0437\u044f \u0443\u0431\u0440\u0430\u0442\u044c, \u0430 \u043c\u0435\u043d\u044f\u0442\u044c \u0442\u043e\u043b\u044c\u043a\u043e \u043f\u043e\u0441\u043b\u0435 \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u0438\u044f. \u041e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440 \u0432\u0438\u0434\u0438\u0442 \u0432 WBU Sports, \u043a\u0442\u043e, \u0447\u0442\u043e \u0438 \u043a\u043e\u0433\u0434\u0430 \u0438\u0437\u043c\u0435\u043d\u0438\u043b.</li>\n</ul>\n<h3 id=\"anl-3-5\">3.5 \u0421\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440: \u043f\u043e\u043b\u043d\u044b\u0439 \u0434\u043e\u0441\u0442\u0443\u043f \u0441 \u043b\u044e\u0431\u043e\u0433\u043e \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0430</h3>\n<ol>\n<li>\u041e\u0442\u043a\u0440\u044b\u0442\u044c \u043d\u043e\u0443\u0442\u0431\u0443\u043a \u0438\u043b\u0438 \u043f\u043b\u0430\u043d\u0448\u0435\u0442, www.wbu-boxing.com \u2192 <strong>WBU Sports</strong>.</li>\n<li>\u041d\u0430\u0436\u0430\u0442\u044c <strong>\u00ab\ud83d\udee1 \u0412\u043e\u0439\u0442\u0438 \u043a\u0430\u043a \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u00bb</strong>, \u0432\u0432\u0435\u0441\u0442\u0438 \u0438\u043c\u044f \u0438 \u0444\u0430\u043c\u0438\u043b\u0438\u044e \u0438 <strong>\u043f\u0430\u0440\u043e\u043b\u044c \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430 WBU</strong> (\u0442\u043e\u0442 \u0436\u0435, \u0447\u0442\u043e \u0432 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0435 \u2013 \u0435\u0433\u043e \u0437\u043d\u0430\u044e\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u043d\u0430\u0441\u0442\u043e\u044f\u0449\u0438\u0435 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u044b).</li>\n<li>\u041f\u043e\u044f\u0432\u044f\u0442\u0441\u044f \u0432\u0441\u0435 \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043d\u043d\u044b\u0435 \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u044f. \u041d\u0430\u0436\u0430\u0442\u044c \u043d\u0443\u0436\u043d\u043e\u0435 \u2013 \u043f\u043e\u043b\u043d\u044b\u0439 \u0434\u043e\u0441\u0442\u0443\u043f \u043a \u043a\u0430\u0440\u0434\u0443, \u043f\u0443\u043b\u044c\u0442\u0443, \u0447\u0430\u0441\u0430\u043c, WBU Time \u0438 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0430\u043c.</li>\n<li>\u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u044f \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440\u0430 \u0438 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430 \u0441\u0438\u043d\u0445\u0440\u043e\u043d\u0438\u0437\u0438\u0440\u0443\u044e\u0442\u0441\u044f \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u043a\u0430\u0436\u0434\u044b\u0435 20 \u0441\u0435\u043a\u0443\u043d\u0434.</li>\n<li><strong>\u041f\u0443\u043b\u044c\u0442\u043e\u043c \u0443\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u043e\u0434\u043d\u043e \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u043e:</strong> \u0435\u0441\u043b\u0438 \u043e\u043d \u0443\u0436\u0435 \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u043d\u0430 \u0434\u0440\u0443\u0433\u043e\u043c, \u043f\u043e\u044f\u0432\u0438\u0442\u0441\u044f \u043a\u0440\u0430\u0441\u043d\u0430\u044f \u043d\u0430\u0434\u043f\u0438\u0441\u044c \u00ab\u26a0 \u041f\u0443\u043b\u044c\u0442 \u0441\u0435\u0439\u0447\u0430\u0441 \u0440\u0430\u0431\u043e\u0442\u0430\u0435\u0442 \u043d\u0430 \u0434\u0440\u0443\u0433\u043e\u043c \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0435\u00bb \u0441 \u0438\u043c\u0435\u043d\u0435\u043c \u0438 \u0432\u0440\u0435\u043c\u0435\u043d\u0435\u043c. \u00ab\u0412\u0437\u044f\u0442\u044c \u043f\u0443\u043b\u044c\u0442 \u043d\u0430 \u044d\u0442\u043e\u043c \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0435\u00bb \u2013 \u043e\u0441\u043e\u0437\u043d\u0430\u043d\u043d\u043e\u0435 \u043f\u0435\u0440\u0435\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0435.</li>\n</ol>\n<p><strong>\u0412\u0445\u043e\u0434 \u0432 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0443:</strong> \u043f\u0440\u043e\u043c\u043e\u0443\u0442\u0435\u0440, \u043c\u0435\u0441\u0442\u043e, \u0434\u0430\u0442\u0430 \u0438 \u0432\u0440\u0430\u0447 \u0440\u0438\u043d\u0433\u0430 \u043f\u0443\u0441\u0442\u044b\u0435, \u043f\u043e\u043a\u0430 \u043d\u0435 \u0432\u044b\u0431\u0440\u0430\u043d\u043e \u0448\u043e\u0443 \u2013 \u0437\u0430\u0442\u0435\u043c \u0437\u0430\u043f\u043e\u043b\u043d\u044f\u044e\u0442\u0441\u044f \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438.</p>\n<p><strong>\u0421\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440 \u043d\u0430 \u043d\u043e\u0443\u0442\u0431\u0443\u043a\u0435/\u041f\u041a:</strong> \u041f\u043e\u0434 \u043f\u0443\u043b\u044c\u0442\u043e\u043c \u043f\u043e\u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u00ab\ud83d\udee1 \u041c\u043e\u044f \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430\u00bb \u2013 \u0432\u0445\u043e\u0434 \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439, \u0432\u0441\u0435 \u0444\u0443\u043d\u043a\u0446\u0438\u0438 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438. \u0412\u0432\u0435\u0440\u0445\u0443 \u043a\u0440\u0443\u043f\u043d\u043e PIN \u0434\u043b\u044f \u0441\u0443\u0434\u0435\u0439, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u0442\u0435\u043b\u0435\u0444\u043e\u043d \u043d\u0435 \u043d\u0443\u0436\u0435\u043d. \u00ab\u041e\u0442\u043a\u0440\u044b\u0442\u044c \u0432 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e\u043c \u043e\u043a\u043d\u0435\u00bb \u043e\u0442\u043a\u0440\u044b\u0432\u0430\u0435\u0442 \u0435\u0451 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e. (\u0412\u0438\u0434\u043d\u043e \u0442\u043e\u043b\u044c\u043a\u043e \u043f\u0440\u0438 \u0432\u0445\u043e\u0434\u0435 \u043a\u0430\u043a \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440 \u0438 \u0435\u0441\u043b\u0438 \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435 \u0432 live.)</p>\n<p><strong>\u0420\u043e\u043b\u0438 \u043f\u0440\u0438 \u0432\u0445\u043e\u0434\u0435 \u0441 \u043f\u0430\u0440\u043e\u043b\u0435\u043c \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430:</strong> \u0420\u043e\u043b\u044c \u0432\u044b\u0431\u0438\u0440\u0430\u0435\u0442\u0441\u044f \u0441\u043f\u0440\u0430\u0432\u0430 \u0432\u0432\u0435\u0440\u0445\u0443 (\u0438 \u0432 \u043e\u043a\u043d\u0435 \u0432\u0445\u043e\u0434\u0430). <strong>\ud83d\udee1 \u0421\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440:</strong> \u0432\u0438\u0434\u0438\u0442 \u043f\u0443\u043b\u044c\u0442 \u0432 \u0440\u0435\u0430\u043b\u044c\u043d\u043e\u043c \u0432\u0440\u0435\u043c\u0435\u043d\u0438 (\u0447\u0430\u0441\u044b \u0438\u0434\u0443\u0442, \u043d\u043e \u0443\u043f\u0440\u0430\u0432\u043b\u044f\u0442\u044c \u0438\u043c\u0438 \u043d\u0435\u043b\u044c\u0437\u044f), \u043d\u0438\u0436\u0435 \u2013 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430. <strong>\ud83c\udf9b \u041e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440 (\u0442\u0435\u0445\u043d\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u0440\u0443\u043a\u043e\u0432\u043e\u0434\u0438\u0442\u0435\u043b\u044c):</strong> \u0422\u0435\u0445\u043d\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u0440\u0443\u043a\u043e\u0432\u043e\u0434\u0438\u0442\u0435\u043b\u044c \u0441\u043b\u0435\u0434\u0438\u0442 \u0437\u0430 \u0432\u0442\u043e\u0440\u044b\u043c \u043f\u0443\u043b\u044c\u0442\u043e\u043c \u0438 \u0443\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442 \u0438\u043c \u2013 \u043e\u043d \u043c\u043e\u0436\u0435\u0442 \u0431\u044b\u0442\u044c \u0438 \u0445\u0440\u043e\u043d\u043e\u043c\u0435\u0442\u0440\u0438\u0441\u0442\u043e\u043c. \u041e\u043d \u0443\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442 \u043f\u0443\u043b\u044c\u0442\u043e\u043c \u2013 \u0447\u0430\u0441\u044b, \u043c\u043e\u043d\u0438\u0442\u043e\u0440\u044b, \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b, \u0440\u0435\u0434\u0430\u043a\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u2013 \u0431\u0435\u0437 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438. \u0422\u0430\u043a \u043e\u0434\u043d\u043e\u0432\u0440\u0435\u043c\u0435\u043d\u043d\u043e \u0440\u0430\u0431\u043e\u0442\u0430\u044e\u0442 \u0434\u0432\u0430 \u043f\u0443\u043b\u044c\u0442\u0430: \u043e\u0434\u0438\u043d \u0434\u043b\u044f \u043d\u0430\u0431\u043b\u044e\u0434\u0435\u043d\u0438\u044f \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430, \u0434\u0440\u0443\u0433\u043e\u0439 \u0434\u043b\u044f \u0443\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u044f.</p>\n<h3 id=\"anl-_2\">\u0413\u043e\u043b\u043e\u0441 \u0440\u0438\u043d\u0433-\u0430\u043d\u043e\u043d\u0441\u0435\u0440\u0430</h3>\n<p>\u0414\u043b\u044f \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0439 \u0431\u0435\u0437 \u0441\u0432\u043e\u0435\u0433\u043e \u0430\u043d\u043e\u043d\u0441\u0435\u0440\u0430. \u0417\u0432\u0443\u043a \u0447\u0435\u0440\u0435\u0437 \u041f\u041a \u043f\u0443\u043b\u044c\u0442\u0430 \u043d\u0430 \u0441\u0438\u0441\u0442\u0435\u043c\u0443 \u0437\u0430\u043b\u0430.</p>\n<ul>\n<li>\u041d\u0430 \u043f\u0443\u043b\u044c\u0442\u0435 \u0432\u043a\u043b\u044e\u0447\u0438\u0442\u0435 <strong>\u00ab\ud83c\udfa4 \u0420\u0438\u043d\u0433-\u0430\u043d\u043e\u043d\u0441\u0435\u0440 \u0432\u043a\u043b.\u00bb</strong> \u0438 \u0432\u044b\u0431\u0435\u0440\u0438\u0442\u0435 \u044f\u0437\u044b\u043a (DE, EN, ES, FR, RU). <strong>\u00ab\u25b6 \u041f\u0440\u043e\u0431\u0430\u00bb</strong> \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442 \u0433\u043e\u043b\u043e\u0441.</li>\n<li><strong>\u041e\u0431\u044a\u044f\u0432\u043b\u0435\u043d\u0438\u0435 \u043a\u043d\u043e\u043f\u043a\u043e\u0439</strong> (\u043f\u0443\u043b\u044c\u0442 \u00ab\u041d\u0430 \u0440\u0438\u043d\u0433\u0435\u00bb \u0438\u043b\u0438 \u043a\u0430\u0440\u0434 \ud83c\udfa4): <strong>\u0411\u043e\u0439</strong> (\u043d\u043e\u043c\u0435\u0440, \u0442\u0438\u0442\u0443\u043b, \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f, \u0440\u0430\u0443\u043d\u0434\u044b), <strong>\u041a\u0440\u0430\u0441\u043d\u044b\u0439 \u0443\u0433\u043e\u043b</strong>, <strong>\u0421\u0438\u043d\u0438\u0439 \u0443\u0433\u043e\u043b</strong> (\u0441\u0442\u0440\u0430\u043d\u0430, \u043a\u043b\u0443\u0431, \u0438\u043c\u044f).</li>\n<li><strong>\ud83c\udfc6 \u041e\u0431\u044a\u044f\u0432\u043b\u0435\u043d\u0438\u0435 \u043f\u043e\u0431\u0435\u0434\u0438\u0442\u0435\u043b\u044f:</strong> \u041f\u043e\u0441\u043b\u0435 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0430 (\u043a\u043e\u0433\u0434\u0430 \u0440\u0435\u0444\u0435\u0440\u0438 \u0437\u0430\u043a\u043e\u043d\u0447\u0438\u043b) \u043d\u0430\u0436\u043c\u0438\u0442\u0435 <strong>\u00ab\ud83c\udfc6 \u041f\u043e\u0431\u0435\u0434\u0438\u0442\u0435\u043b\u044c\u00bb</strong> \u043d\u0430 \u043f\u0443\u043b\u044c\u0442\u0435 \u0438\u043b\u0438 \ud83c\udfc6 \u0432 \u043a\u0430\u0440\u0434\u0435. \u0413\u043e\u043b\u043e\u0441 \u043e\u0431\u044a\u044f\u0432\u043b\u044f\u0435\u0442 \u0441\u043f\u043e\u0441\u043e\u0431 \u0438 \u0440\u0430\u0443\u043d\u0434 \u0438\u0437 \u0432\u0432\u0435\u0434\u0451\u043d\u043d\u043e\u0433\u043e \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0430, \u043d\u0430\u043f\u0440. \u00ab\u0414\u0430\u043c\u044b \u0438 \u0433\u043e\u0441\u043f\u043e\u0434\u0430! \u2026 \u0422\u0435\u0445\u043d\u0438\u0447\u0435\u0441\u043a\u0438\u043c \u043d\u043e\u043a\u0430\u0443\u0442\u043e\u043c, \u0440\u0430\u0443\u043d\u0434 3 \u2026 \u043f\u043e\u0431\u0435\u0436\u0434\u0430\u0435\u0442 \u2026 \u0438\u0437 \u043a\u0440\u0430\u0441\u043d\u043e\u0433\u043e \u0443\u0433\u043b\u0430 \u2026 \u041c\u0430\u0440\u043a\u043e \u2026 \u0411\u0440\u0430\u043d\u0434\u0442!\u00bb \u2013 \u0442\u0430\u043a\u0436\u0435 \u0440\u0435\u0448\u0435\u043d\u0438\u044f \u0441\u0443\u0434\u0435\u0439 (\u0435\u0434\u0438\u043d\u043e\u0433\u043b\u0430\u0441\u043d\u043e\u0435, \u0440\u0430\u0437\u0434\u0435\u043b\u044c\u043d\u043e\u0435, \u0431\u043e\u043b\u044c\u0448\u0438\u043d\u0441\u0442\u0432\u043e\u043c), \u043d\u0438\u0447\u044c\u0438 \u0438 \u00ab\u0431\u043e\u0439 \u043d\u0435 \u0441\u043e\u0441\u0442\u043e\u044f\u043b\u0441\u044f\u00bb.</li>\n<li><strong>\u0422\u043e\u043d:</strong> \u0412 \u00ab\ud83d\udd11 \u0413\u043e\u043b\u043e\u0441 Google\u00bb \u0440\u044f\u0434\u043e\u043c \u0441 \u0433\u043e\u043b\u043e\u0441\u043e\u043c \u0438 \u0442\u0435\u043c\u043f\u043e\u043c \u0435\u0441\u0442\u044c \u043f\u043e\u043b\u0437\u0443\u043d\u043e\u043a <strong>\u0422\u043e\u043d</strong> \u2013 \u043c\u0435\u043d\u044c\u0448\u0435 = \u043d\u0438\u0436\u0435 \u0438 \u0442\u0435\u043c\u043d\u0435\u0435, \u0431\u043e\u043b\u044c\u0448\u0435 = \u0432\u044b\u0448\u0435 \u0438 \u0441\u0432\u0435\u0442\u043b\u0435\u0435. <strong>\u0418\u043c\u0435\u043d\u0430 \u0431\u043e\u043a\u0441\u0451\u0440\u043e\u0432</strong> \u043f\u0440\u043e\u0438\u0437\u043d\u043e\u0441\u044f\u0442\u0441\u044f \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e, \u0441\u043e \u0441\u0432\u043e\u0438\u043c\u0438 \u043f\u043e\u043b\u0437\u0443\u043d\u043a\u0430\u043c\u0438 <strong>\u0422\u0435\u043c\u043f \u0438\u043c\u0435\u043d\u0438</strong> \u0438 <strong>\u0422\u043e\u043d \u0438\u043c\u0435\u043d\u0438</strong> \u2013 \u043c\u0435\u0434\u043b\u0435\u043d\u043d\u0435\u0435, \u043f\u0440\u043e\u0442\u044f\u0436\u043d\u043e \u0438 \u0432\u044b\u0440\u0430\u0437\u0438\u0442\u0435\u043b\u044c\u043d\u043e.</li>\n<li><strong>\u0413\u043e\u043d\u0433 \u043d\u0430\u0434\u0451\u0436\u043d\u043e:</strong> \u0412 \u043d\u0430\u0447\u0430\u043b\u0435 \u0440\u0430\u0443\u043d\u0434\u0430 \u0441\u043d\u0430\u0447\u0430\u043b\u0430 \u00ab\u0420\u0430\u0443\u043d\u0434 X! \u0411\u043e\u043a\u0441!\u00bb, \u0437\u0430\u0442\u0435\u043c \u0433\u043e\u043d\u0433 \u2013 \u0442\u0430\u043a\u0436\u0435 \u043f\u043e\u0441\u043b\u0435 \u00ab\u21ba \u0420\u0430\u0443\u043d\u0434 \u0437\u0430\u043d\u043e\u0432\u043e\u00bb \u0438\u043b\u0438 \u00ab\u23ed \u0421\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0440\u0430\u0443\u043d\u0434\u00bb \u043f\u0440\u0438 \u043d\u0430\u0436\u0430\u0442\u0438\u0438 \u0421\u0422\u0410\u0420\u0422/\u0414\u0410\u041b\u0415\u0415. \u0413\u043e\u043d\u0433 \u0437\u0432\u0443\u0447\u0438\u0442 \u043d\u0435 \u043f\u043e\u0437\u0436\u0435 \u0447\u0435\u043c \u0447\u0435\u0440\u0435\u0437 6 \u0441\u0435\u043a\u0443\u043d\u0434, \u0434\u0430\u0436\u0435 \u0435\u0441\u043b\u0438 \u0433\u043e\u043b\u043e\u0441 \u0437\u0430\u0432\u0438\u0441.</li>\n<li><strong>\u0410\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0441 \u0447\u0430\u0441\u0430\u043c\u0438:</strong> \u043f\u0440\u0438 START \u0438\u043b\u0438 \u043d\u0430\u0447\u0430\u043b\u0435 \u0440\u0430\u0443\u043d\u0434\u0430 \u0441\u043d\u0430\u0447\u0430\u043b\u0430 \u00ab\u0420\u0430\u0443\u043d\u0434 1 \u2013 \u0431\u043e\u043a\u0441!\u00bb, \u0437\u0430\u0442\u0435\u043c \u0433\u043e\u043d\u0433 (\u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0438\u0439 \u0440\u0430\u0443\u043d\u0434 \u2013 \u00ab\u041f\u043e\u0441\u043b\u0435\u0434\u043d\u0438\u0439 \u0440\u0430\u0443\u043d\u0434!\u00bb). \u0412 \u043a\u043e\u043d\u0446\u0435 \u0440\u0430\u0443\u043d\u0434\u0430 \u0441\u043d\u0430\u0447\u0430\u043b\u0430 \u0433\u043e\u043d\u0433, \u0437\u0430\u0442\u0435\u043c \u00ab\u041a\u043e\u043d\u0435\u0446 \u0440\u0430\u0443\u043d\u0434\u0430 1!\u00bb (\u0432 \u043a\u043e\u043d\u0446\u0435 \u0431\u043e\u044f \u00ab\u041a\u043e\u043d\u0435\u0446 \u0431\u043e\u044f!\u00bb). \u00ab\u0421\u0435\u043a\u0443\u043d\u0434\u0430\u043d\u0442\u044b, \u043f\u043e\u043a\u0438\u043d\u0443\u0442\u044c \u0440\u0438\u043d\u0433!\u00bb \u0437\u0430 10 \u0441\u0435\u043a\u0443\u043d\u0434 \u0432 \u043f\u0435\u0440\u0435\u0440\u044b\u0432\u0435.</li>\n<li><strong>\u0413\u043e\u043b\u043e\u0441:</strong> \u0431\u0435\u0441\u043f\u043b\u0430\u0442\u043d\u043e. \u0411\u0435\u0437 \u043a\u043b\u044e\u0447\u0430 \u0433\u043e\u0432\u043e\u0440\u0438\u0442 \u0433\u043e\u043b\u043e\u0441 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0430. \u0427\u0435\u0440\u0435\u0437 <strong>\u00ab\ud83d\udd11 \u0413\u043e\u043b\u043e\u0441 Google\u00bb</strong> (\u0442\u043e\u043b\u044c\u043a\u043e \u0441 \u043f\u0430\u0440\u043e\u043b\u0435\u043c \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430 WBU) \u043d\u0430\u0441\u0442\u0440\u0430\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u0431\u043e\u043b\u0435\u0435 \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0439 \u0433\u043e\u043b\u043e\u0441 Google \u2013 \u0431\u0435\u0441\u043f\u043b\u0430\u0442\u043d\u043e \u0434\u043e 1 \u043c\u043b\u043d \u0441\u0438\u043c\u0432\u043e\u043b\u043e\u0432 \u0432 \u043c\u0435\u0441\u044f\u0446 (\u0433\u0430\u043b\u0430 \u0442\u0440\u0435\u0431\u0443\u0435\u0442 \u043e\u043a\u043e\u043b\u043e 5 000\u201310 000).</li>\n<li><strong>\ud83d\udd14 \u0413\u043e\u043d\u0433 \u0432\u0440\u0443\u0447\u043d\u0443\u044e:</strong> \u043a\u043d\u043e\u043f\u043a\u0430 \u00ab\ud83d\udd14 \u0413\u043e\u043d\u0433\u00bb \u0440\u044f\u0434\u043e\u043c \u0441\u043e START/STOP \u0437\u0432\u043e\u043d\u0438\u0442 \u043e\u0434\u0438\u043d \u0440\u0430\u0437 \u043f\u0440\u0438 \u043a\u0430\u0436\u0434\u043e\u043c \u043d\u0430\u0436\u0430\u0442\u0438\u0438 \u2013 \u0434\u0430\u0436\u0435 \u043a\u043e\u0433\u0434\u0430 \u0447\u0430\u0441\u044b \u0438\u0434\u0443\u0442 \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 (\u043d\u0430\u043f\u0440\u0438\u043c\u0435\u0440, \u0435\u0441\u043b\u0438 \u0433\u043e\u043d\u0433 \u043d\u0435 \u0443\u0441\u043b\u044b\u0448\u0430\u043b\u0438).</li>\n<li><strong>\u041f\u043e\u043f\u0440\u043e\u0431\u043e\u0432\u0430\u0442\u044c:</strong> \u0443 \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0432\u043e\u0448\u0435\u0434\u0448\u0435\u0433\u043e \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044f (\u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440, \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440, WBU) \u043d\u0430 \u0441\u0442\u0430\u0440\u0442\u043e\u0432\u043e\u0439 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0435 \u0435\u0441\u0442\u044c \u00ab\ud83e\uddea \u041e\u0442\u043a\u0440\u044b\u0442\u044c \u0442\u0435\u0441\u0442\u043e\u0432\u043e\u0435 \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435\u00bb \u2013 2 \u0431\u043e\u044f, \u0442\u043e\u043b\u044c\u043a\u043e \u043d\u0430 \u044d\u0442\u043e\u043c \u0443\u0441\u0442\u0440\u043e\u0439\u0441\u0442\u0432\u0435, \u043d\u0435 \u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442\u0441\u044f \u0438 \u043d\u0435 \u0432\u044b\u0445\u043e\u0434\u0438\u0442 \u0432 \u044d\u0444\u0438\u0440.</li>\n<li>\u0412 \u0440\u043e\u043b\u0438 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430 \u0430\u043d\u043e\u043d\u0441\u0435\u0440 \u043c\u043e\u043b\u0447\u0438\u0442 \u2013 \u0433\u043e\u0432\u043e\u0440\u0438\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u043f\u0443\u043b\u044c\u0442 \u0442\u0435\u0445\u043d\u0438\u0447\u0435\u0441\u043a\u043e\u0433\u043e \u0440\u0443\u043a\u043e\u0432\u043e\u0434\u0438\u0442\u0435\u043b\u044f.</li>\n</ul>\n<p><strong>\u0422\u0435\u043b\u0435\u0432\u0438\u0437\u043e\u0440\u044b (\u043f\u0430\u043d\u0435\u043b\u044c \ud83d\udcfa \u043d\u0430 \u043f\u0443\u043b\u044c\u0442\u0435):</strong> <strong>\ud83d\udcfa WBU Live</strong> (\u0441\u043f\u0438\u0441\u043e\u043a \u0431\u043e\u0451\u0432), <strong>\u23f1 WBU Time 1</strong> \u0438 <strong>\u23f1 WBU Time 2</strong> (\u0447\u0430\u0441\u044b \u0440\u0430\u0443\u043d\u0434\u043e\u0432). \u0421 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u043e\u043c \u043e\u0442\u043a\u0440\u044b\u0432\u0430\u044e\u0442\u0441\u044f live-\u0441\u0442\u0440\u0430\u043d\u0438\u0446\u044b (\u0442\u0430\u043a\u0436\u0435 \u043d\u0430 Fire TV). \u0411\u0435\u0437 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0430 \u043d\u0430 \u041f\u041a \u043f\u0443\u043b\u044c\u0442\u0430 \u043e\u0442\u043a\u0440\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u043e\u043a\u043d\u043e \u2013 \u043f\u0435\u0440\u0435\u0442\u0430\u0449\u0438\u0442\u0435 \u0435\u0433\u043e \u043d\u0430 \u0442\u0435\u043b\u0435\u0432\u0438\u0437\u043e\u0440 (HDMI) \u0438 \u043d\u0430\u0436\u043c\u0438\u0442\u0435 F11. \u0422\u0430\u043a \u043d\u0430 \u0447\u0435\u043c\u043f\u0438\u043e\u043d\u0430\u0442\u0435 \u043e\u0434\u043d\u043e\u0432\u0440\u0435\u043c\u0435\u043d\u043d\u043e \u0440\u0430\u0431\u043e\u0442\u0430\u044e\u0442 \u0442\u0440\u0438 \u0442\u0435\u043b\u0435\u0432\u0438\u0437\u043e\u0440\u0430. \u041f\u0440\u0438 \u043e\u0434\u043d\u043e\u043c \u0440\u0438\u043d\u0433\u0435 WBU Time 2 \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u0442\u0435 \u0436\u0435 \u0447\u0430\u0441\u044b \u043d\u0430 \u0432\u0442\u043e\u0440\u043e\u043c \u0442\u0435\u043b\u0435\u0432\u0438\u0437\u043e\u0440\u0435.</p>\n<p><strong>\u23f8 \u041f\u0435\u0440\u0435\u0440\u044b\u0432 \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u044f:</strong> \u043d\u0430 \u043f\u0443\u043b\u044c\u0442\u0435 \u043d\u0430\u0436\u043c\u0438\u0442\u0435 \u00ab\u23f8 \u041f\u0435\u0440\u0435\u0440\u044b\u0432 \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u044f\u00bb \u0438 \u0432\u044b\u0431\u0435\u0440\u0438\u0442\u0435 5\u201330 \u043c\u0438\u043d\u0443\u0442 \u0438\u043b\u0438 \u00ab\u0431\u0435\u0437 \u0432\u0440\u0435\u043c\u0435\u043d\u0438\u00bb. \u0422\u0435\u043a\u0443\u0449\u0438\u0439 \u0431\u043e\u0439 \u0438\u0434\u0451\u0442 \u0434\u043e \u043a\u043e\u043d\u0446\u0430, \u0437\u0430\u0442\u0435\u043c \u043d\u043e\u0432\u044b\u0439 \u0431\u043e\u0439 \u043d\u0435 \u0432\u044b\u0437\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u2013 \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u043a\u0430 \u0436\u0434\u0451\u0442. WBU Time \u0438 WBU Live \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u044e\u0442 \u00ab\u041f\u0415\u0420\u0415\u0420\u042b\u0412\u00bb \u0441 \u043e\u0442\u0441\u0447\u0451\u0442\u043e\u043c \u0438 \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u043c \u0431\u043e\u0435\u043c. \u00ab\u25b6 \u041f\u0440\u043e\u0434\u043e\u043b\u0436\u0438\u0442\u044c \u2013 \u0432\u044b\u0437\u0432\u0430\u0442\u044c \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0431\u043e\u0439\u00bb \u0437\u0430\u0432\u0435\u0440\u0448\u0430\u0435\u0442 \u043f\u0435\u0440\u0435\u0440\u044b\u0432 (\u0441 \u0430\u043d\u043e\u043d\u0441\u043e\u043c, \u0435\u0441\u043b\u0438 \u0432\u043a\u043b\u044e\u0447\u0451\u043d).</p>\n<h3 id=\"anl-3-3\">3.3 \u0411\u0430\u0437\u0430 \u0431\u043e\u0439\u0446\u043e\u0432</h3>\n<ul>\n<li>\u0412\u0441\u0435 \u0431\u043e\u0439\u0446\u044b \u0438\u0437 \u0442\u0443\u0440\u043d\u0438\u0440\u043d\u044b\u0445 \u0437\u0430\u044f\u0432\u043e\u043a \u0438 \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043d\u043d\u044b\u0445 \u0433\u0430\u043b\u0430 \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u043f\u043e\u043f\u0430\u0434\u0430\u044e\u0442 \u0432 <strong>\u0431\u0430\u0437\u0443 \u0431\u043e\u0439\u0446\u043e\u0432</strong>, \u043f\u043e \u0437\u0430\u043b\u0430\u043c. \u041a\u0430\u0436\u0434\u044b\u0439 \u0431\u043e\u0435\u0446 \u0432 \u043d\u0435\u0439 \u043e\u0434\u0438\u043d \u0440\u0430\u0437.</li>\n<li><strong>\ud83d\udcc7</strong> \u0440\u044f\u0434\u043e\u043c \u0441 \u00ab\u041a\u0440\u0430\u0441\u043d\u044b\u0439 \u0443\u0433\u043e\u043b\u00bb / \u00ab\u0421\u0438\u043d\u0438\u0439 \u0443\u0433\u043e\u043b\u00bb (\u0438 \u00ab\ud83d\udcc7 \u0411\u0430\u0437\u0430\u00bb \u0443 \u0443\u0447\u0430\u0441\u0442\u043d\u0438\u043a\u043e\u0432 \u0442\u0443\u0440\u043d\u0438\u0440\u0430): \u0440\u0430\u0441\u043a\u0440\u044b\u0442\u044c \u0437\u0430\u043b \u0438\u043b\u0438 \u043d\u0430\u0439\u0442\u0438 \u0438\u043c\u044f, \u043d\u0430\u0436\u0430\u0442\u044c \u043d\u0430 \u0431\u043e\u0439\u0446\u0430 \u2013 \u0438\u043c\u044f, \u0437\u0430\u043b, \u0441\u0442\u0440\u0430\u043d\u0430, \u0434\u0430\u0442\u0430 \u0440\u043e\u0436\u0434\u0435\u043d\u0438\u044f \u0438 \u0432\u0435\u0441 \u0432\u043d\u043e\u0441\u044f\u0442\u0441\u044f \u0441\u0440\u0430\u0437\u0443.</li>\n<li>\u041d\u0430 \u0441\u0442\u0430\u0440\u0442\u043e\u0432\u043e\u0439 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0435: \u00ab\ud83d\udcc7 \u0411\u0430\u0437\u0430 \u0431\u043e\u0439\u0446\u043e\u0432\u00bb \u2013 \u043f\u0440\u043e\u0441\u043c\u0430\u0442\u0440\u0438\u0432\u0430\u0442\u044c, \u0438\u0441\u043f\u0440\u0430\u0432\u043b\u044f\u0442\u044c (\u270e) \u0438 \u0434\u043e\u0431\u0430\u0432\u043b\u044f\u0442\u044c. \u0423\u0434\u0430\u043b\u0435\u043d\u0438\u0435 \u0442\u043e\u043b\u044c\u043a\u043e \u0441 \u043f\u0430\u0440\u043e\u043b\u0435\u043c WBU.</li>\n<li><strong>\ud83d\udce5 \u0417\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u0441\u043f\u0438\u0441\u043e\u043a:</strong> \u0442\u0430\u0431\u043b\u0438\u0446\u0430 (Excel \u2192 \u00abCSV UTF-8\u00bb) \u0441\u043e \u0441\u0442\u043e\u043b\u0431\u0446\u0430\u043c\u0438 \u0438\u043c\u044f; \u0444\u0430\u043c\u0438\u043b\u0438\u044f; \u0437\u0430\u043b / \u043a\u043b\u0443\u0431; \u0441\u0442\u0440\u0430\u043d\u0430 \u2013 \u043d\u0430\u043f\u0440. \u0443\u0447\u0430\u0441\u0442\u043d\u0438\u043a\u0438 \u043f\u0440\u043e\u0448\u043b\u043e\u0433\u043e \u0442\u0443\u0440\u043d\u0438\u0440\u0430. \u041a\u0442\u043e \u0443\u0436\u0435 \u0435\u0441\u0442\u044c, \u043d\u0435 \u0434\u0443\u0431\u043b\u0438\u0440\u0443\u0435\u0442\u0441\u044f. \u0412\u0435\u0441\u043e\u0432\u0443\u044e \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044e \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440 \u0432\u044b\u0431\u0438\u0440\u0430\u0435\u0442 \u043a\u0430\u0436\u0434\u044b\u0439 \u0440\u0430\u0437 \u0437\u0430\u043d\u043e\u0432\u043e.</li>\n<li><strong>\u041f\u0440\u0438 \u0432\u0432\u043e\u0434\u0435 \u0438\u043c\u0435\u043d\u0438</strong> (\u043a\u0440\u0430\u0441\u043d\u044b\u0439/\u0441\u0438\u043d\u0438\u0439 \u0443\u0433\u043e\u043b, \u0443\u0447\u0430\u0441\u0442\u043d\u0438\u043a\u0438) \u043f\u043e\u044f\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u043f\u043e\u0434\u0445\u043e\u0434\u044f\u0449\u0438\u0435 \u0431\u043e\u0439\u0446\u044b \u0438\u0437 \u0431\u0430\u0437\u044b \u2013 \u043d\u0430\u0436\u0430\u0442\u0438\u0435 \u043f\u0435\u0440\u0435\u043d\u043e\u0441\u0438\u0442 \u0438\u043c\u044f, \u0437\u0430\u043b, \u0441\u0442\u0440\u0430\u043d\u0443 \u0438 \u0434\u0430\u0442\u0443 \u0440\u043e\u0436\u0434\u0435\u043d\u0438\u044f. \u0422\u0430\u043a \u043d\u0435\u0442 \u0434\u0443\u0431\u043b\u0435\u0439. \u0414\u0440\u0443\u0433\u043e\u0439 \u0447\u0435\u043b\u043e\u0432\u0435\u043a \u0441 \u0442\u0435\u043c \u0436\u0435 \u0438\u043c\u0435\u043d\u0435\u043c? \u0414\u043e\u0431\u0430\u0432\u044c\u0442\u0435 \u0443\u0442\u043e\u0447\u043d\u0435\u043d\u0438\u0435 (\u043d\u0430\u043f\u0440. \u0432\u0442\u043e\u0440\u043e\u0435 \u0438\u043c\u044f).</li>\n<li><strong>\u041a\u043b\u0443\u0431\u044b \u043f\u0440\u0438 \u043e\u043d\u043b\u0430\u0439\u043d-\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438</strong> \u0432\u0438\u0434\u044f\u0442 \u0442\u043e\u043b\u044c\u043a\u043e <strong>\u0441\u0432\u043e\u0438\u0445</strong> \u0440\u0430\u043d\u0435\u0435 \u0437\u0430\u044f\u0432\u043b\u0435\u043d\u043d\u044b\u0445 \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u043e\u0432. \u0415\u0441\u043b\u0438 \u0438\u043c\u044f \u0435\u0441\u0442\u044c \u0432 \u0434\u0440\u0443\u0433\u043e\u043c \u043a\u043b\u0443\u0431\u0435, \u043f\u043e\u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e \u043f\u043e\u0434\u0441\u043a\u0430\u0437\u043a\u0430 \u00ab\u0422\u0430\u043a\u043e\u0435 \u0438\u043c\u044f \u0443\u0436\u0435 \u0435\u0441\u0442\u044c\u00bb \u2013 \u0431\u0435\u0437 \u0447\u0443\u0436\u0438\u0445 \u0434\u0430\u043d\u043d\u044b\u0445.</li>\n<li><strong>\u0417\u0430\u043a\u0440\u044b\u0442\u0430:</strong> \u0431\u0430\u0437\u0443 \u0432\u0438\u0434\u044f\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u044b \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440\u043e\u0432 \u0438 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u043e\u0432, \u0442\u0440\u0435\u043d\u0435\u0440\u044b (\u0442\u043e\u043b\u044c\u043a\u043e \u0441\u0432\u043e\u0439 \u0437\u0430\u043b) \u0438 WBU (\u043f\u0430\u0440\u043e\u043b\u044c WBU) \u2013 \u043d\u0438\u043a\u043e\u0433\u0434\u0430 \u043e\u0431\u0449\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0441\u0442\u044c \u0438 \u043a\u043b\u0443\u0431\u044b \u0434\u0440\u0443\u0433 \u0443 \u0434\u0440\u0443\u0433\u0430.</li>\n</ul>\n<h3 id=\"anl-3-4\">3.4 \u041f\u0440\u043e\u0444\u0438\u043b\u044c \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u0430: \u0440\u0435\u043a\u043e\u0440\u0434, \u0442\u0438\u0442\u0443\u043b\u044b, \u0432\u0435\u0441 \u0438 \u043e\u0442\u0441\u0442\u0440\u0430\u043d\u0435\u043d\u0438\u0435 \u043f\u043e\u0441\u043b\u0435 \u043d\u043e\u043a\u0430\u0443\u0442\u0430</h3>\n<ul>\n<li>\u0412 \u0431\u0430\u0437\u0435 \u0431\u043e\u0439\u0446\u043e\u0432 <strong>\u00ab\u041f\u0440\u043e\u0444\u0438\u043b\u044c\u00bb</strong> \u043e\u0442\u043a\u0440\u044b\u0432\u0430\u0435\u0442 \u043f\u0440\u043e\u0444\u0438\u043b\u044c \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u0430. \u041e\u043d \u0432\u0438\u0434\u0435\u043d \u0442\u043e\u043b\u044c\u043a\u043e \u0437\u0434\u0435\u0441\u044c, \u0432 \u0437\u0430\u0449\u0438\u0449\u0451\u043d\u043d\u043e\u0439 \u0437\u043e\u043d\u0435 \u2013 \u043d\u0435 \u043d\u0430 \u0441\u0430\u0439\u0442\u0435.</li>\n<li><strong>\u0420\u0435\u043a\u043e\u0440\u0434 \u043f\u043e \u0432\u0438\u0434\u0430\u043c \u0441\u043f\u043e\u0440\u0442\u0430, \u0440\u0430\u0437\u0434\u0435\u043b\u044c\u043d\u043e:</strong> \u043f\u0440\u043e\u0444\u0438, \u043f\u043e\u043b\u0443\u043f\u0440\u043e\u0444\u0438, \u043c\u0430\u0441\u0442\u0435\u0440\u0441, K1, Bare Knuckle \u0438 Hybrid \u2013 \u043f\u043e\u0431\u0435\u0434\u044b (\u0438\u0437 \u043d\u0438\u0445 KO), \u043f\u043e\u0440\u0430\u0436\u0435\u043d\u0438\u044f (\u0438\u0437 \u043d\u0438\u0445 KO) \u0438 \u043d\u0438\u0447\u044c\u0438. \u041a\u0430\u0436\u0434\u044b\u0439 \u0431\u043e\u0439 \u0438\u0437 \u0441\u0438\u0441\u0442\u0435\u043c\u044b WBU \u0437\u0430\u0441\u0447\u0438\u0442\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438, \u0432 \u0442\u043e\u043c \u0447\u0438\u0441\u043b\u0435 \u0440\u0430\u043d\u0435\u0435 \u043e\u043f\u0443\u0431\u043b\u0438\u043a\u043e\u0432\u0430\u043d\u043d\u044b\u0435 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b. \u0415\u0441\u043b\u0438 \u0435\u0449\u0451 \u043d\u0438\u0447\u0435\u0433\u043e \u043d\u0435\u0442, \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0431\u043e\u0439 WBU \u2013 \u0431\u043e\u0439 \u2116 1.</li>\n<li><strong>\u0414\u043e\u043f\u0438\u0441\u0430\u0442\u044c \u0431\u043e\u0438 \u0438\u0437 \u0434\u0440\u0443\u0433\u0438\u0445 \u043c\u0435\u0441\u0442:</strong> \u0442\u043e\u043b\u044c\u043a\u043e <strong>\u0442\u0440\u0435\u043d\u0435\u0440</strong> \u0442\u043e\u0433\u043e \u0436\u0435 \u0437\u0430\u043b\u0430 (\u0440\u043e\u043b\u044c \u00ab\u0422\u0440\u0435\u043d\u0435\u0440\u00bb) \u2013 \u0438 \u0442\u043e\u043b\u044c\u043a\u043e \u0432\u0432\u0435\u0440\u0445, \u0447\u0438\u0441\u043b\u0430 \u043d\u0435 \u043c\u043e\u0433\u0443\u0442 \u0443\u043c\u0435\u043d\u044c\u0448\u0430\u0442\u044c\u0441\u044f. \u0418\u0441\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0432\u043d\u0438\u0437 \u0434\u0435\u043b\u0430\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e WBU. \u041a\u0430\u0436\u0434\u043e\u0435 \u0438\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0435 \u0441 \u0438\u043c\u0435\u043d\u0435\u043c \u0438 \u0434\u0430\u0442\u043e\u0439 \u0432\u0438\u0434\u043d\u043e \u0432 \u00ab\u0418\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u044f\u00bb.</li>\n<li><strong>\u0422\u0438\u0442\u0443\u043b\u044b:</strong> \u0442\u0438\u0442\u0443\u043b\u044b WBU \u0438 \u043f\u043e\u0431\u0435\u0434\u044b \u043d\u0430 \u0442\u0443\u0440\u043d\u0438\u0440\u0430\u0445 \u0441\u0438\u0441\u0442\u0435\u043c\u0430 \u0432\u043d\u043e\u0441\u0438\u0442 \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 (\u0438\u043b\u0438 WBU \u0432\u0440\u0443\u0447\u043d\u0443\u044e). \u0422\u0440\u0435\u043d\u0435\u0440\u044b \u043c\u043e\u0433\u0443\u0442 \u0434\u043e\u0431\u0430\u0432\u043b\u044f\u0442\u044c \u0442\u0438\u0442\u0443\u043b\u044b \u0434\u0440\u0443\u0433\u0438\u0445 \u0444\u0435\u0434\u0435\u0440\u0430\u0446\u0438\u0439; \u043e\u043d\u0438 \u043e\u0442\u043c\u0435\u0447\u0435\u043d\u044b \u043a\u0430\u043a \u00ab\u0432\u043d\u0435\u0448\u043d\u0438\u0439\u00bb.</li>\n<li><strong>\u0412\u0435\u0441:</strong> \u043a\u0430\u0436\u0434\u044b\u0439 \u0432\u0435\u0441 \u0438\u0437 \u0437\u0430\u044f\u0432\u043a\u0438 \u0438 \u0433\u0430\u043b\u0430 \u0441\u043e\u0445\u0440\u0430\u043d\u044f\u0435\u0442\u0441\u044f \u0441 \u0434\u0430\u0442\u043e\u0439.</li>\n<li><strong>\u041e\u0442\u0441\u0442\u0440\u0430\u043d\u0435\u043d\u0438\u0435 \u043f\u043e\u0441\u043b\u0435 \u043d\u043e\u043a\u0430\u0443\u0442\u0430:</strong> \u043f\u043e\u0441\u043b\u0435 \u043f\u043e\u0440\u0430\u0436\u0435\u043d\u0438\u044f \u043d\u043e\u043a\u0430\u0443\u0442\u043e\u043c \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d \u043e\u0442\u0441\u0442\u0440\u0430\u043d\u0451\u043d \u043d\u0430 <strong>90 \u0434\u043d\u0435\u0439</strong>, \u043f\u043e\u0441\u043b\u0435 \u0442\u0435\u0445\u043d\u0438\u0447\u0435\u0441\u043a\u043e\u0433\u043e \u043d\u043e\u043a\u0430\u0443\u0442\u0430 \u2013 \u043d\u0430 <strong>30 \u0434\u043d\u0435\u0439</strong> (\u043e\u0442\u043a\u0430\u0437/RTD: \u0431\u0435\u0437 \u043e\u0442\u0441\u0442\u0440\u0430\u043d\u0435\u043d\u0438\u044f). \u0412 \u0431\u0430\u0437\u0435 \u043a\u0440\u0430\u0441\u043d\u044b\u043c \u0432\u0438\u0434\u043d\u043e \u00ab\ud83d\udeab \u041e\u0442\u0441\u0442\u0440\u0430\u043d\u0451\u043d \u0434\u043e \u2026\u00bb, \u0435\u0433\u043e \u043d\u0435\u043b\u044c\u0437\u044f \u043d\u0438 \u0432\u044b\u0431\u0440\u0430\u0442\u044c, \u043d\u0438 \u0432\u043d\u0435\u0441\u0442\u0438 \u0432 \u0431\u043e\u0439 \u043f\u043e \u0438\u043c\u0435\u043d\u0438. WBU \u043c\u043e\u0436\u0435\u0442 \u0432\u043d\u0435\u0441\u0442\u0438 \u043e\u0442\u0441\u0442\u0440\u0430\u043d\u0435\u043d\u0438\u0435 \u0432\u0440\u0443\u0447\u043d\u0443\u044e (\u043d\u0430\u043f\u0440. \u043d\u043e\u043a\u0430\u0443\u0442 \u0432 \u0434\u0440\u0443\u0433\u043e\u0439 \u0444\u0435\u0434\u0435\u0440\u0430\u0446\u0438\u0438) \u0438\u043b\u0438 \u0441\u043d\u044f\u0442\u044c \u0435\u0433\u043e \u043f\u0440\u0438 \u0434\u043e\u043f\u0443\u0441\u043a\u0435 \u0432\u0440\u0430\u0447\u0430.</li>\n</ul>\n<h2 id=\"anl-4\">4. \u0412 \u0434\u0435\u043d\u044c \u0431\u043e\u0451\u0432 \u2013 \u043f\u0443\u043b\u044c\u0442</h2>\n<p>\u041f\u0443\u043b\u044c\u0442 \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u0432\u0441\u0435 \u0440\u0438\u043d\u0433\u0438 \u0441 \u0447\u0430\u0441\u0430\u043c\u0438 \u0440\u0430\u0443\u043d\u0434\u0430, \u0431\u043e\u0439 \u043d\u0430 \u0440\u0438\u043d\u0433\u0435, \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0435 \u0438 \u043f\u0440\u043e\u0448\u0435\u0434\u0448\u0438\u0435 \u0431\u043e\u0438. \u041e\u043d \u0432\u043e \u0432\u043a\u043b\u0430\u0434\u043a\u0435 \u00ab\ud83c\udf9b \u041f\u0443\u043b\u044c\u0442\u00bb.</p>\n<h3 id=\"anl-4-1\">4.1 \u041f\u0435\u0440\u0435\u0434 \u0441\u0442\u0430\u0440\u0442\u043e\u043c</h3>\n<ol>\n<li>\u0423\u043a\u0430\u0437\u0430\u0442\u044c \u0432\u0440\u0430\u0447\u0430 \u0440\u0438\u043d\u0433\u0430 (\u043f\u043e\u043b\u0435 \u0432\u0432\u0435\u0440\u0445\u0443, \u0436\u0451\u043b\u0442\u043e\u0435, \u043f\u043e\u043a\u0430 \u043f\u0443\u0441\u0442\u043e\u0435). \u0411\u0435\u0437 \u0432\u0440\u0430\u0447\u0430 \u0440\u0438\u043d\u0433\u0430 \u0447\u0430\u0441\u044b \u043d\u0435 \u0437\u0430\u043f\u0443\u0441\u043a\u0430\u044e\u0442\u0441\u044f.</li>\n<li>\u041f\u0440\u0438 \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u0438\u0445 \u041f\u041a: \u0432 \u00ab\u042d\u0442\u043e\u0442 \u041f\u041a \u043e\u0431\u0441\u043b\u0443\u0436\u0438\u0432\u0430\u0435\u0442\u00bb \u043e\u0442\u043c\u0435\u0442\u0438\u0442\u044c \u0442\u043e\u043b\u044c\u043a\u043e \u0441\u0432\u043e\u0438 \u0440\u0438\u043d\u0433\u0438.</li>\n<li>\u0412\u044b\u0431\u0440\u0430\u0442\u044c \u0441\u0438\u0433\u043d\u0430\u043b \u0434\u043b\u044f \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0440\u0438\u043d\u0433\u0430 (\u043d\u0430\u043f\u0440. \u0440\u0438\u043d\u0433 1 \u2013 \u0433\u043e\u043d\u0433, \u0440\u0438\u043d\u0433 2 \u2013 \u0441\u0432\u0438\u0441\u0442\u043e\u043a) \u0438 \u043f\u0440\u043e\u0441\u043b\u0443\u0448\u0430\u0442\u044c \u25b6.</li>\n<li>\u041f\u0440\u043e\u0432\u0435\u0440\u0438\u0442\u044c \u00ab\u0421\u0438\u0433\u043d\u0430\u043b\u044b \u0432\u043a\u043b.\u00bb \u2013 \u00ab\u0411\u0415\u0417 \u0417\u0412\u0423\u041a\u0410\u00bb \u0432\u044b\u043a\u043b\u044e\u0447\u0430\u0435\u0442 \u0432\u0441\u0435 \u0437\u0432\u0443\u043a\u0438.</li>\n</ol>\n<h3 id=\"anl-4-2\">4.2 \u0427\u0430\u0441\u044b</h3>\n<table>\n<thead>\n<tr>\n<th>\u041a\u043d\u043e\u043f\u043a\u0430</th>\n<th>\u0414\u0435\u0439\u0441\u0442\u0432\u0438\u0435</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\u25b6 \u0421\u0422\u0410\u0420\u0422 / \u0414\u0410\u041b\u0415\u0415</td>\n<td>\u0440\u0430\u0443\u043d\u0434 \u0438\u0434\u0451\u0442</td>\n</tr>\n<tr>\n<td>\u23f8 \u0421\u0422\u041e\u041f</td>\n<td>\u0447\u0430\u0441\u044b \u043e\u0441\u0442\u0430\u043d\u0430\u0432\u043b\u0438\u0432\u0430\u044e\u0442\u0441\u044f, \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0437\u0430\u043f\u0443\u0441\u043a\u0430\u0435\u0442\u0441\u044f \u0442\u0430\u0439\u043c\u0430\u0443\u0442 (\u043c\u0430\u043a\u0441. 10 \u043c\u0438\u043d)</td>\n</tr>\n<tr>\n<td>\u21ba \u0420\u0430\u0443\u043d\u0434 \u0437\u0430\u043d\u043e\u0432\u043e</td>\n<td>\u0442\u0435\u043a\u0443\u0449\u0438\u0439 \u0440\u0430\u0443\u043d\u0434 \u0441\u043d\u0430\u0447\u0430\u043b\u0430</td>\n</tr>\n<tr>\n<td>\u23ed \u0421\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0440\u0430\u0443\u043d\u0434</td>\n<td>\u043f\u0435\u0440\u0435\u0445\u043e\u0434 \u043a \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u043c\u0443 \u0440\u0430\u0443\u043d\u0434\u0443</td>\n</tr>\n<tr>\n<td>\u0420\u0434. / \u041c\u0438\u043d</td>\n<td>\u0438\u0437\u043c\u0435\u043d\u0438\u0442\u044c \u0447\u0438\u0441\u043b\u043e \u0438 \u0434\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c \u0440\u0430\u0443\u043d\u0434\u043e\u0432</td>\n</tr>\n</tbody>\n</table>\n<p>\u0421\u0438\u0433\u043d\u0430\u043b\u044b \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0435: \u0437\u0430 10 \u0441\u0435\u043a\u0443\u043d\u0434 \u0434\u043e \u043a\u043e\u043d\u0446\u0430 \u0440\u0430\u0443\u043d\u0434\u0430 \u0442\u0440\u0438 \u0443\u0434\u0430\u0440\u0430 \u043c\u043e\u043b\u043e\u0442\u043a\u0430, \u043f\u043e\u0441\u043b\u0435 \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0440\u0430\u0443\u043d\u0434\u0430 \u0438 \u043f\u0435\u0440\u0435\u0440\u044b\u0432\u0430 \u2013 \u043e\u0434\u0438\u043d \u0433\u043e\u043d\u0433, \u0432 \u043a\u043e\u043d\u0446\u0435 \u0431\u043e\u044f \u2013 \u0442\u0440\u0438. \u041f\u0435\u0440\u0435\u0440\u044b\u0432 \u0432\u0441\u0435\u0433\u0434\u0430 1 \u043c\u0438\u043d\u0443\u0442\u0430.</p>\n<h3 id=\"anl-4-3\">4.3 \u0412\u0437\u0432\u0435\u0448\u0438\u0432\u0430\u043d\u0438\u0435</h3>\n<p>\u0412 \u0431\u043b\u043e\u043a\u0435 \u00ab\u0412\u0437\u0432\u0435\u0448\u0438\u0432\u0430\u043d\u0438\u0435\u00bb \u0443\u043a\u0430\u0437\u0430\u043d \u043c\u0430\u043a\u0441\u0438\u043c\u0430\u043b\u044c\u043d\u044b\u0439 \u0432\u0435\u0441 (\u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f \u043f\u043b\u044e\u0441 \u0434\u043e\u043f\u0443\u0441\u043a, \u043d\u0430\u043f\u0440. -55 \u043a\u0433 + 4 \u043a\u0433 = \u043c\u0430\u043a\u0441. 59,0 \u043a\u0433). \u0412\u0432\u0435\u0441\u0442\u0438 \u0432\u0435\u0441 \u043a\u0440\u0430\u0441\u043d\u043e\u0433\u043e \u0438 \u0441\u0438\u043d\u0435\u0433\u043e. \u0415\u0441\u043b\u0438 \u043e\u043d \u0432\u044b\u0448\u0435, \u0441\u0438\u0441\u0442\u0435\u043c\u0430 \u043f\u0440\u0435\u0434\u043b\u0430\u0433\u0430\u0435\u0442 \u0434\u0438\u0441\u043a\u0432\u0430\u043b\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u044e; \u0441\u043e\u043f\u0435\u0440\u043d\u0438\u043a \u043f\u043e\u0431\u0435\u0436\u0434\u0430\u0435\u0442 \u0438 \u043f\u0440\u043e\u0445\u043e\u0434\u0438\u0442 \u0434\u0430\u043b\u044c\u0448\u0435.</p>\n<h3 id=\"anl-4-4\">4.4 \u041e\u0441\u043e\u0431\u044b\u0435 \u0441\u043b\u0443\u0447\u0430\u0438 \u043e\u0434\u043d\u0438\u043c \u043d\u0430\u0436\u0430\u0442\u0438\u0435\u043c</h3>\n<table>\n<thead>\n<tr>\n<th>\u0421\u043b\u0443\u0447\u0430\u0439</th>\n<th>\u041a\u043d\u043e\u043f\u043a\u0430</th>\n<th>\u041f\u043e\u0441\u043b\u0435\u0434\u0441\u0442\u0432\u0438\u0435</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\u0414\u0438\u0441\u043a\u0432\u0430\u043b\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u044f \u043d\u0430 \u0432\u0437\u0432\u0435\u0448\u0438\u0432\u0430\u043d\u0438\u0438</td>\n<td>\u2696 DQ: \u043a\u0440\u0430\u0441\u043d\u044b\u0439 / \u0441\u0438\u043d\u0438\u0439</td>\n<td>\u0441\u043e\u043f\u0435\u0440\u043d\u0438\u043a \u043f\u043e\u0431\u0435\u0436\u0434\u0430\u0435\u0442 \u0434\u0438\u0441\u043a\u0432\u0430\u043b\u0438\u0444\u0438\u043a\u0430\u0446\u0438\u0435\u0439</td>\n</tr>\n<tr>\n<td>\u0421\u043e\u043f\u0435\u0440\u043d\u0438\u043a \u043d\u0435 \u043c\u043e\u0436\u0435\u0442 \u0432\u044b\u0441\u0442\u0443\u043f\u0438\u0442\u044c (\u043d\u0430\u043f\u0440. \u0442\u0440\u0430\u0432\u043c\u0430)</td>\n<td>\u270b \u041f\u043e\u0431\u0435\u0434\u0430 \u0431\u0435\u0437 \u0431\u043e\u044f: \u043a\u0440\u0430\u0441\u043d\u044b\u0439 / \u0441\u0438\u043d\u0438\u0439</td>\n<td>\u0431\u0435\u0437 \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u0438\u044f, \u043f\u043e\u0442\u043e\u043c \u043c\u043e\u0436\u043d\u043e \u0438\u0441\u043f\u0440\u0430\u0432\u0438\u0442\u044c \u0447\u0435\u0440\u0435\u0437 \u270e</td>\n</tr>\n<tr>\n<td>\u0421\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d \u043d\u0435 \u044f\u0432\u0438\u043b\u0441\u044f</td>\n<td>\ud83d\udeab \u041d\u0435 \u044f\u0432\u0438\u043b\u0441\u044f: \u043a\u0440\u0430\u0441\u043d\u044b\u0439 / \u0441\u0438\u043d\u0438\u0439</td>\n<td>\u0441\u043e\u043f\u0435\u0440\u043d\u0438\u043a \u043f\u043e\u0431\u0435\u0436\u0434\u0430\u0435\u0442 \u0431\u0435\u0437 \u0431\u043e\u044f, \u0438 \u0432 \u043f\u043e\u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0445 \u0431\u043e\u044f\u0445 \u044d\u0442\u043e\u0433\u043e \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u0430</td>\n</tr>\n</tbody>\n</table>\n<p>\u041a\u0442\u043e \u043f\u0440\u043e\u0438\u0433\u0440\u0430\u043b \u0431\u0435\u0437 \u0431\u043e\u044f, \u043d\u0435 \u044f\u0432\u0438\u043b\u0441\u044f \u0438\u043b\u0438 \u0434\u0438\u0441\u043a\u0432\u0430\u043b\u0438\u0444\u0438\u0446\u0438\u0440\u043e\u0432\u0430\u043d \u043d\u0430 \u0432\u0437\u0432\u0435\u0448\u0438\u0432\u0430\u043d\u0438\u0438, \u043d\u0435 \u043f\u043e\u043b\u0443\u0447\u0430\u0435\u0442 \u0433\u0440\u0430\u043c\u043e\u0442\u0443 \u0437\u0430 \u044d\u0442\u043e \u043c\u0435\u0441\u0442\u043e.</p>\n<h3 id=\"anl-4-5\">4.5 \u0420\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b</h3>\n<p>\u0420\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u043f\u0440\u0438\u0445\u043e\u0434\u0438\u0442 \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u043e\u0442 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430 (\u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430) \u0438\u043b\u0438 \u0432\u043d\u043e\u0441\u0438\u0442\u0441\u044f \u0432\u0440\u0443\u0447\u043d\u0443\u044e \u043a\u043d\u043e\u043f\u043a\u043e\u0439 \u00ab\u0412\u043d\u0435\u0441\u0442\u0438 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u00bb. \u041a\u0430\u043a \u0442\u043e\u043b\u044c\u043a\u043e \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u0435\u0441\u0442\u044c, \u0447\u0430\u0441\u044b \u0441\u0431\u0440\u0430\u0441\u044b\u0432\u0430\u044e\u0442\u0441\u044f \u0438 \u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442\u0441\u044f \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0431\u043e\u0439. \u00ab\u0412\u044b\u0437\u0432\u0430\u0442\u044c \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0431\u043e\u0439\u00bb \u0438\u043b\u0438 \u00ab\u0432\u044b\u0437\u0432\u0430\u0442\u044c\u00bb \u043c\u0435\u043d\u044f\u0435\u0442 \u043f\u043e\u0440\u044f\u0434\u043e\u043a.</p>\n<h3 id=\"anl-4-6\">4.6 \u0412\u0442\u043e\u0440\u043e\u0439 \u041f\u041a \u0443 \u0440\u0438\u043d\u0433\u0430 (\u0440\u0430\u0431\u043e\u0447\u0435\u0435 \u043c\u0435\u0441\u0442\u043e)</h3>\n<p>\u041f\u0440\u0438 \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u0438\u0445 \u0440\u0438\u043d\u0433\u0430\u0445 \u0432\u043d\u0438\u0437\u0443 \u0435\u0441\u0442\u044c \u00ab\u0412\u0442\u043e\u0440\u043e\u0439 \u041f\u041a \u0443 \u0440\u0438\u043d\u0433\u0430 (\u0431\u0435\u0437 \u0432\u0445\u043e\u0434\u0430)\u00bb \u0441\u043e \u0441\u0441\u044b\u043b\u043a\u043e\u0439 \u043d\u0430 \u043a\u0430\u0436\u0434\u044b\u0439 \u0440\u0438\u043d\u0433. \u041e\u0442\u043a\u0440\u044b\u0442\u044c \u0441\u0441\u044b\u043b\u043a\u0443 \u043d\u0430 \u0432\u0442\u043e\u0440\u043e\u043c \u041f\u041a: \u0442\u0430\u043c \u043e\u0431\u0441\u043b\u0443\u0436\u0438\u0432\u0430\u0435\u0442\u0441\u044f \u0442\u043e\u043b\u044c\u043a\u043e \u044d\u0442\u043e\u0442 \u0440\u0438\u043d\u0433 (\u0447\u0430\u0441\u044b, \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b, DQ). \u0417\u0430\u0442\u0435\u043c \u043d\u0430 \u0433\u043b\u0430\u0432\u043d\u043e\u043c \u041f\u041a \u0441\u043d\u044f\u0442\u044c \u043e\u0442\u043c\u0435\u0442\u043a\u0443 \u0441 \u044d\u0442\u043e\u0433\u043e \u0440\u0438\u043d\u0433\u0430 \u0432 \u00ab\u042d\u0442\u043e\u0442 \u041f\u041a \u043e\u0431\u0441\u043b\u0443\u0436\u0438\u0432\u0430\u0435\u0442\u00bb.</p>\n<h3 id=\"anl-4-7-wbu-time\">4.7 WBU Time \u043d\u0430 \u0442\u0435\u043b\u0435\u0432\u0438\u0437\u043e\u0440\u0435</h3>\n<p>\u0427\u0430\u0441\u044b \u0440\u0430\u0443\u043d\u0434\u0430 \u0434\u043b\u044f \u0422\u0412 \u0443 \u0440\u0438\u043d\u0433\u0430: \u0440\u0430\u0443\u043d\u0434 \u0441\u043b\u0435\u0432\u0430, \u0432\u0440\u0435\u043c\u044f \u043a\u0440\u0443\u043f\u043d\u043e \u0441\u043f\u0440\u0430\u0432\u0430, \u0438\u043c\u0435\u043d\u0430 \u0443\u0433\u043b\u043e\u0432 \u0432\u0432\u0435\u0440\u0445\u0443. \u0412 \u043c\u0435\u043d\u044e \u0441\u0430\u0439\u0442\u0430 WBU \u043e\u0442\u043a\u0440\u044b\u0442\u044c \u00abWBU Time 1\u00bb \u0438\u043b\u0438 \u00abWBU Time 2\u00bb (\u0438\u043b\u0438 \u0432 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435 Fire TV <a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1\">https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1</a>). \u041f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u0438\u0434\u0443\u0449\u0435\u0435 \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435 \u0438 \u0441\u043b\u0435\u0434\u0443\u0435\u0442 \u0437\u0430 \u0447\u0430\u0441\u0430\u043c\u0438 \u043f\u0443\u043b\u044c\u0442\u0430. \u0417\u0432\u0443\u043a \u043d\u0430 \u0422\u0412 \u043e\u0434\u0438\u043d \u0440\u0430\u0437 \u0432\u043a\u043b\u044e\u0447\u0438\u0442\u044c \u00ab\u0411\u0435\u0437 \u0437\u0432\u0443\u043a\u0430 \u2013 \u0432\u043a\u043b\u044e\u0447\u0438\u0442\u044c \u0437\u0432\u0443\u043a\u00bb. \u0411\u0435\u0437 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0430: \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0438\u0442\u044c \u0422\u0412 \u043a \u041f\u041a \u043f\u043e HDMI \u0438 \u043e\u0442\u043a\u0440\u044b\u0442\u044c \u044d\u043a\u0440\u0430\u043d \u0432\u0440\u0435\u043c\u0435\u043d\u0438 \u043d\u0430 \u043f\u0443\u043b\u044c\u0442\u0435.</p>\n<h2 id=\"anl-5\">5. \u0420\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b, \u0433\u0440\u0430\u043c\u043e\u0442\u044b \u0438 \u0430\u043a\u043a\u0440\u0435\u0434\u0438\u0442\u0430\u0446\u0438\u044f</h2>\n<h3 id=\"anl-5-1\">5.1 \u0420\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b</h3>\n<p>\u0412\u043a\u043b\u0430\u0434\u043a\u0430 \u00ab\u0420\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b\u00bb: 1, 2 \u0438 3 \u043c\u0435\u0441\u0442\u0430 (\u0434\u0432\u0430 \u0442\u0440\u0435\u0442\u044c\u0438\u0445) \u043f\u043e \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f\u043c, \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0438\u0437 \u0441\u0435\u0442\u043e\u043a. \u00ab\u041f\u0435\u0447\u0430\u0442\u044c / PDF\u00bb \u0434\u043b\u044f \u0434\u043e\u0441\u043a\u0438 \u043e\u0431\u044a\u044f\u0432\u043b\u0435\u043d\u0438\u0439. \u041c\u0435\u0441\u0442\u0430 \u043e\u0434\u043d\u043e\u0432\u0440\u0435\u043c\u0435\u043d\u043d\u043e \u0432\u0438\u0434\u043d\u044b \u0432 WBU Live.</p>\n<h3 id=\"anl-5-2\">5.2 \u0417\u0430\u0440\u0430\u043d\u0435\u0435 \u0432\u044b\u0431\u0440\u0430\u0442\u044c \u043b\u043e\u0433\u043e\u0442\u0438\u043f\u044b</h3>\n<p>\u0412\u043e \u0432\u043a\u043b\u0430\u0434\u043a\u0435 \u00ab\ud83c\udfc5 \u0413\u0440\u0430\u043c\u043e\u0442\u044b\u00bb \u0432 \u0440\u0430\u0437\u0434\u0435\u043b\u0435 \u00ab\u041b\u043e\u0433\u043e\u0442\u0438\u043f\u044b \u043d\u0430 \u0433\u0440\u0430\u043c\u043e\u0442\u0430\u0445\u00bb \u2013 \u0434\u043e \u0434\u043d\u044f \u0431\u043e\u0451\u0432, \u0447\u0442\u043e\u0431\u044b \u0432 \u044d\u0442\u043e\u0442 \u0434\u0435\u043d\u044c \u043d\u0438\u0447\u0435\u0433\u043e \u043d\u0435 \u043d\u0430\u0441\u0442\u0440\u0430\u0438\u0432\u0430\u0442\u044c:</p>\n<ol>\n<li>\u00ab\u0417\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u043c\u043e\u0439 \u043b\u043e\u0433\u043e\u0442\u0438\u043f\u00bb: \u0443 \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u0430 \u043e\u0434\u0438\u043d \u043b\u043e\u0433\u043e\u0442\u0438\u043f (\u043a\u043b\u0443\u0431 \u0438\u043b\u0438 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440).</li>\n<li>\u041e\u0442\u043c\u0435\u0442\u0438\u0442\u044c, \u043a\u0430\u043a\u0438\u0435 \u043b\u043e\u0433\u043e\u0442\u0438\u043f\u044b \u0431\u0443\u0434\u0443\u0442 \u043d\u0430 \u0433\u0440\u0430\u043c\u043e\u0442\u0430\u0445 \u0438 \u043a\u0430\u0440\u0442\u0430\u0445 \u044d\u0442\u043e\u0433\u043e \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u044f: KCW, \u0441\u0432\u043e\u0439 \u043b\u043e\u0433\u043e\u0442\u0438\u043f, \u043b\u043e\u0433\u043e\u0442\u0438\u043f\u044b \u0434\u0440\u0443\u0433\u0438\u0445 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0442\u043e\u0440\u043e\u0432.</li>\n<li>\u0423\u043a\u0430\u0437\u0430\u0442\u044c \u00ab\u0412\u0442\u043e\u0440\u043e\u0439 \u0441\u0430\u0439\u0442 \u0432\u043d\u0438\u0437\u0443 \u0433\u0440\u0430\u043c\u043e\u0442\u044b\u00bb \u0438\u043b\u0438 \u043e\u0441\u0442\u0430\u0432\u0438\u0442\u044c \u043f\u0443\u0441\u0442\u044b\u043c.</li>\n</ol>\n<h3 id=\"anl-5-3\">5.3 \u041f\u0435\u0447\u0430\u0442\u044c \u0433\u0440\u0430\u043c\u043e\u0442</h3>\n<ul>\n<li>\u041f\u043e\u0441\u043b\u0435 \u043f\u043e\u043b\u0443\u0444\u0438\u043d\u0430\u043b\u0430 \u043d\u0430 \u043f\u0443\u043b\u044c\u0442\u0435 \u043f\u043e\u044f\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u00ab\ud83c\udfc5 \u0413\u0440\u0430\u043c\u043e\u0442\u0430 3-\u0435 \u043c\u0435\u0441\u0442\u043e: \u0438\u043c\u044f\u00bb, \u043f\u043e\u0441\u043b\u0435 \u0444\u0438\u043d\u0430\u043b\u0430 \u2013 \u043f\u043e \u043a\u043d\u043e\u043f\u043a\u0435 \u0437\u0430 1 \u0438 2 \u043c\u0435\u0441\u0442\u043e. \u041e\u0434\u043d\u043e \u043d\u0430\u0436\u0430\u0442\u0438\u0435 \u043f\u0435\u0447\u0430\u0442\u0430\u0435\u0442 \u0438\u043c\u0435\u043d\u043d\u043e \u044d\u0442\u0443 \u0433\u0440\u0430\u043c\u043e\u0442\u0443; \u0437\u0430\u0442\u0435\u043c \u043d\u0430 \u043a\u043d\u043e\u043f\u043a\u0435 \u2713.</li>\n<li>\u0412\u043e \u0432\u043a\u043b\u0430\u0434\u043a\u0435 \u00ab\u0413\u0440\u0430\u043c\u043e\u0442\u044b\u00bb: \u00ab\u041f\u0435\u0447\u0430\u0442\u044c \u0432\u0441\u0435\u0445 \u0433\u0440\u0430\u043c\u043e\u0442\u00bb \u0438\u043b\u0438 \u00ab\u041f\u0435\u0447\u0430\u0442\u044c\u00bb \u043f\u043e \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438.</li>\n<li>\u041d\u0430 \u0447\u0435\u043c\u043f\u0438\u043e\u043d\u0430\u0442\u0435 \u0413\u0435\u0440\u043c\u0430\u043d\u0438\u0438 \u043d\u0430 1-\u043c \u043c\u0435\u0441\u0442\u0435 \u043d\u0430\u043f\u0438\u0441\u0430\u043d\u043e \u00ab\u0427\u0435\u043c\u043f\u0438\u043e\u043d/\u0427\u0435\u043c\u043f\u0438\u043e\u043d\u043a\u0430 \u0413\u0435\u0440\u043c\u0430\u043d\u0438\u0438\u00bb, \u0438\u043d\u0430\u0447\u0435 \u00ab\u0413\u0440\u0430\u043c\u043e\u0442\u0430\u00bb. \u041b\u0430\u0432\u0440\u043e\u0432\u044b\u0439 \u0432\u0435\u043d\u043e\u043a \u0437\u043e\u043b\u043e\u0442\u043e\u0439, \u0441\u0435\u0440\u0435\u0431\u0440\u044f\u043d\u044b\u0439 \u0438\u043b\u0438 \u0431\u0440\u043e\u043d\u0437\u043e\u0432\u044b\u0439.</li>\n<li>\u041d\u0430\u0441\u0442\u0440\u043e\u0439\u043a\u0438 \u043f\u0435\u0447\u0430\u0442\u0438: \u0431\u0443\u043c\u0430\u0433\u0430 A4, \u0431\u0435\u0437 \u043f\u043e\u043b\u0435\u0439, \u043e\u0442\u043c\u0435\u0442\u0438\u0442\u044c \u0444\u043e\u043d\u043e\u0432\u0443\u044e \u0433\u0440\u0430\u0444\u0438\u043a\u0443.</li>\n</ul>\n<h3 id=\"anl-5-4\">5.4 \u0410\u043a\u043a\u0440\u0435\u0434\u0438\u0442\u0430\u0446\u0438\u043e\u043d\u043d\u044b\u0435 \u043a\u0430\u0440\u0442\u044b</h3>\n<p>\u0412\u043a\u043b\u0430\u0434\u043a\u0430 \u00ab\ud83e\udeaa \u0410\u043a\u043a\u0440\u0435\u0434\u0438\u0442\u0430\u0446\u0438\u044f\u00bb (\u0442\u043e\u043b\u044c\u043a\u043e \u0434\u043b\u044f \u043e\u043f\u0443\u0431\u043b\u0438\u043a\u043e\u0432\u0430\u043d\u043d\u044b\u0445 \u0442\u0443\u0440\u043d\u0438\u0440\u043e\u0432). \u041a\u0430\u0440\u0442\u044b \u0434\u043b\u044f \u0432\u0441\u0435\u0445 \u0441\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d\u043e\u0432 \u0432 \u0441\u0438\u0441\u0442\u0435\u043c\u0435, \u0430 \u0442\u0430\u043a\u0436\u0435 \u0437\u0430\u044f\u0432\u043b\u0435\u043d\u043d\u044b\u0445 \u0442\u0440\u0435\u043d\u0435\u0440\u043e\u0432 \u0438 \u0441\u0435\u043a\u0443\u043d\u0434\u0430\u043d\u0442\u043e\u0432 \u2013 \u0431\u0435\u0441\u043f\u043b\u0430\u0442\u043d\u044b\u0439 \u0432\u0445\u043e\u0434.</p>\n<ol>\n<li>\u0412\u044b\u0431\u0440\u0430\u0442\u044c \u00ab\u041f\u0435\u0447\u0430\u0442\u044c \u043d\u0430\u00bb: \u043f\u043b\u0430\u0441\u0442\u0438\u043a\u043e\u0432\u0430\u044f \u043a\u0430\u0440\u0442\u0430 \u043d\u0430 \u043f\u0440\u0438\u043d\u0442\u0435\u0440\u0435 \u043a\u0430\u0440\u0442 (\u043a\u0430\u0436\u0434\u0430\u044f \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e, \u0440\u0430\u0437\u043c\u0435\u0440 \u0431\u0430\u043d\u043a\u043e\u0432\u0441\u043a\u043e\u0439 \u043a\u0430\u0440\u0442\u044b \u0432\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c\u043d\u043e 54 \u00d7 85,6 \u043c\u043c) \u0438\u043b\u0438 \u0431\u0443\u043c\u0430\u0433\u0430 A4 \u0441 9 \u043a\u0430\u0440\u0442\u0430\u043c\u0438 \u0434\u043b\u044f \u0432\u044b\u0440\u0435\u0437\u0430\u043d\u0438\u044f.</li>\n<li>\u00ab\u041f\u0435\u0447\u0430\u0442\u044c \u0432\u0441\u0435\u0445 \u043a\u0430\u0440\u0442\u00bb, \u00ab\u0422\u043e\u043b\u044c\u043a\u043e \u043e\u0434\u0438\u043d \u043a\u043b\u0443\u0431\u00bb \u0438\u043b\u0438 \u00ab\u041a\u0430\u0440\u0442\u0430\u00bb \u0434\u043b\u044f \u043e\u0434\u043d\u043e\u0433\u043e \u0447\u0435\u043b\u043e\u0432\u0435\u043a\u0430.</li>\n<li>\u0414\u043b\u044f \u0444\u043e\u0442\u043e \u0431\u0435\u0437 \u0432\u044b\u0431\u0440\u0430\u043d\u043d\u043e\u0439 \u0433\u043e\u043b\u043e\u0432\u044b: \u00ab\u041e\u0431\u0440\u0435\u0437\u0430\u0442\u044c \u043f\u043e \u0433\u043e\u043b\u043e\u0432\u0435\u00bb.</li>\n<li>\u041d\u0430\u0441\u0442\u0440\u043e\u0439\u043a\u0438 \u043f\u0440\u0438\u043d\u0442\u0435\u0440\u0430 \u043a\u0430\u0440\u0442: \u0444\u043e\u0440\u043c\u0430\u0442 CR80 \u0432\u0435\u0440\u0442\u0438\u043a\u0430\u043b\u044c\u043d\u043e, \u0431\u0435\u0437 \u043f\u043e\u043b\u0435\u0439, \u043c\u0430\u0441\u0448\u0442\u0430\u0431 100 %, \u0444\u043e\u043d\u043e\u0432\u0430\u044f \u0433\u0440\u0430\u0444\u0438\u043a\u0430 \u0432\u043a\u043b.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>\u0420\u043e\u043b\u044c</th>\n<th>\u0426\u0432\u0435\u0442 \u043d\u0430 \u043a\u0430\u0440\u0442\u0435</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\u0421\u043f\u043e\u0440\u0442\u0441\u043c\u0435\u043d</td>\n<td>\u043a\u0440\u0430\u0441\u043d\u044b\u0439</td>\n</tr>\n<tr>\n<td>\u0422\u0440\u0435\u043d\u0435\u0440</td>\n<td>\u0441\u0438\u043d\u0438\u0439</td>\n</tr>\n<tr>\n<td>\u0421\u0435\u043a\u0443\u043d\u0434\u0430\u043d\u0442</td>\n<td>\u0437\u0435\u043b\u0451\u043d\u044b\u0439</td>\n</tr>\n</tbody>\n</table>\n<p>\u0412\u0445\u043e\u0434: \u043e\u0442\u0441\u043a\u0430\u043d\u0438\u0440\u043e\u0432\u0430\u0442\u044c QR-\u043a\u043e\u0434 \u043a\u0430\u043c\u0435\u0440\u043e\u0439 \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0430. \u041f\u043e\u044f\u0432\u0438\u0442\u0441\u044f \u00ab\u0410\u043a\u043a\u0440\u0435\u0434\u0438\u0442\u0430\u0446\u0438\u044f \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u0430\u00bb \u0441 \u0438\u043c\u0435\u043d\u0435\u043c, \u0440\u043e\u043b\u044c\u044e \u0438 \u043a\u043b\u0443\u0431\u043e\u043c \u2013 \u0438\u043b\u0438 \u00ab\u041d\u0435\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u00bb, \u0435\u0441\u043b\u0438 \u043a\u0430\u0440\u0442\u0430 \u043f\u043e\u0434\u0434\u0435\u043b\u044c\u043d\u0430\u044f \u0438\u043b\u0438 \u0447\u0435\u043b\u043e\u0432\u0435\u043a \u0443\u0434\u0430\u043b\u0451\u043d.</p>\n<h2 id=\"anl-6\">6. \u0421\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440 \u2013 \u0440\u0430\u0431\u043e\u0442\u0430 \u0441 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u043e\u0439</h2>\n<p>\u0421\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0440\u0443\u0435\u0442 \u043c\u0435\u0440\u043e\u043f\u0440\u0438\u044f\u0442\u0438\u0435 \u0432 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0435, \u0437\u0430\u0434\u0430\u0451\u0442 PIN \u0434\u043b\u044f \u0441\u0443\u0434\u0435\u0439 \u0438 \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0430\u0435\u0442 \u043a\u0430\u0436\u0434\u044b\u0439 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442. \u041e\u043d \u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442\u0441\u044f \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u043e\u043c (https://www.wbu-boxing.com/scorecard/) \u0438\u043b\u0438 Android-\u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435\u043c WBU-SC.</p>\n<p><strong>\u041f\u043e\u0434\u0441\u043a\u0430\u0437\u043a\u0430 \u00ab\u041f\u043e\u0436\u0430\u043b\u0443\u0439\u0441\u0442\u0430, \u0434\u043e\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u00bb:</strong> \u0435\u0441\u043b\u0438 \u043d\u0430 \u0433\u0430\u043b\u0430 \u043d\u0435 \u0445\u0432\u0430\u0442\u0430\u0435\u0442 \u0432\u0435\u0441\u0430 (\u043a\u0440\u0430\u0441\u043d\u044b\u0439/\u0441\u0438\u043d\u0438\u0439 \u0443\u0433\u043e\u043b) \u0438\u043b\u0438 \u0432\u0435\u0441\u043e\u0432\u043e\u0439 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438, \u0436\u0451\u043b\u0442\u0430\u044f \u043f\u043e\u0434\u0441\u043a\u0430\u0437\u043a\u0430 \u0432\u0438\u0434\u043d\u0430 \u0442\u043e\u043b\u044c\u043a\u043e \u0432 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0435 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430 \u2013 \u043d\u0435 \u0443 \u0441\u0443\u0434\u0435\u0439. \u0414\u043e\u043f\u043e\u043b\u043d\u0438\u0442\u044c \u0447\u0435\u0440\u0435\u0437 \u00ab\u270e \u0420\u0435\u0434\u0430\u043a\u0442\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u043a\u0430\u0440\u0434\u00bb. \u0411\u0435\u0437 \u0432\u0435\u0441\u043e\u0432\u043e\u0439 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438 \u0431\u043e\u0439 \u0432\u0441\u0451 \u0440\u0430\u0432\u043d\u043e \u043c\u043e\u0436\u043d\u043e \u0441\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c.</p>\n<p><strong>\u041f\u0440\u0430\u0432\u0438\u043b\u043e \u0432\u043e\u0437\u0440\u0430\u0441\u0442\u0430:</strong> \u0435\u0441\u043b\u0438 \u0443\u043a\u0430\u0437\u0430\u043d\u044b \u0434\u0430\u0442\u044b \u0440\u043e\u0436\u0434\u0435\u043d\u0438\u044f \u043e\u0431\u043e\u0438\u0445 \u0431\u043e\u0439\u0446\u043e\u0432, WBU Sports \u0438 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430 \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u044e\u0442 \u0432\u043e\u0437\u0440\u0430\u0441\u0442 \u0432 \u0434\u0435\u043d\u044c \u0431\u043e\u044f: <strong>\u0431\u043e\u043a\u0441 \u043c\u0430\u0441\u0442\u0435\u0440\u0441</strong> \u2013 \u0440\u0430\u0437\u043d\u0438\u0446\u0430 \u043d\u0435 \u0431\u043e\u043b\u0435\u0435 <strong>5 \u043b\u0435\u0442</strong> (\u043d\u0430\u043f\u0440. 48 \u043f\u0440\u043e\u0442\u0438\u0432 52 \u043c\u043e\u0436\u043d\u043e), <strong>\u044e\u043d\u0438\u043e\u0440\u044b</strong> (\u0434\u043e 18) \u2013 \u043d\u0435 \u0431\u043e\u043b\u0435\u0435 <strong>2 \u043b\u0435\u0442</strong> (\u043d\u0430\u043f\u0440. 14 \u043f\u0440\u043e\u0442\u0438\u0432 12 \u043d\u0435\u043b\u044c\u0437\u044f). \u0415\u0441\u043b\u0438 \u043d\u0435 \u043f\u043e\u0434\u0445\u043e\u0434\u0438\u0442, \u0431\u043e\u0439 \u043d\u0435 \u043f\u0440\u0438\u043d\u0438\u043c\u0430\u0435\u0442\u0441\u044f.</p>\n<p><strong>\u0417\u0430\u0433\u0440\u0443\u0437\u043a\u0430 \u0447\u0435\u0440\u0435\u0437 WBU:</strong> \u0441\u0443\u043f\u0435\u0440\u0430\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0442\u043e\u0440 WBU \u043c\u043e\u0436\u0435\u0442 \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u0433\u0430\u043b\u0430 \u0431\u0435\u0437 \u043f\u0430\u0440\u043e\u043b\u044f (\u0447\u0435\u0440\u0435\u0437 \u0441\u0432\u043e\u0439 \u0430\u043a\u043a\u0430\u0443\u043d\u0442). \u041c\u0435\u043d\u044f\u0442\u044c \u043a\u0430\u0440\u0434 \u043f\u043e\u0441\u043b\u0435 \u044d\u0442\u043e\u0433\u043e \u043c\u043e\u0436\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440.</p>\n<h3 id=\"anl-6-1\">6.1 \u0412\u0445\u043e\u0434</h3>\n<ol>\n<li>\u041d\u0430\u0436\u0430\u0442\u044c \u00ab\u0421\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u00bb, \u0432\u0432\u0435\u0441\u0442\u0438 \u0438\u043c\u044f \u0438 \u0444\u0430\u043c\u0438\u043b\u0438\u044e.</li>\n<li>\u0412\u0432\u0435\u0441\u0442\u0438 \u043f\u0440\u043e\u043c\u043e\u0443\u0442\u0435\u0440\u0430, \u043c\u0435\u0441\u0442\u043e \u0438 \u0434\u0430\u0442\u0443.</li>\n<li>\u0423\u043a\u0430\u0437\u0430\u0442\u044c \u0432\u0440\u0430\u0447\u0430 \u0440\u0438\u043d\u0433\u0430 \u2013 \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u043e, \u0434\u043b\u044f \u0432\u0441\u0435\u0445 \u0431\u043e\u0451\u0432.</li>\n<li>\u0412 \u00ab\u0412\u044b\u0431\u0440\u0430\u0442\u044c \u0448\u043e\u0443\u00bb \u043d\u0430\u0436\u0430\u0442\u044c \u0448\u043e\u0443 \u2013 \u0442\u0430\u043c \u0442\u043e\u043b\u044c\u043a\u043e \u0448\u043e\u0443. \u0411\u0435\u0437 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0430 \u0443 \u0440\u0438\u043d\u0433\u0430 \u043f\u0440\u043e\u0441\u0442\u043e \u043d\u0435 \u0432\u044b\u0431\u0438\u0440\u0430\u0442\u044c \u0448\u043e\u0443: \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0441\u0430\u043c\u043e \u0438\u0449\u0435\u0442 WBU Sports \u043d\u0430 \u043f\u043b\u0430\u043d\u0448\u0435\u0442\u0435 \u043f\u043e Bluetooth \u0438\u043b\u0438 \u043d\u043e\u0443\u0442\u0431\u0443\u043a \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0430\u0435\u0442\u0441\u044f \u0441\u0430\u043c (\u0441\u043c. \u0433\u043b\u0430\u0432\u044b 10.1 \u0438 10.2): \u0431\u043e\u0438, \u0438\u043c\u0435\u043d\u0430, \u0441\u0442\u0440\u0430\u043d\u0430, \u0432\u043e\u0437\u0440\u0430\u0441\u0442, \u0432\u0435\u0441, \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f, \u0442\u0438\u0442\u0443\u043b, \u0440\u0430\u0443\u043d\u0434\u044b, \u0434\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c \u0438 \u0432\u0440\u0430\u0447 \u0440\u0438\u043d\u0433\u0430 \u043f\u0435\u0440\u0435\u043d\u043e\u0441\u044f\u0442\u0441\u044f, \u0432\u0438\u0434\u043d\u044b \u0432 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0435 \u0438 PDF-\u043e\u0442\u0447\u0451\u0442\u0435, \u0430 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438 \u0443\u0445\u043e\u0434\u044f\u0442 \u0432 WBU Sports. \u041d\u0430 \u0442\u0443\u0440\u043d\u0438\u0440\u0435 \u0441 \u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u0438\u043c\u0438 \u0440\u0438\u043d\u0433\u0430\u043c\u0438 \u0432\u044b\u0431\u0440\u0430\u0442\u044c \u0441\u0432\u043e\u0439 \u0440\u0438\u043d\u0433.</li>\n<li>\u0412\u0432\u0435\u0441\u0442\u0438 \u043f\u0430\u0440\u043e\u043b\u044c \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430 WBU. \u041e\u043d \u0437\u0430\u0449\u0438\u0449\u0430\u0435\u0442 \u043e\u0442 \u0442\u043e\u0433\u043e, \u0447\u0442\u043e\u0431\u044b \u043a\u0442\u043e-\u0442\u043e \u0432\u044b\u0434\u0430\u0432\u0430\u043b \u0441\u0435\u0431\u044f \u0437\u0430 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430; \u0434\u0430\u0432\u0430\u0442\u044c \u0442\u043e\u043b\u044c\u043a\u043e \u043d\u0430\u0441\u0442\u043e\u044f\u0449\u0438\u043c \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430\u043c.</li>\n<li>\u0417\u0430\u0434\u0430\u0442\u044c PIN \u0434\u043b\u044f \u0441\u0443\u0434\u0435\u0439 (4 \u0446\u0438\u0444\u0440\u044b, \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u043e \u0432 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435) \u0438 \u0441\u043e\u043e\u0431\u0449\u0438\u0442\u044c \u0441\u0443\u0434\u044c\u044f\u043c.</li>\n<li>\u00ab\u041f\u043e\u0435\u0445\u0430\u043b\u0438\u00bb.</li>\n</ol>\n<p>\u0412 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0438 \u0441\u0443\u0434\u044c\u0438 \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0430\u044e\u0442\u0441\u044f \u043a \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0443 \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440\u0430 \u043f\u043e Bluetooth \u2013 \u0431\u0435\u0437 \u0438\u043d\u0442\u0435\u0440\u043d\u0435\u0442\u0430. \u0418\u043d\u0442\u0435\u0440\u043d\u0435\u0442 \u043d\u0443\u0436\u0435\u043d \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u044e \u0442\u043e\u043b\u044c\u043a\u043e \u0434\u043b\u044f \u0441\u0432\u044f\u0437\u0438 \u0441 WBU Sports.</p>\n<h3 id=\"anl-6-2\">6.2 \u041d\u0430\u0441\u0442\u0440\u043e\u0438\u0442\u044c \u0431\u043e\u0439</h3>\n<ul>\n<li>\u0427\u0438\u0441\u043b\u043e \u0440\u0430\u0443\u043d\u0434\u043e\u0432 (1\u201312), \u0434\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442\u044c, \u0447\u0438\u0441\u043b\u043e \u0441\u0443\u0434\u0435\u0439 (1\u20133), \u0432\u0438\u0434 \u0431\u043e\u044f.</li>\n<li>\u041a\u0440\u0430\u0441\u043d\u044b\u0439 \u0438 \u0441\u0438\u043d\u0438\u0439 \u0443\u0433\u043e\u043b \u0441\u043e \u0441\u0442\u0440\u0430\u043d\u043e\u0439 \u00b7 \u0432\u043e\u0437\u0440\u0430\u0441\u0442\u043e\u043c \u00b7 \u0432\u0435\u0441\u043e\u043c, \u0432\u0435\u0441\u043e\u0432\u0430\u044f \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u044f \u0438\u043b\u0438 \u0442\u0438\u0442\u0443\u043b (\u0441 WBU Sports \u0443\u0436\u0435 \u0437\u0430\u043f\u043e\u043b\u043d\u0435\u043d\u043e; \u0431\u0435\u0437 WBU Sports \u0441\u0443\u043f\u0435\u0440\u0432\u0430\u0439\u0437\u0435\u0440 \u0432\u0432\u043e\u0434\u0438\u0442 \u0441\u0430\u043c).</li>\n<li>\u0413\u0430\u043b\u0430 \u0438\u0437 WBU Sports: \u00ab\u270e \u0420\u0435\u0434\u0430\u043a\u0442\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u043a\u0430\u0440\u0434\u00bb \u043c\u0435\u043d\u044f\u0435\u0442 \u043a\u0430\u0440\u0434 \u0434\u043b\u044f \u0432\u0441\u0435\u0445 (\u0441\u043c. 3.2).</li>\n<li>\u0423\u043a\u0430\u0437\u0430\u0442\u044c \u0440\u0435\u0444\u0435\u0440\u0438 \u0438 \u0445\u0440\u043e\u043d\u043e\u043c\u0435\u0442\u0440\u0438\u0441\u0442\u0430. \u041e\u043d\u0438 \u043e\u0441\u0442\u0430\u044e\u0442\u0441\u044f \u0434\u043b\u044f \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0445 \u0431\u043e\u0451\u0432; \u0441\u043e\u0445\u0440\u0430\u043d\u0451\u043d\u043d\u044b\u0435 \u0438\u043c\u0435\u043d\u0430 \u0440\u0435\u0444\u0435\u0440\u0438 \u0438 \u0441\u0443\u0434\u0435\u0439 \u043c\u043e\u0436\u043d\u043e \u043d\u0430\u0436\u0430\u0442\u044c.</li>\n<li>\u0412\u0432\u0435\u0440\u0445\u0443 \u0432\u0438\u0434\u043d\u043e, \u0441\u043a\u043e\u043b\u044c\u043a\u043e \u0441\u0443\u0434\u0435\u0439 \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0435\u043d\u043e.</li>\n</ul>\n<h3 id=\"anl-6-3\">6.3 \u0421\u043c\u043e\u0442\u0440\u0435\u0442\u044c \u043e\u0446\u0435\u043d\u043a\u0438</h3>\n<p>\u041e\u0446\u0435\u043d\u043a\u0438 \u0441\u0443\u0434\u0435\u0439 \u043f\u043e\u044f\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u0432 \u0440\u0435\u0430\u043b\u044c\u043d\u043e\u043c \u0432\u0440\u0435\u043c\u0435\u043d\u0438, \u0440\u0430\u0443\u043d\u0434 \u0437\u0430 \u0440\u0430\u0443\u043d\u0434\u043e\u043c, \u0441 \u0441\u0443\u043c\u043c\u043e\u0439. \u00ab\u0433\u043e\u0442\u043e\u0432\u043e\u00bb \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442, \u043a\u0442\u043e \u0437\u0430\u0432\u0435\u0440\u0448\u0438\u043b \u0431\u043e\u0439. \u0412 \u0447\u0430\u0442\u0435 \u043c\u043e\u0436\u043d\u043e \u043e\u0442\u043f\u0440\u0430\u0432\u043b\u044f\u0442\u044c \u0441\u0443\u0434\u044c\u044f\u043c \u043a\u043e\u0440\u043e\u0442\u043a\u0438\u0435 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f.</p>\n<p><strong>\u0418\u0441\u043f\u0440\u0430\u0432\u0438\u0442\u044c:</strong> \u043b\u044e\u0431\u043e\u0439 \u0440\u0430\u0443\u043d\u0434 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438 \u043c\u043e\u0436\u043d\u043e \u043d\u0430\u0436\u0430\u0442\u044c \u0438 \u0438\u0441\u043f\u0440\u0430\u0432\u0438\u0442\u044c, \u0435\u0441\u043b\u0438 \u0441\u0443\u0434\u044c\u044f \u044f\u0432\u043d\u043e \u043e\u0448\u0438\u0431\u0441\u044f. \u0420\u0430\u0443\u043d\u0434 \u043e\u0442\u043c\u0435\u0447\u0430\u0435\u0442\u0441\u044f \u0437\u043e\u043b\u043e\u0442\u043e\u043c (\u0441\u043e \u0441\u0442\u0430\u0440\u044b\u043c \u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0435\u043c), \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0430 \u043f\u043e\u043b\u0443\u0447\u0430\u0435\u0442 \u00ab\u0418\u0441\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435 SV\u00bb, \u0432 \u043e\u0442\u0447\u0451\u0442\u0435 \u0441\u0442\u0430\u0432\u0438\u0442\u0441\u044f *.</p>\n<p><strong>\u0421\u0443\u0434\u044c\u0438 \u043e\u0446\u0435\u043d\u0438\u0432\u0430\u044e\u0442 \u043d\u0430 \u0431\u0443\u043c\u0430\u0433\u0435:</strong> \u043d\u0430\u0434 \u00ab\u0411\u043e\u0439 1\u00bb \u0435\u0441\u0442\u044c \u043f\u0435\u0440\u0435\u043a\u043b\u044e\u0447\u0430\u0442\u0435\u043b\u044c \u00ab\u0421\u0443\u0434\u044c\u0438 \u043e\u0446\u0435\u043d\u0438\u0432\u0430\u044e\u0442 \u043d\u043
