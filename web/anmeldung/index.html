<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WBU Turnier-Anmeldung</title>
<meta name="theme-color" content="#d9dde4">
<style>
:root{--bg:#e9ebef;--card:#f6f7f9;--card2:#ffffff;--line:#cfd4dc;--txt:#000;--mut:#000;--gold:#e2a500;--red:#c62828;--blue:#1565c0;--ok:#1a9e55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 "Segoe UI",system-ui,Roboto,sans-serif}
#top{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:3px solid #c3c8d1;background:#d9dde4}
#top img{width:48px;height:48px;display:block}
.wnav{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;font-weight:700}.wnav a{color:#000;text-decoration:none;border-bottom:2px solid transparent}.wnav a:hover,.wnav a.on{border-bottom-color:#c8102e}
#top b{display:block;font-size:18px}#top span{font-size:12px;color:var(--mut)}
#app{max-width:760px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:23px;margin:6px 0 14px}h2{font-size:18px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.tu{cursor:pointer;display:flex;gap:14px;align-items:center}.tu:hover{border-color:var(--gold)}
.tu .d{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center;min-width:64px}
.tu .d b{display:block;font-size:22px;color:var(--gold)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:16px;font-family:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 13px;border-radius:10px;background:var(--card2);border:1px solid var(--line);cursor:pointer;font-size:15px;user-select:none}
.chip.on{background:var(--gold);color:#2a1d00;border-color:var(--gold);font-weight:700}
.chip.sm{padding:7px 9px;font-size:14px;min-width:62px;text-align:center}
.btn{display:inline-block;padding:13px 18px;border:0;border-radius:11px;font:inherit;font-weight:700;background:var(--gold);color:#2a1d00;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.full{width:100%}
.muted{color:var(--mut);font-size:14px}
.kl{border:2px solid var(--gold);background:#fff7df;border-radius:12px;padding:12px 14px;margin-top:12px}
.kl.err{border-color:var(--red);background:#fdeaea;color:#000}
.kl b.nr{font-size:20px;color:#000}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line);margin-right:4px}
.err{color:var(--red);font-weight:700}
.pay{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}.pay span{color:var(--mut)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px}.chk input{width:22px;height:22px;flex:none;margin-top:1px}
.hp{position:absolute;left:-9999px}
.cnt{background:#111;color:#fff;border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:17px}.cnt b{color:var(--gold);font-size:22px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}.tab{padding:9px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}.tab.on{background:#000;color:#fff;border-color:#000}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}.tile{background:#111;color:#fff;border-radius:12px;padding:10px;text-align:center}.tile b{display:block;font-size:24px;color:var(--gold)}.tile span{font-size:12px}
.katbtn{display:inline-block;background:#111;color:var(--gold);border-radius:10px;padding:8px 12px;margin:0 6px 6px 0;font-weight:800;cursor:pointer;font-size:14px}
table.l{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}table.l th{background:#cfe8f7;text-align:left;font-size:13px;padding:8px}table.l td{border-top:1px solid var(--line);padding:8px;font-size:14px;vertical-align:middle}
table.l tr.own td{background:#fff7df}.thumb{width:44px;height:52px;object-fit:cover;border-radius:6px;display:block}.nofoto{width:44px;height:52px;border-radius:6px;background:#e3e6eb;font-size:9px;display:flex;align-items:center;justify-content:center;text-align:center}
.grp{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}.grp.bel{border-color:var(--gold);background:#fff7df}
.modal{position:fixed;inset:0;background:rgba(20,25,35,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}.dlg{background:#fff;border-radius:16px;padding:18px;width:min(560px,96vw);max-height:92vh;overflow:auto}
.prof{display:grid;grid-template-columns:150px 1fr;gap:14px}.prof img,.prof .nofoto{width:150px;height:190px;border-radius:12px;object-fit:cover;font-size:13px}@media(max-width:520px){.prof{grid-template-columns:1fr}}
.acc{margin-left:auto;text-align:right;font-size:13px}.acc a{color:#000;font-weight:700}
.upl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.upl input{width:auto;flex:1;min-width:200px}

.anltoc{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px;margin:0 0 16px}.anltoc a{display:block;padding:9px 12px;border:2px solid #000;border-radius:10px;color:#000;font-weight:700;text-decoration:none;background:#fff}.anltoc a:hover{background:#fff3c4}
.anltxt h2{margin:26px 0 8px;padding-top:12px;border-top:3px solid #d0021b;font-size:24px;scroll-margin-top:12px}.anltxt h3{margin:18px 0 6px;font-size:19px;scroll-margin-top:12px}.anltxt p,.anltxt li{line-height:1.55}.anltxt table{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px}.anltxt th,.anltxt td{border:1px solid #bbb;padding:6px 8px;text-align:left;vertical-align:top}.anltxt th{background:#e9ecf0}.anltxt a{color:#0047bb;word-break:break-all}
</style>
</head>

// Masterboxen: alle Erwachsene.

// Regeln: Freilose bevorzugt an den Verein mit den meisten Startern; Sportler desselben Vereins möglichst nicht gegeneinander.
function wbuSeedOrder(n){let a=[1];while(a.length<n){const m=a.length*2+1;a=a.flatMap(x=>[x,m-x])}return a}

  const key=x=>String(x.club||'').trim().toLowerCase()||('#'+x.id);
  const groups={};list.forEach((x,i)=>{(groups[key(x)]=groups[key(x)]||[]).push({...x,i})});

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}

	get : function(index) {
		return this.num[index];

	getLength : function() {
		return this.num.length;

	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );

	mod : function(e) {

QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
	
	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
	
	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;
	
	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;
};

QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {

	switch(errorCorrectLevel) {
	case QRErrorCorrectLevel.L :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
	case QRErrorCorrectLevel.M :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
	case QRErrorCorrectLevel.Q :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
	case QRErrorCorrectLevel.H :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
	default :
		return undefined;
	}
};

module.exports = QRRSBlock;

const ANL_HTML="<p>WBU Sports ist das System der World Boxing Union f\u00fcr Turniere und Profi-Galas: von der Online-Anmeldung \u00fcber den Kampftag bis zur Urkunde. Alles l\u00e4uft im Browser auf www.wbu-boxing.com \u2013 auch die Scorecard. Zus\u00e4tzlich gibt es die Scorecard als Android-App, WBU Sports als Tablet-App f\u00fcr Android und WBU Sports als Windows-Version \u2013 alle drei laufen auch ohne Internet.</p>\n<h2 id=\"anl-berblick\">\u00dcberblick</h2>\n<table>\n<thead>\n<tr>\n<th>Baustein</th>\n<th>Wer nutzt es</th>\n<th>Adresse</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Anmeldeseite</td>\n<td>Vereine, Trainer, Einzelsportler, Veranstalter</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/anmeldung/\">https://www.wbu-boxing.com/anmeldung/</a></td>\n</tr>\n<tr>\n<td>WBU Sports (Veranstalter)</td>\n<td>Veranstalter, Leitstand</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/veranstalter/\">https://www.wbu-boxing.com/veranstalter/</a></td>\n</tr>\n<tr>\n<td>Scorecard</td>\n<td>Supervisor, Punktrichter</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/scorecard/\">https://www.wbu-boxing.com/scorecard/</a></td>\n</tr>\n<tr>\n<td>WBU Live</td>\n<td>Zuschauer (Handy, Hallen-Monitor)</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/\">https://www.wbu-boxing.com/live/</a></td>\n</tr>\n<tr>\n<td>WBU Time</td>\n<td>Zeitnehmer, Fernseher am Ring</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1\">https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1</a></td>\n</tr>\n<tr>\n<td>Live-Monitor auf der Startseite</td>\n<td>alle Besucher der WBU-Webseite, erscheint automatisch bei laufenden Galas</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/\">https://www.wbu-boxing.com/</a></td>\n</tr>\n<tr>\n<td>Results</td>\n<td>alle</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/results/\">https://www.wbu-boxing.com/results/</a></td>\n</tr>\n<tr>\n<td>WBU-Weltrangliste</td>\n<td>alle</td>\n<td><a target=\"_blank\" href=\"https://www.wbu-boxing.com/rankings/\">https://www.wbu-boxing.com/rankings/</a></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"anl-turnier-oder-profi-gala-der-unterschied\">Turnier oder Profi-Gala \u2013 der Unterschied</h3>\n<p>Beim Anlegen w\u00e4hlt der Veranstalter, ob es ein Turnier oder eine Profi-Gala wird. Das l\u00e4sst sich sp\u00e4ter nicht umstellen.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Turnier</th>\n<th>Profi-Gala</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Was</td>\n<td>viele Sportler, nach Klassen ausgelost</td>\n<td>Kampfabend, Kampf f\u00fcr Kampf festgelegt</td>\n</tr>\n<tr>\n<td>Anmeldung</td>\n<td>online durch Vereine, Trainer, Einzelsportler</td>\n<td>keine \u2013 der Veranstalter tr\u00e4gt die K\u00e4mpfe selbst ein</td>\n</tr>\n<tr>\n<td>Aufbau</td>\n<td>Kategorien, Brackets (K.-o.-System), Kampfliste</td>\n<td>Fight Card</td>\n</tr>\n<tr>\n<td>Ringe</td>\n<td>1 bis 10 Ringe oder Kampffl\u00e4chen</td>\n<td>1 Ring</td>\n</tr>\n<tr>\n<td>Ergebnis</td>\n<td>es muss immer einen Sieger geben</td>\n<td>auch Unentschieden oder No Contest</td>\n</tr>\n<tr>\n<td>Urkunden, Akkreditierung</td>\n<td>ja</td>\n<td>\u2013</td>\n</tr>\n<tr>\n<td>Kapitel</td>\n<td>2</td>\n<td>3</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"anl-1-vereine-trainer-und-einzelsportler\">1. Vereine, Trainer und Einzelsportler</h2>\n<p>Wer Sportler anmeldet, braucht ein Konto auf der Anmeldeseite. Das Konto gilt f\u00fcr alle WBU-Turniere.</p>\n<h3 id=\"anl-1-1-konto-anlegen\">1.1 Konto anlegen</h3>\n<ol>\n<li><a target=\"_blank\" href=\"https://www.wbu-boxing.com/anmeldung/\">https://www.wbu-boxing.com/anmeldung/</a> \u00f6ffnen (im Men\u00fc der WBU-Webseite: WBU Sports).</li>\n<li>\u201eNeu registrieren\u201c antippen.</li>\n<li>Bei \u201eIch bin\u201c die Rolle w\u00e4hlen: Verein/Gym, Trainer, Einzelsportler oder Veranstalter.</li>\n<li>Verein, Vor- und Nachname, Telefon, E-Mail und ein Passwort (mindestens 6 Zeichen) eintragen.</li>\n<li>\u201eKonto anlegen\u201c antippen. Ab jetzt einloggen mit E-Mail und Passwort.</li>\n</ol>\n<p>Das Login gilt in allen Tabs und endet, wenn der Browser geschlossen wird oder man auf \u201eAbmelden\u201c tippt. Die Rolle l\u00e4sst sich oben rechts unter \u201eRolle \u00e4ndern\u201c wechseln. Passwort vergessen: \u201ePasswort vergessen?\u201c antippen, ein Code kommt per E-Mail.</p>\n<h3 id=\"anl-1-2-turnier-ffnen\">1.2 Turnier \u00f6ffnen</h3>\n<p>Jedes Turnier hat eine \u00f6ffentliche Infoseite mit Datum, Ort, Startgeld, Anmeldeschluss und der Ausschreibung zum Lesen \u2013 auch ohne Login. Nach dem Login in der Turnierliste auf das Turnier tippen. Oben stehen die Reiter: Anmeldung, Meine Anmeldungen &amp; Bezahlung, Teilnehmer, Kategorien, Clubs &amp; Trainer.</p>\n<h3 id=\"anl-1-3-sportler-eintragen\">1.3 Sportler eintragen</h3>\n<ol>\n<li>Reiter \u201eAnmeldung\u201c.</li>\n<li>Sportart w\u00e4hlen (Semi-Pro Boxen, Kickboxen K1, Masterboxen, Shadow Boxing Battle).</li>\n<li>Vorname, Name, Geburtsdatum, Geschlecht und Gewicht eintragen. Die Klasse ergibt sich automatisch aus Alter am Turniertag, Geschlecht und Gewicht.</li>\n<li>Verein, Land, Trainer und E-Mail eintragen.</li>\n<li>Foto (freiwillig) ausw\u00e4hlen. Es \u00f6ffnet sich das Fenster \u201eKopf ausw\u00e4hlen\u201c: den roten Rahmen auf den Kopf schieben, mit dem Regler gr\u00f6\u00dfer oder kleiner machen, \u201e\u00dcbernehmen\u201c. Der Kopf erscheint sp\u00e4ter auf der Akkreditierungskarte.</li>\n<li>Unterlagen hochladen, soweit schon da (siehe 1.4) \u2013 sie k\u00f6nnen auch sp\u00e4ter nachgereicht werden.</li>\n<li>\u201eEintragen\u201c. Der Sportler steht sofort in der Teilnehmerliste und im Warenkorb. F\u00fcr weitere Sportler \u201e+ Weiteren Sportler eintragen\u201c.</li>\n</ol>\n<h3 id=\"anl-1-4-unterlagen\">1.4 Unterlagen</h3>\n<table>\n<thead>\n<tr>\n<th>Unterlage</th>\n<th>Wer braucht sie</th>\n<th>Hinweis</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Teilnahmeerkl\u00e4rung &amp; Haftungsausschluss</td>\n<td>alle Sportler</td>\n<td>Formular herunterladen, ausdrucken, unterschreiben, als Foto oder PDF hochladen</td>\n</tr>\n<tr>\n<td>Unterschrift der Eltern</td>\n<td>Sportler unter 18 Jahren</td>\n<td>steht auf derselben Teilnahmeerkl\u00e4rung</td>\n</tr>\n<tr>\n<td>Sport\u00e4rztliches Attest</td>\n<td>laut Ausschreibung (z. B. Semi-Pro)</td>\n<td>muss aus dem Jahr der Veranstaltung sein; Ausstellungsdatum eintragen</td>\n</tr>\n</tbody>\n</table>\n<p>Fehlt etwas, steht es unter \u201eMeine Anmeldungen &amp; Bezahlung\u201c rot markiert und kann dort hochgeladen werden. Nach dem Anmeldeschluss kommt eine Erinnerung mit 3 Tagen Nachfrist, danach wird der Sportler entfernt.</p>\n<h3 id=\"anl-1-5-bezahlen\">1.5 Bezahlen</h3>\n<ol>\n<li>Reiter \u201eMeine Anmeldungen &amp; Bezahlung\u201c.</li>\n<li>\u201eFertig \u2013 jetzt bezahlen\u201c. Die Summe steht damit fest, es erscheint ein Zahlungscode.</li>\n<li>Den Betrag \u00fcberweisen, als Verwendungszweck nur den Zahlungscode.</li>\n<li>Sobald der Veranstalter die Zahlung zugeordnet hat, steht dort \u201eBezahlt \u2013 fest angemeldet\u201c.</li>\n</ol>\n<p>Wer bis zum Anmeldeschluss nicht vollst\u00e4ndig bezahlt hat, bekommt eine Erinnerung mit kurzer Nachfrist; danach werden die Sportler entfernt. Die Rechnung steht am Tag nach der Veranstaltung als PDF zum Herunterladen bereit.</p>\n<h3 id=\"anl-1-6-trainer-und-betreuer-anmelden\">1.6 Trainer und Betreuer anmelden</h3>\n<p>Unter \u201eMeine Anmeldungen &amp; Bezahlung\u201c im Bereich \u201eTrainer &amp; Betreuer (Akkreditierung)\u201c. Jeder Eingetragene bekommt eine Akkreditierungskarte mit freiem Eintritt.</p>\n<table>\n<thead>\n<tr>\n<th>Sportler angemeldet</th>\n<th>Trainer frei</th>\n<th>Betreuer frei</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0</td>\n<td>0</td>\n<td>0</td>\n</tr>\n<tr>\n<td>1 bis 5</td>\n<td>1</td>\n<td>2</td>\n</tr>\n<tr>\n<td>6 oder mehr</td>\n<td>1</td>\n<td>4</td>\n</tr>\n</tbody>\n</table>\n<ol>\n<li>Vor- und Nachname eintragen, Rolle w\u00e4hlen (nur Rollen mit freien Pl\u00e4tzen werden angeboten).</li>\n<li>Foto freiwillig w\u00e4hlen und Kopf ausw\u00e4hlen.</li>\n<li>\u201e+ Hinzuf\u00fcgen\u201c. Entfernen \u00fcber \u201eentfernen\u201c.</li>\n</ol>\n<p>Nicht angemeldete Betreuer z\u00e4hlen als Zuschauer und zahlen Eintritt. Einzelsportler melden ihren Trainer und ihre Betreuer genauso an.</p>\n<h2 id=\"anl-2-veranstalter-ein-turnier-anlegen\">2. Veranstalter \u2013 ein Turnier anlegen</h2>\n<p>Ein Turnier wird in WBU Sports angelegt, online zur Anmeldung freigeschaltet und am Kampftag \u00fcber den Leitstand gesteuert.</p>\n<h3 id=\"anl-2-1-einloggen\">2.1 Einloggen</h3>\n<ol>\n<li>Auf der Anmeldeseite mit einem Konto der Rolle \u201eVeranstalter\u201c einloggen \u2013 man landet direkt in WBU Sports.</li>\n<li>Ist das Konto noch \u201eTrainer\u201c oder \u201eVerein\u201c: in WBU Sports \u201eAls Veranstalter weiter\u201c antippen oder oben \u201eRolle \u00e4ndern\u201c.</li>\n</ol>\n<p>Wichtig: Die Veranstaltungen werden im Browser dieses PCs gespeichert. \u201eSicherung speichern (.json)\u201c legt eine Kopie an; auf einem anderen PC holt man sie mit \u201eGespeicherte Sicherung einspielen\u201c zur\u00fcck.</p>\n<h3 id=\"anl-2-2-veranstaltung-anlegen\">2.2 Veranstaltung anlegen</h3>\n<ol>\n<li>Auf der Startseite \u201eTurnier\u201c w\u00e4hlen (f\u00fcr eine Gala siehe Kapitel 3).</li>\n<li>Reiter \u201eVeranstaltung\u201c ausf\u00fcllen: Name, Promoter, Ort/Halle, Datum. Supervisor und Zeitnehmer tr\u00e4gt der Veranstalter nicht ein \u2013 das macht der Supervisor in seiner Scorecard; die Namen stehen dann im Ergebnis und im PDF-Bericht.</li>\n<li>Ringarzt: kann schon jetzt eingetragen werden \u2013 sonst am Kampftag im Leitstand. Ohne Ringarzt startet die Uhr nicht.</li>\n<li>Anzahl Ringe oder Kampffl\u00e4chen (1\u201310) und die Bezeichnung \u201eRing\u201c oder \u201eKampffl\u00e4che\u201c w\u00e4hlen.</li>\n<li>Gewichtstoleranz beim Wiegen einstellen (z. B. 4 kg laut Ausschreibung).</li>\n</ol>\n<h3 id=\"anl-2-3-online-anmeldung-freischalten\">2.3 Online-Anmeldung freischalten</h3>\n<ol>\n<li>Reiter \u201eOnline-Anmeldung\u201c.</li>\n<li>Angebotene Sportarten antippen.</li>\n<li>Anmeldeschluss, Startgeld f\u00fcr den 1. Start und f\u00fcr jeden weiteren Start, Nachfrist (Tage) eintragen.</li>\n<li>Sport\u00e4rztliches Attest: verlangen oder nicht.</li>\n<li>Kontoinhaber, IBAN, BIC und Hinweise f\u00fcr die Sportler eintragen.</li>\n<li>Ver\u00f6ffentlichen (WBU-Passwort n\u00f6tig). Danach Ausschreibung, Ablaufplan, Plakat und Formulare hochladen.</li>\n</ol>\n<p>Oben zeigt eine schwarze Leiste die Zahlen: angemeldete Teilnehmer, Starts, Clubs, registrierte Konten, offene Zahlungen, fehlende Unterlagen. \u201eTeilnehmer, Kategorien mit Bildern, Clubs ansehen\u201c \u00f6ffnet die Anmeldeseite in der Veranstalter-Ansicht \u2013 ohne eigenes Konto.</p>\n<h3 id=\"anl-2-4-zahlungen-zuordnen\">2.4 Zahlungen zuordnen</h3>\n<p>Im Reiter \u201eOnline-Anmeldung\u201c den Kontoauszug (PDF oder CSV der Bank) laden. Das System sucht die Zahlungscodes und ordnet die Betr\u00e4ge zu. Der Kontoauszug wird nur im eigenen Browser gelesen und nicht hochgeladen. Einzelne Zahlungen lassen sich auch von Hand best\u00e4tigen oder zur\u00fccknehmen.</p>\n<h3 id=\"anl-2-5-kategorien-und-teilnehmer\">2.5 Kategorien und Teilnehmer</h3>\n<ul>\n<li>Online angemeldete Sportler landen automatisch in ihrer Gewichtsklasse.</li>\n<li>Gr\u00fcn: Paarung steht \u00b7 Gelb: wartet auf einen Gegner \u00b7 \u25b6: l\u00e4uft schon.</li>\n<li>Eine Klasse anklicken zeigt die Teilnehmer. Sportler lassen sich von Hand hinzuf\u00fcgen, Runden und Rundenzeit sowie der Ring einstellen.</li>\n<li>Teilnehmer entfernen: \u2715 \u2013 solange in der Klasse noch kein Kampf gewertet ist, wird automatisch neu ausgelost.</li>\n<li>L\u00e4uft die Klasse schon: \u201enicht da\u201c \u2013 der Sportler wird durchgestrichen und verliert seine offenen K\u00e4mpfe kampflos; \u201edoch da\u201c macht es r\u00fcckg\u00e4ngig.</li>\n</ul>\n<h3 id=\"anl-2-6-brackets\">2.6 Brackets</h3>\n<p>K.-o.-System, automatisch ausgelost; Vereinskollegen treffen m\u00f6glichst nicht in der ersten Runde aufeinander. Freilose werden gleichm\u00e4\u00dfig verteilt. Sieger r\u00fccken automatisch weiter. Es gibt keinen Kampf um Platz 3: beide Halbfinal-Verlierer werden Dritte. \u201eNeu auslosen\u201c ist m\u00f6glich, l\u00f6scht aber bereits eingetragene Ergebnisse der Klasse. \u201eBracket drucken\u201c f\u00fcr den Aushang.</p>\n<h3 id=\"anl-2-7-kampfliste-und-ringe\">2.7 Kampfliste und Ringe</h3>\n<ul>\n<li>Die K\u00e4mpfe werden gleichm\u00e4\u00dfig auf die Ringe verteilt; Master m\u00f6glichst in Ring 1.</li>\n<li>Wer zweimal startet, k\u00e4mpft nie gleichzeitig in zwei Ringen und bekommt die eingestellte Mindestpause (z. B. 4 K\u00e4mpfe dazwischen).</li>\n<li>\u201eDrucken / PDF\u201c f\u00fcr die Kampfliste je Ring.</li>\n</ul>\n<h3 id=\"anl-2-8-live-schalten\">2.8 Live schalten</h3>\n<p>Im Reiter \u201eKampfliste\u201c auf \u201eLive schalten\u201c tippen (WBU-Passwort). Danach erscheinen:</p>\n<ul>\n<li>der Link f\u00fcr WBU Live (Handy, Zuschauer),</li>\n<li>der Fernseher-Link f\u00fcr den Hallen-Monitor,</li>\n<li>die Kn\u00f6pfe \u201eRing 1 \u00f6ffnen\u201c, \u201eRing 2 \u00f6ffnen\u201c f\u00fcr WBU Time.</li>\n</ul>\n<p>Die Veranstaltung erscheint dann auch in der Scorecard des Supervisors. Der PC mit WBU Sports muss w\u00e4hrend der Veranstaltung ge\u00f6ffnet und online bleiben \u2013 er schickt die Kampfliste und holt die Ergebnisse.</p>\n<h2 id=\"anl-3-veranstalter-eine-profi-gala-anlegen\">3. Veranstalter \u2013 eine Profi-Gala anlegen</h2>\n<p>Eine Gala ist ein Kampfabend Kampf f\u00fcr Kampf, ohne Kategorien und Brackets. Sie l\u00e4uft immer in einem Ring.</p>\n<ol>\n<li>Auf der Startseite \u201eProfi-Gala\u201c w\u00e4hlen.</li>\n<li>Reiter \u201eVeranstaltung\u201c ausf\u00fcllen wie in 2.2 (Name, Promoter, Ort, Datum, Ringarzt).</li>\n<li>Reiter \u201eFight Card\u201c: je Kampf eintragen und \u201e+ Kampf hinzuf\u00fcgen\u201c:</li>\n<li>rote und blaue Ecke (Name, Pflicht),</li>\n<li>je Ecke Gym / Verein, Land, Geburtsdatum (das Alter wird am Veranstaltungstag ausgerechnet) und Gewicht beim Wiegen,</li>\n<li>Gewichtsklasse (Pflicht),</li>\n<li>Titel laut Autorisation der WBU \u2013 zum Anklicken: Weltmeisterschaft, Interkontinentale Meisterschaft, Europameisterschaft, Internationale Meisterschaft, Deutsche Meisterschaft; f\u00fcr au\u00dferordentliche Titel \u201eAnderer Titel \u2013 selbst eintragen\u201c (z. B. Junioren-Weltmeisterschaft); ohne Titel \u201e\u2013 kein Titelkampf \u2013\u201c,</li>\n<li>Kampfart, Anzahl Runden und Rundendauer.</li>\n<li>Reihenfolge mit \u25b2 \u25bc \u00e4ndern, \u270e bearbeiten, \u2715 l\u00f6schen.</li>\n<li>\u201eLive schalten\u201c wie in 2.8 \u2013 danach Zeitnahme und Fernseher-Anzeige \u00fcber die Kn\u00f6pfe der Fight Card.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Einstellung</th>\n<th>M\u00f6glichkeiten</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Kampfart</td>\n<td>Profi, Semi-Pro, Master, Bare Knuckle, Hybrid, K1 / Kickboxen</td>\n</tr>\n<tr>\n<td>Gewichtsklasse</td>\n<td>Profi-Gewichtsklassen von Light Flyweight bis Schwergewicht</td>\n</tr>\n<tr>\n<td>Titel</td>\n<td>kein Titelkampf, Weltmeisterschaft, Interkontinentale, Europa-, Internationale, Deutsche Meisterschaft oder selbst eintragen</td>\n</tr>\n<tr>\n<td>Runden</td>\n<td>frei w\u00e4hlbar, 1 bis 12</td>\n</tr>\n<tr>\n<td>Rundendauer</td>\n<td>3, 2, 1,5 oder 1 Minute; Pause immer 1 Minute</td>\n</tr>\n</tbody>\n</table>\n<p>Auf der Gala ist auch Unentschieden oder No Contest m\u00f6glich; beim Turnier muss es immer einen Sieger geben.</p>\n<h3 id=\"anl-3-1-gala-hochladen-pflicht\">3.1 Gala hochladen \u2013 Pflicht</h3>\n<p>Sobald die Fight Card den ersten Kampf hat und Internet da ist, verlangt WBU Sports: \u201e\u26a0 Pflicht: Veranstaltung hochladen\u201c. Einmal das WBU-Passwort eingeben \u2013 dann ist die Gala online (auch wenn sie im Windows-Programm oder in der Tablet-App angelegt wurde). Nur so bekommt der Supervisor die Fight Card und kann sie am Veranstaltungstag \u00e4ndern. Beim ersten Hochladen bekommt die WBU automatisch eine Info-E-Mail (an info@wbu-boxing.com) mit Name, Datum, Ort und Veranstalter \u2013 das gilt auch f\u00fcr Turniere.</p>\n<h3 id=\"anl-3-2-fight-card-am-veranstaltungstag-ndern\">3.2 Fight Card am Veranstaltungstag \u00e4ndern</h3>\n<ul>\n<li><strong>Veranstalter:</strong> jederzeit in der Fight Card (\u270e \u00e4ndern, \u25b2 \u25bc verschieben, \u2715 l\u00f6schen, neue K\u00e4mpfe). Alles geht automatisch an Scorecard, WBU Live und WBU Time.</li>\n<li><strong>Supervisor (wenn der Veranstalter nicht da ist):</strong> In der Scorecard im Kasten \u201eAus WBU Sports\u201c auf \u201e\u270e Fight Card bearbeiten\u201c tippen. Namen, Land, Geburtsdatum, Gewicht, Gewichtsklasse, Titel, Kampfart, Runden und Rundendauer \u00e4ndern, K\u00e4mpfe verschieben, hinzuf\u00fcgen oder streichen \u2013 \u201eSpeichern &amp; senden\u201c. Das geht auch ohne Internet, wenn er mit dem Tablet oder Laptop per Bluetooth verbunden ist; fehlt das Internet kurz, wird automatisch nachgesendet.</li>\n<li><strong>\u00dcber das WBU-Sports-Konto:</strong> Wer sich in der Scorecard im Browser als Supervisor mit dem WBU-Passwort angemeldet hat und dabei bei WBU Sports eingeloggt war, findet die Gala danach auf der Anmeldeseite unter \u201e\u270e Als Supervisor freigeschaltet\u201c \u2013 mit \u201eFight Card bearbeiten\u201c. Das gilt nur f\u00fcr diese Gala und endet nach dem Veranstaltungstag.</li>\n<li>Schon gewertete K\u00e4mpfe lassen sich nicht streichen und nur mit R\u00fcckfrage \u00e4ndern. Der Veranstalter sieht in WBU Sports, wer wann ge\u00e4ndert hat.</li>\n</ul>\n<h3 id=\"anl-3-3-k-mpfer-datenbank\">3.3 K\u00e4mpfer-Datenbank</h3>\n<ul>\n<li>Alle K\u00e4mpfer aus Turnier-Anmeldungen und hochgeladenen Galas landen automatisch in der <strong>K\u00e4mpfer-Datenbank</strong>, sortiert nach Gyms. Jeder K\u00e4mpfer steht nur einmal darin.</li>\n<li><strong>\ud83d\udcc7</strong> neben \u201eRote Ecke\u201c / \u201eBlaue Ecke\u201c (und \u201e\ud83d\udcc7 Datenbank\u201c bei den Turnier-Teilnehmern): Gym aufklappen oder Namen suchen, K\u00e4mpfer anklicken \u2013 Name, Gym, Land, Geburtsdatum und Gewicht sind sofort eingetragen.</li>\n<li>Auf der Startseite: \u201e\ud83d\udcc7 K\u00e4mpfer-Datenbank\u201c zum Durchsehen, Korrigieren (\u270e) und neu Eintragen. L\u00f6schen nur mit dem WBU-Passwort.</li>\n<li><strong>\ud83d\udce5 Liste einspielen:</strong> eine Tabelle (Excel \u2192 \u201eCSV UTF-8\u201c) mit den Spalten Vorname; Nachname; Gym / Verein; Land \u2013 z. B. die Starter eines fr\u00fcheren Turniers. Wer schon drin ist, wird nicht doppelt angelegt. Die Gewichtsklasse w\u00e4hlt der Veranstalter beim Eintragen jedes Mal neu.</li>\n<li><strong>Beim Eintippen eines Namens</strong> (Rote/Blaue Ecke, Turnier-Teilnehmer) erscheinen passende K\u00e4mpfer aus der Datenbank \u2013 anklicken \u00fcbernimmt Name, Gym, Land und Geburtsdatum. So entstehen keine Doppel-Eintr\u00e4ge. Andere Person mit gleichem Namen? Einfach einen Zusatz eintragen (z. B. zweiter Vorname).</li>\n<li><strong>Vereine bei der Online-Anmeldung</strong> sehen beim Eintippen nur ihre <strong>eigenen</strong>, fr\u00fcher gemeldeten Sportler zum \u00dcbernehmen. Gibt es den Namen bei einem anderen Verein, kommt nur der Hinweis \u201eDiesen Namen gibt es schon\u201c \u2013 ohne fremde Daten.</li>\n<li><strong>Geschlossen:</strong> Die Datenbank sehen nur Veranstalter- und Supervisor-Konten und die WBU (WBU-Passwort) \u2013 nie die \u00d6ffentlichkeit, auch nicht die Vereine untereinander.</li>\n</ul>\n<h2 id=\"anl-4-am-kampftag-der-leitstand\">4. Am Kampftag \u2013 der Leitstand</h2>\n<p>Der Leitstand zeigt alle Ringe mit Rundenuhr, dem Kampf im Ring, den n\u00e4chsten K\u00e4mpfen und den bisherigen K\u00e4mpfen. Er ist im Reiter \u201e\ud83c\udf9b Leitstand\u201c.</p>\n<h3 id=\"anl-4-1-vor-dem-start\">4.1 Vor dem Start</h3>\n<ol>\n<li>Ringarzt eintragen (Feld oben, gelb markiert, solange es leer ist). Ohne Ringarzt startet die Uhr nicht.</li>\n<li>Bei mehreren PCs: unter \u201eDieser PC bedient\u201c nur die eigenen Ringe ankreuzen.</li>\n<li>Signal je Ring w\u00e4hlen (z. B. Ring 1 Ringglocke, Ring 2 Schiedsrichterpfiff) und mit \u25b6 anh\u00f6ren.</li>\n<li>\u201eSignale an\u201c pr\u00fcfen \u2013 \u201eMUTE\u201c schaltet alle T\u00f6ne aus.</li>\n</ol>\n<h3 id=\"anl-4-2-die-uhr\">4.2 Die Uhr</h3>\n<table>\n<thead>\n<tr>\n<th>Knopf</th>\n<th>Wirkung</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\u25b6 START / WEITER</td>\n<td>Runde l\u00e4uft</td>\n</tr>\n<tr>\n<td>\u23f8 STOPP</td>\n<td>Uhr h\u00e4lt an, die Timeout-Uhr (max. 10 Min) startet automatisch</td>\n</tr>\n<tr>\n<td>\u21ba Runde neu</td>\n<td>aktuelle Runde von vorn</td>\n</tr>\n<tr>\n<td>\u23ed N\u00e4chste Runde</td>\n<td>springt in die n\u00e4chste Runde</td>\n</tr>\n<tr>\n<td>Rd. / Min</td>\n<td>Rundenzahl und Rundendauer \u00e4ndern</td>\n</tr>\n<tr>\n<td>\u23f1 gro\u00df</td>\n<td>Uhr gro\u00df auf diesem PC</td>\n</tr>\n</tbody>\n</table>\n<p>Signale laufen automatisch: 10 Sekunden vor Rundenende dreimal der Hammer, nach jeder Runde und jeder Pause einmal die Glocke, am Kampfende dreimal. Die Pause dauert immer 1 Minute.</p>\n<h3 id=\"anl-4-3-wiegen\">4.3 Wiegen</h3>\n<p>Im Kasten \u201eWiegen\u201c steht das H\u00f6chstgewicht (Klasse plus Toleranz, z. B. -55 kg + 4 kg = max. 59,0 kg). Gewicht f\u00fcr Rot und Blau eintippen. Liegt es dar\u00fcber, fragt das System nach Disqualifikation; der Gegner gewinnt und kommt weiter.</p>\n<h3 id=\"anl-4-4-sonderf-lle-mit-einem-klick\">4.4 Sonderf\u00e4lle mit einem Klick</h3>\n<table>\n<thead>\n<tr>\n<th>Fall</th>\n<th>Knopf</th>\n<th>Folge</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Disqualifikation beim Wiegen</td>\n<td>\u2696 DQ: Rot / Blau</td>\n<td>Gegner gewinnt durch DQ</td>\n</tr>\n<tr>\n<td>Gegner kann nicht antreten (z. B. Verletzung)</td>\n<td>\u270b Kampflos gewonnen: Rot / Blau</td>\n<td>ohne R\u00fcckfrage, sp\u00e4ter \u00fcber \u270e korrigierbar</td>\n</tr>\n<tr>\n<td>Sportler nicht erschienen</td>\n<td>\ud83d\udeab Nicht erschienen: Rot / Blau</td>\n<td>Gegner gewinnt kampflos, auch sp\u00e4tere K\u00e4mpfe dieses Sportlers</td>\n</tr>\n</tbody>\n</table>\n<p>Wer kampflos verliert, nicht erscheint oder beim Wiegen disqualifiziert wird, bekommt keine Urkunde f\u00fcr diesen Platz.</p>\n<h3 id=\"anl-4-5-ergebnisse\">4.5 Ergebnisse</h3>\n<p>Das Ergebnis kommt automatisch vom Supervisor (Scorecard) oder wird mit \u201eErgebnis eintragen\u201c von Hand gesetzt. Sobald ein Ergebnis da ist, wird die Uhr zur\u00fcckgesetzt und der n\u00e4chste Kampf geladen. Mit \u201eN\u00e4chsten Kampf aufrufen\u201c oder \u201eaufrufen\u201c l\u00e4sst sich die Reihenfolge \u00e4ndern.</p>\n<h3 id=\"anl-4-6-zweiter-pc-am-ring-bedienplatz\">4.6 Zweiter PC am Ring (Bedienplatz)</h3>\n<p>Bei mehreren Ringen steht unten \u201eZweiter PC am Ring (ohne Login)\u201c mit einem Link je Ring. Diesen Link am zweiten PC \u00f6ffnen: dort l\u00e4sst sich nur dieser Ring bedienen (Uhr, Ergebnisse, DQ). Danach am Haupt-PC bei \u201eDieser PC bedient\u201c diesen Ring abhaken.</p>\n<h3 id=\"anl-4-7-wbu-time-am-fernseher\">4.7 WBU Time am Fernseher</h3>\n<p>Die Rundenuhr f\u00fcr den Fernseher am Ring: Runde links, Zeit gro\u00df rechts, Namen der Ecken oben. Im Men\u00fc der WBU-Webseite \u201eWBU Time 1\u201c bzw. \u201eWBU Time 2\u201c \u00f6ffnen (oder im Browser des Fire TV <a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1\">https://www.wbu-boxing.com/live/?zeit=1&amp;ring=1</a>). Sie zeigt automatisch die laufende Veranstaltung und folgt der Uhr im Leitstand. Ton am Fernseher einmal mit \u201eMute \u2013 Ton einschalten\u201c freigeben. Ohne Internet: den Fernseher per HDMI an den PC anschlie\u00dfen und im Leitstand die Zeitanzeige \u00f6ffnen.</p>\n<h2 id=\"anl-5-ergebnisse-urkunden-und-akkreditierung\">5. Ergebnisse, Urkunden und Akkreditierung</h2>\n<h3 id=\"anl-5-1-ergebnisse\">5.1 Ergebnisse</h3>\n<p>Reiter \u201eErgebnisse\u201c: Platz 1, 2 und 3 (zwei Dritte) je Klasse, automatisch aus den Brackets. \u201eDrucken / PDF\u201c f\u00fcr den Aushang. Die Platzierungen stehen gleichzeitig auf WBU Live.</p>\n<h3 id=\"anl-5-2-logos-vorher-festlegen\">5.2 Logos vorher festlegen</h3>\n<p>Im Reiter \u201e\ud83c\udfc5 Urkunden\u201c unter \u201eLogos auf den Urkunden\u201c \u2013 vor dem Kampftag, damit am Kampftag niemand etwas einstellen muss:</p>\n<ol>\n<li>\u201eMein Logo hochladen\u201c: jedes Konto hat ein Logo (Verein oder Veranstalter).</li>\n<li>Anhaken, welche Logos auf die Urkunden und Akkreditierungskarten dieser Veranstaltung kommen: KCW, das eigene Logo, Logos anderer Veranstalter.</li>\n<li>\u201eZweite Webseite unten auf der Urkunde\u201c eintragen oder leer lassen.</li>\n</ol>\n<h3 id=\"anl-5-3-urkunden-drucken\">5.3 Urkunden drucken</h3>\n<ul>\n<li>Im Leitstand erscheint nach einem Halbfinale \u201e\ud83c\udfc5 Urkunde 3. Platz: Name\u201c, nach dem Finale je ein Knopf f\u00fcr Platz 1 und 2. Ein Klick druckt genau diese Urkunde; danach tr\u00e4gt der Knopf ein \u2713.</li>\n<li>Im Reiter \u201eUrkunden\u201c: \u201eAlle Urkunden drucken\u201c oder pro Klasse \u201eDrucken\u201c.</li>\n<li>Bei einer Deutschen Meisterschaft steht auf Platz 1 \u201eDeutscher Meister\u201c bzw. \u201eDeutsche Meisterin\u201c, sonst \u201eUrkunde\u201c. Lorbeer in Gold, Silber oder Bronze.</li>\n<li>Druckeinstellung: Papier A4, R\u00e4nder keine, H\u00e4kchen bei Hintergrundgrafiken.</li>\n</ul>\n<h3 id=\"anl-5-4-akkreditierungskarten\">5.4 Akkreditierungskarten</h3>\n<p>Reiter \u201e\ud83e\udeaa Akkreditierung\u201c (nur f\u00fcr ver\u00f6ffentlichte Turniere). Karten f\u00fcr alle Sportler im System sowie angemeldete Trainer und Betreuer \u2013 freier Eintritt.</p>\n<ol>\n<li>\u201eDrucken auf\u201c w\u00e4hlen: Plastikkarte am Kartendrucker (jede Karte einzeln, Scheckkarte hochkant 54 \u00d7 85,6 mm) oder Papier A4 mit 9 Karten zum Ausschneiden.</li>\n<li>\u201eAlle Karten drucken\u201c, \u201eNur ein Verein\u201c oder \u201eKarte\u201c f\u00fcr eine einzelne Person.</li>\n<li>Bei Fotos ohne ausgew\u00e4hlten Kopf: \u201eKopf zuschneiden\u201c.</li>\n<li>Druckeinstellung Kartendrucker: Format CR80 hochkant, R\u00e4nder keine, Skalierung 100 %, Hintergrundgrafiken an.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Rolle</th>\n<th>Farbe auf der Karte</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Sportler</td>\n<td>Rot</td>\n</tr>\n<tr>\n<td>Trainer</td>\n<td>Blau</td>\n</tr>\n<tr>\n<td>Betreuer</td>\n<td>Gr\u00fcn</td>\n</tr>\n</tbody>\n</table>\n<p>Einlass: Den QR-Code mit einer Handykamera scannen. Es erscheint \u201eAkkreditierung g\u00fcltig\u201c mit Name, Rolle und Verein \u2013 oder \u201eNicht g\u00fcltig\u201c, wenn die Karte gef\u00e4lscht oder die Person entfernt ist.</p>\n<h2 id=\"anl-6-supervisor-die-scorecard-bedienen\">6. Supervisor \u2013 die Scorecard bedienen</h2>\n<p>Der Supervisor meldet die Veranstaltung in der Scorecard an, legt die PIN f\u00fcr die Punktrichter fest und best\u00e4tigt jedes Ergebnis. Er nutzt den Browser (https://www.wbu-boxing.com/scorecard/) oder die Android-App WBU-SC.</p>\n<p><strong>Hinweis \u201eBitte nachtragen\u201c:</strong> Fehlen bei einer Gala Gewicht (Rote/Blaue Ecke) oder Gewichtsklasse, zeigt nur die Scorecard des Supervisors einen gelben Hinweis \u2013 nicht die Punktrichter. Nachtragen \u00fcber \u201e\u270e Fight Card bearbeiten\u201c. Ohne Gewichtsklasse l\u00e4sst sich ein Kampf trotzdem speichern.</p>\n<p><strong>Altersregel:</strong> Ist das Geburtsdatum beider K\u00e4mpfer eingetragen, pr\u00fcfen WBU Sports und die Scorecard das Alter am Kampftag: <strong>Masterboxen</strong> h\u00f6chstens <strong>5 Jahre</strong> Unterschied (z. B. 48 gegen 52 erlaubt), <strong>Jugend</strong> (unter 18) h\u00f6chstens <strong>2 Jahre</strong> Unterschied (z. B. 14 gegen 12 nicht erlaubt). Passt es nicht, wird der Kampf gar nicht erst angenommen.</p>\n<p><strong>Hochladen durch die WBU:</strong> Der WBU-Superadministrator kann eine Gala ohne Passwort hochladen (\u00fcber sein Konto). \u00c4ndern darf die Fight Card danach nur der Supervisor.</p>\n<h3 id=\"anl-6-1-anmelden\">6.1 Anmelden</h3>\n<ol>\n<li>\u201eSupervisor\u201c antippen, Vor- und Nachname eintragen.</li>\n<li>Promoter, Ort und Datum eintragen.</li>\n<li>Ringarzt eintragen \u2013 Pflicht, gilt f\u00fcr alle K\u00e4mpfe.</li>\n<li>Bei \u201eShow ausw\u00e4hlen\u201c die Show antippen \u2013 dort stehen nur die Shows. Ohne Internet am Ring einfach keine Show w\u00e4hlen: Die App sucht dann von selbst per Bluetooth nach WBU Sports auf dem Tablet bzw. der Laptop verbindet sich von selbst (siehe Kapitel 10.1 und 10.2): dann werden K\u00e4mpfe, Namen, Land, Alter, Gewicht, Gewichtsklasse, Titel, Runden, Rundendauer und der Ringarzt \u00fcbernommen und stehen im Ergebnis und im PDF-Bericht und die Ergebnisse gehen automatisch an WBU Sports. Beim Turnier mit mehreren Ringen den eigenen Ring w\u00e4hlen.</li>\n<li>WBU-Supervisor-Passwort eintragen. Es sch\u00fctzt davor, dass sich jemand als Supervisor ausgibt; nur an echte Supervisoren weitergeben.</li>\n<li>PIN f\u00fcr die Punktrichter festlegen (4 Ziffern, Pflicht im Browser) und den Punktrichtern sagen.</li>\n<li>\u201eLos geht's\u201c.</li>\n</ol>\n<p>In der App verbinden sich die Punktrichter per Bluetooth mit dem Handy des Supervisors \u2013 ohne Internet. Internet braucht die App nur f\u00fcr die Verbindung zu WBU Sports.</p>\n<h3 id=\"anl-6-2-kampf-einstellen\">6.2 Kampf einstellen</h3>\n<ul>\n<li>Anzahl Runden (1\u201312), Rundendauer, Anzahl Punktrichter (1\u20133), Kampfart.</li>\n<li>Rote und blaue Ecke mit Land \u00b7 Alter \u00b7 Gewicht, Gewichtsklasse oder Titel (bei WBU Sports schon ausgef\u00fcllt; ohne WBU Sports tippt der Supervisor sie selbst ein).</li>\n<li>Gala aus WBU Sports: \u201e\u270e Fight Card bearbeiten\u201c \u00e4ndert die Fight Card f\u00fcr alle (siehe 3.2).</li>\n<li>Ringrichter und Zeitnehmer eintragen. Sie bleiben f\u00fcr die n\u00e4chsten K\u00e4mpfe stehen; fr\u00fchere Ringrichter lassen sich antippen.</li>\n<li>Oben steht, wie viele Punktrichter verbunden sind.</li>\n</ul>\n<h3 id=\"anl-6-3-wertungen-ansehen\">6.3 Wertungen ansehen</h3>\n<p>Die Wertungen der Punktrichter erscheinen live, Runde f\u00fcr Runde, mit Summe. \u201efertig\u201c zeigt, wer den Kampf abgeschlossen hat. Im Chat lassen sich kurze Nachrichten an die Punktrichter schicken.</p>\n<h3 id=\"anl-6-4-ergebnis-festlegen\">6.4 Ergebnis festlegen</h3>\n<ol>\n<li>Ergebnis w\u00e4hlen. Das System schl\u00e4gt aus den Wertungen eine Entscheidung vor.</li>\n<li>Sieger antippen.</li>\n<li>Bei K.O., T.K.O., RTD (Aufgabe in der Ecke), Disqualifikation und Technischer Entscheidung zus\u00e4tzlich Runde und Zeit eintragen, z. B. Runde 3, 1:25.</li>\n<li>Speichern \u2013 das Ergebnis geht an WBU Sports, den Leitstand, WBU Live und WBU Time.</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Ergebnis</th>\n<th>Bedeutung</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>UD / SD / MD</td>\n<td>Punktsieg einstimmig / geteilt / Mehrheit</td>\n</tr>\n<tr>\n<td>K.O. / T.K.O.</td>\n<td>mit Runde und Zeit</td>\n</tr>\n<tr>\n<td>RTD</td>\n<td>Aufgabe in der Ecke</td>\n</tr>\n<tr>\n<td>DQ</td>\n<td>Disqualifikation</td>\n</tr>\n<tr>\n<td>TD</td>\n<td>Technische Entscheidung</td>\n</tr>\n<tr>\n<td>W.O.</td>\n<td>kampflos</td>\n</tr>\n<tr>\n<td>Unentschieden, Technical Draw, No Contest</td>\n<td>nur bei Galas</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"anl-6-5-abschluss\">6.5 Abschluss</h3>\n<p>\u201eN\u00e4chster Kampf\u201c f\u00fchrt zum n\u00e4chsten Kampf. Am Ende \u201eVeranstaltung abschlie\u00dfen &amp; PDF erstellen\u201c \u2013 mit doppelter Best\u00e4tigung (\u201eJa, abschlie\u00dfen\u201c und dann \u201eEndg\u00fcltig abschlie\u00dfen &amp; senden\u201c), damit nichts aus Versehen abgeschickt wird. Ein einzelner Kampf l\u00e4sst sich jederzeit wieder \u00f6ffnen; auch eine abgeschlossene Veranstaltung l\u00e4sst sich mit \u201eVeranstaltung wieder \u00f6ffnen\u201c fortsetzen \u2013 beim erneuten Abschlie\u00dfen gehen die Ergebnisse als Korrektur an die WBU. der Bericht enth\u00e4lt jeden Kampf mit Ergebnis, Wertungen, Supervisor, Ringrichter, Zeitnehmer, Ringarzt und Punktrichtern. \u201eAls Text kopieren\u201c gibt ein einzelnes Ergebnis zum Weiterschicken.</p>\n<p>Beim Abschlie\u00dfen gehen die Ergebnisse automatisch an die WBU: Das B\u00fcro bekommt eine E-Mail mit dem PDF-Bericht (info@wbu-boxing.com), und alle K\u00e4mpfe erscheinen sofort auf der \u00f6ffentlichen Seite <strong>Resultate</strong> (https://www.wbu-boxing.com/live/?resultate=1) \u2013 mit Titel, Gewichtsklasse, Namen, Sieger, Entscheidung, Runde/Zeit und den Punkten der Punktrichter; bei Turnieren zus\u00e4tzlich die Platzierungen. Ohne Internet wird automatisch nachgesendet. Wurde der Supervisor ohne WBU-Passwort angemeldet (z. B. mit Tablet per Bluetooth), fragt die Scorecard einmal danach. Wird die Veranstaltung wieder ge\u00f6ffnet und erneut abgeschlossen, ersetzt der neue Stand den alten (E-Mail mit \u201eKorrektur\u201c).</p>\n<h2 id=\"anl-7-punktrichter-werten-mit-der-scorecard\">7. Punktrichter \u2013 werten mit der Scorecard</h2>\n<p>Punktrichter werten jede Runde im 10-Punkte-System am Handy. Sie brauchen nur ihren Namen und die PIN des Supervisors.</p>\n<h3 id=\"anl-7-1-anmelden\">7.1 Anmelden</h3>\n<ul>\n<li>Browser: <a target=\"_blank\" href=\"https://www.wbu-boxing.com/scorecard/\">https://www.wbu-boxing.com/scorecard/</a> \u00f6ffnen, \u201ePunktrichter\u201c antippen, Vor- und Nachname und die PIN vom Supervisor eintragen, \u201eLos geht's\u201c. Man kommt direkt zur Scorecard; eine falsche PIN wird abgelehnt.</li>\n<li>App: Bluetooth einschalten, \u201ePunktrichter\u201c und Namen w\u00e4hlen \u2013 die App verbindet sich mit dem Handy des Supervisors, auch ohne Internet.</li>\n</ul>\n<p>Oben steht \u201eOnline verbunden\u201c mit dem Namen der Veranstaltung. Kommt keine Verbindung zustande, werden Wertungen gespeichert und automatisch nachgeschickt.</p>\n<h3 id=\"anl-7-2-eine-runde-werten\">7.2 Eine Runde werten</h3>\n<ol>\n<li>Bei Rot und Blau die Punkte antippen: der Rundensieger 10, der andere 9 (bei Niederschlag oder klarer \u00dcberlegenheit 8 oder weniger).</li>\n<li>Minuspunkte bei Verwarnungen: \u22121 bis \u22124 unter der Ecke antippen; nochmals tippen nimmt sie weg.</li>\n<li>Unten steht die Summe der Runde, z. B. 10 : 9.</li>\n<li>\u201eRunde senden\u201c schickt die Runde sofort an den Supervisor. \u201eRunde speichern (ohne Senden)\u201c merkt sie nur \u2013 je nach Ansage des Supervisors.</li>\n</ol>\n<h3 id=\"anl-7-3-korrigieren-und-abschlie-en\">7.3 Korrigieren und abschlie\u00dfen</h3>\n<ul>\n<li>In der Liste unten l\u00e4sst sich jede Runde antippen und korrigieren.</li>\n<li>Nach der letzten Runde \u201eKampf abschlie\u00dfen\u201c. Es erscheint \u201eAbgeschlossen \u2013 beim Supervisor angekommen\u201c mit allen Runden.</li>\n<li>\u201eKampf vorzeitig beendet (K.O. / T.K.O. / RTD \u2026)\u201c, wenn der Kampf vor der letzten Runde endet.</li>\n<li>\u201eN\u00e4chster Kampf\u201c startet eine leere Scorecard.</li>\n<li>\u00dcber den Chat lassen sich kurze Nachrichten an den Supervisor schicken (z. B. \u201eHabe korrigiert\u201c, \u201eBitte kurz kommen\u201c).</li>\n</ul>\n<h2 id=\"anl-8-ringrichter-zeitnehmer-und-ringarzt\">8. Ringrichter, Zeitnehmer und Ringarzt</h2>\n<table>\n<thead>\n<tr>\n<th>Rolle</th>\n<th>Aufgabe im System</th>\n<th>Wo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Ringrichter</td>\n<td>wird je Kampf vom Supervisor eingetragen, bleibt f\u00fcr die n\u00e4chsten K\u00e4mpfe stehen; selbst bedient er nichts</td>\n<td>Scorecard des Supervisors</td>\n</tr>\n<tr>\n<td>Zeitnehmer</td>\n<td>bedient die Rundenuhr: START, STOPP (Timeout l\u00e4uft automatisch), WEITER, Runde neu; die Signale kommen automatisch</td>\n<td>Leitstand oder Bedienplatz am Ring</td>\n</tr>\n<tr>\n<td>Ringarzt</td>\n<td>wird einmal vor dem Start eingetragen und gilt f\u00fcr alle K\u00e4mpfe; ohne ihn startet die Uhr nicht</td>\n<td>WBU Sports (Veranstaltung oder Leitstand) und Scorecard</td>\n</tr>\n</tbody>\n</table>\n<p>Alle Namen stehen im Ergebnis jedes Kampfes und im PDF-Bericht des Supervisors.</p>\n<h2 id=\"anl-9-zuschauer-wbu-live-live-monitor-results-und-weltrangliste\">9. Zuschauer \u2013 WBU Live, Live-Monitor, Results und Weltrangliste</h2>\n<p>WBU Live zeigt ohne Login, wer im Ring ist, wer sich bereit machen muss, alle Ergebnisse und die Platzierungen.</p>\n<ul>\n<li>Am Handy: <a target=\"_blank\" href=\"https://www.wbu-boxing.com/live/\">https://www.wbu-boxing.com/live/</a> \u2013 Veranstaltung antippen, bei mehreren Ringen den Ring w\u00e4hlen. Reiter: N\u00e4chste K\u00e4mpfe, Bisherige K\u00e4mpfe, Platzierungen.</li>\n<li>Am Hallen-Monitor: den Fernseher-Link aus WBU Sports (Reiter Kampfliste) im Browser des Fernsehers oder Fire TV \u00f6ffnen. Er zeigt alle kommenden K\u00e4mpfe; gr\u00fcn ist im Ring, gelb muss sich bereit machen.</li>\n<li>Beides aktualisiert sich von selbst, solange der PC mit WBU Sports online ist.</li>\n</ul>\n<h3 id=\"anl-9-1-live-monitor-auf-der-wbu-startseite\">9.1 Live-Monitor auf der WBU-Startseite</h3>\n<ul>\n<li>Sobald sich der <strong>Supervisor</strong> mit der Gala verbunden hat (Scorecard angemeldet, noch offene K\u00e4mpfe), erscheint auf der WBU-Startseite direkt unter dem Men\u00fc automatisch ein <strong>Live-Monitor</strong> \u2013 ohne Men\u00fcpunkt, ohne Klick.</li>\n<li><strong>Links:</strong> der laufende Kampf \u2013 Kampfnummer, Titelkampf, Rote und Blaue Ecke mit Gym und Land, Gewichtsklasse, Sportart, Runden \u00d7 Minuten. L\u00e4uft die Zeitnahme \u00fcber WBU Time, stehen Runde und Zeit gro\u00df darunter (auch Pause und Timeout); bei analoger Zeitnahme f\u00e4llt das einfach weg. Darunter das letzte Ergebnis und der n\u00e4chste Kampf.</li>\n<li><strong>Rechts:</strong> die ganze Fight Card zum Scrollen \u2013 fertige K\u00e4mpfe mit Ergebnis und Sieger, der laufende Kampf gelb markiert.</li>\n<li>Ergebnisse erscheinen, sobald der Supervisor den Kampf abschlie\u00dft. Punkte je Runde und Namen der Punktrichter werden nicht gezeigt.</li>\n<li>Laufen mehrere Galas gleichzeitig, erscheinen mehrere Monitore untereinander.</li>\n<li>Sind alle K\u00e4mpfe fertig, bleibt der Monitor noch 30 Minuten stehen und verschwindet dann. Die Ergebnisse stehen danach auf der Results-Seite.</li>\n<li>Heller Hintergrund, schwarze Schrift, Rot und Blau \u2013 wie WBU Live und WBU Time. Auf dem Handy untereinander, die Fight Card l\u00e4sst sich mit dem Finger scrollen.</li>\n</ul>\n<p><strong>YouTube-Livestream:</strong> Unter \u201eVeranstaltung\u201c kann der Veranstalter einen YouTube-Link eintragen \u2013 Link zum Video (z. B. youtube.com/live/\u2026) oder zum Kanal (youtube.com/channel/UC\u2026, dann l\u00e4uft automatisch, was dort gerade live ist). Sobald sich der Supervisor einloggt, erscheint auf der Startseite \u00fcber dem Live-Monitor das Video in 16:9 und in der gleichen Breite \u2013 nur das reine Bild, ohne Kommentare und ohne Vorschl\u00e4ge. Vollbild \u00fcber das Symbol unten rechts im Video, am Handy einfach drehen. Das Video startet ohne Ton (so wollen es die Browser) \u2013 einmal auf den Lautsprecher tippen. Ohne Link bleibt es beim Live-Monitor allein.</p>\n<p><strong>Countdown vor einer Show:</strong> Ab dem Montag der Woche, in der am Wochenende eine WBU-Show ist, steht unter dem Men\u00fc ein schmaler Countdown-Balken: Name der Show, Ort, Tag(e), Beginnzeit und die Zeit bis zum Beginn (Tage, Stunden, Minuten, Sekunden) \u2013 mit dem Hinweis, dass ab Showbeginn hier der Live-Monitor l\u00e4uft. Jeder Showtag hat einen eigenen Balken, mehrere stehen untereinander (z. B. Freitag und Samstag). Steht keine Uhrzeit auf dem Plakat, gilt Beginn 19:00 Uhr. Ab Showbeginn verschwindet der Balken. Neue Versionen der Startseite laden sich in offenen Browsern von selbst nach.</p>\n<h3 id=\"anl-9-2-results\">9.2 Results</h3>\n<ul>\n<li><a target=\"_blank\" href=\"https://www.wbu-boxing.com/results/\">https://www.wbu-boxing.com/results/</a> \u2013 alle Ergebnisse der WBU-Galas und Turniere, automatisch vom Supervisor \u00fcbermittelt, ohne Login. Turniere zeigen die Platzierungen (1., 2., 3.).</li>\n<li>In 5 Sprachen (EN, DE, ES, FR, RU), Suche nach Name, Veranstaltung oder Ort.</li>\n</ul>\n<h3 id=\"anl-9-3-wbu-weltrangliste\">9.3 WBU-Weltrangliste</h3>\n<ul>\n<li><a target=\"_blank\" href=\"https://www.wbu-boxing.com/rankings/\">https://www.wbu-boxing.com/rankings/</a> \u2013 die Top 15 nach BoxRec je Profi-Gewichtsklasse plus die WBU-Champions an ihrer Position (mit Krone), zwei Spalten, kg/lbs umschaltbar, Suche, 5 Sprachen.</li>\n</ul>\n<h3 id=\"anl-9-4-die-neue-wbu-webseite-www-wbu-boxing-com\">9.4 Die neue WBU-Webseite (www.wbu-boxing.com)</h3>\n<ul>\n<li>Oben immer: WBU-Logo mit \u201eWorld Boxing Union \u2013 Be the Best\u201c, Facebook, X/Twitter, E-Mail und die Sprachen; darunter der G\u00fcrtel-Banner und das Men\u00fc mit allen Punkten einzeln.</li>\n<li>Kopf, Banner und Men\u00fc bleiben immer stehen \u2013 Rangliste, Results, Coin, WBU Live, WBU Sports und alle anderen Seiten (Champions, Regeln, G\u00fcrtel, PBU, EBO, WFU, K1, SemiPro, Master, BKB, HYBB, SD, Downloads, Geschichte, Verzeichnis, Kontakt, Bundesliga, Sportpass) \u00f6ffnen sich darunter im neuen Design. Unterseiten mit eigenem Men\u00fc (z. B. WBU Coin mit dem Fight Quiz) zeigen es als zweites Men\u00fc darunter.</li>\n<li>Shop, Scorecard und WBU Time \u00f6ffnen sich als eigene Seite (eigenst\u00e4ndige Programme).</li>\n<li>Kontaktformular: wird im neuen Design abgeschickt, die Best\u00e4tigung erscheint im neuen Design.</li>\n<li>Der gr\u00fcne WhatsApp-Knopf unten rechts bleibt beim Scrollen immer im Bild und \u00f6ffnet einen Chat mit der WBU.</li>\n<li>Alte Adressen der Unterseiten (z. B. wbu-boxing.com/champions/) leiten automatisch auf dieselbe Seite im neuen Design weiter.</li>\n<li>Rechte Spalte \u201eWBU Shows\u201c: die Plakate der n\u00e4chsten Veranstaltungen untereinander (zum Scrollen, anklicken = gro\u00df). Neue Plakate schickt der Pr\u00e4sident einfach an Claude, sie erscheinen dann automatisch.</li>\n<li>G\u00fcrtel-Seite: 8 Bilder der WBU-G\u00fcrtel, 4 nebeneinander (Handy: 2), Blond und Br\u00fcnett im Wechsel.</li>\n</ul>\n<h2 id=\"anl-10-downloads-app-updates-und-arbeiten-ohne-internet\">10. Downloads, App-Updates und Arbeiten ohne Internet</h2>\n<p>WBU Sports gibt es in mehreren Formen. Alle arbeiten gleich und sehen gleich aus.</p>\n<table>\n<thead>\n<tr>\n<th>Version</th>\n<th>F\u00fcr wen</th>\n<th>Internet n\u00f6tig</th>\n<th>Download</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Browser-Version</td>\n<td>alle: Anmeldung, WBU Sports, Scorecard, WBU Live, WBU Time</td>\n<td>ja</td>\n<td>keine Installation \u2013 <a target=\"_blank\" href=\"https://www.wbu-boxing.com/anmeldung/\">https://www.wbu-boxing.com/anmeldung/</a></td>\n</tr>\n<tr>\n<td>WBU Sports f\u00fcr Windows (Programm)</td>\n<td>Veranstalter und Leitstand auf dem Laptop, mit Bluetooth, Hallen-WLAN und Fernseher per HDMI</td>\n<td>nein</td>\n<td><a target=\"_blank\" href=\"https://github.com/energyfighter/wbu-sc-download/raw/windows/WBU-Sports-Setup.exe\">https://github.com/energyfighter/wbu-sc-download/raw/windows/WBU-Sports-Setup.exe</a></td>\n</tr>\n<tr>\n<td>WBU Sports als Tablet-App (Android)</td>\n<td>Veranstalter und Leitstand am Ring, mit Fernseher per HDMI</td>\n<td>nein (Bluetooth zum Supervisor)</td>\n<td><a target=\"_blank\" href=\"https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-Sports.apk\">https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-Sports.apk</a></td>\n</tr>\n<tr>\n<td>Scorecard-App f\u00fcr Android (Handy und Tablet)</td>\n<td>Supervisor und Punktrichter</td>\n<td>nein (Bluetooth)</td>\n<td><a target=\"_blank\" href=\"https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-SC.apk\">https://github.com/energyfighter/wbu-sc-download/raw/main/WBU-SC.apk</a></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"anl-10-1-wbu-sports-f-r-windows-installieren\">10.1 WBU Sports f\u00fcr Windows installieren</h3>\n<ol>\n<li>\u201eWBU-Sports-Setup.exe\u201c herunterladen (etwa 10 MB) und doppelt anklicken. Fragt Windows \u201eDer Computer wurde durch Windows gesch\u00fctzt\u201c: \u201eWeitere Informationen\u201c \u2013 \u201eTrotzdem ausf\u00fchren\u201c.</li>\n<li>\u201eInstallieren\u201c \u2013 fehlt auf dem PC das Microsoft-.NET-Grundprogramm, l\u00e4dt das Setup es einmalig selbst nach (Windows fragt dabei einmal \u201eJa\u201c).</li>\n<li>Auf dem Desktop erscheint \u201eWBU Sports\u201c. Das Programm \u00f6ffnet sich im eigenen Fenster \u2013 ohne Login. Die Daten bleiben auf dem Laptop, auch bei Updates.</li>\n<li><strong>Supervisor per Bluetooth:</strong> Bluetooth am Laptop einschalten. Im Leitstand \u201e\ud83d\udcf6 Bluetooth starten\u201c. Am Supervisor-Handy in der Scorecard-App normal anmelden, ohne Show zu w\u00e4hlen \u2013 nichts weiter ausw\u00e4hlen. Der Laptop findet das Handy selbst, schickt die Kampfliste und bekommt die Ergebnisse.</li>\n<li><strong>Fernseher per HDMI:</strong> Fernseher anschlie\u00dfen, Windows-Taste + P dr\u00fccken und \u201eErweitern\u201c w\u00e4hlen. Im Leitstand \u201e\u23f1 WBU Time\u201c oder \u201e\ud83d\udccb Kampfliste\u201c \u2013 die Anzeige erscheint im Vollbild auf dem Fernseher.</li>\n<li><strong>Hallen-WLAN:</strong> siehe 10.3.</li>\n</ol>\n<p>Eine Veranstaltung aus dem Browser kommt mit \u201eSicherung speichern (.json)\u201c und \u201eGespeicherte Sicherung einspielen\u201c ins Programm.</p>\n<h3 id=\"anl-10-1a-veranstaltung-erstellen-windows-programm-und-tablet-app\">10.1a Veranstaltung erstellen (Windows-Programm und Tablet-App)</h3>\n<ul>\n<li>Vorbereiten geht ohne Internet: Name, Datum, Ort, Fight Card bzw. Kategorien und Teilnehmer.</li>\n<li><strong>Benutzen</strong> l\u00e4sst sich eine Veranstaltung erst, wenn sie <strong>erstellt</strong> ist: oben auf \u201e\u2705 Veranstaltung erstellen\u201c dr\u00fccken \u2013 daf\u00fcr einmal <strong>Internet</strong> und das <strong>Veranstalter-Passwort</strong> (bekommt der Veranstalter von der WBU). Die WBU bekommt dabei automatisch eine Info-E-Mail.</li>\n<li>Vorher sind Leitstand, Kampfliste, Brackets, Ergebnisse, Urkunden, Akkreditierung, Drucken, Fernseher und Supervisor-Verbindung <strong>gesperrt (\ud83d\udd12)</strong>. Ohne Internet kommt der Hinweis \u201eBitte mit dem Internet verbinden\u201c.</li>\n<li>Danach l\u00e4uft alles auch ohne Internet weiter. Im Browser (mit WBU-Sports-Konto) gibt es diese Sperre nicht.</li>\n</ul>\n<h3 id=\"anl-10-2-wbu-sports-als-tablet-app-android\">10.2 WBU Sports als Tablet-App (Android)</h3>\n<p>Die Tablet-App ist WBU Sports zum Mitnehmen: alles auf dem Tablet, am Ring auch ohne Internet.</p>\n<ol>\n<li>Die APK-Datei \u201eWBU-Sports.apk\u201c auf dem Tablet herunterladen und antippen, einmalig \u201eApps aus dieser Quelle zulassen\u201c, dann \u201eInstallieren\u201c.</li>\n<li>Veranstaltung auf das Tablet holen: entweder direkt auf dem Tablet anlegen (mit Internet funktionieren Online-Anmeldung und Live schalten wie im Browser) oder am PC \u201eSicherung speichern (.json)\u201c, die Datei aufs Tablet schicken (z. B. per E-Mail oder USB) und in der App \u201eGespeicherte Sicherung einspielen\u201c.</li>\n<li><strong>Supervisor per Bluetooth:</strong> Im Leitstand \u201e\ud83d\udcf6 Bluetooth starten\u201c antippen. Am Supervisor-Handy in der Scorecard-App normal anmelden, ohne Show zu w\u00e4hlen \u2013 die App findet das Tablet von selbst. Die Kampfliste mit Namen, Titel, Runden kommt vom Tablet, die best\u00e4tigten Ergebnisse gehen automatisch ans Tablet zur\u00fcck. Die Punktrichter verbinden sich wie immer mit dem Supervisor-Handy.</li>\n<li><strong>Fernseher per Kabel:</strong> Tablet mit einem USB-C-auf-HDMI-Adapter an den Fernseher anschlie\u00dfen. Im Leitstand erscheint \u201e\ud83d\udcfa Fernseher (HDMI) \u2013 angeschlossen\u201c: \u201e\u23f1 WBU Time\u201c zeigt die Rundenuhr am Fernseher, \u201e\ud83d\udccb Kampfliste\u201c die n\u00e4chsten K\u00e4mpfe. Auf dem Tablet bedient man weiter den Leitstand.</li>\n<li><strong>Drucken:</strong> Kampfliste, Brackets, Urkunden und Akkreditierungskarten gehen \u00fcber den Android-Druckdialog an einen WLAN-Drucker oder als PDF.</li>\n<li><strong>Sicherung:</strong> \u201eSicherung speichern (.json)\u201c legt die Datei in den Ordner \u201eDownload\u201c des Tablets.</li>\n</ol>\n<p>Mit Internet arbeitet die Tablet-App zus\u00e4tzlich genau wie die Browser-Version (Online-Anmeldung, Zahlungen, Live schalten, WBU Live und WBU Time \u00fcber das Netz).</p>\n<h3 id=\"anl-10-3-hallen-wlan-beliebig-viele-fernseher-ohne-internet-und-ohne-kabel\">10.3 Hallen-WLAN: beliebig viele Fernseher ohne Internet und ohne Kabel</h3>\n<p>Tablet-App und Windows-Programm k\u00f6nnen ein eigenes WLAN aufmachen. Alle Fernseher (z. B. Fire TV) und Handys, die sich damit verbinden, zeigen WBU Live und WBU Time \u2013 f\u00fcr jeden Ring \u2013 ganz ohne Internet.</p>\n<ol>\n<li>Im Leitstand \u201e\ud83d\udce1 Hallen-WLAN starten\u201c antippen.</li>\n<li>Es erscheinen WLAN-Name und Passwort (Laptop: \u201eWBU-Halle\u201c / \u201ewbuboxing\u201c; Tablet: vom Tablet vorgegeben) sowie die Adressen.</li>\n<li>Am Fernseher das WLAN verbinden und im Browser (Fire TV: Silk) die angezeigte Adresse \u00f6ffnen:</li>\n<li>WBU Time f\u00fcr Ring 1, Ring 2 \u2026 (eine eigene Adresse je Ring),</li>\n<li>Kampfliste f\u00fcr den Hallen-Monitor,</li>\n<li>WBU Live f\u00fcr Handys.</li>\n<li>Am Laptop fragt die Windows-Firewall beim ersten Mal: \u201eZugriff zulassen\u201c (private und \u00f6ffentliche Netzwerke anhaken).</li>\n</ol>\n<p>L\u00e4sst sich kein eigenes WLAN starten (manche Ger\u00e4te sperren das), funktionieren dieselben Adressen auch \u00fcber einen vorhandenen WLAN-Router oder einen Handy-Hotspot, mit dem Tablet/Laptop und Fernseher verbunden sind. Mit Internet laufen WBU Live und WBU Time weiterhin zus\u00e4tzlich \u00fcber www.wbu-boxing.com.</p>\n<h3 id=\"anl-10-4-scorecard-app-f-r-android-installieren\">10.4 Scorecard-App f\u00fcr Android installieren</h3>\n<ol>\n<li>Die APK-Datei auf dem Handy oder Tablet herunterladen und antippen.</li>\n<li>Einmalig \u201eApps aus dieser Quelle zulassen\u201c erlauben, dann \u201eInstallieren\u201c.</li>\n<li>Bluetooth und Standort einschalten.</li>\n</ol>\n<p>Supervisor und Punktrichter verbinden sich per Bluetooth direkt miteinander \u2013 ohne Internet und ohne WLAN in der Halle. Internet braucht die App nur, wenn eine Veranstaltung aus WBU Sports \u00fcbernommen und die Ergebnisse dorthin geschickt werden sollen; fehlt es kurz, werden die Ergebnisse automatisch nachgeschickt.</p>\n<h3 id=\"anl-10-5-updates\">10.5 Updates</h3>\n<ul>\n<li>Browser-Version: immer automatisch aktuell. Zeigt eine Seite noch die alte Version, Strg + F5 dr\u00fccken.</li>\n<li>Android-Apps (Scorecard und WBU Sports Tablet): pr\u00fcfen bei jedem Start, ob es eine neue Version gibt. Dann erscheint ein Hinweis mit \u201eUpdate installieren\u201c \u2013 antippen, das Update l\u00e4dt und installiert sich selbst. Ein App-Store ist nicht n\u00f6tig. Bricht Android den ersten Versuch ab (manche Handys pr\u00fcfen die App erst mit Play Protect), startet die App die Installation still noch einmal \u2013 es erscheint keine Fehlermeldung (ab Version 1.145).</li>\n<li>Windows-Programm: zeigt beim Start (mit Internet) \u201eNeue Version\u201c \u2013 \u201eUpdate installieren\u201c antippen: es l\u00e4dt, installiert sich selbst und startet nach ein paar Sekunden neu. Die Daten bleiben erhalten.</li>\n</ul>\n<h2 id=\"anl-11-h-ufige-fragen-und-probleme\">11. H\u00e4ufige Fragen und Probleme</h2>\n<table>\n<thead>\n<tr>\n<th>Problem</th>\n<th>L\u00f6sung</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>WBU Sports zeigt \u201eBitte zuerst einloggen\u201c</td>\n<td>Auf der Anmeldeseite einloggen; bei falscher Rolle \u201eAls Veranstalter weiter\u201c antippen</td>\n</tr>\n<tr>\n<td>Seite zeigt noch die alte Version</td>\n<td>Strg + F5 dr\u00fccken</td>\n</tr>\n<tr>\n<td>Uhr startet nicht</td>\n<td>Ringarzt im Leitstand eintragen</td>\n</tr>\n<tr>\n<td>Punktrichter kommt nicht rein</td>\n<td>PIN beim Supervisor erfragen; der Supervisor muss zuerst angemeldet sein</td>\n</tr>\n<tr>\n<td>Veranstaltung fehlt in der Scorecard</td>\n<td>In WBU Sports \u201eLive schalten\u201c; der PC mit WBU Sports muss online sein</td>\n</tr>\n<tr>\n<td>WBU Live oder WBU Time steht still</td>\n<td>Internet am PC mit WBU Sports pr\u00fcfen; als Reserve einen Handy-Hotspot bereithalten \u2013 oder ohne Internet mit der Windows-Version und der App arbeiten (Kapitel 10)</td>\n</tr>\n<tr>\n<td>Kein Ton am Fernseher</td>\n<td>Einmal \u201eMute \u2013 Ton einschalten\u201c antippen</td>\n</tr>\n<tr>\n<td>Browser f\u00fcllt das Passwort in ein falsches Feld</td>\n<td>Feld leeren; gespeicherten Eintrag \u00fcber das Schl\u00fcssel-Symbol in der Adressleiste l\u00f6schen</td>\n</tr>\n<tr>\n<td>Neuer PC, Veranstaltung fehlt</td>\n<td>\u201eGespeicherte Sicherung einspielen\u201c mit der .json-Sicherung</td>\n</tr>\n<tr>\n<td>Urkunde ohne Gold oder Fahne</td>\n<td>Beim Drucken H\u00e4kchen bei Hintergrundgrafiken setzen</td>\n</tr>\n</tbody>\n</table>\n<p>Fragen an die WBU: dm@wbu-boxing.com \u00b7 www.wbu-boxing.com</p>";
